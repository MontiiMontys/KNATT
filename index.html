<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

:root{
  --green:#123c2d;
  --green-2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
  --danger:#d95c5c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font-family:inherit;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:96px;
}

/* HEADER */

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--green),#0d2d22);
  color:white;
  padding:26px 20px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #0c2d2225;
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  right:-75px;
  top:-90px;
  background:#b9e86c12;
}

.brand{
  position:relative;
  z-index:2;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand span{
  color:var(--lime);
}

.role{
  position:relative;
  z-index:2;
  opacity:.78;
  font-size:13px;
  margin-top:5px;
  font-weight:600;
}

/* MAIN */

main{
  padding:20px 16px 30px;
}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin:2px 0 16px;
}

/* ROLE SELECTOR */

.rolebar{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  background:#e6ece8;
  padding:5px;
  border-radius:15px;
}

.rolebar button{
  flex:1;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 7px 25px #10221b0b;
}

.hero{
  background:linear-gradient(145deg,var(--green),var(--green-2));
  color:white;
  border:0;
  padding:20px;
  box-shadow:0 12px 30px #123c2d22;
}

.hero .muted{
  color:#c8d8d1;
}

.hero .big{
  color:white;
}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 0;
}

.team-ball{
  width:50px;
  height:50px;
  border-radius:16px;
  background:#ffffff18;
  display:grid;
  place-items:center;
  font-size:25px;
}

.match-info{
  flex:1;
}

.match-date{
  font-weight:800;
  font-size:14px;
}

.match-place{
  color:#c8d8d1;
  font-size:13px;
  margin-top:3px;
}

/* STATS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  box-shadow:0 6px 20px #10221b08;
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.stat.accent b{
  color:#315d18;
}

/* ROWS */

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px;
}

.grow{
  flex:1;
  min-width:0;
}

/* PILLS */

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20;
}

.pill.danger{
  background:#fae9e9;
  color:#b44343;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  background:var(--green);
  color:white;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 12px #123c2d20;
}

.btn.light{
  background:#e9efec;
  color:var(--green);
  box-shadow:none;
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.full{
  width:100%;
}

.choice{
  display:flex;
  gap:8px;
}

.choice button{
  flex:1;
}

/* ADD PLAYER */

.add-player{
  margin-bottom:14px;
}

.add-player .btn{
  width:100%;
}

.delete-btn{
  border:0;
  background:#fae9e9;
  color:#b44343;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  flex:0 0 38px;
}

/* TABS */

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:white;
}

/* NOTICE */

.notice{
  background:#edf6df;
  color:#36561f;
  border-radius:17px;
  padding:14px;
  font-size:13px;
  font-weight:700;
}

/* NAVIGATION */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffee;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -8px 30px #10221b0c;
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 8px;
  min-width:58px;
  border-radius:13px;
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef;
}

nav button:first-line{
  font-size:18px;
}

/* MOBILE */

@media(max-width:380px){
  main{
    padding-left:12px;
    padding-right:12px;
  }

  .big{
    font-size:20px;
  }

  .brand{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ <span>KNATT</span></div>
  <div class="role" id="roleText"></div>
</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>

<script>

const KEY='teamhub-v2';

let data;

try{

  const saved=localStorage.getItem(KEY);

  if(saved){

    data=JSON.parse(saved);

  }else{

    data={
      players:[
        {id:1,name:'Montiimontys',num:9,pos:'DC',available:true,reason:'',min:1126,g:12,a:6,train:18,total:20},
        {id:2,name:'Marc',num:7,pos:'MC',available:true,reason:'',min:1030,g:5,a:8,train:18,total:20},
        {id:3,name:'Juan',num:4,pos:'DFC',available:false,reason:'Trabajo',min:980,g:4,a:3,train:17,total:20},
        {id:4,name:'Alex',num:1,pos:'POR',available:true,reason:'',min:1260,g:0,a:1,train:19,total:20},
        {id:5,name:'Pedro',num:3,pos:'LI',available:false,reason:'Lesión',min:640,g:1,a:2,train:14,total:20}
      ],
      next:{
        opponent:'CD Rival',
        date:'Domingo 23 de agosto',
        time:'12:00',
        place:'Campo Municipal'
      },
      trainings:[
        {
          date:'Jueves 20 de agosto',
          time:'21:15',
          place:'Campo Municipal'
        }
      ]
    };

  }

}catch(error){

  console.error('Error cargando datos:',error);

  data={
    players:[],
    next:{
      opponent:'CD Rival',
      date:'Próximo partido',
      time:'12:00',
      place:'Campo Municipal'
    },
    trainings:[
      {
        date:'Próximo entrenamiento',
        time:'21:15',
        place:'Campo Municipal'
      }
    ]
  };

}


/* ASEGURAR ESTRUCTURA */

if(!Array.isArray(data.players)){
  data.players=[];
}

if(!data.next || typeof data.next!=='object'){
  data.next={
    opponent:'CD Rival',
    date:'Próximo partido',
    time:'12:00',
    place:'Campo Municipal'
  };
}

if(!data.next.opponent){
  data.next.opponent='CD Rival';
}

if(!data.next.date){
  data.next.date='Próximo partido';
}

if(!data.next.time){
  data.next.time='12:00';
}

if(!data.next.place){
  data.next.place='Campo Municipal';
}

if(!Array.isArray(data.trainings) || !data.trainings.length){
  data.trainings=[
    {
      date:'Próximo entrenamiento',
      time:'21:15',
      place:'Campo Municipal'
    }
  ];
}

if(!data.trainings[0].date){
  data.trainings[0].date='Próximo entrenamiento';
}

if(!data.trainings[0].time){
  data.trainings[0].time='21:15';
}

if(!data.trainings[0].place){
  data.trainings[0].place='Campo Municipal';
}
let role=localStorage.getItem('teamhub-role')||'trainer';
let section='home';
let filter='all';

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function setRole(r){
  role=r;
  localStorage.setItem('teamhub-role',r);
  section='home';
  render();
}

function roleName(){
  return role==='trainer'?'Entrenador':'Jugador';
}

function navItems(){
  return role==='trainer'
  ? [
      ['home','🏠','Inicio'],
      ['team','👥','Plantilla'],
      ['training','🏋️','Entrenos'],
      ['matches','🏆','Partidos'],
      ['stats','📊','Stats']
    ]
  : [
      ['home','🏠','Inicio'],
      ['profile','⚽','Mi perfil'],
      ['training','🏋️','Entrenos'],
      ['matches','🏆','Partidos'],
      ['stats','📊','Mi temporada']
    ];
}

function render(){

  document.getElementById('roleText').textContent=
    roleName()+' · Primer Equipo';

  document.getElementById('nav').innerHTML=
    navItems()
    .map(x=>`
      <button class="${section===x[0]?'active':''}"
      onclick="go('${x[0]}')">
      ${x[1]}<br>${x[2]}
      </button>
    `)
    .join('');

  let c=document.getElementById('content');

  c.innerHTML=`
    <div class="rolebar">

      <button
        class="btn ${role==='trainer'?'':'light'}"
        onclick="setRole('trainer')">
        🧑‍🏫 Entrenador
      </button>

      <button
        class="btn ${role==='player'?'':'light'}"
        onclick="setRole('player')">
        ⚽ Jugador
      </button>

    </div>
  `;

  if(section==='home')c.innerHTML+=home();
  if(section==='team')c.innerHTML+=team();
  if(section==='training')c.innerHTML+=training();
  if(section==='matches')c.innerHTML+=matches();
  if(section==='stats')c.innerHTML+=stats();
  if(section==='profile')c.innerHTML+=profile();
} if(section==='player')c.innerHTML+=playerProfile();

function go(s){
  section=s;
  render();
}
/* =========================================================
   FICHA DE JUGADOR
========================================================= */

let selectedPlayerId=null;

function openPlayer(id){

  selectedPlayerId=id;
  section='player';
  render();

}

function getSelectedPlayer(){

  return data.players.find(
    p=>String(p.id)===String(selectedPlayerId)
  );

}

function editPlayer(){

  if(role!=='trainer') return;

  const p=getSelectedPlayer();

  if(!p) return;

  const name=prompt(
    'Nombre del jugador:',
    p.name
  );

  if(name===null) return;

  const num=prompt(
    'Número de camiseta:',
    p.num
  );

  if(num===null) return;

  const pos=prompt(
    'Posición:',
    p.pos
  );

  if(pos===null) return;

  const available=confirm(
    '¿Está disponible para jugar?\\n\\nAceptar = Sí\\nCancelar = No'
  );

  let reason='';

  if(!available){

    const r=prompt(
      'Motivo de la ausencia:',
      p.reason||''
    );

    if(r!==null){
      reason=r.trim();
    }

  }

  const min=prompt(
    'Minutos jugados:',
    p.min
  );

  if(min===null) return;

  const goals=prompt(
    'Goles:',
    p.g
  );

  if(goals===null) return;

  const assists=prompt(
    'Asistencias:',
    p.a
  );

  if(assists===null) return;

  const train=prompt(
    'Entrenamientos realizados:',
    p.train
  );

  if(train===null) return;

  const total=prompt(
    'Entrenamientos totales:',
    p.total
  );

  if(total===null) return;

  p.name=name.trim()||p.name;
  p.num=num.trim()||p.num;
  p.pos=pos.trim()||p.pos;

  p.available=available;
  p.reason=reason;

  p.min=Math.max(0,Number(min)||0);
  p.g=Math.max(0,Number(goals)||0);
  p.a=Math.max(0,Number(assists)||0);
  p.train=Math.max(0,Number(train)||0);
  p.total=Math.max(0,Number(total)||0);

  save();

  render();

}

function playerProfile(){

  const p=getSelectedPlayer();

  if(!p){

    return `

      <div class="title">
        Jugador
      </div>

      <div class="card">

        <div class="muted">
          No se ha encontrado el jugador.
        </div>

        <br>

        <button
          class="btn full"
          onclick="go('team')">
          ← Volver a plantilla
        </button>

      </div>

    `;
  }

  const percentage=
    p.total>0
    ?Math.round(p.train/p.total*100)
    :0;

  return `

    <button
      class="btn light"
      onclick="go('team')"
      style="margin-bottom:14px">
      ← Plantilla
    </button>

    <div class="card hero">

      <div class="row">

        <div>

          <div
            class="section-label"
            style="color:#b9e86c">
            JUGADOR
          </div>

          <div class="big">
            #${p.num} · ${p.name}
          </div>

          <div class="muted">
            ${p.pos||'Jugador'}
          </div>

        </div>

        <div class="avatar">
          ${p.pos==='POR'?'🧤':'⚽'}
        </div>

      </div>

      <br>

      <span class="pill ${
        p.available?'':'danger'
      }">

        ${
          p.available
          ?'🟢 Disponible'
          :'🔴 '+(p.reason||'No disponible')
        }

      </span>

    </div>

    <div class="section-label">
      TEMPORADA
    </div>

    <div class="grid">

      <div class="stat">
        <b>${p.min}</b>
        <span>Minutos</span>
      </div>

      <div class="stat accent">
        <b>${p.g}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${p.a}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${percentage}%</b>
        <span>Entrenamientos</span>
      </div>

    </div>

    <div class="card">

      <div class="section-label">
        ASISTENCIA
      </div>

      <div class="big">
        ${p.train}/${p.total}
      </div>

      <div class="muted small">
        Entrenamientos realizados
      </div>

      <br>

      <div class="notice">
        ${percentage}% de asistencia esta temporada.
      </div>

    </div>

    ${
      role==='trainer'
      ?
      `

      <div class="card">

        <button
          class="btn lime full"
          onclick="editPlayer()">
          ✏️ Editar jugador
        </button>

        <br><br>

        <button
          class="btn light full"
          onclick="deletePlayer(${p.id})">
          🗑️ Eliminar jugador
        </button>

      </div>

      `
      :
      ''
    }

  `;
}

/* AÑADIR JUGADOR */

function addPlayer(){

  if(role!=='trainer') return;

  const name=prompt('Nombre del jugador:');

  if(!name || !name.trim()){
    return;
  }

  const num=prompt('Número de camiseta:','');

  if(num===null){
    return;
  }

  const pos=prompt('Posición:','');

  if(pos===null){
    return;
  }

  const newPlayer={
    id:Date.now(),
    name:name.trim(),
    num:num.trim()||'-',
    pos:pos.trim()||'Jugador',
    available:true,
    reason:'',
    min:0,
    g:0,
    a:0,
    train:0,
    total:0
  };

  data.players.push(newPlayer);

  save();

  section='team';

  render();
}

/* ELIMINAR JUGADOR */

function deletePlayer(id){

  if(role!=='trainer') return;

  const player=data.players.find(p=>p.id===id);

  if(!player) return;

  const confirmDelete=confirm(
    '¿Seguro que quieres eliminar a '+player.name+' de la plantilla?'
  );

  if(!confirmDelete){
    return;
  }

  data.players=data.players.filter(p=>p.id!==id);

  save();

  render();
}

function home(){

  if(role==='trainer'){

    let available=data.players.filter(p=>p.available).length;
    let absent=data.players.filter(p=>!p.available).length;
    let goals=data.players.reduce((s,p)=>s+p.g,0);

    return `

    <div class="title">
      Panel del equipo
    </div>

    <div class="card hero">

      <div class="section-label" style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        TeamHub FC 🆚 ${data.next.opponent}
      </div>

      <div class="match-meta">

        <div class="team-ball">⚽</div>

        <div class="match-info">

          <div class="match-date">
            ${data.next.date} · ${data.next.time}
          </div>

          <div class="match-place">
            📍 ${data.next.place}
          </div>

        </div>

      </div>

      <button class="btn lime full"
        onclick="go('matches')">
        Ver partido →
      </button>

    </div>

    <div class="section-label">
      RESUMEN DEL EQUIPO
    </div>

    <div class="grid">

      <div class="stat accent">
        <b>${data.players.length}</b>
        <span>Jugadores</span>
      </div>

      <div class="stat">
        <b>${available}</b>
        <span>Disponibles</span>
      </div>

      <div class="stat">
        <b>${absent}</b>
        <span>Ausentes</span>
      </div>

      <div class="stat">
        <b>${goals}</b>
        <span>Goles</span>
      </div>

    </div>

    <div class="card">

      <div class="row">

        <div>

          <div class="section-label">
            PRÓXIMO ENTRENAMIENTO
          </div>

          <div class="big">
            ${data.trainings[0].date}
          </div>

          <div class="muted small">
            ${data.trainings[0].time} ·
            ${data.trainings[0].place}
          </div>

        </div>

        <div class="avatar">
          🏋️
        </div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">
        AUSENCIAS
      </div>

      ${
        data.players.filter(p=>!p.available).map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>${p.num} · ${p.name}</b>

              <div class="muted small">
                ${p.pos}
              </div>

            </div>

            <span class="pill danger">
              ${p.reason}
            </span>

          </div>

        `).join('')
        || '<div class="muted">Ninguna</div>'
      }

    </div>

    `;
  }

  let p=data.players[0];

  if(!p){

    return `

      <div class="card">

        <div class="title">
          No hay jugadores
        </div>

        <div class="muted">
          El entrenador todavía no ha añadido jugadores.
        </div>

      </div>

    `;
  }

  return `

    <div class="title">
      Hola, ${p.name}
    </div>

    <div class="card hero">

      <div class="section-label" style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        TeamHub FC 🆚 ${data.next.opponent}
      </div>

      <div class="match-meta">

        <div class="team-ball">⚽</div>

        <div class="match-info">

          <div class="match-date">
            ${data.next.date} · ${data.next.time}
          </div>

          <div class="match-place">
            📍 ${data.next.place}
          </div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">
        PRÓXIMO ENTRENAMIENTO
      </div>

      <div class="big">
        ${data.trainings[0].date}
      </div>

      <div class="muted small">
        ${data.trainings[0].time} ·
        ${data.trainings[0].place}
      </div>

      <br>

      <div class="choice">

        <button
          class="btn"
          onclick="alert('Asistencia confirmada')">
          ✅ Voy
        </button>

        <button
          class="btn light"
          onclick="alert('Ausencia comunicada')">
          ❌ No voy
        </button>

      </div>

    </div>

    <div class="section-label">
      MI TEMPORADA
    </div>

    <div class="grid">

      <div class="stat">
        <b>${p.min}</b>
        <span>Minutos</span>
      </div>

      <div class="stat accent">
        <b>${p.g}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${p.a}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${p.total ? Math.round(p.train/p.total*100) : 0}%</b>
        <span>Entrenos</span>
      </div>

    </div>

  `;
}

function team(){

  let list=data.players.filter(
    p=>filter==='all'||
    (filter==='available'?p.available:!p.available)
  );

  return `

    <div class="title">
      Plantilla
    </div>

    ${
      role==='trainer'
      ?
      `
      <div class="add-player">

        <button
          class="btn lime full"
          onclick="addPlayer()">
          ➕ Añadir jugador
        </button>

      </div>
      `
      :
      ''
    }

    <div class="tabs">

      <button
        class="tab ${filter==='all'?'active':''}"
        onclick="filter='all';render()">
        Todos
      </button>

      <button
        class="tab ${filter==='available'?'active':''}"
        onclick="filter='available';render()">
        🟢 Disponibles
      </button>

      <button
        class="tab ${filter==='absent'?'active':''}"
        onclick="filter='absent';render()">
        🔴 Ausentes
      </button>

    </div>

    <div class="card">

      ${
        list.length

        ?

        list.map(p=>`

          <div
            class="item"
            onclick="openPlayer(${p.id})"
            style="cursor:pointer">

            <div class="avatar">
              ${p.pos==='POR'?'🧤':'⚽'}
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">

                ${p.pos||'Jugador'} ·

                ${
                  p.available
                  ?'🟢 Disponible'
                  :'🔴 '+(p.reason||'Ausente')
                }

              </div>

              <div class="muted small">
                ${p.g} ⚽ ·
                ${p.a} 🎯 ·
                ${p.min} min
              </div>

            </div>

            <span class="pill">
              ${
                p.total
                ?Math.round(p.train/p.total*100)
                :0
              }%
            </span>

            ${
              role==='trainer'
              ?
              `
              <button
                class="delete-btn"
                onclick="event.stopPropagation();deletePlayer(${p.id})"
                title="Eliminar jugador">
                🗑️
              </button>
              `
              :
              ''
            }

          </div>

        `).join('')

        :

        `
        <div
          class="muted"
          style="text-align:center;padding:20px 0">

          No hay jugadores en este filtro.

        </div>
        `
      }

    </div>

  `;
}

function training(){

  let first=data.trainings[0];

  return `

    <div class="title">
      Entrenamientos
    </div>

    <div class="card hero">

      <div class="section-label" style="color:#b9e86c">
        PRÓXIMO
      </div>

      <div class="big">
        ${first.date}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          🏋️
        </div>

        <div class="match-info">

          <div class="match-date">
            ${first.time}
          </div>

          <div class="match-place">
            📍 ${first.place}
          </div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">
        ${role==='trainer'
          ?'CONTROL DE ASISTENCIA'
          :'MI ASISTENCIA'}
      </div>

      ${
        role==='trainer'
        ?
        data.players.map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.train}/${p.total} entrenamientos
              </div>

            </div>

            <span class="pill">
              ${p.total ? Math.round(p.train/p.total*100) : 0}%
            </span>

          </div>

        `).join('')
        :
        data.players[0]
        ?
        `

        <div class="grid">

          <div class="stat">
            <b>${data.players[0].train}</b>
            <span>Asistencias</span>
          </div>

          <div class="stat accent">
            <b>${data.players[0].total ? Math.round(data.players[0].train/data.players[0].total*100) : 0}%</b>
            <span>Asistencia</span>
          </div>

        </div>

        `
        :
        `<div class="muted">No hay datos.</div>`
      }

    </div>

  `;
}

function matches(){

  return `

    <div class="title">
      Partidos
    </div>

    <div class="card hero">

      <div class="section-label" style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        TeamHub FC 🆚 ${data.next.opponent}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          ⚽
        </div>

        <div class="match-info">

          <div class="match-date">
            ${data.next.date}
          </div>

          <div class="match-place">
            ${data.next.time} ·
            ${data.next.place}
          </div>

        </div>

      </div>

      ${
        role==='trainer'
        ?
        `<button
          class="btn lime full"
          onclick="alert('Aquí gestionaremos convocatoria y alineación')">
          Gestionar convocatoria
        </button>`
        :
        `<span class="pill">
          Convocatoria pendiente
        </span>`
      }

    </div>

  `;
}

function stats(){

  let sorted=[...data.players]
    .sort((a,b)=>b.g-a.g);

  return `

    <div class="title">
      ${role==='trainer'
        ?'Estadísticas del equipo'
        :'Mi temporada'}
    </div>

    <div class="grid">

      <div class="stat accent">
        <b>
          ${data.players.reduce((s,p)=>s+p.g,0)}
        </b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>
          ${data.players.reduce((s,p)=>s+p.a,0)}
        </b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>
          ${data.players.reduce((s,p)=>s+p.min,0)}
        </b>
        <span>Minutos</span>
      </div>

      <div class="stat">
        <b>${data.players.length}</b>
        <span>Jugadores</span>
      </div>

    </div>

    <div class="card">

      <div class="section-label">
        ${role==='trainer'
          ?'RENDIMIENTO DE PLANTILLA'
          :'MIS ESTADÍSTICAS'}
      </div>

      ${
        (role==='trainer'
          ?sorted
          :data.players.length ? [data.players[0]] : []
        ).map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.pos}
              </div>

            </div>

            <div style="text-align:right">

              <b>
                ${p.min}
              </b>

              <div class="muted small">
                ${p.g} ⚽ ·
                ${p.a} 🎯
              </div>

            </div>

          </div>

        `).join('')
        ||
        `<div class="muted">No hay jugadores.</div>`
      }

    </div>

  `;
}

function profile(){

  let p=data.players[0];

  if(!p){

    return `

      <div class="card">

        <div class="title">
          Mi perfil
        </div>

        <div class="muted">
          No hay ningún jugador registrado.
        </div>

      </div>

    `;

  }

  return `

    <div class="title">
      Mi perfil
    </div>

    <div class="card hero">

      <div class="row">

        <div>

          <div class="section-label" style="color:#b9e86c">
            JUGADOR
          </div>

          <div class="big">
            ${p.num} · ${p.name}
          </div>

          <div class="muted">
            ${p.pos}
          </div>

        </div>

        <div class="avatar">
          ⚽
        </div>

      </div>

    </div>

    <div class="grid">

      <div class="stat">
        <b>${p.min}</b>
        <span>Minutos jugados</span>
      </div>

      <div class="stat accent">
        <b>${p.g}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${p.a}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${p.total ? Math.round(p.train/p.total*100) : 0}%</b>
        <span>Entrenamientos</span>
      </div>

    </div>

  `;
}

render();

</script>

</body>
</html>
