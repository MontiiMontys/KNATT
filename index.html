<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>KNATT</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --red:#e21d2f;
  --red2:#b90f20;
  --red3:#ff3b4d;
  --red-soft:#fff0f2;
  --dark:#0b0b0d;
  --dark2:#151518;
  --dark3:#202024;
  --bg:#f5f5f6;
  --card:#fff;
  --text:#17171a;
  --muted:#77777e;
  --line:#e6e6e9;
  --ok:#27a94b;
  --warning:#e0a300;
  --danger:#d51f32;
  --shadow:0 7px 24px rgba(20,20,25,.08)
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg)
}

body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  padding-bottom:88px
}

/* CABECERA */

header{
  background:var(--dark);
  color:#fff;
  padding:17px 18px 15px;
  position:relative;
  overflow:hidden
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid #ffffff12;
  border-radius:50%;
  right:-95px;
  top:-115px
}

.header-row{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1px
}

.brand span{
  color:var(--red3)
}

.role{
  font-size:11px;
  color:#a9a9ae;
  margin-top:2px;
  font-weight:700
}

.header-bell{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#ffffff10;
  border:1px solid #ffffff12;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:18px
}

/* GENERAL */

main{
  padding:16px 14px 28px
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:3px 2px 13px
}

.title{
  font-size:25px;
  font-weight:950;
  letter-spacing:-.7px
}

.subtitle{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow)
}

.card-dark{
  background:var(--dark2);
  color:#fff;
  border-color:#2b2b30
}

.card-dark .muted{
  color:#a9a9ae
}

.section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px
}

.dark-label{
  color:#9d9da3
}

.big{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px
}

.muted{
  color:var(--muted)
}

.small{
  font-size:12px
}

/* BOTONES */

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:13px;
  box-shadow:0 5px 12px rgba(226,29,47,.18)
}

.btn.dark{
  background:var(--dark);
  box-shadow:none
}

.btn.light{
  background:#f0f0f2;
  color:#222;
  box-shadow:none
}

.btn.red-soft{
  background:var(--red-soft);
  color:var(--red);
  box-shadow:none
}

.btn.full{
  width:100%
}

/* HERO */

.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,#151518,#09090b);
  color:#fff;
  border:0
}

.hero:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  right:-85px;
  top:-65px;
  border:2px solid #e21d2f22
}

.hero .section-label{
  color:#ff6975
}

.hero .muted{
  color:#b6b6bb
}

.hero .big{
  color:#fff
}

/* PARTIDO */

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:15px 0
}

.team-ball{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#ffffff12;
  display:grid;
  place-items:center;
  font-size:24px
}

.match-info{
  flex:1
}

.match-date{
  font-weight:850;
  font-size:13px
}

.match-place{
  color:#bdbdc2;
  font-size:12px;
  margin-top:3px
}

/* ESTADÍSTICAS */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:13px
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 8px;
  text-align:center
}

.stat b{
  display:block;
  font-size:21px;
  font-weight:950
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-top:2px
}

.stat.red{
  background:var(--red-soft);
  border-color:#ffd7dc
}

.stat.red b{
  color:var(--red)
}

/* NOVEDADES */

.notice-list{
  border:1px solid var(--line);
  border-radius:15px;
  overflow:hidden
}

.notice-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:11px 12px;
  border-bottom:1px solid var(--line)
}

.notice-row:last-child{
  border-bottom:0
}

.notice-icon{
  width:28px;
  height:28px;
  border-radius:9px;
  background:#f1f1f3;
  display:grid;
  place-items:center;
  font-size:14px;
  flex:0 0 28px
}

.notice-row b{
  font-size:12px
}

.notice-row .muted{
  font-size:10px;
  margin-top:2px
}

/* TABS */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:12px;
  scrollbar-width:none
}

.tabs::-webkit-scrollbar{
  display:none
}

.tab{
  border:0;
  border-radius:999px;
  padding:9px 13px;
  background:#e9e9ec;
  color:#5e5e64;
  font-size:11px;
  font-weight:850;
  white-space:nowrap
}

.tab.active{
  background:var(--red);
  color:#fff
}

/* JUGADORES */

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ededf0
}

.item:last-child{
  border-bottom:0
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#ececef;
  display:grid;
  place-items:center;
  font-size:20px;
  overflow:hidden
}

.avatar.red{
  background:var(--red-soft);
  color:var(--red)
}

.grow{
  flex:1;
  min-width:0
}

.item b{
  font-size:13px
}

.item .muted{
  font-size:10px;
  margin-top:2px
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  background:var(--ok);
  margin-right:5px
}

.status-dot.off{
  background:#f0b400
}

.pill{
  display:inline-flex;
  align-items:center;
  font-size:10px;
  font-weight:900;
  border-radius:999px;
  padding:5px 8px;
  background:#e8f7ec;
  color:#258640
}

.pill.danger{
  background:#fae8eb;
  color:#bd2738
}

.pill.warning{
  background:#fff4d9;
  color:#9a7115
}

/* FORMULARIOS */

.form-group{
  margin-bottom:12px
}

.form-group label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px
}

.form-input,
.select{
  width:100%;
  border:1px solid var(--line);
  background:#fafafa;
  color:var(--text);
  border-radius:11px;
  padding:11px;
  font-size:14px;
  outline:none
}

.form-input:focus,
.select:focus{
  border-color:#f18b95
}

/* ENTRENAMIENTOS */

.date-strip{
  display:grid;
  grid-template-columns:repeat(7,1fr);
  gap:4px;
  margin-bottom:12px
}

.day{
  border:0;
  background:transparent;
  border-radius:11px;
  padding:8px 2px;
  text-align:center;
  color:#6d6d73
}

.day b{
  display:block;
  font-size:9px;
  text-transform:uppercase
}

.day span{
  display:block;
  font-size:12px;
  font-weight:900;
  margin-top:4px
}

.day.active{
  background:var(--red);
  color:#fff
}

.training-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:8px
}

.plus{
  width:38px;
  height:38px;
  border:0;
  border-radius:50%;
  background:var(--red);
  color:#fff;
  font-size:24px;
  line-height:1
}

.training-card{
  border-left:4px solid var(--red)
}

.training-time{
  font-size:20px;
  font-weight:950;
  margin:3px 0
}

.training-place{
  font-size:11px;
  color:var(--muted)
}

.plan-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  padding:9px 0;
  border-bottom:1px solid var(--line);
  font-size:12px
}

.plan-row:last-child{
  border-bottom:0
}

.plan-min{
  color:var(--muted);
  font-size:10px
}

/* PARTIDOS */

.match-card{
  position:relative
}

.versus{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:13px 0
}

.club{
  width:90px;
  text-align:center;
  font-weight:900;
  font-size:11px
}

.club-logo{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#f0f0f2;
  margin:0 auto 5px;
  display:grid;
  place-items:center;
  font-size:21px
}

.vs{
  font-weight:950;
  font-size:15px;
  color:#888
}

/* MÁS */

.more-screen{
  background:var(--dark);
  min-height:calc(100vh - 80px);
  margin:-16px -14px -28px;
  padding:16px 14px 30px;
  color:#fff
}

.more-screen .title{
  color:#fff
}

.coach-card{
  display:flex;
  align-items:center;
  gap:12px;
  background:#17171a;
  border:1px solid #2b2b30;
  border-radius:15px;
  padding:13px;
  margin-bottom:12px
}

.coach-avatar{
  width:48px;
  height:48px;
  border-radius:50%;
  background:linear-gradient(145deg,#d9d9dc,#77777e);
  display:grid;
  place-items:center;
  font-size:22px
}

.more-menu{
  display:grid;
  gap:8px
}

.more-row{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  border:1px solid #2b2b30;
  background:#17171a;
  color:#fff;
  border-radius:13px;
  padding:12px;
  text-align:left
}

.more-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#242428;
  display:grid;
  place-items:center;
  font-size:16px;
  flex:0 0 30px
}

.more-row.red-icon .more-icon{
  background:#3b1419;
  color:#ff6975
}

.more-text{
  flex:1;
  font-size:12px;
  font-weight:850
}

.more-arrow{
  color:#8c8c92;
  font-size:17px
}

/* TÁCTICA — MANTENIDA */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:12px
}

.select-wrap label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:5px
}

.pitch-wrap{
  background:#e8e8ea;
  border-radius:19px;
  padding:8px;
  margin-bottom:12px
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:14px;
  overflow:hidden;
  background:repeating-linear-gradient(
    0deg,
    #278247 0 9%,
    #2d8b4f 9% 18%
  );
  touch-action:manipulation
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #fff9;
  border-radius:8px
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #fff9
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #fff9;
  border-radius:50%;
  left:36.5%;
  top:36.5%
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px)
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #fff9
}

.box.top{top:2.5%}
.box.bottom{bottom:2.5%}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18
}

.goal.top{top:0}
.goal.bottom{bottom:0}

.tactic-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:clamp(68px,22vw,105px);
  z-index:6;
  text-align:center
}

.tactic-role{
  display:inline-block;
  background:var(--dark);
  color:#fff;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  margin-bottom:3px
}

.slot-select{
  display:block;
  width:100%;
  height:36px;
  border:3px solid var(--red);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  padding:0 4px;
  font-size:9px;
  font-weight:900;
  outline:none
}

.alignment-list{
  border:1px solid var(--line);
  border-radius:13px;
  overflow:hidden
}

.alignment-row{
  display:flex;
  align-items:center;
  gap:8px;
  min-height:44px;
  padding:6px 9px;
  border-bottom:1px solid var(--line)
}

.alignment-row:last-child{
  border-bottom:0
}

.role-badge{
  background:var(--dark);
  color:#fff;
  border-radius:8px;
  padding:4px 6px;
  font-size:9px;
  font-weight:900
}

.alignment-name{
  flex:1;
  min-width:0;
  font-size:11px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis
}

.availability{
  font-size:9px;
  font-weight:800;
  white-space:nowrap
}

.availability.ok{
  color:#2c9646
}

.availability.no{
  color:#c52d3d
}

.tactic-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px
}

.notice{
  background:#fff0f2;
  color:#8c2531;
  border-radius:13px;
  padding:12px;
  font-size:11px;
  font-weight:700
}

/* NAVEGACIÓN */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  display:flex;
  justify-content:space-around;
  background:#fffefeeF;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dedee2;
  padding:7px 3px calc(7px + env(safe-area-inset-bottom));
  z-index:30;
  box-shadow:0 -8px 25px rgba(20,20,25,.08)
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#77777e;
  font-size:10px;
  font-weight:850;
  padding:6px 4px;
  min-width:52px;
  border-radius:11px
}

nav button.active{
  color:var(--red)!important;
  background:var(--red-soft)
}

nav button .nav-icon{
  font-size:18px;
  line-height:18px;
  margin-bottom:2px
}

@media(max-width:380px){

  main{
    padding-left:11px;
    padding-right:11px
  }

  .stat-grid{
    gap:4px
  }

  .stat{
    padding:10px 4px
  }

  .stat b{
    font-size:19px
  }

  .tactic-slot{
    width:clamp(62px,20vw,90px)
  }

  .slot-select{
    font-size:8px
  }
}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="header-row">

    <div>

      <div class="brand">
        ⚽ <span>KNATT</span>
      </div>

      <div class="role">
        Tu equipo, en una sola app
      </div>

    </div>

    <button
      class="header-bell"
      onclick="alert('No tienes nuevas notificaciones.')">

      🔔

    </button>

  </div>

</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>

<script>

const KEY='teamhub-v2';

let data;

try{

  const saved=
    localStorage.getItem(KEY);

  data=
    saved
      ?JSON.parse(saved)
      :null;

}catch(e){

  data=null;

}


/* DATOS */

if(!data||typeof data!=='object'){

  data={

    players:[

      {
        id:1,
        name:'Montiimontys',
        num:9,
        pos:'DC',
        available:true,
        reason:'',
        min:1126,
        g:12,
        a:6
      },

      {
        id:2,
        name:'Marc',
        num:7,
        pos:'MC',
        available:true,
        reason:'',
        min:1030,
        g:5,
        a:8
      },

      {
        id:3,
        name:'Juan',
        num:4,
        pos:'DFC',
        available:false,
        reason:'Trabajo',
        min:980,
        g:4,
        a:3
      },

      {
        id:4,
        name:'Alex',
        num:1,
        pos:'POR',
        available:true,
        reason:'',
        min:1260,
        g:0,
        a:1
      },

      {
        id:5,
        name:'Pedro',
        num:3,
        pos:'LI',
        available:false,
        reason:'Lesión',
        min:640,
        g:1,
        a:2
      }

    ],

    next:{
      opponent:'CD Rival',
      date:'Domingo, 24 de agosto',
      time:'12:00',
      place:'Campo Municipal'
    },

    trainings:[
      {
        date:'Miércoles, 20 de agosto',
        time:'21:15',
        place:'Campo Municipal',
        att:18,
        total:22
      }
    ],

    matches:[
      {
        date:'17 AGO',
        home:'KNATT FC',
        away:'UD Ejemplo',
        score:'2 - 1'
      },
      {
        date:'10 AGO',
        home:'CD Prueba',
        away:'KNATT FC',
        score:'0 - 3'
      },
      {
        date:'03 AGO',
        home:'KNATT FC',
        away:'CF Amistad',
        score:'1 - 1'
      }
    ],

    tactics:{
      formation:'4-3-3',
      positions:{},
      savedLineup:[]
    },

    settings:{
      coach:'',
      team:'KNATT FC',
      season:'2026/27',
      category:'Primer Equipo'
    }

  }

}


/* NORMALIZACIÓN */

if(!Array.isArray(data.players))
  data.players=[];

data.players=
  data.players.map(
    (p,index)=>({

      id:
        p?.id ??
        Date.now()+index,

      name:
        String(
          p?.name ||
          'Jugador'
        ),

      num:
        p?.num ??
        '-',

      pos:
        String(
          p?.pos ||
          'Jugador'
        ),

      available:
        typeof p?.available==='boolean'
          ?p.available
          :true,

      reason:
        String(
          p?.reason ||
          ''
        ),

      min:
        Number(p?.min)||0,

      g:
        Number(p?.g)||0,

      a:
        Number(p?.a)||0

    })
  );

if(!data.next)
  data.next={};

data.next.opponent=
  data.next.opponent ||
  'CD Rival';

data.next.date=
  data.next.date ||
  'Próximo partido';

data.next.time=
  data.next.time ||
  '12:00';

data.next.place=
  data.next.place ||
  'Campo Municipal';

if(!Array.isArray(data.trainings))
  data.trainings=[];

if(!Array.isArray(data.matches))
  data.matches=[];

if(!data.tactics)
  data.tactics={};

data.tactics.formation=
  data.tactics.formation ||
  '4-3-3';

function esc(str){

  return String(str).replace(
    /[&<>"']/g,
    m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m])
  )

}

function go(s){

function addPlayer(){

  const name=
    prompt(
      'Nombre del jugador:'
    );

  if(!name)return;

  const num=
    prompt(
      'Número de camiseta:',
      ''
    );

  if(num===null)return;

  const pos=
    prompt(
      'Posición:',
      ''
    );

  if(pos===null)return;

  data.players.push({

    id:Date.now(),

    name:name.trim(),

    num:num.trim()||'-',

    pos:
      pos.trim()||
      'Jugador',

    available:true,

    reason:'',

    min:0,

    g:0,

    a:0

  });

  save();
  render()

}


function editPlayer(){

  const p=getPlayer();

  if(!p)return;

  const name=
    prompt(
      'Nombre del jugador:',
      p.name
    );

  if(name===null)return;

  const num=
    prompt(
      'Número de camiseta:',
      p.num
    );

  if(num===null)return;

  const pos=
    prompt(
      'Posición:',
      p.pos
    );

  if(pos===null)return;

  const available=
    confirm(
      '¿Está disponible?\n\n' +
      'Aceptar = Sí\n' +
      'Cancelar = No'
    );

  let reason='';

  if(!available){

    const r=
      prompt(
        'Motivo:',
        p.reason
      );

    if(r!==null)
      reason=r.trim()

  }

  const min=
    prompt(
      'Minutos:',
      p.min
    );

  if(min===null)return;

  const goals=
    prompt(
      'Goles:',
      p.g
    );

  if(goals===null)return;

  const assists=
    prompt(
      'Asistencias:',
      p.a
    );

  if(assists===null)return;

  p.name=
    name.trim()||
    p.name;

  p.num=
    num.trim()||
    p.num;

  p.pos=
    pos.trim()||
    p.pos;

  p.available=
    available;

  p.reason=
    reason;

  p.min=
    Number(min)||0;

  p.g=
    Number(goals)||0;

  p.a=
    Number(assists)||0;

  save();
  render()

}


function deletePlayer(id){

  const p=
    data.players.find(
      x=>
        String(x.id)===
        String(id)
    );

  if(
    !p ||
    !confirm(
      '¿Eliminar a '+
      p.name+
      ' de la plantilla?'
    )
  )
    return;

  data.players=
    data.players.filter(
      x=>
        String(x.id)!==
        String(id)
    );

  Object.keys(
    data.tactics.positions||{}
  )
  .forEach(
    k=>{

      if(
        String(
          data.tactics.positions[k]
            ?.playerId
        )===
        String(id)
      ){

        delete data.tactics.positions[k]

      }

    }
  );

  data.tactics.savedLineup=
    data.tactics.savedLineup
      .filter(
        x=>
          String(x)!==
          String(id)
      );

  save();

  selectedPlayerId=null;

  section='team';

  render()

}

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  const url=
    URL.createObjectURL(
      blob
    );

  const a=
    document.createElement(
      'a'
    );

  a.href=url;

  a.download=
    'knatt-datos.json';

  a.click();

  URL.revokeObjectURL(url)

}


function resetApp(){

  if(
    !confirm(
      'Esto borrará los datos actuales de KNATT en este dispositivo. ¿Continuar?'
    )
  )
    return;

  localStorage.removeItem(
    KEY
  );

  location.reload()

}


/* =========================
   TÁCTICA
   ========================= */

function normalizeTacticPositions(){

  const spots=
    formations[
      data.tactics.formation
    ] ||
    formations['4-3-3'];

  const old=
    data.tactics.positions ||
    {};

  const values=
    Object.values(old);

  const alreadyNew=
    values.some(
      v=>
        v &&
        v.playerId!==undefined
    );

  if(alreadyNew)
    return;

  const next={};

  const oldPlayers=
    Object.entries(old)
      .map(
        ([id,v])=>({
          id:String(id),
          v
        })
      )
      .filter(
        x=>
          data.players.some(
            p=>
              String(p.id)===
              x.id
          )
      );

  oldPlayers
    .slice(
      0,
      spots.length
    )
    .forEach(
      (x,i)=>{

        next[String(i)]={
          playerId:x.id,
          x:spots[i][1],
          y:spots[i][2],
          role:spots[i][0]
        }

      }
    );

  data.tactics.positions=
    next;

  save()

}


function tactic(){

  normalizeTacticPositions();

  const formation=
    data.tactics.formation;

  const spots=
    formations[formation] ||
    formations['4-3-3'];

  const positions=
    data.tactics.positions ||
    {};

  return `

  <div class="title">
    Táctica
  </div>


  <div class="card">

    <div class="section-label">
      PIZARRA TÁCTICA
    </div>

    <div class="big">
      Crear alineación
    </div>

    <div class="muted small">

      Elige una formación y selecciona
      un jugador en cada una de las
      11 posiciones. No hay que
      arrastrar nada.

    </div>

  </div>


  <div class="tactic-toolbar">

    <div class="select-wrap">

      <label>
        Formación
      </label>

      <select
        class="select"
        onchange="changeFormation(this.value)">

        ${
          Object.keys(formations)
            .map(
              f=>`

              <option
                value="${f}"
                ${
                  f===formation
                    ?'selected'
                    :''
                }>

                ${f}

              </option>

              `
            )
            .join('')
        }

      </select>

    </div>


    <button
      class="btn light"
      onclick="resetTactic()">

      ↺ Reset

    </button>

  </div>


  <div class="pitch-wrap">

    <div
      class="pitch"
      id="pitch">

      <div class="pitch-line"></div>

      <div class="pitch-circle"></div>

      <div class="pitch-center"></div>

      <div class="box top"></div>

      <div class="box bottom"></div>

      <div class="goal top"></div>

      <div class="goal bottom"></div>

      ${
        spots
          .map(
            (spot,i)=>
              slotHtml(
                spot,
                i,
                positions
              )
          )
          .join('')
      }

    </div>

  </div>


  <div class="card">

    <div class="section-label">
      ALINEACIÓN
    </div>

    <div
      class="muted small"
      style="margin-bottom:8px">

      Cada jugador solo puede ocupar
      una posición.

    </div>

    <div class="alignment-list">

      ${
        spots
          .map(
            (spot,i)=>
              alignmentRow(
                spot,
                i,
                positions
              )
          )
          .join('')
      }

    </div>

  </div>


  <div class="tactic-actions">

    <button
      class="btn"
      onclick="saveTactic()">

      💾 Guardar alineación

    </button>

    <button
      class="btn light"
      onclick="clearTactic()">

      🧹 Vaciar campo

    </button>

  </div>


  <div class="notice">

    💡 Puedes poner cualquier jugador
    en cualquier posición. Si un jugador
    ya está seleccionado, no aparecerá
    como opción en otra posición.

  </div>

  `

}


function slotHtml(
  spot,
  index,
  positions
){

  const role=spot[0];

  const x=spot[1];

  const y=spot[2];

  const selectedId=
    positions[
      String(index)
    ]?.playerId ||
    '';

  return `

  <div
    class="tactic-slot"
    style="
      left:${x}%;
      top:${y}%
    ">

    <div class="tactic-role">
      ${role}
    </div>

    <select
      class="slot-select"
      aria-label="Posición ${role}"
      onchange="
        assignPosition(
          ${index},
          this.value
        )
      ">

      <option value="">
        -- ${role} --
      </option>

      ${
        playerOptions(
          selectedId
        )
      }

    </select>

  </div>

  `

}


function playerOptions(
  selectedId
){

  const used=
    new Set(
      Object.values(
        data.tactics.positions ||
        {}
      )
      .map(
        v=>
          String(
            v?.playerId ||
            ''
          )
      )
      .filter(Boolean)
    );

  return data.players
    .map(
      p=>{

        const id=
          String(p.id);

        const disabled=
          used.has(id) &&
          id!==String(
            selectedId
          );

        return `

        <option
          value="${id}"
          ${
            id===String(selectedId)
              ?'selected'
              :''
          }
          ${
            disabled
              ?'disabled'
              :''
          }>

          ${esc(p.name)}

        </option>

        `

      }
    )
    .join('')

}


function alignmentRow(
  spot,
  index,
  positions
){

  const id=
    positions[
      String(index)
    ]?.playerId ||
    '';

  const p=
    data.players.find(
      x=>
        String(x.id)===
        String(id)
    );

  return `

  <div class="alignment-row">

    <span class="role-badge">
      ${spot[0]}
    </span>

    <span class="alignment-name">

      ${
        p
          ?esc(p.name)
          :'-- Sin jugador --'
      }

    </span>

    ${
      p

      ?

      `
      <span
        class="availability ${
          p.available
            ?'ok'
            :'no'
        }">

        ${
          p.available
            ?'● Disponible'
            :'● '+esc(
              p.reason ||
              'No disponible'
            )
        }

      </span>
      `

      :

      ''

    }

  </div>

  `

}


function assignPosition(
  index,
  playerId
){

  if(!data.tactics.positions)
    data.tactics.positions={};

  const key=
    String(index);

  const id=
    String(
      playerId ||
      ''
    );

  if(!id){

    delete data.tactics.positions[
      key
    ];

    save();
    render();

    return

  }

  const duplicate=
    Object.entries(
      data.tactics.positions
    )
    .some(
      ([k,v])=>
        k!==key &&
        String(
          v?.playerId ||
          ''
        )===id
    );

  if(duplicate){

    alert(
      'Ese jugador ya está colocado en otra posición.'
    );

    render();

    return

  }

  const spot=
    (
      formations[
        data.tactics.formation
      ] ||
      formations['4-3-3']
    )[index];

  data.tactics.positions[
    key
  ]={

    playerId:id,

    x:spot[1],

    y:spot[2],

    role:spot[0]

  };

  save();

  render()

}


function changeFormation(
  formation
){

  data.tactics.formation=
    formation;

  const spots=
    formations[formation];

  const old=
    data.tactics.positions ||
    {};

  const next={};

  spots.forEach(
    (spot,i)=>{

      const id=
        String(
          old[
            String(i)
          ]?.playerId ||
          ''
        );

      if(
        id &&
        !Object.values(
          next
        )
        .some(
          v=>
            String(v.playerId)===
            id
        )
      ){

        next[
          String(i)
        ]={

          playerId:id,

          x:spot[1],

          y:spot[2],

          role:spot[0]

        }

      }

    }
  );

  data.tactics.positions=
    next;

  save();

  render()

}


function resetTactic(){

  const spots=
    formations[
      data.tactics.formation
    ];

  const next={};

  data.players
    .slice(
      0,
      spots.length
    )
    .forEach(
      (p,i)=>{

        next[
          String(i)
        ]={

          playerId:
            String(p.id),

          x:spots[i][1],

          y:spots[i][2],

          role:spots[i][0]

        }

      }
    );

  data.tactics.positions=
    next;

  save();

  render()

}


function clearTactic(){

  data.tactics.positions={};

  save();

  render()

}


function saveTactic(){

  data.tactics.savedLineup=
    Object.keys(
      data.tactics.positions ||
      {}
    )
    .filter(
      k=>
        data.tactics.positions[k]
          ?.playerId
    );

  save();

  alert(
    'Alineación guardada correctamente.'
  )

}


/* ARRANQUE */

render();

</script>
