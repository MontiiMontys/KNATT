<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#09090b">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --red:#e21d2f;
  --red-dark:#b80f20;
  --red-light:#fff0f2;
  --black:#09090b;
  --black2:#151518;
  --bg:#f4f4f6;
  --white:#fff;
  --text:#17171a;
  --muted:#77777e;
  --line:#e4e4e8;
}

html,body{
  margin:0;
  padding:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:82px;
  background:var(--bg);
}

/* HEADER */

header{
  background:var(--black);
  color:white;
  padding:17px 18px;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:28px;
  font-weight:950;
  letter-spacing:-1px;
}

.brand span{
  color:var(--red);
}

.role{
  color:#99999f;
  font-size:11px;
  font-weight:700;
  margin-top:2px;
}

.header-button{
  width:38px;
  height:38px;
  border:1px solid #ffffff15;
  border-radius:12px;
  background:#ffffff0d;
  color:white;
}

/* GENERAL */

main{
  padding:16px 14px 28px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:3px 2px 14px;
}

.title{
  font-size:25px;
  line-height:1.05;
  font-weight:950;
  letter-spacing:-.7px;
}

.subtitle{
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:4px;
}

.card{
  background:var(--white);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 7px 24px #14141912;
}

.card-dark{
  background:var(--black2);
  color:white;
  border-color:#29292d;
}

.section-label{
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.8px;
  text-transform:uppercase;
  margin-bottom:7px;
}

.big{
  font-size:21px;
  font-weight:950;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--red);
  color:white;
  font-size:13px;
  font-weight:900;
}

.btn.light{
  background:#eeeeF1;
  color:#222;
}

.btn.soft{
  background:var(--red-light);
  color:var(--red);
}

.btn.full{
  width:100%;
}

/* HOME */

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin-top:14px;
}

.icon-box{
  width:44px;
  height:44px;
  border-radius:13px;
  display:grid;
  place-items:center;
  background:var(--red-light);
  color:var(--red);
  font-size:20px;
}

.match-info{
  flex:1;
}

.match-time{
  font-size:14px;
  font-weight:900;
}

.match-place{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:14px;
  padding:12px 6px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:20px;
  font-weight:950;
}

.stat span{
  display:block;
  margin-top:3px;
  font-size:9px;
  font-weight:800;
  color:var(--muted);
}

.card-dark .stat{
  background:#1d1d21;
  border-color:#2b2b30;
  color:white;
}

.card-dark .stat span{
  color:#9b9ba1;
}

.versus{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:17px;
  margin:15px 0;
}

.club{
  width:90px;
  text-align:center;
  font-size:11px;
  font-weight:900;
}

.club-logo{
  width:46px;
  height:46px;
  margin:0 auto 6px;
  border-radius:13px;
  background:#f0f0f2;
  display:grid;
  place-items:center;
  font-size:21px;
}

.vs{
  font-size:14px;
  font-weight:950;
  color:#888;
}

/* PLANTILLA */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:12px;
}

.tab{
  border:0;
  border-radius:999px;
  background:#e9e9ec;
  color:#5f5f66;
  padding:9px 13px;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}

.tab.active{
  background:var(--red);
  color:white;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ededf0;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#ececef;
  display:grid;
  place-items:center;
  font-size:19px;
}

.grow{
  flex:1;
  min-width:0;
}

.item b{
  font-size:13px;
}

.item .muted{
  font-size:10px;
  margin-top:3px;
}

/* FORMS */

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:900;
  letter-spacing:.7px;
  text-transform:uppercase;
  margin-bottom:6px;
}

.form-input,
.form-select{
  width:100%;
  border:1px solid var(--line);
  border-radius:11px;
  background:#fafafa;
  padding:11px;
  outline:none;
}

/* MÁS */

.more-screen{
  min-height:calc(100vh - 80px);
  margin:-16px -14px -28px;
  padding:18px 14px 30px;
  background:var(--black);
  color:white;
}

.more-screen .title{
  color:white;
}

.more-menu{
  display:grid;
  gap:9px;
  margin-top:18px;
}

.more-row{
  width:100%;
  display:flex;
  align-items:center;
  gap:11px;
  border:1px solid #29292d;
  border-radius:14px;
  padding:13px;
  background:#151518;
  color:white;
  text-align:left;
}

.more-icon{
  width:31px;
  height:31px;
  border-radius:9px;
  display:grid;
  place-items:center;
  background:#242428;
  flex:0 0 31px;
}

.more-text{
  flex:1;
  font-size:12px;
  font-weight:850;
}

.more-arrow{
  color:#88888e;
}

/* PARTIDOS */

.result{
  text-align:center;
  font-weight:950;
  font-size:18px;
}

/* ================================
   TÁCTICA
   ================================ */

.tactic-top{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:12px;
}

.pitch-wrap{
  background:#e8e8ea;
  padding:8px;
  border-radius:19px;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  overflow:hidden;
  border-radius:14px;

  background:
    repeating-linear-gradient(
      0deg,
      #278247 0 9%,
      #2d8b4f 9% 18%
    );
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #ffffff99;
  border-radius:8px;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #ffffff99;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  left:36.5%;
  top:36.5%;
  border:2px solid #ffffff99;
  border-radius:50%;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
  border-radius:50%;
  background:white;
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #ffffff99;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid white;
  background:#ffffff18;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}

/*
  TÁCTICA:

  POSICIÓN
     ↓
  [ NOMBRE ]

  SOLO ESO.
*/

.tactic-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:clamp(67px,22vw,105px);
  text-align:center;
  z-index:10;
}

.tactic-role{
  display:inline-block;
  padding:4px 7px;
  margin-bottom:3px;
  border-radius:999px;
  background:var(--black);
  color:white;
  font-size:9px;
  font-weight:950;
}

.player-select{
  display:block;
  width:100%;
  height:36px;
  border:3px solid var(--red);
  border-radius:10px;
  background:white;
  color:#151518;
  padding:0 4px;
  font-size:9px;
  font-weight:900;
  outline:none;
}

.tactic-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}

/* NAV */

nav{
  position:fixed;
  z-index:50;
  left:50%;
  bottom:0;
  transform:translateX(-50%);
  width:min(560px,100%);
  display:flex;
  justify-content:space-around;
  background:#fffffff0;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dedee2;
  padding:7px 3px calc(7px + env(safe-area-inset-bottom));
  box-shadow:0 -8px 25px #14141912;
}

nav button{
  min-width:52px;
  border:0;
  border-radius:11px;
  background:none;
  color:#77777e;
  padding:6px 4px;
  font-size:10px;
  font-weight:850;
}

nav button.active{
  color:var(--red);
  background:var(--red-light);
}

.nav-icon{
  font-size:18px;
  line-height:18px;
  margin-bottom:2px;
}

@media(max-width:380px){

  main{
    padding-left:11px;
    padding-right:11px;
  }

  .tactic-slot{
    width:clamp(61px,20vw,90px);
  }

  .player-select{
    font-size:8px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>

  <div class="header-row">

    <div>

      <div class="brand">
        ⚽ <span>KNATT</span>
      </div>

      <div class="role">
        Tu equipo, en una sola app

    </div>

    <button

</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>

let section='home';

/* =========================================

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


function esc(value){

  return String(value).replace(
    /[&<>"']/g,
    char=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[char])
  );

}


function go(page){

  section=page;

  selectedPlayerId=null;

  window.scrollTo(0,0);

  render();

  ];

}


/* =========================================
   RENDER
   ========================================= */

function render(){

  document.getElementById(
    'nav'
  ).innerHTML=

    navItems()
      .map(
        item=>`

        <button
          class="${
            section===item[0]
              ?'active'
              :''
          }"
          onclick="
            go('${item[0]}')
          ">

          <div class="nav-icon">
            ${item[1]}
          </div>

          ${item[2]}

        </button>

        `
      )
      .join('');


  const content=
    document.getElementById(
      'content'
    );


  if(section==='home')
    content.innerHTML=home();

  else if(section==='team')
    content.innerHTML=team();

  else if(section==='player')
    content.innerHTML=player();

  else if(section==='tactic')
    content.innerHTML=tactic();

  else if(section==='matches')
    content.innerHTML=matches();

  else if(section==='more')
    content.innerHTML=more();

  else if(section==='stats')
    content.innerHTML=stats();

  else if(section==='settings')
    content.innerHTML=settings();

}

function addPlayer(){

  const name=
    prompt(
      'Nombre del jugador:'
    );

  if(!name)
    return;


  const num=
    prompt(
      'Dorsal:',
      ''
    );

  if(num===null)
    return;


  const pos=
    prompt(
      'Posición:',
      ''
    );

  if(pos===null)
    return;


  data.players.push({

    id:Date.now(),

    name:name.trim(),

    num:num.trim()||'-',

    pos:pos.trim()||'Jugador',

    available:true,

    reason:'',

    min:0,

    g:0,

    a:0

  });


  save();

  render();

}

function tactic(){

  const formation=

    data.tactics.positions||

  return `

      class="form-select"
      onchange="
        changeFormation(this.value)
      ">

      ${
        Object.keys(formations)
          .map(
            f=>`

            <option
              value="${f}"
              ${
                f===formation
                  ?'selected'
                  :''
              }>

              ${f}

            </option>

            `
          )
          .join('')
      }

    </select>


    <button
      class="btn light"
      onclick="clearTactic()">

      Vaciar

    </button>

  </div>


  <div class="pitch-wrap">

    <div class="pitch">

      <div class="pitch-line"></div>

      <div class="pitch-circle"></div>

      <div class="pitch-center"></div>

      <div class="box top"></div>

      <div class="box bottom"></div>

      <div class="goal top"></div>

      <div class="goal bottom"></div>


      ${
        spots.map(
          (spot,index)=>
            createTacticSlot(
              spot,
              index,
              positions
            )
        ).join('')
      }

    </div>

  </div>


  <div class="tactic-buttons">

    <button
      class="btn"
      onclick="saveTactic()">

      💾 Guardar

    </button>


    <button
      class="btn light"
      onclick="resetTactic()">

      ↺ Reset

    </button>

  </div>

  `;

}


/*
  IMPORTANTE:

  Aquí NO aparece el dorsal.

  Ejemplo:

      DC
  [Montiimontys]

  Y nada más.
*/

function createTacticSlot(
  spot,
  index,
  positions
){

  const role=spot[0];

  const x=spot[1];

  const y=spot[2];

  const selected=
    String(
      positions[
        String(index)
      ]?.playerId||
      ''
    );


  return `

  <div
    class="tactic-slot"
    style="
      left:${x}%;
      top:${y}%;
    ">

    <div class="tactic-role">
      ${role}
    </div>


    <select
      class="player-select"
      onchange="
        assignPlayer(
          ${index},
          this.value
        )
      ">

      <option value="">
        Seleccionar jugador
      </option>


      ${
        getPlayerOptions(
          selected
        )
      }

    </select>

  </div>

  `;

}


/*
  EL DESPLEGABLE SOLO MUESTRA:
  NOMBRE
*/

function getPlayerOptions(
  selected
){

  const used=
    new Set(
      Object.values(
        data.tactics.positions||
        {}
      )
      .map(
        position=>
          String(
            position?.playerId||
            ''
          )
      )
      .filter(Boolean)
    );


  return data.players
    .map(
      player=>{

        const id=
          String(player.id);


        const disabled=
          used.has(id)&&
          id!==selected;


        return `

        <option
          value="${id}"
          ${
            id===selected
              ?'selected'
              :''
          }
          ${
            disabled
              ?'disabled'
              :''
          }>

          ${esc(player.name)}

        </option>

        `;

      }
    )
    .join('');

}


function assignPlayer(
  index,
  playerId
){

  const id=
    String(playerId||'');


  if(!id){

    delete
      data.tactics.positions[
        String(index)
      ];

    save();

    render();

    return;

  }


  const duplicate=
    Object.entries(
      data.tactics.positions
    )
    .some(
      ([position,value])=>
        position!==String(index)&&
        String(
          value?.playerId||
          ''
        )===id
    );


  if(duplicate){

    alert(
      'Ese jugador ya está colocado en otra posición.'
    );

    render();

    return;

  }


  data.tactics.positions[
    String(index)
  ]={

    playerId:id

  };


  save();

  render();

}


/* CAMBIAR FORMACIÓN */

function changeFormation(
  formation
){

  const old=
    data.tactics.positions||
    {};


  const next={};


  formations[
    formation
  ].forEach(
    (spot,index)=>{

      const oldPlayer=
        old[
          String(index)
        ]?.playerId;


      if(
        oldPlayer &&
        !Object.values(
          next
        ).some(
          value=>
            String(
              value.playerId
            )===
            String(oldPlayer)
        )
      ){

        next[
          String(index)
        ]={

          playerId:
            String(oldPlayer)

        };

      }

    }
  );


  data.tactics.formation=
    formation;


  data.tactics.positions=
    next;


  save();

  render();

}


/* VACIAR */

function clearTactic(){

  data.tactics.positions={};

  save();

  render();

}


/* RESET */

function resetTactic(){

  const spots=
    formations[
      data.tactics.formation
    ];


  const next={};


  data.players
    .slice(0,11)
    .forEach(
      (player,index)=>{

        if(!spots[index])
          return;


        next[
          String(index)
        ]={

          playerId:
            String(player.id)

        };

      }
    );


  data.tactics.positions=
    next;


  save();

  render();

}


/* GUARDAR */

function saveTactic(){

  data.tactics.savedLineup=
    Object.values(
      data.tactics.positions
    )
    .map(
      value=>
        value.playerId
    );


  save();

  alert(
    'Alineación guardada correctamente.'
  );

}
