<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green:#123c2d;
  --green-2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
  --danger:#d95c5c;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font-family:inherit;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:96px;
}

/* HEADER */

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--green),#0d2d22);
  color:white;
  padding:26px 20px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #0c2d2225;
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  right:-75px;
  top:-90px;
  background:#b9e86c12;
}

.brand{
  position:relative;
  z-index:2;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand span{
  color:var(--lime);
}

.role{
  position:relative;
  z-index:2;
  opacity:.78;
  font-size:13px;
  margin-top:5px;
  font-weight:600;
}

/* MAIN */

main{
  padding:20px 16px 30px;
}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin:2px 0 16px;
}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

/* ROLE SELECTOR */

.rolebar{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  background:#e6ece8;
  padding:5px;
  border-radius:15px;
}

.rolebar button{
  flex:1;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 7px 25px #10221b0b;
}

.hero{
  background:linear-gradient(145deg,var(--green),var(--green-2));
  color:white;
  border:0;
  padding:20px;
  box-shadow:0 12px 30px #123c2d22;
}

.hero .muted{
  color:#c8d8d1;
}

.hero .big{
  color:white;
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

/* MATCH */

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 0;
}

.team-ball{
  width:50px;
  height:50px;
  border-radius:16px;
  background:#ffffff18;
  display:grid;
  place-items:center;
  font-size:25px;
}

.match-info{
  flex:1;
}

.match-date{
  font-weight:800;
  font-size:14px;
}

.match-place{
  color:#c8d8d1;
  font-size:13px;
  margin-top:3px;
}

/* STATS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  box-shadow:0 6px 20px #10221b08;
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.stat.accent b{
  color:#315d18;
}

/* ROWS */

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px;
}

.grow{
  flex:1;
  min-width:0;
}

/* PILLS */

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20;
}

.pill.danger{
  background:#fae9e9;
  color:#b44343;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  background:var(--green);
  color:white;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 12px #123c2d20;
}

.btn.light{
  background:#e9efec;
  color:var(--green);
  box-shadow:none;
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.danger{
  background:#fae9e9;
  color:#b44343;
  box-shadow:none;
}

.btn.full{
  width:100%;
}

.choice{
  display:flex;
  gap:8px;
}

.choice button{
  flex:1;
}

/* TABS */

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:white;
}

/* NOTICE */

.notice{
  background:#edf6df;
  color:#36561f;
  border-radius:17px;
  padding:14px;
  font-size:13px;
  font-weight:700;
}

/* EMPTY */

.empty{
  text-align:center;
  padding:28px 12px;
  color:var(--muted);
}

.empty-icon{
  font-size:38px;
  margin-bottom:8px;
}

/* NAVIGATION */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffee;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -8px 30px #10221b0c;
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 8px;
  min-width:58px;
  border-radius:13px;
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef;
}

/* MOBILE */

@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .big{
    font-size:20px;
  }

  .brand{
    font-size:27px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ <span>KNATT</span></div>
  <div class="role" id="roleText"></div>
</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>

<script>

/* =========================================================
   DATOS
========================================================= */

const KEY='teamhub-v2';

const DEFAULT_DATA={
  players:[
    {
      id:1,
      name:'Montiimontys',
      num:9,
      pos:'DC',
      available:true,
      reason:'',
      min:1126,
      g:12,
      a:6,
      train:18,
      total:20
    },
    {
      id:2,
      name:'Marc',
      num:7,
      pos:'MC',
      available:true,
      reason:'',
      min:1030,
      g:5,
      a:8,
      train:18,
      total:20
    },
    {
      id:3,
      name:'Juan',
      num:4,
      pos:'DFC',
      available:false,
      reason:'Trabajo',
      min:980,
      g:4,
      a:3,
      train:17,
      total:20
    },
    {
      id:4,
      name:'Alex',
      num:1,
      pos:'POR',
      available:true,
      reason:'',
      min:1260,
      g:0,
      a:1,
      train:19,
      total:20
    },
    {
      id:5,
      name:'Pedro',
      num:3,
      pos:'LI',
      available:false,
      reason:'Lesión',
      min:640,
      g:1,
      a:2,
      train:14,
      total:20
    }
  ],

  next:{
    opponent:'CD Rival',
    date:'Domingo 23 de agosto',
    time:'12:00',
    place:'Campo Municipal'
  },

  trainings:[
    {
      date:'Jueves 20 de agosto',
      time:'21:15',
      place:'Campo Municipal'
    }
  ]
};


/* =========================================================
   CARGA SEGURA DE DATOS
========================================================= */

function safeNumber(value, fallback=0){
  const n=Number(value);
  return Number.isFinite(n)?n:fallback;
}

function normalizePlayer(p,index){

  p=p||{};

  return {
    id:p.id!=null?p.id:Date.now()+index,
    name:String(p.name||'Jugador'),
    num:safeNumber(p.num,index+1),
    pos:String(p.pos||''),
    available:p.available!==false,
    reason:String(p.reason||''),
    min:safeNumber(p.min,0),
    g:safeNumber(p.g,0),
    a:safeNumber(p.a,0),
    train:safeNumber(p.train,0),
    total:safeNumber(p.total,0)
  };
}

function normalizeData(raw){

  if(!raw || typeof raw!=='object'){
    raw={};
  }

  const players=Array.isArray(raw.players)
    ?raw.players.map(normalizePlayer)
    :[];

  const next=raw.next||{};

  const trainings=Array.isArray(raw.trainings)
    ?raw.trainings
    :[];

  return {

    players,

    next:{
      opponent:String(next.opponent||'CD Rival'),
      date:String(next.date||'Próximo partido'),
      time:String(next.time||'12:00'),
      place:String(next.place||'Campo Municipal')
    },

    trainings:trainings.length
      ?trainings.map(t=>({
          date:String(t?.date||'Próximo entrenamiento'),
          time:String(t?.time||'21:15'),
          place:String(t?.place||'Campo Municipal')
        }))
      :[
        {
          date:'Próximo entrenamiento',
          time:'21:15',
          place:'Campo Municipal'
        }
      ]
  };
}

function loadData(){

  try{

    const saved=localStorage.getItem(KEY);

    if(!saved){
      return normalizeData(DEFAULT_DATA);
    }

    return normalizeData(JSON.parse(saved));

  }catch(error){

    console.error('Error cargando datos:',error);

    return normalizeData(DEFAULT_DATA);
  }
}

let data=loadData();


/* =========================================================
   ESTADO
========================================================= */

let role=localStorage.getItem('teamhub-role')||'trainer';

let section='home';

let filter='all';


/* =========================================================
   GUARDAR
========================================================= */

function save(){

  try{
    localStorage.setItem(KEY,JSON.stringify(data));
  }catch(error){
    console.error('Error guardando datos:',error);
  }
}


/* =========================================================
   ROLES
========================================================= */

function setRole(r){

  role=r;

  localStorage.setItem('teamhub-role',r);

  section='home';

  render();
}

function roleName(){

  return role==='trainer'
    ?'Entrenador'
    :'Jugador';
}


/* =========================================================
   JUGADOR ACTUAL
========================================================= */

function currentPlayer(){

  if(!data.players.length){
    return null;
  }

  const savedId=localStorage.getItem('teamhub-player-id');

  if(savedId){

    const found=data.players.find(
      p=>String(p.id)===String(savedId)
    );

    if(found){
      return found;
    }
  }

  const first=data.players[0];

  localStorage.setItem(
    'teamhub-player-id',
    String(first.id)
  );

  return first;
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function navItems(){

  return role==='trainer'

  ?[
    ['home','🏠','Inicio'],
    ['team','👥','Plantilla'],
    ['training','🏋️','Entrenos'],
    ['matches','🏆','Partidos'],
    ['stats','📊','Stats']
  ]

  :[
    ['home','🏠','Inicio'],
    ['profile','⚽','Mi perfil'],
    ['training','🏋️','Entrenos'],
    ['matches','🏆','Partidos'],
    ['stats','📊','Mi temporada']
  ];
}

function go(s){

  section=s;

  render();
}


/* =========================================================
   RENDER PRINCIPAL
========================================================= */

function render(){

  try{

    document.getElementById('roleText').textContent=
      roleName()+' · Primer Equipo';

    document.getElementById('nav').innerHTML=
      navItems()
      .map(x=>`
        <button
          class="${section===x[0]?'active':''}"
          onclick="go('${x[0]}')">
          ${x[1]}<br>${x[2]}
        </button>
      `)
      .join('');

    const c=document.getElementById('content');

    c.innerHTML=`

      <div class="rolebar">

        <button
          class="btn ${role==='trainer'?'':'light'}"
          onclick="setRole('trainer')">
          🧑‍🏫 Entrenador
        </button>

        <button
          class="btn ${role==='player'?'':'light'}"
          onclick="setRole('player')">
          ⚽ Jugador
        </button>

      </div>

    `;

    if(section==='home'){
      c.innerHTML+=home();
    }

    if(section==='team'){
      c.innerHTML+=team();
    }

    if(section==='training'){
      c.innerHTML+=training();
    }

    if(section==='matches'){
      c.innerHTML+=matches();
    }

    if(section==='stats'){
      c.innerHTML+=stats();
    }

    if(section==='profile'){
      c.innerHTML+=profile();
    }

  }catch(error){

    console.error('KNATT render error:',error);

    document.getElementById('content').innerHTML+=`

      <div class="card">

        <div class="section-label">
          KNATT
        </div>

        <div class="big">
          No se ha podido cargar esta sección
        </div>

        <br>

        <button
          class="btn full"
          onclick="location.reload()">
          Recargar KNATT
        </button>

      </div>

    `;
  }
}


/* =========================================================
   INICIO
========================================================= */

function home(){

  /* -----------------------------------------
     ENTRENADOR
  ----------------------------------------- */

  if(role==='trainer'){

    const players=Array.isArray(data.players)
      ?data.players
      :[];

    const available=players.filter(
      p=>p && p.available
    ).length;

    const absent=players.filter(
      p=>p && !p.available
    ).length;

    const goals=players.reduce(
      (s,p)=>s+safeNumber(p.g,0),
      0
    );

    const next=data.next||{
      opponent:'CD Rival',
      date:'Próximo partido',
      time:'12:00',
      place:'Campo Municipal'
    };

    const nextTraining=
      data.trainings &&
      data.trainings.length
      ?data.trainings[0]
      :{
        date:'Próximo entrenamiento',
        time:'21:15',
        place:'Campo Municipal'
      };

    const absences=players.filter(
      p=>p && !p.available
    );

    return `

      <div class="title">
        Panel del equipo
      </div>

      <div class="card hero">

        <div
          class="section-label"
          style="color:#b9e86c">
          PRÓXIMO PARTIDO
        </div>

        <div class="big">
          KNATT 🆚 ${next.opponent}
        </div>

        <div class="match-meta">

          <div class="team-ball">
            ⚽
          </div>

          <div class="match-info">

            <div class="match-date">
              ${next.date} · ${next.time}
            </div>

            <div class="match-place">
              📍 ${next.place}
            </div>

          </div>

        </div>

        <button
          class="btn lime full"
          onclick="go('matches')">
          Ver partido →
        </button>

      </div>

      <div class="section-label">
        RESUMEN DEL EQUIPO
      </div>

      <div class="grid">

        <div class="stat accent">
          <b>${players.length}</b>
          <span>Jugadores</span>
        </div>

        <div class="stat">
          <b>${available}</b>
          <span>Disponibles</span>
        </div>

        <div class="stat">
          <b>${absent}</b>
          <span>Ausentes</span>
        </div>

        <div class="stat">
          <b>${goals}</b>
          <span>Goles</span>
        </div>

      </div>

      <div class="card">

        <div class="row">

          <div>

            <div class="section-label">
              PRÓXIMO ENTRENAMIENTO
            </div>

            <div class="big">
              ${nextTraining.date}
            </div>

            <div class="muted small">
              ${nextTraining.time} ·
              ${nextTraining.place}
            </div>

          </div>

          <div class="avatar">
            🏋️
          </div>

        </div>

      </div>

      <div class="card">

        <div class="section-label">
          AUSENCIAS
        </div>

        ${
          absences.length

          ?absences.map(p=>`

            <div class="item">

              <div class="avatar">
                ⚽
              </div>

              <div class="grow">

                <b>
                  ${p.num} · ${p.name}
                </b>

                <div class="muted small">
                  ${p.pos||'Jugador'}
                </div>

              </div>

              <span class="pill danger">
                ${p.reason||'No disponible'}
              </span>

            </div>

          `).join('')

          :`

            <div class="empty">

              <div class="empty-icon">
                ✅
              </div>

              <b>No hay ausencias</b>

              <div class="small">
                Todos los jugadores están disponibles.
              </div>

            </div>

          `
        }

      </div>

    `;
  }


  /* -----------------------------------------
     JUGADOR
  ----------------------------------------- */

  const p=currentPlayer();

  const next=data.next||{
    opponent:'CD Rival',
    date:'Próximo partido',
    time:'12:00',
    place:'Campo Municipal'
  };

  const nextTraining=
    data.trainings &&
    data.trainings.length
    ?data.trainings[0]
    :{
      date:'Próximo entrenamiento',
      time:'21:15',
      place:'Campo Municipal'
    };


  /* Si no quedan jugadores */

  if(!p){

    return `

      <div class="title">
        Mi área
      </div>

      <div class="card">

        <div class="empty">

          <div class="empty-icon">
            ⚽
          </div>

          <b>No hay jugadores registrados</b>

          <div class="small">
            El entrenador todavía no ha añadido jugadores.
          </div>

        </div>

      </div>

    `;
  }


  return `

    <div class="title">
      Hola, ${p.name}
    </div>

    <div class="card hero">

      <div
        class="section-label"
        style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        KNATT 🆚 ${next.opponent}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          ⚽
        </div>

        <div class="match-info">

          <div class="match-date">
            ${next.date} · ${next.time}
          </div>

          <div class="match-place">
            📍 ${next.place}
          </div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">
        PRÓXIMO ENTRENAMIENTO
      </div>

      <div class="big">
        ${nextTraining.date}
      </div>

      <div class="muted small">
        ${nextTraining.time} ·
        ${nextTraining.place}
      </div>

      <br>

      <div class="choice">

        <button
          class="btn"
          onclick="alert('Asistencia confirmada')">
          ✅ Voy
        </button>

        <button
          class="btn light"
          onclick="alert('Ausencia comunicada')">
          ❌ No voy
        </button>

      </div>

    </div>

    <div class="section-label">
      MI TEMPORADA
    </div>

    <div class="grid">

      <div class="stat">
        <b>${safeNumber(p.min)}</b>
        <span>Minutos</span>
      </div>

      <div class="stat accent">
        <b>${safeNumber(p.g)}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${safeNumber(p.a)}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>
          ${
            p.total>0
            ?Math.round(p.train/p.total*100)
            :0
          }%
        </b>
        <span>Entrenos</span>
      </div>

    </div>

  `;
}


/* =========================================================
   PLANTILLA
========================================================= */

function team(){

  const players=Array.isArray(data.players)
    ?data.players
    :[];

  const list=players.filter(p=>
    filter==='all' ||
    (filter==='available' && p.available) ||
    (filter==='absent' && !p.available)
  );

  return `

    <div class="title">
      Plantilla
    </div>

    <div class="tabs">

      <button
        class="tab ${filter==='all'?'active':''}"
        onclick="filter='all';render()">
        Todos
      </button>

      <button
        class="tab ${filter==='available'?'active':''}"
        onclick="filter='available';render()">
        🟢 Disponibles
      </button>

      <button
        class="tab ${filter==='absent'?'active':''}"
        onclick="filter='absent';render()">
        🔴 Ausentes
      </button>

    </div>

    <div class="card">

      ${
        list.length

        ?list.map(p=>`

          <div class="item">

            <div class="avatar">
              ${p.pos==='POR'?'🧤':'⚽'}
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.pos||'Jugador'} ·
                ${
                  p.available
                  ?'🟢 Disponible'
                  :'🔴 '+(p.reason||'Ausente')
                }
              </div>

              <div class="muted small">
                ${safeNumber(p.g)} ⚽ ·
                ${safeNumber(p.a)} 🎯 ·
                ${safeNumber(p.min)} min
              </div>

            </div>

            <span class="pill">
              ${
                p.total>0
                ?Math.round(p.train/p.total*100)
                :0
              }%
            </span>

          </div>

        `).join('')

        :`

          <div class="empty">

            <div class="empty-icon">
              👥
            </div>

            <b>No hay jugadores</b>

            <div class="small">
              Añade jugadores para comenzar.
            </div>

          </div>

        `
      }

    </div>

  `;
}


/* =========================================================
   ENTRENAMIENTOS
========================================================= */

function training(){

  const t=
    data.trainings &&
    data.trainings.length
    ?data.trainings[0]
    :{
      date:'Próximo entrenamiento',
      time:'21:15',
      place:'Campo Municipal'
    };

  const players=Array.isArray(data.players)
    ?data.players
    :[];

  return `

    <div class="title">
      Entrenamientos
    </div>

    <div class="card hero">

      <div
        class="section-label"
        style="color:#b9e86c">
        PRÓXIMO
      </div>

      <div class="big">
        ${t.date}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          🏋️
        </div>

        <div class="match-info">

          <div class="match-date">
            ${t.time}
          </div>

          <div class="match-place">
            📍 ${t.place}
          </div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">

        ${
          role==='trainer'
          ?'CONTROL DE ASISTENCIA'
          :'MI ASISTENCIA'
        }

      </div>

      ${
        role==='trainer'

        ?

        players.length

        ?players.map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${safeNumber(p.train)}/${safeNumber(p.total)}
                entrenamientos
              </div>

            </div>

            <span class="pill">
              ${
                p.total>0
                ?Math.round(p.train/p.total*100)
                :0
              }%
            </span>

          </div>

        `).join('')

        :`

          <div class="empty">
            <div class="empty-icon">👥</div>
            No hay jugadores registrados.
          </div>

        `

        :

        (()=>{

          const p=currentPlayer();

          if(!p){

            return `
              <div class="empty">
                No hay jugador seleccionado.
              </div>
            `;

          }

          return `

            <div class="grid">

              <div class="stat">
                <b>${safeNumber(p.train)}</b>
                <span>Asistencias</span>
              </div>

              <div class="stat accent">
                <b>
                  ${
                    p.total>0
                    ?Math.round(p.train/p.total*100)
                    :0
                  }%
                </b>
                <span>Asistencia</span>
              </div>

            </div>

          `;

        })()
      }

    </div>

  `;
}


/* =========================================================
   PARTIDOS
========================================================= */

function matches(){

  const next=data.next||{
    opponent:'CD Rival',
    date:'Próximo partido',
    time:'12:00',
    place:'Campo Municipal'
  };

  return `

    <div class="title">
      Partidos
    </div>

    <div class="card hero">

      <div
        class="section-label"
        style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        KNATT 🆚 ${next.opponent}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          ⚽
        </div>

        <div class="match-info">

          <div class="match-date">
            ${next.date}
          </div>

          <div class="match-place">
            ${next.time} ·
            ${next.place}
          </div>

        </div>

      </div>

      ${
        role==='trainer'

        ?

        `<button
          class="btn lime full"
          onclick="alert('Aquí gestionaremos convocatoria y alineación')">
          Gestionar convocatoria
        </button>`

        :

        `<span class="pill">
          Convocatoria pendiente
        </span>`
      }

    </div>

  `;
}


/* =========================================================
   ESTADÍSTICAS
========================================================= */

function stats(){

  const players=Array.isArray(data.players)
    ?data.players
    :[];

  const sorted=[...players]
    .sort((a,b)=>safeNumber(b.g)-safeNumber(a.g));

  const goals=players.reduce(
    (s,p)=>s+safeNumber(p.g),
    0
  );

  const assists=players.reduce(
    (s,p)=>s+safeNumber(p.a),
    0
  );

  const minutes=players.reduce(
    (s,p)=>s+safeNumber(p.min),
    0
  );

  const visible=
    role==='trainer'
    ?sorted
    :(()=>{
        const p=currentPlayer();
        return p?[p]:[];
      })();

  return `

    <div class="title">

      ${
        role==='trainer'
        ?'Estadísticas del equipo'
        :'Mi temporada'
      }

    </div>

    <div class="grid">

      <div class="stat accent">
        <b>${goals}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${assists}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${minutes}</b>
        <span>Minutos</span>
      </div>

      <div class="stat">
        <b>${players.length}</b>
        <span>Jugadores</span>
      </div>

    </div>

    <div class="card">

      <div class="section-label">

        ${
          role==='trainer'
          ?'RENDIMIENTO DE PLANTILLA'
          :'MIS ESTADÍSTICAS'
        }

      </div>

      ${
        visible.length

        ?visible.map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.pos||'Jugador'}
              </div>

            </div>

            <div style="text-align:right">

              <b>
                ${safeNumber(p.min)}
              </b>

              <div class="muted small">
                ${safeNumber(p.g)} ⚽ ·
                ${safeNumber(p.a)} 🎯
              </div>

            </div>

          </div>

        `).join('')

        :`

          <div class="empty">

            <div class="empty-icon">
              📊
            </div>

            No hay estadísticas todavía.

          </div>

        `
      }

    </div>

  `;
}


/* =========================================================
   PERFIL
========================================================= */

function profile(){

  const p=currentPlayer();

  if(!p){

    return `

      <div class="title">
        Mi perfil
      </div>

      <div class="card">

        <div class="empty">

          <div class="empty-icon">
            ⚽
          </div>

          No hay jugador seleccionado.

        </div>

      </div>

    `;
  }

  return `

    <div class="title">
      Mi perfil
    </div>

    <div class="card hero">

      <div class="row">

        <div>

          <div
            class="section-label"
            style="color:#b9e86c">
            JUGADOR
          </div>

          <div class="big">
            ${p.num} · ${p.name}
          </div>

          <div class="muted">
            ${p.pos||'Jugador'}
          </div>

        </div>

        <div class="avatar">
          ⚽
        </div>

      </div>

    </div>

    <div class="grid">

      <div class="stat">
        <b>${safeNumber(p.min)}</b>
        <span>Minutos jugados</span>
      </div>

      <div class="stat accent">
        <b>${safeNumber(p.g)}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${safeNumber(p.a)}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>
          ${
            p.total>0
            ?Math.round(p.train/p.total*100)
            :0
          }%
        </b>
        <span>Entrenamientos</span>
      </div>

    </div>

  `;
}


/* =========================================================
   INICIO
========================================================= */

render();

</script>

</body>
</html>
