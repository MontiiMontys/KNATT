<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef3f0;
  color:#17201d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#f7f9f8;
  padding-bottom:90px;
}

header{
  background:#103c2b;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 12px #0002;
}

.brand{
  font-size:24px;
  font-weight:800;
}

.header-sub{
  font-size:13px;
  opacity:.75;
  margin-top:3px;
}

main{
  padding:16px;
}

.card{
  background:white;
  border:1px solid #e1e7e4;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 3px 12px #00000008;
}

h1,h2,h3{
  margin-top:0;
}

h2{
  font-size:21px;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 15px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.btn{
  background:#103c2b;
  color:white;
}

.btn-light{
  background:#e9efec;
  color:#103c2b;
}

.btn-danger{
  background:#b32626;
  color:white;
}

.btn-gold{
  background:#d6a928;
  color:white;
}

.row{
  display:flex;
  gap:9px;
  align-items:center;
}

.row-between{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd6d1;
  border-radius:12px;
  background:white;
  font-size:16px;
  margin-top:6px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:11px;
}

.item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-bottom:1px solid #edf0ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:42px;
  height:42px;
  border-radius:50%;
  background:#dfe9e4;
  color:#103c2b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
}

.small{
  font-size:13px;
  color:#6d7773;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  background:#e9efec;
  color:#103c2b;
}

.stat{
  text-align:center;
  padding:12px 5px;
  background:#f2f6f4;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:21px;
}

.notice{
  background:#fff7df;
  border:1px solid #f0df9e;
  padding:12px;
  border-radius:13px;
  font-size:14px;
}

.empty{
  text-align:center;
  padding:25px 10px;
  color:#7a8480;
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:white;
  border-top:1px solid #dfe5e2;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:20;
  padding-bottom:env(safe-area-inset-bottom);
}

nav button{
  background:white;
  color:#68736e;
  border-radius:0;
  padding:10px 4px;
  font-size:11px;
}

nav button.active{
  color:#103c2b;
  font-weight:800;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.hidden{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-box{
  width:min(520px,100%);
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.close{
  float:right;
  background:#edf1ef;
  color:#333;
  padding:8px 11px;
}

.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-grid button{
  min-height:70px;
}

.green{
  color:#187443;
}

.red{
  color:#b32626;
}

.yellow{
  color:#9a7600;
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ KNATT</div>
  <div class="header-sub" id="headerSub">Gestión de equipo</div>
</header>

<main id="content"></main>

<nav id="nav">
  <button onclick="go('inicio')" id="nav-inicio">
    <span class="nav-icon">🏠</span>Inicio
  </button>

  <button onclick="go('plantilla')" id="nav-plantilla">
    <span class="nav-icon">👥</span>Plantilla
  </button>

  <button onclick="go('entrenos')" id="nav-entrenos">
    <span class="nav-icon">🏋️</span>Entrenos
  </button>

  <button onclick="go('partidos')" id="nav-partidos">
    <span class="nav-icon">⚽</span>Partidos
  </button>

  <button onclick="go('mas')" id="nav-mas">
    <span class="nav-icon">☰</span>Más
  </button>
</nav>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>

const KEY="teamhub-v2";

let data=JSON.parse(localStorage.getItem(KEY)||"null");

if(!data){
  data={
    team:{
      name:"KNATT",
      season:""
    },

    players:[
      {id:1,name:"Montiimontys",num:9,pos:"DC",available:true,reason:""},
      {id:2,name:"Marc",num:7,pos:"MC",available:true,reason:""},
      {id:3,name:"Juan",num:4,pos:"DFC",available:false,reason:"Lesión"},
      {id:4,name:"Alex",num:1,pos:"POR",available:true,reason:""},
      {id:5,name:"Pedro",num:3,pos:"LI",available:false,reason:"Trabajo"}
    ],

    matches:[
      {
        id:1,
        opponent:"CD Rival",
        date:"Domingo 23 de agosto",
        time:"12:00",
        location:"Campo rival",
        convocados:[]
      }
    ],

    trainings:[
      {
        id:1,
        date:"Jueves 20 de agosto",
        time:"21:15",
        place:"Campo habitual",
        attendance:[]
      }
    ],

    stats:{},

    role:"entrenador"
  };

  save();
}

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

let current="inicio";

function go(page){
  current=page;

  document.querySelectorAll("nav button").forEach(x=>x.classList.remove("active"));

  const n=document.getElementById("nav-"+page);
  if(n)n.classList.add("active");

  render();
}

function render(){

  const content=document.getElementById("content");

  if(current==="inicio") content.innerHTML=home();
  if(current==="plantilla") content.innerHTML=plantilla();
  if(current==="entrenos") content.innerHTML=entrenos();
  if(current==="partidos") content.innerHTML=partidos();
  if(current==="mas") content.innerHTML=mas();

  document.getElementById("headerSub").textContent=
    data.role==="administrador" ? "Administrador" :
    data.role==="entrenador" ? "Entrenador" :
    "Jugador";
}

function home(){

  const next=data.matches[0];

  const disponibles=data.players.filter(p=>p.available).length;

  return `
    <div class="card">
      <h2>👋 Inicio</h2>
      <p class="small">Panel principal de ${data.team.name}</p>

      <div class="grid3">
        <div class="stat">
          <strong>${data.players.length}</strong>
          <span class="small">Jugadores</span>
        </div>

        <div class="stat">
          <strong>${disponibles}</strong>
          <span class="small">Disponibles</span>
        </div>

        <div class="stat">
          <strong>${data.trainings.length}</strong>
          <span class="small">Entrenos</span>
        </div>
      </div>
    </div>

    <div class="card">
      <h2>🏆 Próximo partido</h2>

      ${
        next
        ? `
          <div class="item">
            <div class="avatar">⚽</div>
            <div style="flex:1">
              <strong>${next.opponent}</strong>
              <div class="small">${next.date} · ${next.time}</div>
              <div class="small">${next.location}</div>
            </div>
          </div>

          <button class="btn" style="width:100%;margin-top:10px"
            onclick="go('partidos')">
            Ver partido
          </button>
        `
        : `<div class="empty">No hay partidos registrados.</div>`
      }
    </div>

    <div class="card">
      <h2>🏋️ Próximo entrenamiento</h2>

      ${
        data.trainings[0]
        ? `
          <strong>${data.trainings[0].date}</strong>
          <div class="small">
            ${data.trainings[0].time} · ${data.trainings[0].place}
          </div>
        `
        : `<div class="empty">No hay entrenamientos.</div>`
      }
    </div>

    <div class="card">
      <h2>⚡ Acciones rápidas</h2>

      <div class="action-grid">
        <button class="btn-light" onclick="go('plantilla')">👥 Plantilla</button>
        <button class="btn-light" onclick="go('entrenos')">🏋️ Entreno</button>
        <button class="btn-light" onclick="go('partidos')">⚽ Partido</button>
        <button class="btn-light" onclick="go('mas')">⚙️ Más</button>
      </div>
    </div>
  `;
}

function plantilla(){

  return `
    <div class="row-between">
      <div>
        <h2 style="margin-bottom:3px">👥 Plantilla</h2>
        <div class="small">${data.players.length} jugadores</div>
      </div>

      ${
        data.role!=="jugador"
        ? `<button class="btn" onclick="newPlayer()">＋</button>`
        : ""
      }
    </div>

    <div class="card" style="margin-top:12px">

      ${
        data.players.map(p=>`

          <div class="item">

            <div class="avatar">${p.num}</div>

            <div style="flex:1">
              <strong>${p.name}</strong>
              <div class="small">
                ${p.pos} ·
                ${
                  p.available
                  ? `<span class="green">Disponible</span>`
                  : `<span class="red">No disponible</span>`
                }
              </div>
            </div>

            <button class="btn-light"
              onclick="player(${p.id})">
              Ver
            </button>

          </div>

        `).join("")
      }

    </div>
  `;
}

function player(id){

  const p=data.players.find(x=>x.id===id);

  if(!p)return;

  const stat=data.stats[id]||{
    goals:0,
    assists:0,
    yellow:0,
    red:0,
    games:0
  };

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>${p.name}</h2>

    <div class="grid2">

      <div>
        <div class="small">Dorsal</div>
        <strong>#${p.num}</strong>
      </div>

      <div>
        <div class="small">Posición</div>
        <strong>${p.pos}</strong>
      </div>

    </div>

    <div class="card" style="margin-top:15px;background:#f4f7f5">

      <div class="row-between">
        <strong>Estado</strong>

        ${
          p.available
          ? `<span class="badge green">Disponible</span>`
          : `<span class="badge red">No disponible</span>`
        }
      </div>

      ${
        !p.available && p.reason
        ? `<div class="small" style="margin-top:8px">${p.reason}</div>`
        : ""
      }

    </div>

    <h3>📊 Estadísticas</h3>

    <div class="grid3">

      <div class="stat">
        <strong>${stat.games}</strong>
        <span class="small">Partidos</span>
      </div>

      <div class="stat">
        <strong>${stat.goals}</strong>
        <span class="small">Goles</span>
      </div>

      <div class="stat">
        <strong>${stat.assists}</strong>
        <span class="small">Asistencias</span>
      </div>

    </div>

    <div class="grid2" style="margin-top:8px">

      <div class="stat">
        <strong>${stat.yellow}</strong>
        <span class="small">Amarillas</span>
      </div>

      <div class="stat">
        <strong>${stat.red}</strong>
        <span class="small">Rojas</span>
      </div>

    </div>

    ${
      data.role!=="jugador"
      ? `
        <button class="btn" style="width:100%;margin-top:15px"
          onclick="editPlayer(${p.id})">
          ✏️ Editar jugador
        </button>
      `
      : ""
    }

  `);
}

function newPlayer(){

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>Nuevo jugador</h2>

    <label>Nombre</label>
    <input id="pName" placeholder="Nombre del jugador">

    <label>Dorsal</label>
    <input id="pNum" type="number" placeholder="Dorsal">

    <label>Posición</label>
    <select id="pPos">
      <option>POR</option>
      <option>DFC</option>
      <option>LD</option>
      <option>LI</option>
      <option>MC</option>
      <option>MP</option>
      <option>ED</option>
      <option>EI</option>
      <option>DC</option>
    </select>

    <button class="btn" style="width:100%;margin-top:16px"
      onclick="addPlayer()">
      Guardar jugador
    </button>

  `);
}

function addPlayer(){

  const name=document.getElementById("pName").value.trim();
  const num=Number(document.getElementById("pNum").value);
  const pos=document.getElementById("pPos").value;

  if(!name)return alert("Introduce el nombre.");

  data.players.push({
    id:Date.now(),
    name,
    num,
    pos,
    available:true,
    reason:""
  });

  save();
  closeModal();
  render();
}

function editPlayer(id){

  const p=data.players.find(x=>x.id===id);

  if(!p)return;

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>Editar jugador</h2>

    <label>Nombre</label>
    <input id="eName" value="${p.name}">

    <label>Dorsal</label>
    <input id="eNum" type="number" value="${p.num}">

    <label>Posición</label>
    <select id="ePos">

      ${["POR","DFC","LD","LI","MC","MP","ED","EI","DC"]
      .map(x=>`<option ${x===p.pos?"selected":""}>${x}</option>`)
      .join("")}

    </select>

    <label>Disponibilidad</label>

    <select id="eAvailable">
      <option value="true" ${p.available?"selected":""}>Disponible</option>
      <option value="false" ${!p.available?"selected":""}>No disponible</option>
    </select>

    <label>Motivo</label>
    <input id="eReason" value="${p.reason||""}"
      placeholder="Lesión, trabajo, etc.">

    <button class="btn" style="width:100%;margin-top:15px"
      onclick="savePlayer(${id})">
      Guardar cambios
    </button>

    <button class="btn-danger" style="width:100%;margin-top:8px"
      onclick="deletePlayer(${id})">
      Eliminar jugador
    </button>

  `);
}

function savePlayer(id){

  const p=data.players.find(x=>x.id===id);

  p.name=document.getElementById("eName").value.trim();
  p.num=Number(document.getElementById("eNum").value);
  p.pos=document.getElementById("ePos").value;
  p.available=document.getElementById("eAvailable").value==="true";
  p.reason=document.getElementById("eReason").value.trim();

  save();
  closeModal();
  render();
}

function deletePlayer(id){

  if(!confirm("¿Eliminar este jugador?"))return;

  data.players=data.players.filter(x=>x.id!==id);

  save();
  closeModal();
  render();
}

function entrenos(){

  return `

    <div class="row-between">

      <div>
        <h2 style="margin-bottom:3px">🏋️ Entrenamientos</h2>
        <div class="small">Control de asistencia</div>
      </div>

      ${
        data.role!=="jugador"
        ? `<button class="btn" onclick="newTraining()">＋</button>`
        : ""
      }

    </div>

    ${
      data.trainings.length
      ? data.trainings.map(t=>`

        <div class="card">

          <div class="row-between">

            <div>
              <strong>${t.date}</strong>
              <div class="small">
                ${t.time} · ${t.place}
              </div>
            </div>

            <button class="btn-light"
              onclick="attendance(${t.id},'training')">
              Asistencia
            </button>

          </div>

          <div class="small" style="margin-top:10px">
            ${t.attendance.length}/${data.players.length} registrados
          </div>

        </div>

      `).join("")
      : `<div class="card empty">No hay entrenamientos.</div>`
    }

  `;
}

function newTraining(){

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>Nuevo entrenamiento</h2>

    <label>Fecha</label>
    <input id="tDate" placeholder="Jueves 20 de agosto">

    <label>Hora</label>
    <input id="tTime" placeholder="21:15">

    <label>Lugar</label>
    <input id="tPlace" placeholder="Campo habitual">

    <button class="btn" style="width:100%;margin-top:15px"
      onclick="addTraining()">
      Crear entrenamiento
    </button>

  `);
}

function addTraining(){

  const date=document.getElementById("tDate").value.trim();
  const time=document.getElementById("tTime").value.trim();
  const place=document.getElementById("tPlace").value.trim();

  if(!date)return alert("Introduce la fecha.");

  data.trainings.push({
    id:Date.now(),
    date,
    time,
    place,
    attendance:[]
  });

  save();
  closeModal();
  render();
}

function attendance(id,type){

  const list=
    type==="training"
    ? data.trainings.find(x=>x.id===id)
    : data.matches.find(x=>x.id===id);

  if(!list)return;

  let records=type==="training"
    ? list.attendance
    : list.convocados;

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>${type==="training"?"🏋️ Asistencia":"⚽ Convocatoria"}</h2>

    <p class="small">
      Marca los jugadores que ${
        type==="training"?"han asistido":"están convocados"
      }.
    </p>

    ${
      data.players.map(p=>`

        <label style="display:flex;align-items:center;gap:10px">

          <input
            type="checkbox"
            style="width:auto"
            value="${p.id}"
            ${records.includes(p.id)?"checked":""}
          >

          ${p.name}

        </label>

      `).join("")
    }

    <button class="btn" style="width:100%;margin-top:16px"
      onclick="saveAttendance(${id},'${type}')">
      Guardar
    </button>

  `);
}

function saveAttendance(id,type){

  const ids=[...document.querySelectorAll(
    '.modal-box input[type="checkbox"]:checked'
  )].map(x=>Number(x.value));

  if(type==="training"){
    const t=data.trainings.find(x=>x.id===id);
    t.attendance=ids;
  }else{
    const m=data.matches.find(x=>x.id===id);
    m.convocados=ids;
  }

  save();
  closeModal();
  render();
}

function partidos(){

  return `

    <div class="row-between">

      <div>
        <h2 style="margin-bottom:3px">⚽ Partidos</h2>
        <div class="small">Calendario y convocatorias</div>
      </div>

      ${
        data.role!=="jugador"
        ? `<button class="btn" onclick="newMatch()">＋</button>`
        : ""
      }

    </div>

    ${
      data.matches.length
      ? data.matches.map(m=>`

        <div class="card">

          <h3>${m.opponent}</h3>

          <div class="small">
            📅 ${m.date}
          </div>

          <div class="small">
            🕐 ${m.time}
          </div>

          <div class="small">
            📍 ${m.location}
          </div>

          <div class="row" style="margin-top:14px">

            <button class="btn-light"
              onclick="attendance(${m.id},'match')">
              Convocatoria
            </button>

          </div>

          <div class="small" style="margin-top:10px">
            ${m.convocados.length} convocados
          </div>

        </div>

      `).join("")
      : `<div class="card empty">No hay partidos.</div>`
    }

  `;
}

function newMatch(){

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>Nuevo partido</h2>

    <label>Rival</label>
    <input id="mOpponent" placeholder="Nombre del rival">

    <label>Fecha</label>
    <input id="mDate" placeholder="Domingo 23 de agosto">

    <label>Hora</label>
    <input id="mTime" placeholder="12:00">

    <label>Lugar</label>
    <input id="mLocation" placeholder="Campo">

    <button class="btn" style="width:100%;margin-top:15px"
      onclick="addMatch()">
      Crear partido
    </button>

  `);
}

function addMatch(){

  const opponent=document.getElementById("mOpponent").value.trim();

  if(!opponent)return alert("Introduce el rival.");

  data.matches.push({
    id:Date.now(),
    opponent,
    date:document.getElementById("mDate").value.trim(),
    time:document.getElementById("mTime").value.trim(),
    location:document.getElementById("mLocation").value.trim(),
    convocados:[]
  });

  save();
  closeModal();
  render();
}

function mas(){

  return `

    <div class="card">

      <h2>⚙️ Más</h2>

      <div class="item">
        <div class="avatar">👤</div>
        <div style="flex:1">
          <strong>Rol actual</strong>
          <div class="small">${data.role}</div>
        </div>

        <button class="btn-light" onclick="changeRole()">
          Cambiar
        </button>
      </div>

    </div>

    <div class="card">

      <h2>📊 Estadísticas</h2>

      <button class="btn-light"
        style="width:100%"
        onclick="statistics()">
        Ver estadísticas
      </button>

    </div>

    <div class="card">

      <h2>ℹ️ KNATT</h2>

      <p class="small">
        Aplicación de gestión de equipos de fútbol.
      </p>

      <p class="small">
        Datos guardados localmente en este dispositivo.
      </p>

    </div>

  `;
}

function changeRole(){

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>👤 Cambiar rol</h2>

    <button class="btn-light" style="width:100%;margin-top:8px"
      onclick="setRole('administrador')">
      ⚙️ Administrador
    </button>

    <button class="btn-light" style="width:100%;margin-top:8px"
      onclick="setRole('entrenador')">
      🧑‍🏫 Entrenador
    </button>

    <button class="btn-light" style="width:100%;margin-top:8px"
      onclick="setRole('jugador')">
      👤 Jugador
    </button>

  `);
}

function setRole(role){

  data.role=role;

  save();
  closeModal();
  render();
}

function statistics(){

  const total=data.players.length;

  const totalGoals=Object.values(data.stats)
    .reduce((a,b)=>a+(b.goals||0),0);

  const totalAssists=Object.values(data.stats)
    .reduce((a,b)=>a+(b.assists||0),0);

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>📊 Estadísticas</h2>

    <div class="grid3">

      <div class="stat">
        <strong>${total}</strong>
        <span class="small">Jugadores</span>
      </div>

      <div class="stat">
        <strong>${totalGoals}</strong>
        <span class="small">Goles</span>
      </div>

      <div class="stat">
        <strong>${totalAssists}</strong>
        <span class="small">Asistencias</span>
      </div>

    </div>

    <h3 style="margin-top:20px">Jugadores</h3>

    ${
      data.players.map(p=>{

        const s=data.stats[p.id]||{
          goals:0,
          assists:0,
          yellow:0,
          red:0
        };

        return `

          <div class="item">

            <div style="flex:1">
              <strong>${p.name}</strong>
              <div class="small">
                ⚽ ${s.goals}
                · 🅰️ ${s.assists}
                · 🟨 ${s.yellow}
                · 🟥 ${s.red}
              </div>
            </div>

            ${
              data.role!=="jugador"
              ? `<button class="btn-light"
                   onclick="editStats(${p.id})">
                   Editar
                 </button>`
              : ""
            }

          </div>

        `;

      }).join("")
    }

  `);
}

function editStats(id){

  const p=data.players.find(x=>x.id===id);

  if(!data.stats[id]){
    data.stats[id]={
      goals:0,
      assists:0,
      yellow:0,
      red:0,
      games:0
    };
  }

  const s=data.stats[id];

  openModal(`

    <button class="close" onclick="closeModal()">✕</button>

    <h2>📊 ${p.name}</h2>

    <label>Partidos</label>
    <input id="stGames" type="number" value="${s.games}">

    <label>Goles</label>
    <input id="stGoals" type="number" value="${s.goals}">

    <label>Asistencias</label>
    <input id="stAssists" type="number" value="${s.assists}">

    <label>Amarillas</label>
    <input id="stYellow" type="number" value="${s.yellow}">

    <label>Rojas</label>
    <input id="stRed" type="number" value="${s.red}">

    <button class="btn" style="width:100%;margin-top:15px"
      onclick="saveStats(${id})">
      Guardar estadísticas
    </button>

  `);
}

function saveStats(id){

  data.stats[id]={
    games:Number(document.getElementById("stGames").value)||0,
    goals:Number(document.getElementById("stGoals").value)||0,
    assists:Number(document.getElementById("stAssists").value)||0,
    yellow:Number(document.getElementById("stYellow").value)||0,
    red:Number(document.getElementById("stRed").value)||0
  };

  save();
  closeModal();
  statistics();
}

function openModal(html){

  document.getElementById("modalBox").innerHTML=html;
  document.getElementById("modal").classList.remove("hidden");

}

function closeModal(){

  document.getElementById("modal").classList.add("hidden");

}

document.getElementById("modal").addEventListener("click",e=>{

  if(e.target.id==="modal")closeModal();

});

go("inicio");

</script>

</body>
</html>
