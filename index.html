<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent
}

:root{
  --green:#123c2d;
  --green-2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
  --danger:#d95c5c;
  --warning:#e4a936;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font-family:inherit;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:96px;
}

/* HEADER */

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--green),#0d2d22);
  color:white;
  padding:26px 20px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #0c2d2225;
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  right:-75px;
  top:-90px;
  background:#b9e86c12;
}

.brand{
  position:relative;
  z-index:2;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand span{
  color:var(--lime);
}

.role{
  position:relative;
  z-index:2;
  opacity:.78;
  font-size:13px;
  margin-top:5px;
  font-weight:600;
}

/* MAIN */

main{
  padding:20px 16px 30px;
}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin:2px 0 16px;
}

/* ROLE SELECTOR */

.rolebar{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  background:#e6ece8;
  padding:5px;
  border-radius:15px;
}

.rolebar button{
  flex:1;
}

/* CARDS */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 7px 25px #10221b0b;
}

.hero{
  background:linear-gradient(145deg,var(--green),var(--green-2));
  color:white;
  border:0;
  padding:20px;
  box-shadow:0 12px 30px #123c2d22;
}

.hero .muted{
  color:#c8d8d1;
}

.hero .big{
  color:white;
}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 0;
}

.team-ball{
  width:50px;
  height:50px;
  border-radius:16px;
  background:#ffffff18;
  display:grid;
  place-items:center;
  font-size:25px;
}

.match-info{
  flex:1;
}

.match-date{
  font-weight:800;
  font-size:14px;
}

.match-place{
  color:#c8d8d1;
  font-size:13px;
  margin-top:3px;
}

/* STATS */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  box-shadow:0 6px 20px #10221b08;
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.stat.accent b{
  color:#315d18;
}

/* ROWS */

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px;
}

.grow{
  flex:1;
  min-width:0;
}

/* PILLS */

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20;
}

.pill.danger{
  background:#fae9e9;
  color:#b44343;
}

.pill.warning{
  background:#fff2d7;
  color:#986d18;
}

/* BUTTONS */

.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  background:var(--green);
  color:white;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 12px #123c2d20;
}

.btn.light{
  background:#e9efec;
  color:var(--green);
  box-shadow:none;
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.full{
  width:100%;
}

.choice{
  display:flex;
  gap:8px;
}

.choice button{
  flex:1;
}

/* ADD PLAYER */

.add-player{
  margin-bottom:14px;
}

.add-player .btn{
  width:100%;
}

.delete-btn{
  border:0;
  background:#fae9e9;
  color:#b44343;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  flex:0 0 38px;
}

/* TABS */

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:white;
}

/* NOTICE */

.notice{
  background:#edf6df;
  color:#36561f;
  border-radius:17px;
  padding:14px;
  font-size:13px;
  font-weight:700;
}

/* FORM */

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.form-input{
  width:100%;
  border:1px solid var(--line);
  background:#f8faf9;
  color:var(--text);
  border-radius:14px;
  padding:13px;
  font-size:15px;
  outline:none;
}

.form-input:focus{
  border-color:#a9c99a;
}

/* ATTENDANCE */

.attendance-buttons{
  display:flex;
  gap:6px;
  flex:0 0 auto;
}

.attendance-btn{
  border:0;
  width:39px;
  height:39px;
  border-radius:12px;
  font-size:17px;
  cursor:pointer;
  font-weight:900;
}

.attendance-btn.present{
  background:#e9f7d8;
}

.attendance-btn.absent{
  background:#fae9e9;
}

.attendance-btn.late{
  background:#fff2d7;
}

.attendance-btn.active{
  box-shadow:0 0 0 2px var(--green);
}

.training-card{
  cursor:pointer;
}

.training-card:active{
  transform:scale(.99);
}

.training-status{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-top:12px;
}

/* NAVIGATION */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffee;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -8px 30px #10221b0c;
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 8px;
  min-width:58px;
  border-radius:13px;
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef;
}

nav button:first-line{
  font-size:18px;
}

/* MOBILE */

@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .big{
    font-size:20px;
  }

  .brand{
    font-size:27px;
  }

  .attendance-btn{
    width:34px;
    height:34px;
    font-size:15px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ <span>KNATT</span></div>
  <div class="role" id="roleText"></div>
</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>

<script>

const KEY='teamhub-v2';

let data;

/* =========================================================
   CARGAR DATOS
========================================================= */

try{

  const saved=localStorage.getItem(KEY);

  if(saved){

    data=JSON.parse(saved);

  }else{

    data={
      players:[
        {
          id:1,
          name:'Montiimontys',
          num:9,
          pos:'DC',
          available:true,
          reason:'',
          min:1126,
          g:12,
          a:6,
          train:18,
          total:20
        },
        {
          id:2,
          name:'Marc',
          num:7,
          pos:'MC',
          available:true,
          reason:'',
          min:1030,
          g:5,
          a:8,
          train:18,
          total:20
        },
        {
          id:3,
          name:'Juan',
          num:4,
          pos:'DFC',
          available:false,
          reason:'Trabajo',
          min:980,
          g:4,
          a:3,
          train:17,
          total:20
        },
        {
          id:4,
          name:'Alex',
          num:1,
          pos:'POR',
          available:true,
          reason:'',
          min:1260,
          g:0,
          a:1,
          train:19,
          total:20
        },
        {
          id:5,
          name:'Pedro',
          num:3,
          pos:'LI',
          available:false,
          reason:'Lesión',
          min:640,
          g:1,
          a:2,
          train:14,
          total:20
        }
      ],

      next:{
        opponent:'CD Rival',
        date:'Domingo 23 de agosto',
        time:'12:00',
        place:'Campo Municipal'
      },

      trainings:[
        {
          id:1,
          date:'Jueves 20 de agosto',
          time:'21:15',
          place:'Campo Municipal',
          attendance:{}
        }
      ]
    };

  }

}catch(error){

  console.error('Error cargando datos:',error);

  data={
    players:[],
    next:{
      opponent:'CD Rival',
      date:'Próximo partido',
      time:'12:00',
      place:'Campo Municipal'
    },
    trainings:[
      {
        id:1,
        date:'Próximo entrenamiento',
        time:'21:15',
        place:'Campo Municipal',
        attendance:{}
      }
    ]
  };

}


/* =========================================================
   REPARAR DATOS
========================================================= */

if(!data || typeof data!=='object'){
  data={};
}

if(!Array.isArray(data.players)){
  data.players=[];
}

data.players=data.players.map((p,index)=>{

  if(!p || typeof p!=='object'){
    p={};
  }

  return {

    id:p.id ?? Date.now()+index,

    name:
      typeof p.name==='string' && p.name.trim()
      ?p.name
      :'Jugador',

    num:
      p.num!==undefined &&
      p.num!==null &&
      String(p.num).trim()!==''
      ?p.num
      :'-',

    pos:
      typeof p.pos==='string' && p.pos.trim()
      ?p.pos
      :'Jugador',

    available:
      typeof p.available==='boolean'
      ?p.available
      :true,

    reason:
      typeof p.reason==='string'
      ?p.reason
      :'',

    min:
      Number.isFinite(Number(p.min))
      ?Math.max(0,Number(p.min))
      :0,

    g:
      Number.isFinite(Number(p.g))
      ?Math.max(0,Number(p.g))
      :0,

    a:
      Number.isFinite(Number(p.a))
      ?Math.max(0,Number(p.a))
      :0,

    train:
      Number.isFinite(Number(p.train))
      ?Math.max(0,Number(p.train))
      :0,

    total:
      Number.isFinite(Number(p.total))
      ?Math.max(0,Number(p.total))
      :0

  };

});


/* =========================================================
   PARTIDO
========================================================= */

if(!data.next || typeof data.next!=='object'){

  data.next={
    opponent:'CD Rival',
    date:'Próximo partido',
    time:'12:00',
    place:'Campo Municipal'
  };

}

if(!data.next.opponent){
  data.next.opponent='CD Rival';
}

if(!data.next.date){
  data.next.date='Próximo partido';
}

if(!data.next.time){
  data.next.time='12:00';
}

if(!data.next.place){
  data.next.place='Campo Municipal';
}


/* =========================================================
   ENTRENAMIENTOS
========================================================= */

if(!Array.isArray(data.trainings)){
  data.trainings=[];
}

if(!data.trainings.length){

  data.trainings.push({
    id:Date.now(),
    date:'Próximo entrenamiento',
    time:'21:15',
    place:'Campo Municipal',
    attendance:{}
  });

}

data.trainings=data.trainings.map((t,index)=>{

  if(!t || typeof t!=='object'){
    t={};
  }

  if(!t.id){
    t.id=Date.now()+index;
  }

  if(!t.date){
    t.date='Próximo entrenamiento';
  }

  if(!t.time){
    t.time='21:15';
  }

  if(!t.place){
    t.place='Campo Municipal';
  }

  if(!t.attendance || typeof t.attendance!=='object'){
    t.attendance={};
  }

  return t;

});


/* =========================================================
   GUARDAR REPARACIÓN
========================================================= */

localStorage.setItem(
  KEY,
  JSON.stringify(data)
);


/* =========================================================
   ESTADO
========================================================= */

let role=
  localStorage.getItem('teamhub-role')||
  'trainer';

let section='home';

let filter='all';

let selectedPlayerId=null;

let selectedTrainingId=null;


/* =========================================================
   GUARDAR
========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   ROL
========================================================= */

function setRole(r){

  role=r;

  localStorage.setItem(
    'teamhub-role',
    r
  );

  section='home';

  selectedPlayerId=null;

  selectedTrainingId=null;

  render();

}


function roleName(){

  return role==='trainer'
    ?'Entrenador'
    :'Jugador';

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function navItems(){

  return role==='trainer'

  ?

  [
    ['home','🏠','Inicio'],
    ['team','👥','Plantilla'],
    ['training','🏋️','Entrenos'],
    ['matches','🏆','Partidos'],
    ['stats','📊','Stats']
  ]

  :

  [
    ['home','🏠','Inicio'],
    ['profile','⚽','Mi perfil'],
    ['training','🏋️','Entrenos'],
    ['matches','🏆','Partidos'],
    ['stats','📊','Mi temporada']
  ];

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  document.getElementById('roleText').textContent=
    roleName()+' · Primer Equipo';


  document.getElementById('nav').innerHTML=

    navItems()
    .map(x=>`

      <button
        class="${section===x[0]?'active':''}"
        onclick="go('${x[0]}')">

        ${x[1]}<br>${x[2]}

      </button>

    `)
    .join('');


  let c=document.getElementById('content');


  c.innerHTML=`

    <div class="rolebar">

      <button
        class="btn ${role==='trainer'?'':'light'}"
        onclick="setRole('trainer')">

        🧑‍🏫 Entrenador

      </button>


      <button
        class="btn ${role==='player'?'':'light'}"
        onclick="setRole('player')">

        ⚽ Jugador

      </button>

    </div>

  `;


  if(section==='home'){
    c.innerHTML+=home();
  }

  if(section==='team'){
    c.innerHTML+=team();
  }

  if(section==='training'){
    c.innerHTML+=training();
  }

  if(section==='training-detail'){
    c.innerHTML+=trainingDetail();
  }

  if(section==='matches'){
    c.innerHTML+=matches();
  }

  if(section==='stats'){
    c.innerHTML+=stats();
  }

  if(section==='profile'){
    c.innerHTML+=profile();
  }

  if(section==='player'){
    c.innerHTML+=playerProfile();
  }

}


/* =========================================================
   GO
========================================================= */

function go(s){

  section=s;

  selectedPlayerId=null;

  selectedTrainingId=null;

  render();

}


/* =========================================================
   FICHA JUGADOR
========================================================= */

function openPlayer(id){

  selectedPlayerId=id;

  section='player';

  render();

}


function getSelectedPlayer(){

  return data.players.find(
    p=>String(p.id)===String(selectedPlayerId)
  );

}


/* =========================================================
   EDITAR JUGADOR
========================================================= */

function editPlayer(){

  if(role!=='trainer'){
    return;
  }

  const p=getSelectedPlayer();

  if(!p){
    return;
  }

  const name=prompt(
    'Nombre del jugador:',
    p.name
  );

  if(name===null)return;


  const num=prompt(
    'Número de camiseta:',
    p.num
  );

  if(num===null)return;


  const pos=prompt(
    'Posición:',
    p.pos
  );

  if(pos===null)return;


  const available=confirm(
    '¿Está disponible para jugar?\n\nAceptar = Sí\nCancelar = No'
  );


  let reason='';


  if(!available){

    const r=prompt(
      'Motivo de la ausencia:',
      p.reason||''
    );

    if(r!==null){
      reason=r.trim();
    }

  }


  const min=prompt(
    'Minutos jugados:',
    p.min
  );

  if(min===null)return;


  const goals=prompt(
    'Goles:',
    p.g
  );

  if(goals===null)return;


  const assists=prompt(
    'Asistencias:',
    p.a
  );

  if(assists===null)return;


  const train=prompt(
    'Entrenamientos realizados:',
    p.train
  );

  if(train===null)return;


  const total=prompt(
    'Entrenamientos totales:',
    p.total
  );

  if(total===null)return;


  p.name=name.trim()||p.name;
  p.num=num.trim()||p.num;
  p.pos=pos.trim()||p.pos;

  p.available=available;
  p.reason=reason;

  p.min=Math.max(0,Number(min)||0);
  p.g=Math.max(0,Number(goals)||0);
  p.a=Math.max(0,Number(assists)||0);
  p.train=Math.max(0,Number(train)||0);
  p.total=Math.max(0,Number(total)||0);

  save();

  render();

}


/* =========================================================
   AÑADIR JUGADOR
========================================================= */

function addPlayer(){

  if(role!=='trainer'){
    return;
  }

  const name=prompt(
    'Nombre del jugador:'
  );

  if(!name || !name.trim()){
    return;
  }

  const num=prompt(
    'Número de camiseta:',
    ''
  );

  if(num===null)return;


  const pos=prompt(
    'Posición:',
    ''
  );

  if(pos===null)return;


  data.players.push({

    id:Date.now(),

    name:name.trim(),

    num:num.trim()||'-',

    pos:pos.trim()||'Jugador',

    available:true,

    reason:'',

    min:0,

    g:0,

    a:0,

    train:0,

    total:0

  });


  save();

  section='team';

  render();

}


/* =========================================================
   ELIMINAR JUGADOR
========================================================= */

function deletePlayer(id){

  if(role!=='trainer'){
    return;
  }

  const player=data.players.find(
    p=>String(p.id)===String(id)
  );

  if(!player){
    return;
  }


  const confirmDelete=confirm(
    '¿Seguro que quieres eliminar a '+player.name+' de la plantilla?'
  );


  if(!confirmDelete){
    return;
  }


  data.players=data.players.filter(
    p=>String(p.id)!==String(id)
  );


  selectedPlayerId=null;

  save();

  section='team';

  render();

}


/* =========================================================
   INICIO
========================================================= */

function home(){

  if(role==='trainer'){

    const available=
      data.players.filter(
        p=>p.available
      ).length;


    const absent=
      data.players.filter(
        p=>!p.available
      ).length;


    const goals=
      data.players.reduce(
        (s,p)=>s+(Number(p.g)||0),
        0
      );


    const firstTraining=data.trainings[0];


    return `

      <div class="title">
        Panel del equipo
      </div>


      <div class="card hero">

        <div
          class="section-label"
          style="color:#b9e86c">

/* =========================================================

========================================================= */

function addTraining(){

  if(role!=='trainer'){
    return;
  }


  const date=prompt(
    'Fecha del entrenamiento:',
    ''
  );

  if(!date || !date.trim()){
    return;
  }


  const time=prompt(
    'Hora del entrenamiento:',
    '21:15'
  );

  if(time===null){
    return;
  }


  const place=prompt(
    'Lugar:',
    'Campo Municipal'
  );

  if(place===null){
    return;
  }


  const training={

    id:Date.now(),

    date:date.trim(),

    time:time.trim()||'21:15',

    place:place.trim()||'Campo Municipal',

    attendance:{}

  };


  data.trainings.unshift(training);

  save();

  selectedTrainingId=training.id;

  section='training-detail';

  render();

}

   ABRIR ENTRENAMIENTO
========================================================= */

function openTraining(id){

  selectedTrainingId=id;

  section='training-detail';

  render();

}


function getSelectedTraining(){

  return data.trainings.find(
    t=>String(t.id)===String(selectedTrainingId)
  );

}


/* =========================================================
   ASISTENCIA
========================================================= */

function setAttendance(trainingId,playerId,status){

  if(role!=='trainer'){
    return;
  }


  const training=data.trainings.find(
    t=>String(t.id)===String(trainingId)
  );


  if(!training){
    return;
  }


  if(!training.attendance){
    training.attendance={};
  }


  training.attendance[String(playerId)]=status;


  save();

  render();

}


/* =========================================================
   CALCULAR ASISTENCIA
========================================================= */

function attendanceStats(playerId){

  let present=0;

  let late=0;

  let absent=0;

  let total=0;


  data.trainings.forEach(t=>{

    if(!t.attendance){
      return;
    }


    const status=
      t.attendance[String(playerId)];


    if(!status){
      return;
    }


    total++;


    if(status==='present'){
      present++;
    }


    if(status==='late'){
      late++;
    }


    if(status==='absent'){
      absent++;
    }

  });


  const percentage=
    total>0
    ?
    Math.round(
      (present+late)/total*100
    )
    :
    0;


  return {
    present,
    late,
    absent,
    total,
    percentage
  };

}

        <div class="title">
          Mi perfil
        </div>


        <div class="muted">

          No hay ningún jugador registrado.

        </div>

      </div>

    `;

  }


  const percentage=
    Number(p.total)>0
    ?
    Math.round(
      Number(p.train)/
      Number(p.total)*
      100
    )
    :
    0;


  return `

    <div class="title">
      Mi perfil
    </div>


    <div class="card hero">

      <div class="row">

        <div>

          <div
            class="section-label"
            style="color:#b9e86c">

            JUGADOR

          </div>


          <div class="big">

            ${p.num} ·
            ${p.name}

          </div>


          <div class="muted">

            ${p.pos}

          </div>

        </div>


        <div class="avatar">
          ⚽
        </div>

      </div>

    </div>


    <div class="grid">

      <div class="stat">

        <b>
          ${Number(p.min)||0}
        </b>

        <span>
          Minutos jugados
        </span>

      </div>


      <div class="stat accent">

        <b>
          ${Number(p.g)||0}
        </b>

        <span>
          Goles
        </span>

      </div>


      <div class="stat">

        <b>
          ${Number(p.a)||0}
        </b>

        <span>
          Asistencias
        </span>

      </div>


      <div class="stat">

        <b>
          ${percentage}%
        </b>

        <span>
          Entrenamientos
        </span>

      </div>

    </div>

  `;

}


/* =========================================================
   INICIAR
========================================================= */

render();

</script>

</body>
</html>
