<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>KNATT</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --red:#e21d2f;
  --red2:#b90f20;
  --dark:#0b0b0d;
  --dark2:#17171a;
  --bg:#f5f5f6;
  --card:#fff;
  --text:#17171a;
  --muted:#77777e;
  --line:#e6e6e9;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  color:var(--text);
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:82px;
}


/* =====================================================
   CABECERA
===================================================== */

header{
  background:var(--dark);
  color:#fff;
  padding:
    calc(12px + env(safe-area-inset-top))
    18px
    14px;
}

.header-row,
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1px;
}

.brand span{
  color:#ff3b4d;
}

.role{
  font-size:11px;
  color:#aaa;
  margin-top:2px;
  font-weight:700;
}

.header-bell{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#ffffff10;
  border:1px solid #ffffff12;
  color:#fff;
}

main{
  padding:14px 14px 24px;
}


/* =====================================================
   GENERAL
===================================================== */

.title{
  font-size:25px;
  font-weight:950;
  letter-spacing:-.7px;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:3px 2px 13px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 7px 24px #14141914;
}

.card-dark{
  background:var(--dark2);
  color:#fff;
  border-color:#2b2b30;
}

.section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:21px;
  font-weight:950;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:13px;
}

.btn.light{
  background:#f0f0f2;
  color:#222;
  box-shadow:none;
}

.btn.red-soft{
  background:#fff0f2;
  color:var(--red);
  box-shadow:none;
}

.btn.full{
  width:100%;
}

.btn:disabled{
  opacity:.5;
  cursor:not-allowed;
}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:13px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 8px;
  text-align:center;
}

.card-dark .stat{
  background:#202024;
  border-color:#303036;
}

.stat b{
  display:block;
  font-size:21px;
  font-weight:950;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-top:2px;
}

.stat.red{
  background:#fff0f2;
  border-color:#ffd7dc;
}

.stat.red b{
  color:var(--red);
}


/* =====================================================
   INICIO
===================================================== */

.home-title-row{
  margin-top:0;
  margin-bottom:12px;
}

.home-title-row .title{
  font-size:26px;
}

.home-title-row .subtitle{
  font-size:13px;
  margin-top:3px;
}

.home-match-card{
  padding:17px;
  border-radius:20px;
}

.home-match-card .section-label{
  margin-bottom:8px;
}

.home-match-card .big{
  font-size:22px;
  line-height:1.15;
}

.home-match-card .versus{
  margin:15px 0 16px;
}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

.match-countdown{
  text-align:center;
  margin-top:-6px;
  margin-bottom:14px;
  font-size:11px;
  font-weight:850;
  color:var(--muted);
}

.match-countdown strong{
  color:var(--red);
  font-weight:950;
}


/* =====================================================
   ACCESO RÁPIDO PLANTILLA
===================================================== */

.home-quick-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 15px;
  cursor:pointer;
}

.home-quick-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#fff0f2;
  color:var(--red);
  display:grid;
  place-items:center;
  font-size:21px;
}

.home-quick-content{
  flex:1;
  min-width:0;
}

.home-quick-title{
  font-size:13px;
  font-weight:950;
}

.home-quick-subtitle{
  font-size:10px;
  color:var(--muted);
  font-weight:750;
  margin-top:2px;
}

.home-quick-arrow{
  font-size:22px;
  color:#99999f;
}


/* =====================================================
   ÚLTIMA ACTIVIDAD
===================================================== */

.home-activity-card{
  padding:16px;
}

.activity-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #ededf0;
}

.activity-item:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.activity-item:first-child{
  padding-top:2px;
}

.activity-icon{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:10px;
  background:#f0f0f2;
  display:grid;
  place-items:center;
  font-size:16px;
}

.activity-content{
  flex:1;
  min-width:0;
}

.activity-title{
  font-size:11px;
  font-weight:900;
}

.activity-time{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}

.activity-empty{
  padding:7px 0 2px;
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}


/* =====================================================
   PLANTILLA
===================================================== */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:12px;
}

.tab{
  border:0;
  border-radius:999px;
  padding:9px 13px;
  background:#e9e9ec;
  color:#5e5e64;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}

.tab.active{
  background:var(--red);
  color:#fff;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ededf0;
}

.item:last-child{
  border:0;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#ececef;
  display:grid;
  place-items:center;
  font-size:20px;
}

.grow{
  flex:1;
  min-width:0;
}

.item b{
  font-size:13px;
}

.item .muted{
  font-size:10px;
  margin-top:2px;
}


/* =====================================================
   FORMULARIOS
===================================================== */

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

.form-input,
.select,
.form-textarea{
  width:100%;
  border:1px solid var(--line);
  background:#fafafa;
  border-radius:11px;
  padding:11px;
  font-size:14px;
  outline:none;
}

.form-textarea{
  min-height:130px;
  resize:vertical;
  line-height:1.4;
}

.form-input:focus,
.select:focus,
.form-textarea:focus{
  border-color:#ffb5bd;
  box-shadow:0 0 0 3px #fff0f2;
}


/* =====================================================
   MODAL
===================================================== */

.edit-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(18px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.edit-modal-card{
  width:min(500px,100%);
  max-height:calc(100vh - 36px);
  overflow-y:auto;
  background:#fff;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  padding:20px;
  -webkit-overflow-scrolling:touch;
}

.edit-modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.edit-modal-title{
  font-size:22px;
  font-weight:950;
  letter-spacing:-.5px;
}

.edit-modal-subtitle{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  margin-top:3px;
}

.edit-modal-close{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border:0;
  border-radius:10px;
  background:#f0f0f2;
  color:#555;
  font-size:20px;
  line-height:34px;
}

.edit-status-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.edit-status-option{
  position:relative;
}

.edit-status-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.edit-status-option label{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:45px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fafafa;
  color:#666;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.edit-status-option input:checked + label{
  background:#fff0f2;
  border-color:#ffb5bd;
  color:var(--red);
}

.edit-stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.edit-stats-grid .form-group{
  margin-bottom:12px;
}

.edit-modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:5px;
}

.edit-disabled{
  opacity:.48;
}

.edit-disabled input{
  background:#f0f0f2;
}


/* =====================================================
   PARTIDOS
===================================================== */

.match-card{
  position:relative;
}

.versus{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:13px 0;
}

.club{
  width:90px;
  text-align:center;
  font-weight:900;
  font-size:11px;
}

.club-logo{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#f0f0f2;
  margin:0 auto 5px;
  display:grid;
  place-items:center;
  font-size:21px;
}

.vs{
  font-weight:950;
  color:#888;
}


/* =====================================================
   NUEVO SISTEMA DE CALENDARIO
===================================================== */

.matches-header-actions{
  display:flex;
  gap:7px;
  flex-wrap:wrap;
}

.calendar-import-card{
  background:#fff;
  border:1px solid #ffd8dd;
  border-radius:18px;
  padding:14px;
  margin-bottom:12px;
}

.calendar-import-row{
  display:flex;
  align-items:center;
  gap:11px;
}

.calendar-import-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#fff0f2;
  display:grid;
  place-items:center;
  font-size:21px;
}

.calendar-import-content{
  flex:1;
  min-width:0;
}

.calendar-import-title{
  font-size:12px;
  font-weight:950;
}

.calendar-import-subtitle{
  margin-top:3px;
  font-size:10px;
  color:var(--muted);
  line-height:1.35;
}

.calendar-import-button{
  margin-top:11px;
}

.season-summary{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:7px;
  margin-bottom:12px;
}

.season-summary-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:14px;
  padding:10px 7px;
  text-align:center;
}

.season-summary-card b{
  display:block;
  font-size:18px;
  font-weight:950;
}

.season-summary-card span{
  display:block;
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  margin-top:2px;
}

.match-round{
  font-size:9px;
  color:var(--muted);
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:950;
  margin-bottom:4px;
}

.match-date{
  font-size:12px;
  color:#77777e;
  font-weight:750;
}

.match-teams{
  display:grid;
  grid-template-columns:1fr auto 1fr;
  align-items:center;
  gap:8px;
  margin-top:12px;
}

.match-team{
  font-size:12px;
  font-weight:950;
  line-height:1.2;
}

.match-team.home{
  text-align:right;
}

.match-team.away{
  text-align:left;
}

.match-score{
  min-width:58px;
  text-align:center;
  font-size:17px;
  font-weight:950;
  color:#8a8a90;
}

.match-score.played{
  color:#17171a;
}

.match-status{
  margin-top:9px;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.match-location{
  font-size:9px;
  color:var(--muted);
  font-weight:750;
}

.match-result-button{
  border:0;
  border-radius:9px;
  padding:7px 9px;
  background:#f0f0f2;
  color:#444;
  font-size:9px;
  font-weight:900;
}

.match-result-button:hover{
  background:#fff0f2;
  color:var(--red);
}

.match-upcoming{
  border:2px solid #ffe0e4;
}

.match-upcoming .match-round{
  color:var(--red);
}

.match-past{
  opacity:.94;
}

.matches-empty{
  text-align:center;
  padding:24px 10px;
  color:var(--muted);
  font-size:12px;
  font-weight:750;
}

.calendar-preview-list{
  margin-top:12px;
  display:grid;
  gap:8px;
}

.calendar-preview-row{
  border:1px solid var(--line);
  background:#fafafa;
  border-radius:12px;
  padding:10px;
}

.calendar-preview-grid{
  display:grid;
  grid-template-columns:72px 1fr 1fr;
  gap:7px;
}

.calendar-preview-row input{
  width:100%;
  min-width:0;
  border:1px solid #dedee2;
  background:#fff;
  border-radius:8px;
  padding:8px;
  font-size:11px;
  outline:none;
}

.calendar-preview-label{
  font-size:8px;
  color:var(--muted);
  text-transform:uppercase;
  font-weight:900;
  margin-bottom:3px;
}

.calendar-preview-actions{
  margin-top:9px;
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
}

.ocr-progress{
  margin-top:12px;
  background:#f0f0f2;
  border-radius:999px;
  height:8px;
  overflow:hidden;
}

.ocr-progress-bar{
  width:0%;
  height:100%;
  background:var(--red);
  transition:width .2s ease;
}

.ocr-status{
  margin-top:7px;
  font-size:10px;
  color:var(--muted);
  font-weight:800;
}

.calendar-image-preview{
  width:100%;
  max-height:260px;
  object-fit:contain;
  background:#f0f0f2;
  border-radius:13px;
  display:none;
  margin-top:10px;
}

.import-help{
  background:#f7f7f8;
  border-radius:12px;
  padding:10px;
  font-size:10px;
  color:#666;
  line-height:1.45;
  margin-bottom:12px;
}

.import-help strong{
  color:#222;
}

.import-file{
  display:none;
}


/* =====================================================
   MÁS
===================================================== */

.more-screen{
  background:var(--dark);
  min-height:calc(100vh - 80px);
  margin:-16px -14px -28px;
  padding:16px 14px 30px;
  color:#fff;
}

.more-screen .title{
  color:#fff;
}

.more-menu{
  display:grid;
  gap:8px;
}

.more-row{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  border:1px solid #2b2b30;
  background:#17171a;
  color:#fff;
  border-radius:13px;
  padding:13px;
  text-align:left;
}

.more-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#242428;
  display:grid;
  place-items:center;
  flex:0 0 30px;
}

.more-text{
  flex:1;
  font-size:12px;
  font-weight:850;
}

.more-arrow{
  color:#8c8c92;
}


/* =====================================================
   TÁCTICA
===================================================== */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.tactic-view-btn{
  border:0;
  border-radius:12px;
  min-height:44px;
  background:#e9e9ec;
  color:#666;
  font-size:12px;
  font-weight:900;
}

.tactic-view-btn.active{
  background:var(--red);
  color:#fff;
}


/* =====================================================
   PIZARRA
===================================================== */

.pitch-wrap{
  position:relative;
  z-index:5;
  background:#e8e8ea;
  border-radius:19px;
  padding:8px;
  margin-bottom:12px;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:14px;
  overflow:hidden;
  background:
    repeating-linear-gradient(
      0deg,
      #278247 0 9%,
      #2d8b4f 9% 18%
    );
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #fff9;
  border-radius:8px;
  pointer-events:none;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #fff9;
  pointer-events:none;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #fff9;
  border-radius:50%;
  left:36.5%;
  top:36.5%;
  pointer-events:none;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
  pointer-events:none;
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #fff9;
  pointer-events:none;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18;
  pointer-events:none;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}


/* =====================================================
   MEDIO CAMPO
===================================================== */

.pitch.half-mode{
  aspect-ratio:68/70;
}

.pitch.half-mode .pitch-line{
  display:none;
}

.pitch.half-mode .pitch-circle{
  top:58%;
}

.pitch.half-mode .box.bottom,
.pitch.half-mode .goal.bottom{
  display:none;
}

.pitch.half-mode .box.top{
  top:2.5%;
}

.pitch.half-mode .goal.top{
  top:0;
}


/* =====================================================
   JUGADORES PIZARRA
===================================================== */

.board-player{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:30;
  width:78px;
  min-height:66px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:grab;
  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}

.board-player.dragging{
  z-index:1000;
  cursor:grabbing;
  transform:
    translate(-50%,-50%)
    scale(1.08);
}

.board-player-card{
  position:relative;
  width:100%;
  min-height:66px;
  padding:0;
  border:0;
  background:transparent;

/* =====================================================

/*
  KNATT utiliza Tesseract.js para leer el texto

*/

let tesseractLoaded=false;

function loadTesseract(){

  return new Promise(
    (resolve,reject)=>{

      if(
        window.Tesseract
      ){

        tesseractLoaded=true;
        resolve();
        return;

      }

      const script=
        document.createElement('script');

      script.src=
        'https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js';

      script.onload=()=>{

        tesseractLoaded=true;
        resolve();

      };

      script.onerror=()=>{

        reject(
          new Error(
            'No se pudo cargar el motor OCR.'
          )
        );

      };

      document.head.appendChild(
        script
      );

    }
  );

}


/* =====================================================
   DATOS
===================================================== */

const KEY='teamhub-v2';

let data;

try{

  data=JSON.parse(

}catch(error){

}


/* =====================================================

if(

/* =====================================================
   ESCAPE
===================================================== */

function esc(s){

  return String(
    s ?? ''
  ).replace(
    /[&<>"']/g,

    m => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m])

  );

}


/* =====================================================
   FECHAS
===================================================== */

function normalizeDateText(date){

  if(!date){
    return '';
  }

  return String(date)
    .replace(/\s+/g,' ')
    .trim();

}


function getSeasonStartYear(){

  const season =
    String(
      data.settings.season ||
      ''
    );

  const match =
    season.match(
      /(\d{4})/
    );

  if(match){
    return Number(match[1]);
  }

  return new Date().getFullYear();

}


function dateToISO(
  day,
  month
){

  const d=
    Number(day);

  const m=
    Number(month);

  if(
    !Number.isFinite(d) ||
    !Number.isFinite(m) ||
    d<1 ||
    d>31 ||
    m<1 ||
    m>12
  ){

    return '';

  }

  let year=
    getSeasonStartYear();

  /*
    Agosto-Diciembre pertenece al
    primer año de la temporada.
    Enero-Julio al segundo.
  */

  if(m<=7){
    year++;
  }

  const date=
    new Date(
      year,
      m-1,
      d
    );

  if(
    date.getDate()!==d ||
    date.getMonth()!==m-1
  ){

    return '';

  }

  return [
    year,
    String(m).padStart(2,'0'),
    String(d).padStart(2,'0')
  ].join('-');

}


function displayDateFromISO(
  iso
){

  if(!iso){
    return '';
  }

  const parts=
    String(iso).split('-');

  if(parts.length!==3){
    return '';
  }

  const d=
    Number(parts[2]);

  const m=
    Number(parts[1]);

  const months=[
    'ENE',
    'FEB',
    'MAR',
    'ABR',
    'MAY',
    'JUN',
    'JUL',
    'AGO',
    'SEP',
    'OCT',
    'NOV',
    'DIC'
  ];

  if(
    !d ||
    !m ||
    !months[m-1]
  ){

    return '';

  }

  return `${d} ${months[m-1]}`;

}


function sortMatches(
  list
){

  return [...list].sort(
    (a,b)=>{

      const da=
        a.dateISO ||
        '';

      const db=
        b.dateISO ||
        '';

      if(
        da &&
        db &&
        da!==db
      ){

        return da.localeCompare(db);

      }

      return String(
        a.date || ''
      ).localeCompare(
        String(
          b.date || ''
        )
      );

    }
  );

}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

function getMatchCountdown(){

  const nextMatch=
    getNextUpcomingMatch();

  if(
    nextMatch &&
    nextMatch.dateISO
  ){

    const target=
      new Date(
        `${nextMatch.dateISO}T${
          nextMatch.time ||
          '12:00'
        }:00`
      );

    const now=
      new Date();

    const today=
      new Date(
        now.getFullYear(),
        now.getMonth(),
        now.getDate()
      );

    const targetDay=
      new Date(
        target.getFullYear(),
        target.getMonth(),
        target.getDate()
      );

    const days=
      Math.round(
        (
          targetDay -
          today
        ) /
        86400000
      );

    if(days===0){
      return '🔴 Partido hoy';
    }

    if(days===1){
      return '🟠 Partido mañana';
    }

    if(days>1){
      return `⏱ Faltan <strong>${days} días</strong>`;
    }

    return '';

  }


  const text=
    String(
      data.next?.date || ''
    );

  const match=
    text.match(
      /(\d{1,2})\s+de\s+([a-záéíóúñ]+)/i
    );

  if(!match){
    return '';
  }

  const day=
    Number(match[1]);

  const months={

    enero:0,
    febrero:1,
    marzo:2,
    abril:3,
    mayo:4,
    junio:5,
    julio:6,
    agosto:7,
    septiembre:8,
    octubre:9,
    noviembre:10,
    diciembre:11

  };

  const monthName=
    match[2]
      .toLowerCase();

  if(
    months[monthName] === undefined
  ){

    return '';

  }

  const now=
    new Date();

  let year=
    now.getFullYear();

  let target=
    new Date(
      year,
      months[monthName],
      day,
      12,
      0,
      0
    );

  if(
    target <
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    )
  ){

    target=
      new Date(
        year+1,
        months[monthName],
        day,
        12,
        0,
        0
      );

  }

  const startToday=
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const startTarget=
    new Date(
      target.getFullYear(),
      target.getMonth(),
      target.getDate()
    );

  const days=
    Math.round(
      (
        startTarget -
        startToday
      ) /
      86400000
    );

  if(days<0){
    return '';
  }

  if(days===0){
    return '🔴 Partido hoy';
  }

  if(days===1){
    return '🟠 Partido mañana';
  }

  return `⏱ Faltan <strong>${days} días</strong>`;

}


/* =====================================================
   PRÓXIMO PARTIDO
===================================================== */

function isPlayedMatch(match){

  return !!(
    match &&
    String(
      match.score ||
      ''
    ).trim()
  );

}


function getNextUpcomingMatch(){

  const now=
    new Date();

  const todayISO=
    [
      now.getFullYear(),
      String(
        now.getMonth()+1
      ).padStart(2,'0'),
      String(
        now.getDate()
      ).padStart(2,'0')
    ].join('-');


  const upcoming=
    data.matches
      .filter(
        m =>
          !isPlayedMatch(m) &&
          m.dateISO &&
          m.dateISO>=todayISO
      );


  const sorted=
    sortMatches(
      upcoming
    );


  return sorted[0] || null;

}


function syncNextMatch(){

  const next=
    getNextUpcomingMatch();

  if(!next){
    return;
  }

  data.next.opponent=
    data.next.opponent ||
    next.away;

  /*
    El equipo configurado determina
    automáticamente cuál es nuestro
    lado del partido.
  */

  const team=
    String(
      data.settings.team ||
      'KNATT FC'
    ).trim();


  const isHome=
    String(
      next.home
    ).toLowerCase() ===
    team.toLowerCase();


  const opponent=
    isHome
      ?next.away
      :next.home;


  data.next.opponent=
    opponent;


  data.next.date=
    next.date ||
    displayDateFromISO(
      next.dateISO
    );


  data.next.time=
    next.time ||
    '12:00';


  data.next.place=
    next.place ||
    (
      isHome
        ?'Campo local'
        :'Campo visitante'
    );


  save();

}

/* =====================================================
   ACTIVIDAD TIME
===================================================== */

function activityTime(timestamp){

  if(!timestamp){
    return '';
  }

  const diff=
    Date.now() -
    Number(timestamp);

  const minute=
    60*1000;

  const hour=
    60*minute;

  const day=
    24*hour;

  if(diff<minute){
    return 'Ahora';
  }

  if(diff<hour){

    const n=
      Math.floor(
        diff/minute
      );

    return `Hace ${n} min`;

  }

  if(diff<day){

    const n=
      Math.floor(
        diff/hour
      );

    return `Hace ${n} h`;

  }

  if(diff<2*day){
    return 'Ayer';
  }

  const date=
    new Date(timestamp);

  return date.toLocaleDateString(
    'es-ES',
    {
      day:'numeric',
      month:'short'
    }
  );

}

/* =====================================================
   IMAGEN
===================================================== */

async function handleCalendarImage(
  event
){

  const file=
    event.target.files?.[0];


  if(!file){
    return;
  }


  const preview=
    document.getElementById(
      'calendar-image-preview'
    );

  const status=
    document.getElementById(
      'ocr-status'
    );

  const progress=
    document.getElementById(
      'ocr-progress'
    );

  const bar=
    document.getElementById(
      'ocr-progress-bar'
    );


  if(!preview || !status){
    return;
  }


  preview.src=
    URL.createObjectURL(file);

  preview.style.display='block';


  status.style.display='block';

  progress.style.display='block';

  bar.style.width='0%';


  status.textContent=
    'Preparando imagen...';


  try{

    await loadTesseract();


    status.textContent=
      'Leyendo calendario...';


    const result=
      await Tesseract.recognize(
        file,
        'spa',
        {
          logger:message=>{

            if(
              message.status==='recognizing text'
            ){

              const percent=
                Math.round(
                  (
                    Number(
                      message.progress
                    )||0
                  )*100
                );

              bar.style.width=
                `${percent}%`;

              status.textContent=
                `Analizando calendario... ${percent}%`;

            }

          }
        }
      );


    bar.style.width='100%';

    status.textContent=
      'Analizando los partidos detectados...';


    const text=
      result?.data?.text ||
      '';


    const parsed=
      parseCalendarText(
        text
      );


    importedMatches=
      parsed;


    if(!importedMatches.length){

      status.textContent=
        'No se han detectado partidos automáticamente.';


      showOCRFallback(
        text
      );

      return;

    }


    status.textContent=
      `${importedMatches.length} partidos detectados. Revisa los datos antes de guardar.`;


    showImportedPreview();

  }catch(error){

    console.error(error);


    status.textContent=
      'No se pudo leer la imagen automáticamente.';


    showOCRFallback('');

  }

}


/* =====================================================
   NORMALIZAR OCR
===================================================== */

function cleanOCRText(
  text
){

  return String(
    text || ''
  )
    .replace(/\r/g,'\n')
    .replace(/[|]/g,' ')
    .replace(/[“”]/g,'"')
    .replace(/[‘’]/g,"'")
    .replace(/\t+/g,' ')
    .replace(/[ ]{2,}/g,' ')
    .split('\n')
    .map(
      line =>
        line
          .trim()
    )
    .filter(Boolean);

}


function normalizeTeamName(
  name
){

  let result=
    String(
      name || ''
    )
      .replace(
        /\b(jornada|fecha|campo|hora|domingo|lunes|martes|miércoles|jueves|viernes|sábado)\b/gi,
        ''
      )
      .replace(
        /^\d{1,2}[:.)-]?\s*/,
        ''
      )
      .replace(
        /\s{2,}/g,
        ' '
      )
      .trim();


  return result;

}


/* =====================================================
   PARSER CALENDARIO
===================================================== */

function parseCalendarText(
  text
){

  const lines=
    cleanOCRText(
      text
    );


  const results=[];

  let currentRound='';


  /*
    Formatos de fecha admitidos:

    24/08
    24-08
    24.08
    24/08/2026
    24 agosto
    24 de agosto
  */

  const dateRegex=
    /(?:^|\s)(\d{1,2})[\/\-.](\d{1,2})(?:[\/\-.](\d{4}))?(?:\s|$)/;

  const monthRegex=
    /(?:^|\s)(\d{1,2})\s*(?:de\s*)?(enero|febrero|marzo|abril|mayo|junio|julio|agosto|septiembre|octubre|noviembre|diciembre)\b/i;


  const monthNumbers={

    enero:1,
    febrero:2,
    marzo:3,
    abril:4,
    mayo:5,
    junio:6,
    julio:7,
    agosto:8,
    septiembre:9,
    octubre:10,
    noviembre:11,
    diciembre:12

  };


  for(
    let i=0;
    i<lines.length;
    i++
  ){

    let line=
      lines[i];


    const roundMatch=
      line.match(
        /(?:jornada|jor\.?|fecha)\s*[:#-]?\s*(\d{1,3})/i
      );


    if(roundMatch){

      currentRound=
        `Jornada ${roundMatch[1]}`;

    }


    let day=null;
    let month=null;
    let year=null;


    const numeric=
      line.match(
        dateRegex
      );


    if(numeric){

      day=
        Number(
          numeric[1]
        );

      month=
        Number(
          numeric[2]
        );

      year=
        numeric[3]
          ?Number(numeric[3])
          :null;

    }else{

      const named=
        line.match(
          monthRegex
        );


      if(named){

        day=
          Number(
            named[1]
          );

        month=
          monthNumbers[
            named[2]
              .toLowerCase()
          ];

      }

    }


    if(
      !day ||
      !month
    ){

      continue;

    }


    let dateISO=
      dateToISO(
        day,
        month
      );


    if(year){

      dateISO=
        `${year}-${String(month).padStart(2,'0')}-${String(day).padStart(2,'0')}`;

    }


    /*
      Intentamos obtener los equipos
      quitando la fecha.
    */

    let teamText=
      line
        .replace(
          dateRegex,
          ' '
        )
        .replace(
          monthRegex,
          ' '
        )
        .replace(
          /\b(?:jornada|jor\.?|fecha)\s*\d*\b/gi,
          ' '
        )
        .trim();


    /*
      Si la línea no contiene los dos equipos,
      miramos la siguiente.
    */

    if(
      !containsMatchSeparator(
        teamText
      ) &&
      lines[i+1]
    ){

      const combined=
        `${teamText} ${lines[i+1]}`;

      if(
        containsMatchSeparator(
          combined
        )
      ){

        teamText=
          combined;

        i++;

      }

    }


    const teams=
      splitTeams(
        teamText
      );


    if(!teams){
      continue;
    }


    results.push({

      id:
        `import-${Date.now()}-${results.length}`,

      date:
        displayDateFromISO(
          dateISO
        ) ||
        `${day}/${month}`,

      dateISO:

        dateISO,

      round:
        currentRound,

      home:
        normalizeTeamName(
          teams.home
        ),

      away:
        normalizeTeamName(
          teams.away
        ),

      score:'',

      time:'',
      place:'',
      imported:true

    });

  }


  /*
    Eliminamos duplicados.
  */

  const unique=[];

  const seen=
    new Set();


  results.forEach(
    match=>{

      const key=
        [
          match.dateISO,
          match.home
            .toLowerCase(),
          match.away
            .toLowerCase()
        ].join('|');


      if(
        !seen.has(key) &&
        match.home &&
        match.away &&
        match.home.length>1 &&
        match.away.length>1
      ){

        seen.add(key);

        unique.push(
          match
        );

      }

    }
  );


  return sortMatches(
    unique
  );

}


function containsMatchSeparator(
  text
){

  return /(?:\s+vs\.?\s+|\s+v\s+|\s+-\s+|\s+–\s+|\s+—\s+|\s+x\s+)/i.test(
    String(text)
  );

}


function splitTeams(
  text
){

  const value=
    String(
      text || ''
    )
      .replace(
        /\s{2,}/g,
        ' '
      )
      .trim();


  const separators=[
    /\s+vs\.?\s+/i,
    /\s+v\s+/i,
    /\s+–\s+/,
    /\s+—\s+/,
    /\s+x\s+/i,
    /\s+-\s+/
  ];


  for(
    const regex of separators
  ){

    const parts=
      value.split(regex);


    if(
      parts.length>=2
    ){

      return {

        home:
          parts[0]
            .trim(),

        away:
          parts
            .slice(1)
            .join(' ')
            .trim()

      };

    }

  }


  return null;

}

    document.getElementById(
      'ocr-manual-text'
    );


  if(!textarea){
    return;
  }


  const parsed=
    parseCalendarText(
      textarea.value
    );


  if(!parsed.length){

    alert(
      'No se han podido detectar partidos. Prueba con una imagen donde se vean claramente las fechas y los dos equipos de cada partido.'
    );

    return;

  }


  importedMatches=
    parsed;


  showImportedPreview();


  const status=
    document.getElementById(
      'ocr-status'
    );


  if(status){

    status.textContent=
      `${parsed.length} partidos detectados. Revisa los datos antes de guardar.`;

      importedMatches
    ) ||
    !importedMatches.length
  ){

    alert(
      'No hay partidos para guardar.'
    );

    return;

  }


  const finalMatches=[];


  importedMatches.forEach(
    (match,index)=>{

      const round=
        document.getElementById(
          `preview-round-${index}`
        );

      const home=
        document.getElementById(
          `preview-home-${index}`
        );

      const away=
        document.getElementById(

        );

      const date=
        document.getElementById(
          `preview-date-${index}`
        );

      const time=
        document.getElementById(
          `preview-time-${index}`
        );


      const updated={

        ...match,

        round:
          round
            ?round.value.trim()
            :match.round,

        home:
          home
            ?home.value.trim()
            :match.home,

        away:
          away
            ?away.value.trim()
            :match.away,

        date:
          date
            ?date.value.trim()
            :match.date,

        time:
          time
            ?time.value.trim()
            :match.time,

        score:'',

        imported:true

      };


      if(
        !updated.home ||
        !updated.away
      ){

        return;

      }


      finalMatches.push(
        updated
      );

    }
  );


  if(!finalMatches.length){

    alert(
      'No hay partidos válidos para guardar.'
    );

    return;

  }


  /*
    Si se importa un calendario nuevo,
    reemplazamos los partidos importados
    anteriores, pero conservamos los
    partidos que se hayan creado manualmente.
  */

  const manualMatches=
    data.matches.filter(
      m =>
        !m.imported
    );


  /*
    Intentamos conservar resultados ya
    introducidos si el mismo partido ya
    existía.
  */

  finalMatches.forEach(
    imported=>{

      const existing=
        data.matches.find(
          old =>

            String(
              old.home
            ).toLowerCase() ===
            String(
              imported.home
            ).toLowerCase()

            &&

            String(
              old.away
            ).toLowerCase() ===
            String(
              imported.away
            ).toLowerCase()

            &&

            (
              !imported.dateISO ||
              !old.dateISO ||
              imported.dateISO===old.dateISO
            )

        );


      if(existing){

        imported.id=
          existing.id ||
          imported.id;

        imported.score=
          existing.score ||
          '';

        imported.place=
          existing.place ||
          imported.place ||
          '';

      }

    }
  );


  data.matches=
    [
      ...manualMatches,
      ...finalMatches
    ];


  data.matches=
    sortMatches(
      data.matches
    );


  addActivity(
    '📅',
    `Calendario importado: ${finalMatches.length} partidos`
  );


  syncNextMatch();

  save();


  importedMatches=[];


  closeCalendarImport();

  go('matches');


  alert(
    `Calendario guardado correctamente.\n\n${finalMatches.length} partidos añadidos a KNATT.`
  );

}

    data.tactics.view==='half'
      ?'half'
      :'full';

    data.tactics.positions||
    {};


  const placedIds=
    new Set(
      Object
        .values(positions)
        .map(
          p=>
            String(
              p?.playerId||
              ''
            )
        )
        .filter(Boolean)
    );


  const availablePlayers=
    data.players.filter(
      p=>
        p.available!==false &&
        !placedIds.has(
          String(p.id)
        )
    );


  return `

  <div class="title-row">

    <div>

      <div class="title">
        Táctica
      </div>

      <div class="subtitle">
        Arrastra los jugadores al campo
      </div>

    </div>

  </div>


  <div class="tactic-toolbar">

    <button
      type="button"
      class="tactic-view-btn ${
        view==='full'
          ?'active'
          :''
      }"
      onclick="
        changeTacticView('full')
      ">

      🟢 Campo entero

    </button>


    <button
      type="button"
      class="tactic-view-btn ${
        view==='half'
          ?'active'
          :''
      }"
      onclick="
        changeTacticView('half')
      ">

      🟢 Medio campo

    </button>

  </div>


  <div class="tactic-help">

    Arrastra un jugador desde abajo y colócalo donde quieras.

  </div>


  <div class="pitch-wrap">

    <div
      id="tactic-pitch"
      class="pitch ${
        view==='half'
          ?'half-mode'
          :''
      }">

      <div class="pitch-line"></div>

      <div class="pitch-circle"></div>

      <div class="pitch-center"></div>

      <div class="box top"></div>

      <div class="box bottom"></div>

      <div class="goal top"></div>

      <div class="goal bottom"></div>


      ${
        Object
          .entries(positions)
          .map(
            ([key,value])=>
              boardPlayerHtml(
                key,
                value
              )
          )
          .join('')
      }

    </div>

  </div>


  <div class="player-tray">

    <div class="player-tray-title">

      <strong>
        Jugadores
      </strong>

      <span class="player-tray-count">

        ${availablePlayers.length}
        disponibles para colocar

function trayPlayerHtml(
  player
){

  return `

  <div
    class="tray-player"
    data-player-id="${esc(player.id)}"
    data-drag-source="tray"
    onpointerdown="
      startTrayDrag(event, ${player.id})
    ">

    <div class="tray-player-top">

      <div class="tray-number">
        ${esc(player.num)}
      </div>

      <div class="tray-name">
        ${esc(player.name)}
      </div>

    </div>

    <div class="tray-pos">
      ${esc(player.pos||'Jugador')}
    </div>

  </div>

  `;

}


function boardPlayerHtml(
  key,
  value
){

  const player=
    data.players.find(
      p=>
        String(p.id)===
        String(
          value?.playerId||
          ''
        )
    );


  if(!player){
    return '';
  }


  let x=
    Number(value.x);

  let y=
    Number(value.y);


  if(!Number.isFinite(x)){
    x=50;
  }

  if(!Number.isFinite(y)){
    y=50;
  }


  x=
    Math.max(
      4,
      Math.min(
        96,
        x
      )
    );


  y=
    Math.max(
      3,
      Math.min(
        97,
        y
      )
    );


  return `

  <div
    class="board-player"
    id="board-player-${esc(player.id)}"
    data-player-id="${esc(player.id)}"
    data-position-key="${esc(key)}"
    style="
      left:${x}%;
      top:${y}%;
    "
    onpointerdown="
      startBoardDrag(
        event,
        '${esc(player.id)}'
      )
    ">

    <div class="board-player-card">

      <div class="board-player-ball">
        👤
      </div>

      <div class="board-player-info">

        <div class="board-player-name">
          ${esc(player.name)}
        </div>

        <div class="board-player-pos">
          ${esc(player.pos||'Jugador')}
        </div>

      </div>


      <button
        type="button"
        class="board-player-remove"
        onclick="
          event.stopPropagation();
          removePlayerFromTactic('${esc(player.id)}')
        ">

        ×

      </button>

    </div>

  </div>

  `;

}


function changeTacticView(
  view
){

  if(
    view!=='full' &&
    view!=='half'
  ){

    return;

  }


  data.tactics.view=
    view;

  save();

  render();

}


/* =====================================================
   AÑADIR TÁCTICA
===================================================== */

function addPlayerToTactic(
  playerId,
  x,
  y
){

  const id=
    String(playerId);


  const player=
    data.players.find(
      p=>
        String(p.id)===id
    );


  if(!player){
    return;
  }


  const positions=
    data.tactics.positions||
    {};


  const already=
    Object
      .entries(positions)
      .find(
        ([key,value])=>
          String(
            value?.playerId||
            ''
          )===id
      );


  if(already){
    return;
  }


  const key=
    'p_'+
    Date.now()+
    '_'+
    Math.floor(
      Math.random()*10000
    );


  positions[key]={

    playerId:id,

    x:Math.max(
      4,
      Math.min(
        96,
        Number(x)
      )
    ),

    y:Math.max(
      3,
      Math.min(
        97,
        Number(y)
      )
    )

  };


  data.tactics.positions=
    positions;


  addActivity(
    '⚽',
    `Jugador colocado: ${player.name}`
  );


  save();

  render();

}


/* =====================================================
   ELIMINAR TÁCTICA
===================================================== */

function removePlayerFromTactic(
  playerId,
  silent=false
){

  const id=
    String(playerId);


  const positions=
    data.tactics.positions||
    {};


  let removed=false;


  Object
    .entries(positions)
    .forEach(
      ([key,value])=>{

        if(
          String(
            value?.playerId||
            ''
          )===id
        ){

          delete positions[key];

          removed=true;

        }

      }
    );


  if(!removed){
    return;
  }


  const player=
    data.players.find(
      p=>
        String(p.id)===id
    );


  if(!silent){

    addActivity(
      '↩️',
      player
        ?`${player.name} retirado de la pizarra`
        :'Jugador retirado de la pizarra'
    );

  }


  data.tactics.positions=
    positions;


  save();


  if(!silent){
    render();
  }

}


/* =====================================================
   DRAG
===================================================== */

let dragState=null;

let dragGhost=null;


function createDragGhost(
  player
){

  if(dragGhost){
    dragGhost.remove();
  }


  dragGhost=
    document.createElement(
      'div'
    );


  dragGhost.className=
    'drag-ghost';


  dragGhost.innerHTML=`

    <div class="board-player-card">

      <div class="board-player-ball">
        👤
      </div>

      <div class="board-player-info">

        <div class="board-player-name">
          ${esc(player.name)}
        </div>

        <div class="board-player-pos">
          ${esc(player.pos||'Jugador')}
        </div>

      </div>

    </div>

  `;


  document.body.appendChild(
    dragGhost
  );


  dragGhost.style.display=
    'block';

}


function updateDragGhost(
  event
){

  if(
    !dragGhost ||
    !dragState
  ){

    return;

  }


  dragGhost.style.left=
    `${event.clientX}px`;

  dragGhost.style.top=
    `${event.clientY}px`;

}


function destroyDragGhost(){

  if(dragGhost){

    dragGhost.remove();

    dragGhost=null;

  }

}


function startTrayDrag(
  event,
  playerId
){

  if(
    event.pointerType==='mouse' &&
    event.button!==0
  ){

    return;

  }


  event.preventDefault();
  event.stopPropagation();


  const player=
    data.players.find(
      p=>
        String(p.id)===
        String(playerId)
    );


  if(!player){
    return;
  }


  const source=
    event.currentTarget;


  dragState={

    type:'tray',

    playerId:
      String(playerId),

    source:source,

    moved:false,

    startX:event.clientX,

    startY:event.clientY

  };


  source.classList.add(
    'dragging'
  );


  createDragGhost(
    player
  );


  updateDragGhost(
    event
  );


  try{

    source.setPointerCapture(
      event.pointerId
    );

  }catch(error){}


  document.addEventListener(
    'pointermove',
    handleGlobalPointerMove,
    {
      passive:false
    }
  );


  document.addEventListener(
    'pointerup',
    handleGlobalPointerUp,
    {
      once:true
    }
  );


  document.addEventListener(
    'pointercancel',
    handleGlobalPointerCancel,
    {
      once:true
    }
  );

}


function startBoardDrag(
  event,
  playerId
){

  if(
    event.target.closest(
      '.board-player-remove'
    )
  ){

    return;

  }


  if(
    event.pointerType==='mouse' &&
    event.button!==0
  ){

    return;

  }


  event.preventDefault();
  event.stopPropagation();


  const id=
    String(playerId);


  const entry=
    Object
      .entries(
        data.tactics.positions||
        {}
      )
      .find(
        ([key,value])=>
          String(
            value?.playerId||
            ''
          )===id
      );


  if(!entry){
    return;
  }


  const player=
    data.players.find(
      p=>
        String(p.id)===id
    );


  if(!player){
    return;
  }


  const source=
    event.currentTarget;


  dragState={

    type:'board',

    playerId:id,

    key:entry[0],

    source:source,

    moved:false,

    startX:event.clientX,

    startY:event.clientY

  };


  source.classList.add(
    'dragging'
  );


  try{

    source.setPointerCapture(
      event.pointerId
    );

  }catch(error){}


  document.addEventListener(
    'pointermove',
    handleGlobalPointerMove,
    {
      passive:false
    }
  );


  document.addEventListener(
    'pointerup',
    handleGlobalPointerUp,
    {
      once:true
    }
  );


  document.addEventListener(
    'pointercancel',
    handleGlobalPointerCancel,
    {
      once:true
    }
  );

}


function handleGlobalPointerMove(
  event
){

  if(!dragState){
    return;
  }


  event.preventDefault();


  const dx=
    event.clientX-
    (
      dragState.startX||
      event.clientX
    );


  const dy=
    event.clientY-
    (
      dragState.startY||
      event.clientY
    );


  if(
    Math.abs(dx)>4 ||
    Math.abs(dy)>4
  ){

    dragState.moved=true;

  }


  if(
    dragState.type==='tray'
  ){

    updateDragGhost(
      event
    );

  }


  const pitch=
    document.getElementById(
      'tactic-pitch'
    );


  if(!pitch){
    return;
  }


  const rect=
    pitch.getBoundingClientRect();


  const inside=
    event.clientX>=rect.left &&
    event.clientX<=rect.right &&
    event.clientY>=rect.top &&
    event.clientY<=rect.bottom;


  pitch.classList.toggle(
    'drop-active',
    inside
  );


  if(
    dragState.type==='board' &&
    inside
  ){

    const x=
      (
        (
          event.clientX-
          rect.left
        )/
        rect.width
      )*100;


    const y=
      (
        (
          event.clientY-
          rect.top
        )/
        rect.height
      )*100;


    const playerElement=
      dragState.source;


    playerElement.style.left=
      `${Math.max(
        4,
        Math.min(
          96,
          x
        )
      )}%`;


    playerElement.style.top=
      `${Math.max(
        3,
        Math.min(
          97,
          y
        )
      )}%`;

  }

}


function handleGlobalPointerUp(
  event
){

  if(!dragState){
    return;
  }


  event.preventDefault();


  const state=
    dragState;


  const pitch=
    document.getElementById(
      'tactic-pitch'
    );


  let dropped=false;


  if(pitch){

    const rect=
      pitch.getBoundingClientRect();


    const inside=
      event.clientX>=rect.left &&
      event.clientX<=rect.right &&
      event.clientY>=rect.top &&
      event.clientY<=rect.bottom;


    if(
      state.type==='tray' &&
      inside &&
      state.moved
    ){

      const x=
        (
          (
            event.clientX-
            rect.left
          )/
          rect.width
        )*100;


      const y=
        (
          (
            event.clientY-
            rect.top
        )/
        rect.height
      )*100;


      destroyDragGhost();


      addPlayerToTactic(
        state.playerId,
        x,
        y
      );


      dropped=true;

    }


    if(
      state.type==='board' &&
      inside &&
      state.moved
    ){

      const x=
        (
          (
            event.clientX-
            rect.left
          )/
          rect.width
        )*100;


      const y=
        (
          (
            event.clientY-
            rect.top
          )/
          rect.height
        )*100;


      updateBoardPlayerPosition(
        state.key,
        x,
        y
      );


      dropped=true;

    }

  }


  cleanupDrag();


  if(!dropped){
    render();
  }

}


function handleGlobalPointerCancel(){

  cleanupDrag();

  render();

}


function updateBoardPlayerPosition(
  key,
  x,
  y
){

  const position=
    data.tactics.positions[
      key
    ];


  if(!position){
    return;
  }


  position.x=
    Math.max(
      4,
      Math.min(
        96,
        Number(x)
      )
    );


  position.y=
    Math.max(
      3,
      Math.min(
        97,
        Number(y)
      )
    );


  const player=
    data.players.find(
      p=>
        String(p.id)===
        String(position.playerId)
    );


  addActivity(
    '📍',
    player
      ?`Posición actualizada: ${player.name}`
      :'Posición actualizada'
  );


  save();

}


function cleanupDrag(){

  document
    .querySelectorAll(
      '.tray-player.dragging'
    )
    .forEach(
      el=>
        el.classList.remove(
          'dragging'
        )
    );


  document
    .querySelectorAll(
      '.board-player.dragging'
    )
    .forEach(
      el=>
        el.classList.remove(
          'dragging'
        )
    );


  document
    .querySelectorAll(
      '.pitch.drop-active'
    )
    .forEach(
      el=>
        el.classList.remove(
          'drop-active'
        )
    );


  destroyDragGhost();


  document.removeEventListener(
    'pointermove',
    handleGlobalPointerMove
  );


  dragState=null;

}


/* =====================================================
   TÁCTICA GUARDAR/VACIAR
===================================================== */

function clearTactic(){

  data.tactics.positions={};

  addActivity(
    '🧹',
    'Pizarra táctica vaciada'
  );

  save();

  render();

}


function saveTactic(){

  data.tactics.savedLineup=

    Object
      .values(
        data.tactics.positions||
        {}
      )
      .map(
        v=>({

          playerId:
            String(v.playerId),

          x:
            Number(v.x),

          y:
            Number(v.y)

        })
      );


  addActivity(
    '💾',
    'Pizarra táctica guardada'
  );


  save();


  alert(
    'Pizarra táctica guardada correctamente.'
  );

}


/* =====================================================
   ARRANQUE
===================================================== */

syncNextMatch();

save();

render();

</script>
