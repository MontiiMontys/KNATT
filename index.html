<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --red:#e21d2f;
  --red2:#b90f20;
  --red3:#ff3b4d;
  --red-soft:#fff0f2;

  --dark:#0b0b0d;
  --dark2:#151518;
  --dark3:#202024;

  --bg:#f5f5f6;
  --card:#fff;
  --text:#17171a;
  --muted:#77777e;
  --line:#e6e6e9;

  --ok:#27a94b;
  --warning:#e0a300;
  --danger:#d51f32;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  padding-bottom:88px;
}


/* =========================
   HEADER
   ========================= */

header{
  background:var(--dark);
  color:#fff;
  padding:17px 18px 15px;
  position:relative;
  overflow:hidden;
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border:1px solid #ffffff12;
  border-radius:50%;
  right:-95px;
  top:-115px;
}

.header-row{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1px;
}

.brand span{
  color:var(--red3);
}

.role{
  font-size:11px;
  color:#a9a9ae;
  margin-top:2px;
  font-weight:700;
}

.header-bell{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#ffffff10;
  border:1px solid #ffffff12;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:18px;
}


/* =========================
   GENERAL
   ========================= */

main{
  padding:16px 14px 28px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:3px 2px 13px;
}

.title{
  font-size:25px;
  font-weight:950;
  letter-spacing:-.7px;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 7px 24px rgba(20,20,25,.08);
}

.card-dark{
  background:var(--dark2);
  color:#fff;
  border-color:#2b2b30;
}

.card-dark .muted{
  color:#a9a9ae;
}

.section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}


/* =========================
   BOTONES
   ========================= */

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:13px;
  box-shadow:0 5px 12px rgba(226,29,47,.18);
}

.btn.light{
  background:#f0f0f2;
  color:#222;
  box-shadow:none;
}

.btn.red-soft{
  background:var(--red-soft);
  color:var(--red);
  box-shadow:none;
}

.btn.full{
  width:100%;
}


/* =========================
   HOME
   ========================= */

.hero{
  position:relative;
  overflow:hidden;
  background:linear-gradient(
    145deg,
    #151518,
    #09090b
  );
  color:#fff;
  border:0;
}

.hero:after{
  content:"";
  position:absolute;
  width:150px;
  height:150px;
  border-radius:50%;
  right:-85px;
  top:-65px;
  border:2px solid #e21d2f22;
}

.hero .section-label{
  color:#ff6975;
}

.hero .muted{
  color:#b6b6bb;
}

.hero .big{
  color:#fff;
}

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:15px 0;
}

.team-ball{
  width:48px;
  height:48px;
  border-radius:14px;
  background:#ffffff12;
  display:grid;
  place-items:center;
  font-size:24px;
}

.match-info{
  flex:1;
}

.match-date{
  font-weight:850;
  font-size:13px;
}

.match-place{
  color:#bdbdc2;
  font-size:12px;
  margin-top:3px;
}

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:13px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 8px;
  text-align:center;
}

.stat b{
  display:block;
  font-size:21px;
  font-weight:950;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-top:2px;
}

.stat.red{
  background:var(--red-soft);
  border-color:#ffd7dc;
}

.stat.red b{
  color:var(--red);
}


/* =========================
   PARTIDOS
   ========================= */

.versus{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:13px 0;
}

.club{
  width:90px;
  text-align:center;
  font-weight:900;
  font-size:11px;
}

.club-logo{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#f0f0f2;
  margin:0 auto 5px;
  display:grid;
  place-items:center;
  font-size:21px;
}

.vs{
  font-weight:950;
  font-size:15px;
  color:#888;
}


/* =========================
   PLANTILLA
   ========================= */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:12px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:9px 13px;
  background:#e9e9ec;
  color:#5e5e64;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}

.tab.active{
  background:var(--red);
  color:#fff;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ededf0;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#ececef;
  display:grid;
  place-items:center;
  font-size:20px;
  overflow:hidden;
}

.avatar.red{
  background:var(--red-soft);
  color:var(--red);
}

.grow{
  flex:1;
  min-width:0;
}

.item b{
  font-size:13px;
}

.item .muted{
  font-size:10px;
  margin-top:2px;
}

.status-dot{
  width:8px;
  height:8px;
  border-radius:50%;
  display:inline-block;
  background:var(--ok);
  margin-right:5px;
}

.status-dot.off{
  background:#f0b400;
}

.delete-btn{
  border:0;
  background:#fae8eb;
  color:var(--danger);
  width:35px;
  height:35px;
  border-radius:10px;
  font-size:15px;
}


/* =========================
   FORMS
   ========================= */

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

.form-input,
.select{
  width:100%;
  border:1px solid var(--line);
  background:#fafafa;
  color:var(--text);
  border-radius:11px;
  padding:11px;
  font-size:14px;
  outline:none;
}

.form-input:focus,
.select:focus{
  border-color:#f18b95;
}


/* =========================
   MÁS
   ========================= */

.more-screen{
  background:var(--dark);
  min-height:calc(100vh - 80px);
  margin:-16px -14px -28px;
  padding:16px 14px 30px;
  color:#fff;
}

.more-screen .title{
  color:#fff;
}

.more-menu{
  display:grid;
  gap:8px;
  margin-top:16px;
}

.more-row{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  border:1px solid #2b2b30;
  background:#17171a;
  color:#fff;
  border-radius:13px;
  padding:12px;
  text-align:left;
}

.more-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#242428;
  display:grid;
  place-items:center;
  font-size:16px;
  flex:0 0 30px;
}

.more-row.red-icon .more-icon{
  background:#3b1419;
  color:#ff6975;
}

.more-text{
  flex:1;
  font-size:12px;
  font-weight:850;
}

.more-arrow{
  color:#8c8c92;
  font-size:17px;
}


/* =========================
   TÁCTICA
   ========================= */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:12px;
}

.select-wrap{
  min-width:0;
}

.select-wrap label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:5px;
}

.pitch-wrap{
  background:#e8e8ea;
  border-radius:19px;
  padding:8px;
  margin-bottom:12px;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:14px;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #278247 0 8.33%,
      #2d8b4f 8.33% 16.66%,
      #278247 16.66% 25%,
      #2d8b4f 25% 33.33%,
      #278247 33.33% 41.66%,
      #2d8b4f 41.66% 50%,
      #278247 50% 58.33%,
      #2d8b4f 58.33% 66.66%,
      #278247 66.66% 75%,
      #2d8b4f 75% 83.33%,
      #278247 83.33% 91.66%,
      #2d8b4f 91.66% 100%
    );

  touch-action:manipulation;
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #fff9;
  border-radius:8px;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #fff9;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #fff9;
  border-radius:50%;
  left:36.5%;
  top:36.5%;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #fff9;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}


/*
  ESTA ES LA PARTE QUE NO CAMBIAMOS DE LA TÁCTICA:

  ┌──────────────┐
  │      DC      │
  ├──────────────┤
  │ Montiimontys │
  └──────────────┘

  Y debajo permanece la lista
  de posiciones.
*/

.tactic-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:clamp(68px,22vw,105px);
  z-index:6;
  text-align:center;
}

.tactic-role{
  display:inline-block;
  background:var(--dark);
  color:#fff;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  margin-bottom:3px;
}

.slot-select{
  display:block;
  width:100%;
  height:36px;
  border:3px solid var(--red);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  padding:0 18px 0 7px;
  font-size:9px;
  font-weight:900;
  outline:none;
  box-shadow:0 3px 10px rgba(20,20,25,.14);
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.slot-select:focus{
  box-shadow:
    0 0 0 3px #e21d2f35;
}


/* LISTA DE ALINEACIÓN */

.alignment-list{
  margin-top:4px;
  border:1px solid var(--line);
  border-radius:16px;
  overflow:hidden;
}

.alignment-row{
  display:flex;
  align-items:center;
  gap:9px;
  min-height:48px;
  padding:7px 10px;
  border-bottom:1px solid var(--line);
}

.alignment-row:last-child{
  border-bottom:0;
}

.role-badge{
  flex:0 0 auto;
  background:var(--dark);
  color:#fff;
  border-radius:10px;
  padding:5px 7px;
  font-size:10px;
  font-weight:900;
}

.alignment-name{
  flex:1;
  min-width:0;
  font-size:12px;
  font-weight:800;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.availability{
  font-size:10px;
  font-weight:800;
  white-space:nowrap;
}

.availability.ok{
  color:#2c9646;
}

.availability.no{
  color:#c52d3d;
}

.tactic-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:12px;
}


/* =========================
   NAVEGACIÓN
   ========================= */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  display:flex;
  justify-content:space-around;
  background:#fffefeed;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dedee2;
  padding:7px 3px calc(7px + env(safe-area-inset-bottom));
  z-index:30;
  box-shadow:0 -8px 25px rgba(20,20,25,.08);
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#77777e;
  font-size:10px;
  font-weight:850;
  padding:6px 4px;
  min-width:52px;
  border-radius:11px;
}

nav button.active{
  color:var(--red)!important;
  background:var(--red-soft);
}

nav button .nav-icon{
  font-size:18px;
  line-height:18px;
  margin-bottom:2px;
}


/* =========================
   RESPONSIVE
   ========================= */

@media(max-width:380px){

  main{
    padding-left:11px;
    padding-right:11px;
  }

  .stat-grid{
    gap:4px;
  }

  .stat{
    padding:10px 4px;
  }

  .stat b{
    font-size:19px;
  }

  .tactic-slot{
    width:clamp(62px,20vw,90px);
  }

  .slot-select{
    font-size:8px;
    padding-left:5px;
    padding-right:14px;
  }

}
</style>
</head>


<body>

<div class="app">

<header>

  <div class="header-row">

    <div>

      <div class="brand">
        ⚽ <span>KNATT</span>
      </div>

      <div class="role">
        Entrenador · Primer Equipo
      </div>

    </div>

    <button
      class="header-bell"
      onclick="
        alert('No tienes nuevas notificaciones.')
      ">

      🔔

    </button>

  </div>

</header>


<main id="content"></main>

<nav id="nav"></nav>

</div>


<script>

const KEY='teamhub-v2';

let data;


/* =========================
   CARGAR DATOS
   ========================= */

try{

  const saved=
    localStorage.getItem(KEY);

  data=
    saved
      ?JSON.parse(saved)
      :null;

}catch(error){

  console.error(
    'Error cargando datos:',
    error
  );

  data=null;

}


/* =========================
   DATOS INICIALES
   ========================= */

if(
  !data ||
  typeof data!=='object'
){

  data={

    players:[

      {
        id:1,
        name:'Montiimontys',
        num:9,
        pos:'DC',
        available:true,
        reason:'',
        min:1126,
        g:12,
        a:6
      },

      {
        id:2,
        name:'Marc',
        num:7,
        pos:'MC',
        available:true,
        reason:'',
        min:1030,
        g:5,
        a:8
      },

      {
        id:3,
        name:'Juan',
        num:4,
        pos:'DFC',
        available:false,
        reason:'Trabajo',
        min:980,
        g:4,
        a:3
      },

      {
        id:4,
        name:'Alex',
        num:1,
        pos:'POR',
        available:true,
        reason:'',
        min:1260,
        g:0,
        a:1
      },

      {
        id:5,
        name:'Pedro',
        num:3,
        pos:'LI',
        available:false,
        reason:'Lesión',
        min:640,
        g:1,
        a:2
      }

    ],

    next:{
      opponent:'CD Rival',
      date:'Domingo, 24 de agosto',
      time:'12:00',
      place:'Campo Municipal'
    },

    matches:[
      {
        date:'17 AGO',
        home:'KNATT FC',
        away:'UD Ejemplo',
        score:'2 - 1'
      },

      {
        date:'10 AGO',
        home:'CD Prueba',
        away:'KNATT FC',
        score:'0 - 3'
      },

      {
        date:'03 AGO',
        home:'KNATT FC',
        away:'CF Amistad',
        score:'1 - 1'
      }
    ],

    tactics:{
      formation:'4-3-3',
      positions:{},
      savedLineup:[]
    },

    settings:{
      coach:'',
      team:'KNATT FC',
      season:'2026/27',
      category:'Primer Equipo'
    }

  };

}


/* =========================
   NORMALIZACIÓN
   ========================= */

if(!Array.isArray(data.players))
  data.players=[];


data.players=
  data.players.map(
    (p,index)=>({

      id:
        p?.id ??
        Date.now()+index,

      name:
        typeof p?.name==='string' &&
        p.name.trim()
          ?p.name
          :'Jugador',

      num:
        p?.num!==undefined &&
        p?.num!==null &&
        String(p.num).trim()!==''
          ?p.num
          :'-',

      pos:
        typeof p?.pos==='string' &&
        p.pos.trim()
          ?p.pos
          :'Jugador',

      available:
        typeof p?.available==='boolean'
          ?p.available
          :true,

      reason:
        typeof p?.reason==='string'
          ?p.reason
          :'',

      min:
        Number.isFinite(
          Number(p?.min)
        )
          ?Math.max(0,Number(p.min))
          :0,

      g:
        Number.isFinite(
          Number(p?.g)
        )
          ?Math.max(0,Number(p.g))
          :0,

      a:
        Number.isFinite(
          Number(p?.a)
        )
          ?Math.max(0,Number(p.a))
          :0

    })
  );


if(
  !data.next ||
  typeof data.next!=='object'
)
  data.next={};


data.next.opponent=
  data.next.opponent||
  'CD Rival';

data.next.date=
  data.next.date||
  'Próximo partido';

data.next.time=
  data.next.time||
  '12:00';

data.next.place=
  data.next.place||
  'Campo Municipal';


if(
  !Array.isArray(data.matches)
)
  data.matches=[];


if(
  !data.tactics ||
  typeof data.tactics!=='object'
)
  data.tactics={};


data.tactics.formation=
  data.tactics.formation||
  '4-3-3';


data.tactics.positions=
  data.tactics.positions &&
  typeof data.tactics.positions==='object'
    ?data.tactics.positions
    :{};


data.tactics.savedLineup=
  Array.isArray(
    data.tactics.savedLineup
  )
    ?data.tactics.savedLineup
    :[];


if(
  !data.settings ||
  typeof data.settings!=='object'
)
  data.settings={};


data.settings.coach=
  data.settings.coach||'';

data.settings.team=
  data.settings.team||
  'KNATT FC';

data.settings.season=
  data.settings.season||
  '2026/27';

data.settings.category=
  data.settings.category||
  'Primer Equipo';


localStorage.setItem(
  KEY,
  JSON.stringify(data)
);


/* =========================
   ESTADO
   ========================= */

let section='home';

let filter='all';

let selectedPlayerId=null;


/* =========================
   FORMACIONES

function esc(s){

  return String(s).replace(
    /[&<>"']/g,
    m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m])
  );

}

function editPlayer(){

  const p=
    getSelectedPlayer();

  if(!p)
    return;


  const name=
    prompt(
      'Nombre del jugador:',
      p.name
    );

  if(name===null)
    return;


  const num=
    prompt(
      'Número de camiseta:',
      p.num
    );

  if(num===null)
    return;


  const pos=
    prompt(
      'Posición:',
      p.pos
    );

  if(pos===null)
    return;


  const available=
    confirm(
      '¿Está disponible para jugar?\n\n'+
      'Aceptar = Sí\n'+
      'Cancelar = No'
    );


  let reason='';


  if(!available){

    const r=
      prompt(
        'Motivo de la ausencia:',
        p.reason||''
      );

    if(r!==null)
      reason=r.trim();

  }


  const min=
    prompt(
      'Minutos jugados:',
      p.min
    );

  if(min===null)
    return;


  const goals=
    prompt(
      'Goles:',
      p.g
    );

  if(goals===null)
    return;


  const assists=
    prompt(
      'Asistencias:',
      p.a
    );

  if(assists===null)
    return;


  p.name=
    name.trim()||
    p.name;

  p.num=
    num.trim()||
    p.num;

  p.pos=
    pos.trim()||
    p.pos;

  p.available=
    available;

  p.reason=
    reason;

  p.min=
    Math.max(
      0,
      Number(min)||0
    );

  p.g=
    Math.max(
      0,
      Number(goals)||0
    );

  p.a=
    Math.max(
      0,
      Number(assists)||0
    );


  save();

  render();

}

function deletePlayer(id){

  const player=
    data.players.find(
      p=>
        String(p.id)===
        String(id)
    );


  if(!player)
    return;


  if(
    !confirm(
      '¿Seguro que quieres eliminar a '+
      player.name+
      ' de la plantilla?'
    )
  )
    return;


  data.players=
    data.players.filter(
      p=>
        String(p.id)!==
        String(id)
    );


  Object.keys(
    data.tactics.positions
  )
  .forEach(
    key=>{

      if(
        String(
          data.tactics.positions[key]
            .playerId
        )===
        String(id)
      ){

        delete
          data.tactics.positions[key];

      }

    }
  );


  data.tactics.savedLineup=
    data.tactics.savedLineup
      .filter(
        x=>
          String(x)!==
          String(id)
      );


  save();

  selectedPlayerId=null;

  section='team';

  render();

}

function normalizeTacticPositions(){

  const spots=
    formations[
      data.tactics.formation
    ]||
    formations['4-3-3'];


  const old=
    data.tactics.positions||
    {};


  const values=
    Object.values(old);


  const alreadyNew=
    values.some(
      v=>
        v &&
        v.playerId!==undefined
    );


  if(alreadyNew)
    return;


  const next={};


  const oldPlayers=
    Object.entries(old)
      .map(
        ([id,v])=>({
          id:String(id),
          v
        })
      )
      .filter(
        x=>
          data.players.some(
            p=>
              String(p.id)===
              x.id
          )
      );


  oldPlayers
    .slice(
      0,
      spots.length
    )
    .forEach(
      (x,i)=>{

        next[
          String(i)
        ]={

          playerId:x.id,

          x:spots[i][1],

          y:spots[i][2],

          role:spots[i][0]

        };

      }
    );


  data.tactics.positions=
    next;


  save();

}

function slotHtml(
  spot,
  index,
  positions
){

  const role=
    spot[0];

  const x=
    spot[1];

  const y=
    spot[2];

  const selectedId=
    positions[
      String(index)
    ]?.playerId||
    '';


  return `

  <div
    class="tactic-slot"
    style="
      left:${x}%;
      top:${y}%
    ">

    <div class="tactic-role">
      ${role}
    </div>


    <select
      class="slot-select"
      aria-label="
        Posición ${role}
      "
      onchange="
        assignPosition(
          ${index},
          this.value
        )
      ">


      <option value="">
        -- ${role} --
      </option>


      ${
        playerOptions(
          selectedId
        )
      }


    </select>

  </div>

  `;

}


/*
  SOLO NOMBRE.
  SIN DORSAL.
*/

function playerOptions(
  selectedId
){

  const used=
    new Set(
      Object.values(
        data.tactics.positions||
        {}
      )
      .map(
        v=>
          String(
            v?.playerId||
            ''
          )
      )
      .filter(Boolean)
    );


  return data.players
    .map(
      p=>{

        const id=
          String(p.id);


        const disabled=
          used.has(id) &&
          id!==String(selectedId);


        return `

        <option
          value="${id}"
          ${
            id===String(selectedId)
              ?'selected'
              :''
          }
          ${
            disabled
              ?'disabled'
              :''
          }>

          ${esc(p.name)}

        </option>

        `;

      }
    )
    .join('');

}


/* =========================
   LISTA INFERIOR
   ========================= */

function alignmentRow(
  spot,
  index,
  positions
){

  const id=
    positions[
      String(index)
    ]?.playerId||
    '';


  const p=
    data.players.find(
      x=>
        String(x.id)===
        String(id)
    );


  return `

  <div class="alignment-row">

    <span class="role-badge">
      ${spot[0]}
    </span>


    <span class="alignment-name">

      ${
        p
          ?esc(p.name)
          :'-- Sin jugador --'
      }

    </span>


    ${
      p

        ?

        `
        <span
          class="
            availability
            ${
              p.available
                ?'ok'
                :'no'
            }
          ">

          ${
            p.available
              ?'● Disponible'
              :'● '+
                esc(
                  p.reason||
                  'No disponible'
                )
          }

        </span>
        `

        :

        ''

    }

  </div>

  `;

}


/* =========================
   ASIGNAR POSICIÓN
   ========================= */

function assignPosition(
  index,
  playerId
){

  if(
    !data.tactics.positions
  ){

    data.tactics.positions={};

  }


  const key=
    String(index);

  const id=
    String(
      playerId||
      ''
    );


  if(!id){

    delete
      data.tactics.positions[
        key
      ];

    save();

    render();

    return;

  }


  const duplicate=
    Object.entries(
      data.tactics.positions
    )
    .some(
      ([k,v])=>

        k!==key &&

        String(
          v?.playerId||
          ''
        )===id

    );


  if(duplicate){

    alert(
      'Ese jugador ya está colocado en otra posición.'
    );

    render();

    return;

  }


  const spot=
    (
      formations[
        data.tactics.formation
      ]||
      formations['4-3-3']
    )[index];


  data.tactics.positions[
    key
  ]={

    playerId:id,

    x:spot[1],

    y:spot[2],

    role:spot[0]

  };


  save();

  render();

}


/* =========================
   CAMBIAR FORMACIÓN
   ========================= */

function changeFormation(
  formation
){

  data.tactics.formation=
    formation;


  const spots=
    formations[formation];


  const old=
    data.tactics.positions||
    {};


  const next={};


  spots.forEach(
    (spot,i)=>{

      const id=
        String(
          old[
            String(i)
          ]?.playerId||
          ''
        );


      if(
        id &&
        !Object.values(
          next
        )
        .some(
          v=>
            String(
              v.playerId
            )===id
        )
      ){

        next[
          String(i)
        ]={

          playerId:id,

          x:spot[1],

          y:spot[2],

          role:spot[0]

        };

      }

    }
  );


  data.tactics.positions=
    next;


  save();

  render();

}


/* =========================
   RESET
   ========================= */

function resetTactic(){

  const spots=
    formations[
      data.tactics.formation
    ];


  const next={};


  data.players
    .slice(
      0,
      spots.length
    )
    .forEach(
      (p,i)=>{

        next[
          String(i)
        ]={

          playerId:
            String(p.id),

          x:spots[i][1],

          y:spots[i][2],

          role:spots[i][0]

        };

      }
    );


  data.tactics.positions=
    next;


  save();

  render();

}


/* =========================
   VACIAR
   ========================= */

function clearTactic(){

  data.tactics.positions={};

  save();

  render();

}


/* =========================
   GUARDAR
   ========================= */

function saveTactic(){

  data.tactics.savedLineup=
    Object.keys(
      data.tactics.positions||
      {}
    )
    .filter(
      key=>
        data.tactics
          .positions[key]
          ?.playerId
    );


  save();

  alert(
    'Alineación guardada correctamente.'
  );

}

/* =========================

function stats(){

  const sorted=

      .sort(

          (Number(a.g)||0)
      );


  const totalGoals=
    data.players.reduce(
      (s,p)=>
        s+(Number(p.g)||0),
      0
    );


  const totalAssists=
    data.players.reduce(
      (s,p)=>
        s+(Number(p.a)||0),
      0
    );


  const totalMinutes=
    data.players.reduce(
      (s,p)=>
        s+(Number(p.min)||0),
      0
    );


  return `

  <div class="title">

    </div>


    <div class="stat">

      <b>
        ${totalAssists}
      </b>

      <span>
        Asistencias
      </span>

    </div>


    <div class="stat">

      <b>
        ${totalMinutes}
      </b>

      <span>
        Minutos
      </span>

    </div>


    <div class="stat">

      <b>
        ${data.players.length}
      </b>

      <span>
        Jugadores
      </span>

    </div>

  </div>


  <div class="card">

    <div class="section-label">
      RENDIMIENTO DE PLANTILLA
    </div>


    ${
      sorted
        .map(
          p=>`

          <div class="item">

            <div class="avatar">

              ${
                p.pos==='POR'
                  ?'🧤'
                  :'⚽'
              }

            </div>


            <div class="grow">

              <b>
                ${esc(p.name)}
              </b>

              <div class="muted small">
                ${esc(p.pos)}
              </div>

            </div>


            <div style="text-align:right">

              <b>
                ${Number(p.min)||0}

              <div class="muted small">

                ${Number(p.g)||0} ⚽
