<!doctype html>
<html lang="es">

<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KNATT</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green:#123c2d;
  --green2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#10221b;
  --muted:#718078;
  --line:#e3ebe7;
  --red:#d95c5c;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  min-height:100vh;
}

button{
  font-family:inherit;
  border:0;
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:0 auto;
  padding-bottom:105px;
  background:var(--bg);
}

/* ================= HEADER ================= */

header{
  position:relative;
  overflow:hidden;
  padding:30px 22px 28px;
  color:white;
  background:
    linear-gradient(
      145deg,
      var(--green),
      #0d2d22
    );
  border-radius:0 0 34px 34px;
  box-shadow:0 10px 30px rgba(18,60,45,.15);
}

header:after{
  content:"";
  position:absolute;
  width:220px;
  height:220px;
  right:-100px;
  top:-110px;
  border-radius:50%;
  background:rgba(185,232,108,.07);
}

.brand{
  position:relative;
  z-index:2;
  font-size:30px;
  line-height:1;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--lime);
}

.role-text{
  position:relative;
  z-index:2;
  margin-top:10px;
  color:#d8e5df;
  font-size:14px;
  font-weight:700;
}

/* ================= MAIN ================= */

main{
  padding:20px 16px 30px;
}

.title{
  margin:3px 0 17px;
  font-size:27px;
  font-weight:900;
  letter-spacing:-.7px;
}

/* ================= ROLE ================= */

.rolebar{
  display:flex;
  gap:8px;
  padding:5px;
  margin-bottom:20px;
  border-radius:18px;
  background:#e6ece8;
}

.role-button{
  flex:1;
  min-height:54px;
  padding:12px;
  border-radius:15px;
  background:#eef2f0;
  color:var(--green);
  font-size:15px;
  font-weight:900;
}

.role-button.active{
  background:var(--green);
  color:white;
  box-shadow:0 7px 18px rgba(18,60,45,.16);
}

/* ================= CARDS ================= */

.card{
  padding:19px;
  margin-bottom:14px;
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  box-shadow:0 8px 25px rgba(16,34,27,.06);
}

.hero{
  color:white;
  border:0;
  background:
    linear-gradient(
      145deg,
      var(--green),
      var(--green2)
    );
  box-shadow:0 12px 30px rgba(18,60,45,.16);
}

.section-label{
  margin-bottom:7px;
  color:var(--muted);
  font-size:11px;
  font-weight:900;
  letter-spacing:1.1px;
  text-transform:uppercase;
}

.hero .section-label{
  color:var(--lime);
}

.big{
  color:var(--text);
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}

.hero .big{
  color:white;
}

.muted{
  color:var(--muted);
}

.hero .muted{
  color:#c8d8d1;
}

.small{
  font-size:13px;
}

/* ================= MATCH ================= */

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 0;
}

.team-ball{
  display:grid;
  place-items:center;
  width:52px;
  height:52px;
  flex:0 0 52px;
  border-radius:17px;
  background:rgba(255,255,255,.10);
  font-size:25px;
}

.match-info{
  flex:1;
}

.match-date{
  font-size:14px;
  font-weight:800;
}

.match-place{
  margin-top:4px;
  color:#c8d8d1;
  font-size:13px;
}

/* ================= BUTTONS ================= */

.btn{
  width:auto;
  padding:13px 16px;
  border-radius:15px;
  background:var(--green);
  color:white;
  font-size:14px;
  font-weight:900;
}

.btn.full{
  width:100%;
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.light{
  background:#e9efec;
  color:var(--green);
}

.choice{
  display:flex;
  gap:8px;
}

.choice .btn{
  flex:1;
}

/* ================= STATS ================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  padding:16px;
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
}

.stat span{
  display:block;
  margin-top:3px;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.stat.accent b{
  color:#315d18;
}

/* ================= ROWS ================= */

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  display:grid;
  place-items:center;
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  font-size:21px;
}

.grow{
  flex:1;
  min-width:0;
}

/* ================= PILLS ================= */

.pill{
  display:inline-flex;
  align-items:center;
  padding:6px 9px;
  border-radius:999px;
  background:#e9f7d8;
  color:#426c20;
  font-size:11px;
  font-weight:900;
}

.pill.red{
  background:#fae9e9;
  color:#b44343;
}

/* ================= TABS ================= */

.tabs{
  display:flex;
  gap:7px;
  overflow-x:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  flex:0 0 auto;
  padding:10px 14px;
  border-radius:999px;
  background:#e8eeeb;
  color:#526159;
  font-size:13px;
  font-weight:800;
}

.tab.active{
  background:var(--green);
  color:white;
}

/* ================= PLAYER ================= */

.player-card{
  padding:22px;
  margin-bottom:14px;
  color:white;
  background:
    linear-gradient(
      145deg,
      var(--green),
      var(--green2)
    );
  border-radius:24px;
  box-shadow:0 12px 30px rgba(18,60,45,.16);
}

.player-number{
  display:grid;
  place-items:center;
  width:64px;
  height:64px;
  margin-bottom:15px;
  border-radius:20px;
  background:rgba(185,232,108,.14);
  color:var(--lime);
  font-size:26px;
  font-weight:900;
}

.player-name{
  font-size:27px;
  font-weight:900;
  letter-spacing:-.6px;
}

.player-position{
  margin-top:4px;
  color:#c8d8d1;
  font-size:14px;
  font-weight:700;
}

/* ================= NAV ================= */

nav{
  position:fixed;
  z-index:50;
  right:0;
  bottom:0;
  left:0;
  display:flex;
  justify-content:space-around;
  width:min(520px,100%);
  margin:auto;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  background:rgba(255,255,255,.95);
  border-top:1px solid #dfe7e3;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  box-shadow:0 -8px 30px rgba(16,34,27,.08);
}

nav button{
  min-width:58px;
  padding:7px 6px;
  border-radius:14px;
  background:transparent;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
}

nav button.active{
  background:#edf4ef;
  color:var(--green);
}

/* ================= EMPTY ================= */

.empty{
  padding:30px 15px;
  text-align:center;
  color:var(--muted);
}

/* ================= MOBILE ================= */

@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .brand{
    font-size:27px;
  }

  .big{
    font-size:20px;
  }

}

</style>

</head>

<body>

<div class="app">

<header>

  <div class="brand">
    ⚽ <span>KNATT</span>
  </div>

  <div
    class="role-text"
    id="roleText">
  </div>

</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>


<script>

/* =====================================================
   DATOS
===================================================== */

const STORAGE_KEY = "knatt-v3";


const DEFAULT_DATA = {

  players:[
    {
      id:1,
      name:"Montiimontys",
      num:9,
      pos:"DC",
      available:true,
      reason:"",
      min:1126,
      g:12,
      a:6,
      train:18,
      total:20
    },

    {
      id:2,
      name:"Marc",
      num:7,
      pos:"MC",
      available:true,
      reason:"",
      min:1030,
      g:5,
      a:8,
      train:18,
      total:20
    },

    {
      id:3,
      name:"Juan",
      num:4,
      pos:"DFC",
      available:false,
      reason:"Trabajo",
      min:980,
      g:4,
      a:3,
      train:17,
      total:20
    },

    {
      id:4,
      name:"Alex",
      num:1,
      pos:"POR",
      available:true,
      reason:"",
      min:1260,
      g:0,
      a:1,
      train:19,
      total:20
    },

    {
      id:5,
      name:"Pedro",
      num:3,
      pos:"LI",
      available:false,
      reason:"Lesión",
      min:640,
      g:1,
      a:2,
      train:14,
      total:20
    }
  ],

  next:{
    opponent:"CD Rival",
    date:"Domingo 23 de agosto",
    time:"12:00",
    place:"Campo Municipal"
  },

  trainings:[
    {
      date:"Jueves 20 de agosto",
      time:"21:15",
      place:"Campo Municipal"
    }
  ]

};


/* =====================================================
   CARGAR DATOS DE FORMA SEGURA
===================================================== */

function loadData(){

  try{

    const saved =
      localStorage.getItem(STORAGE_KEY);

    if(!saved){
      return structuredClone(DEFAULT_DATA);
    }

    const parsed=JSON.parse(saved);

    if(
      !parsed ||
      !Array.isArray(parsed.players)
    ){
      return structuredClone(DEFAULT_DATA);
    }

    if(
      !parsed.next ||
      typeof parsed.next!=="object"
    ){
      parsed.next=structuredClone(DEFAULT_DATA.next);
    }

    if(
      !Array.isArray(parsed.trainings) ||
      parsed.trainings.length===0
    ){
      parsed.trainings=
        structuredClone(DEFAULT_DATA.trainings);
    }

    return parsed;

  }catch(error){

    console.log("Error cargando datos:",error);

    return structuredClone(DEFAULT_DATA);

  }

}


let data=loadData();


/* =====================================================
   ESTADO
===================================================== */

let role="trainer";

try{

  const savedRole=
    localStorage.getItem("knatt-role");

  if(
    savedRole==="trainer" ||
    savedRole==="player"
  ){
    role=savedRole;
  }

}catch(error){}


let section="home";

let filter="all";


/* =====================================================
   GUARDAR
===================================================== */

function save(){

  try{

    localStorage.setItem(
      STORAGE_KEY,
      JSON.stringify(data)
    );

  }catch(error){

    console.log("No se pudo guardar:",error);

  }

}


/* =====================================================
   CAMBIAR ROL
===================================================== */

function setRole(newRole){

  if(
    newRole!=="trainer" &&
    newRole!=="player"
  ){
    return;
  }

  role=newRole;

  section="home";

  try{

    localStorage.setItem(
      "knatt-role",
      role
    );

  }catch(error){}

  render();

}


/* =====================================================
   NOMBRE DEL ROL
===================================================== */

function roleName(){

  if(role==="player"){
    return "Jugador";
  }

  return "Entrenador";

}


/* =====================================================
   NAVEGACIÓN
===================================================== */

function getNavItems(){

  if(role==="trainer"){

    return [

      ["home","🏠","Inicio"],

      ["team","👥","Plantilla"],

      ["training","🏋️","Entrenos"],

      ["matches","🏆","Partidos"],

      ["stats","📊","Stats"]

    ];

  }


  return [

    ["home","🏠","Inicio"],

    ["profile","⚽","Mi perfil"],

    ["training","🏋️","Entrenos"],

    ["matches","🏆","Partidos"],

    ["stats","📊","Mi temporada"]

  ];

}


/* =====================================================
   IR A UNA SECCIÓN
===================================================== */

function go(newSection){

  section=newSection;

  render();

  window.scrollTo({
    top:0,
    behavior:"smooth"
  });

}


/* =====================================================
   RENDER PRINCIPAL
===================================================== */

function render(){

  try{

    document.getElementById(
      "roleText"
    ).textContent=
      roleName()+" · Primer Equipo";


    renderRoleButtons();


    renderNavigation();


    renderContent();

  }catch(error){

    console.log(
      "Error renderizando KNATT:",
      error
    );

    document.getElementById(
      "content"
    ).innerHTML=`

      <div class="card">

        <div class="title">
          KNATT
        </div>

        <div class="empty">
          Ha ocurrido un error cargando la pantalla.
        </div>

        <button
          class="btn full"
          type="button"
          onclick="resetApp()">
          Reiniciar KNATT
        </button>

      </div>

    `;

  }

}


/* =====================================================
   BOTONES ENTRENADOR / JUGADOR
===================================================== */

function renderRoleButtons(){

  const content=
    document.getElementById("content");

  content.innerHTML=`

    <div class="rolebar">

      <button
        type="button"
        class="role-button ${
          role==="trainer" ? "active" : ""
        }"
        onclick="setRole('trainer')">

        🧑‍🏫 Entrenador

      </button>


      <button
        type="button"
        class="role-button ${
          role==="player" ? "active" : ""
        }"
        onclick="setRole('player')">

        ⚽ Jugador

      </button>

    </div>

  `;

}


/* =====================================================
   NAVEGACIÓN INFERIOR
===================================================== */

function renderNavigation(){

  const nav=
    document.getElementById("nav");

  nav.innerHTML=
    getNavItems()
    .map(item=>`

      <button
        type="button"
        class="${
          section===item[0]
          ? "active"
          : ""
        }"
        onclick="go('${item[0]}')">

        ${item[1]}<br>
        ${item[2]}

      </button>

    `)
    .join("");

}


/* =====================================================
   CONTENIDO
===================================================== */

function renderContent(){

  const content=
    document.getElementById("content");

  let html="";


  if(section==="home"){
    html=home();
  }

  else if(section==="team"){
    html=team();
  }

  else if(section==="training"){
    html=training();
  }

  else if(section==="matches"){
    html=matches();
  }

  else if(section==="stats"){
    html=stats();
  }

  else if(section==="profile"){
    html=profile();
  }

  else{
    html=home();
  }


  content.innerHTML += html;

}


/* =====================================================
   HOME
===================================================== */

function home(){

  if(role==="trainer"){

    const available=
      data.players.filter(
        p=>p.available===true
      ).length;


    const absent=
      data.players.filter(
        p=>p.available!==true
      ).length;


    const goals=
      data.players.reduce(
        (sum,p)=>
          sum + Number(p.g || 0),
        0
      );


    const training=
      data.trainings[0];


    return `

      <div class="title">
        Panel del equipo
      </div>


      <div class="card hero">

        <div class="section-label">
          PRÓXIMO PARTIDO
        </div>

        <div class="big">
          KNATT 🆚 ${data.next.opponent}
        </div>


        <div class="match-meta">

          <div class="team-ball">
            ⚽
          </div>

          <div class="match-info">

            <div class="match-date">
              ${data.next.date}
              ·
              ${data.next.time}
            </div>

            <div class="match-place">
              📍 ${data.next.place}
            </div>

          </div>

        </div>


        <button
          type="button"
          class="btn lime full"
          onclick="go('matches')">

          Ver partido →

        </button>

      </div>


      <div class="section-label">
        RESUMEN DEL EQUIPO
      </div>


      <div class="grid">

        <div class="stat accent">
          <b>${data.players.length}</b>
          <span>Jugadores</span>
        </div>

        <div class="stat">
          <b>${available}</b>
          <span>Disponibles</span>
        </div>

        <div class="stat">
          <b>${absent}</b>
          <span>Ausentes</span>
        </div>

        <div class="stat">
          <b>${goals}</b>
          <span>Goles</span>
        </div>

      </div>


      <div class="card">

        <div class="section-label">
          PRÓXIMO ENTRENAMIENTO
        </div>

        <div class="big">
          ${training.date}
        </div>

        <div class="muted small">
          ${training.time}
          ·
          ${training.place}
        </div>

      </div>


      <div class="card">

        <div class="section-label">
          AUSENCIAS
        </div>


        ${
          data.players
          .filter(p=>p.available!==true)
          .map(p=>`

            <div class="item">

              <div class="avatar">
                ⚽
              </div>

              <div class="grow">

                <b>
                  ${p.num} · ${p.name}
                </b>

                <div class="muted small">
                  ${p.pos}
                </div>

              </div>

              <span class="pill red">
                ${p.reason || "No disponible"}
              </span>

            </div>

          `)
          .join("")
          ||
          `<div class="muted">
            No hay ausencias.
          </div>`
        }

      </div>

    `;

  }


  /* =========================
     HOME JUGADOR
  ========================= */

  const player=
    data.players[0];


  const percentage=
    player.total>0
    ? Math.round(
        player.train/
        player.total*
        100
      )
    : 0;


  return `

    <div class="title">
      Hola, ${player.name}
    </div>


    <div class="player-card">

      <div class="player-number">
        #${player.num}
      </div>

      <div class="player-name">
        ${player.name}
      </div>

      <div class="player-position">
        ${player.pos}
        ·
        Primer Equipo
      </div>

    </div>


    <div class="card hero">

      <div class="section-label">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        KNATT 🆚 ${data.next.opponent}
      </div>


      <div class="match-meta">

        <div class="team-ball">
          ⚽
        </div>

        <div class="match-info">

          <div class="match-date">
            ${data.next.date}
            ·
            ${data.next.time}
          </div>

          <div class="match-place">
            📍 ${data.next.place}
          </div>

        </div>

      </div>


      <button
        type="button"
        class="btn lime full"
        onclick="go('matches')">

        Ver partido →

      </button>

    </div>


    <div class="card">

      <div class="section-label">
        PRÓXIMO ENTRENAMIENTO
      </div>

      <div class="big">
        ${data.trainings[0].date}
      </div>

      <div class="muted small">
        ${data.trainings[0].time}
        ·
        ${data.trainings[0].place}
      </div>


      <br>


      <div class="choice">

        <button
          type="button"
          class="btn"
          onclick="confirmAttendance()">

          ✅ Voy

        </button>


        <button
          type="button"
          class="btn light"
          onclick="reportAbsence()">

          ❌ No voy

        </button>

      </div>

    </div>


    <div class="section-label">
      MI TEMPORADA
    </div>


    <div class="grid">

      <div class="stat">
        <b>${player.min}</b>
        <span>Minutos</span>
      </div>

      <div class="stat accent">
        <b>${player.g}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${player.a}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${percentage}%</b>
        <span>Entrenos</span>
      </div>

    </div>

  `;

}


/* =====================================================
   ASISTENCIA
===================================================== */

function confirmAttendance(){

  alert(
    "Asistencia confirmada para el próximo entrenamiento."
  );

}


function reportAbsence(){

  alert(
    "Ausencia comunicada al entrenador."
  );

}


/* =====================================================
   PLANTILLA
===================================================== */

function team(){

  const list=
    data.players.filter(p=>{

      if(filter==="available"){
        return p.available===true;
      }

      if(filter==="absent"){
        return p.available!==true;
      }

      return true;

    });


  return `

    <div class="title">
      Plantilla
    </div>


    <div class="tabs">

      <button
        type="button"
        class="tab ${
          filter==="all" ? "active" : ""
        }"
        onclick="
          filter='all';
          render();
        ">

        Todos

      </button>


      <button
        type="button"
        class="tab ${
          filter==="available"
          ? "active"
          : ""
        }"
        onclick="
          filter='available';
          render();
        ">

        🟢 Disponibles

      </button>


      <button
        type="button"
        class="tab ${
          filter==="absent"
          ? "active"
          : ""
        }"
        onclick="
          filter='absent';
          render();
        ">

        🔴 Ausentes

      </button>

    </div>


    <div class="card">

      ${
        list.length===0

        ?

        `<div class="empty">
          No hay jugadores en esta categoría.
        </div>`

        :

        list.map(p=>`

          <div class="item">

            <div class="avatar">
              ${
                p.pos==="POR"
                ? "🧤"
                : "⚽"
              }
            </div>


            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.pos}
                ·
                ${
                  p.available===true
                  ? "🟢 Disponible"
                  : "🔴 "+(p.reason || "No disponible")
                }
              </div>

              <div class="muted small">
                ${p.g} ⚽
                ·
                ${p.a} 🎯
                ·
                ${p.min} min
              </div>

            </div>


            <span class="pill">

              ${
                p.total>0
                ? Math.round(
                    p.train/
                    p.total*
                    100
                  )
                : 0
              }%

            </span>

          </div>

        `).join("")

      }

    </div>

  `;

}

/* =====================================================
   ESTADÍSTICAS
===================================================== */

function stats(){

  const sorted=
    [...data.players]
    .sort(
      (a,b)=>
        Number(b.g||0)-
        Number(a.g||0)
    );


  const goals=
    data.players.reduce(
      (s,p)=>
        s+Number(p.g||0),
      0
    );


  const assists=
    data.players.reduce(
      (s,p)=>
        s+Number(p.a||0),
      0
    );


  const minutes=
    data.players.reduce(
      (s,p)=>
        s+Number(p.min||0),
      0
    );


  const list=
    role==="trainer"
    ? sorted
    : [data.players[0]];


  return `

    <div class="title">

      ${
        role==="trainer"
        ? "Estadísticas del equipo"
        : "Mi temporada"
      }

    </div>


    <div class="grid">

      <div class="stat accent">
        <b>${goals}</b>
        <span>Goles</span>
      </div>


      <div class="stat">
        <b>${assists}</b>
        <span>Asistencias</span>
      </div>


      <div class="stat">
        <b>${minutes}</b>
        <span>Minutos</span>
      </div>


      <div class="stat">
        <b>${data.players.length}</b>
        <span>Jugadores</span>
      </div>

    </div>


    <div class="card">

      <div class="section-label">

        ${
          role==="trainer"
          ? "RENDIMIENTO DE PLANTILLA"
          : "MIS ESTADÍSTICAS"
        }

      </div>


      ${

        list.map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>


            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.pos}
              </div>

            </div>


            <div style="text-align:right">

              <b>
                ${p.min}
              </b>

              <div class="muted small">
                ${p.g} ⚽
                ·
                ${p.a} 🎯
              </div>

            </div>

          </div>

        `).join("")

      }

    </div>

  `;

}

   PERFIL DEL JUGADOR
===================================================== */

  const p=

  const percentage=

    : 0;


  return `

    <div class="title">
      Mi perfil
    </div>


    <div class="player-card">

      <div class="player-number">
        #${p.num}
      </div>

      <div class="player-name">
        ${p.name}
      </div>

        ${p.pos}

      </div>

    </div>


    <div class="grid">

      <div class="stat">
        <b>${p.min}</b>
        <span>Minutos jugados</span>
      </div>


      <div class="stat accent">
        <b>${p.g}</b>
        <span>Goles</span>
      </div>


      <div class="stat">
        <b>${p.a}</b>
        <span>Asistencias</span>
      </div>


      <div class="stat">
        <b>${percentage}%</b>
        <span>Entrenamientos</span>
      </div>

    </div>


    <div class="card">

      <div class="section-label">
        ESTADO
      </div>


      ${

        ?

        `
        <b>
          🟢 Disponible
        </b>

        <div class="muted small">
          Disponible para el próximo partido.
        </div>
        `

        :

        `
        <b>
          🔴 No disponible
        </b>

        <div class="muted small">
          ${p.reason || "No disponible"}
        </div>
        `
      }

  `;

}
