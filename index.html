<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green:#123c2d;
  --green-2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
  --danger:#d95c5c;
  --shadow:0 8px 28px rgba(16,34,27,.07);
}

html{
  background:var(--bg);
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button{
  font-family:inherit;
  -webkit-appearance:none;
  appearance:none;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:100px;
}

/* =========================
   HEADER
========================= */

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--green),#0d2d22);
  color:white;
  padding:28px 20px 26px;
  border-radius:0 0 32px 32px;
  box-shadow:0 10px 30px rgba(12,45,34,.14);
}

header:after{
  content:"";
  position:absolute;
  width:210px;
  height:210px;
  border-radius:50%;
  right:-90px;
  top:-105px;
  background:rgba(185,232,108,.07);
}

.brand{
  position:relative;
  z-index:2;
  font-size:30px;
  font-weight:900;
  letter-spacing:-1px;
}

.brand span{
  color:var(--lime);
}

.role{
  position:relative;
  z-index:2;
  color:#d8e5df;
  font-size:14px;
  margin-top:6px;
  font-weight:700;
}

/* =========================
   MAIN
========================= */

main{
  padding:20px 16px 30px;
}

.title{
  font-size:26px;
  font-weight:900;
  letter-spacing:-.7px;
  margin:4px 0 17px;
}

/* =========================
   ROLE SELECTOR
========================= */

.rolebar{
  display:flex;
  gap:8px;
  margin-bottom:20px;
  background:#e7ede9;
  padding:5px;
  border-radius:18px;
  box-shadow:inset 0 1px 0 rgba(255,255,255,.7);
}

.rolebar button{
  flex:1;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:var(--shadow);
}

.hero{
  background:linear-gradient(145deg,var(--green),var(--green-2));
  color:white;
  border:0;
  padding:20px;
  box-shadow:0 12px 32px rgba(18,60,45,.16);
}

.hero .muted{
  color:#c8d8d1;
}

.hero .big{
  color:white;
}

.section-label{
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:1.1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.5px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

/* =========================
   MATCH
========================= */

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:17px 0;
}

.team-ball{
  width:50px;
  height:50px;
  border-radius:16px;
  background:rgba(255,255,255,.1);
  display:grid;
  place-items:center;
  font-size:25px;
  flex:0 0 50px;
}

.match-info{
  flex:1;
}

.match-date{
  font-weight:800;
  font-size:14px;
}

.match-place{
  color:#c8d8d1;
  font-size:13px;
  margin-top:3px;
}

/* =========================
   STATS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  box-shadow:0 6px 20px rgba(16,34,27,.05);
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.stat.accent b{
  color:#315d18;
}

/* =========================
   ROWS
========================= */

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px;
}

.grow{
  flex:1;
  min-width:0;
}

/* =========================
   PILLS
========================= */

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20;
}

.pill.danger{
  background:#fae9e9;
  color:#b44343;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:15px;
  padding:13px 15px;
  background:var(--green);
  color:white;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 12px rgba(18,60,45,.12);
}

.btn.light{
  background:#e9efec;
  color:var(--green);
  box-shadow:none;
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.full{
  width:100%;
}

.choice{
  display:flex;
  gap:8px;
}

.choice button{
  flex:1;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:white;
}

/* =========================
   PLAYER HERO
========================= */

.player-hero{
  background:linear-gradient(145deg,#123c2d,#19553f);
  color:white;
  border-radius:24px;
  padding:22px;
  margin-bottom:14px;
  box-shadow:0 12px 32px rgba(18,60,45,.16);
}

.player-number{
  width:64px;
  height:64px;
  border-radius:20px;
  background:rgba(185,232,108,.14);
  color:var(--lime);
  display:grid;
  place-items:center;
  font-size:27px;
  font-weight:900;
  margin-bottom:15px;
}

.player-name{
  font-size:27px;
  font-weight:900;
  letter-spacing:-.7px;
}

.player-position{
  color:#c8d8d1;
  margin-top:4px;
  font-size:14px;
  font-weight:700;
}

/* =========================
   NAVIGATION
========================= */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:rgba(255,255,255,.94);
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -8px 30px rgba(16,34,27,.08);
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 8px;
  min-width:58px;
  border-radius:13px;
  cursor:pointer;
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .big{
    font-size:20px;
  }

  .brand{
    font-size:27px;
  }

}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ <span>KNATT</span></div>
  <div class="role" id="roleText"></div>
</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>

<script>

const KEY='teamhub-v2';

let data;

try{

  data=JSON.parse(localStorage.getItem(KEY)||'null');

}catch(e){

  data=null;

}

if(!data || !Array.isArray(data.players)){

  data={
    players:[
      {
        id:1,
        name:'Montiimontys',
        num:9,
        pos:'DC',
        available:true,
        reason:'',
        min:1126,
        g:12,
        a:6,
        train:18,
        total:20
      },
      {
        id:2,
        name:'Marc',
        num:7,
        pos:'MC',
        available:true,
        reason:'',
        min:1030,
        g:5,
        a:8,
        train:18,
        total:20
      },
      {
        id:3,
        name:'Juan',
        num:4,
        pos:'DFC',
        available:false,
        reason:'Trabajo',
        min:980,
        g:4,
        a:3,
        train:17,
        total:20
      },
      {
        id:4,
        name:'Alex',
        num:1,
        pos:'POR',
        available:true,
        reason:'',
        min:1260,
        g:0,
        a:1,
        train:19,
        total:20
      },
      {
        id:5,
        name:'Pedro',
        num:3,
        pos:'LI',
        available:false,
        reason:'Lesión',
        min:640,
        g:1,
        a:2,
        train:14,
        total:20
      }
    ],

    next:{
      opponent:'CD Rival',
      date:'Domingo 23 de agosto',
      time:'12:00',
      place:'Campo Municipal'
    },

    trainings:[
      {
        date:'Jueves 20 de agosto',
        time:'21:15',
        place:'Campo Municipal'
      }
    ]
  };

}

let role=localStorage.getItem('teamhub-role')||'trainer';

if(role!=='trainer' && role!=='player'){
  role='trainer';
}

let section='home';
let filter='all';

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function setRole(r){

  role=r;

  localStorage.setItem('teamhub-role',r);

  section='home';

  render();

}

function roleName(){

  return role==='trainer'
    ?'Entrenador'
    :'Jugador';

}

function navItems(){

  if(role==='trainer'){

    return[
      ['home','🏠','Inicio'],
      ['team','👥','Plantilla'],
      ['training','🏋️','Entrenos'],
      ['matches','🏆','Partidos'],
      ['stats','📊','Stats']
    ];

  }

  return[
    ['home','🏠','Inicio'],
    ['profile','⚽','Mi perfil'],
    ['training','🏋️','Entrenos'],
    ['matches','🏆','Partidos'],
    ['stats','📊','Mi temporada']
  ];

}

function render(){

  document.getElementById('roleText').textContent=
    roleName()+' · Primer Equipo';

  document.getElementById('nav').innerHTML=
    navItems()
    .map(x=>`
      <button
        type="button"
        class="${section===x[0]?'active':''}"
        onclick="go('${x[0]}')">
        ${x[1]}<br>
        ${x[2]}
      </button>
    `)
    .join('');

  const c=document.getElementById('content');

  c.innerHTML=`

    <div class="rolebar">

      <button
        type="button"
        class="btn ${role==='trainer'?'':'light'}"
        onclick="setRole('trainer')">
        🧑‍🏫 Entrenador
      </button>

      <button
        type="button"
        class="btn ${role==='player'?'':'light'}"
        onclick="setRole('player')">
        ⚽ Jugador
      </button>

    </div>

  `;

  if(section==='home'){
    c.innerHTML+=home();
  }

  if(section==='team'){
    c.innerHTML+=team();
  }

  if(section==='training'){
    c.innerHTML+=training();
  }

  if(section==='matches'){
    c.innerHTML+=matches();
  }

  if(section==='stats'){
    c.innerHTML+=stats();
  }

  if(section==='profile'){
    c.innerHTML+=profile();
  }

}

function go(s){

  section=s;

  render();

  window.scrollTo({
    top:0,
    behavior:'smooth'
  });

}

/* =========================
   HOME
========================= */

function home(){

  if(role==='trainer'){

    const available=data.players.filter(p=>p.available).length;
    const absent=data.players.filter(p=>!p.available).length;
    const goals=data.players.reduce((s,p)=>s+(Number(p.g)||0),0);

    return`

      <div class="title">
        Panel del equipo
      </div>

      <div class="card hero">

        <div
          class="section-label"
          style="color:#b9e86c">
          PRÓXIMO PARTIDO
        </div>

        <div class="big">
          TeamHub FC 🆚 ${data.next.opponent}
        </div>

        <div class="match-meta">

          <div class="team-ball">
            ⚽
          </div>

          <div class="match-info">

            <div class="match-date">
              ${data.next.date} · ${data.next.time}
            </div>

            <div class="match-place">
              📍 ${data.next.place}
            </div>

          </div>

        </div>

        <button
          type="button"
          class="btn lime full"
          onclick="go('matches')">
          Ver partido →
        </button>

      </div>

      <div class="section-label">
        RESUMEN DEL EQUIPO
      </div>

      <div class="grid">

        <div class="stat accent">
          <b>${data.players.length}</b>
          <span>Jugadores</span>
        </div>

        <div class="stat">
          <b>${available}</b>
          <span>Disponibles</span>
        </div>

        <div class="stat">
          <b>${absent}</b>
          <span>Ausentes</span>
        </div>

        <div class="stat">
          <b>${goals}</b>
          <span>Goles</span>
        </div>

      </div>

      <div class="card">

        <div class="row">

          <div>

            <div class="section-label">
              PRÓXIMO ENTRENAMIENTO
            </div>

            <div class="big">
              ${data.trainings[0].date}
            </div>

            <div class="muted small">
              ${data.trainings[0].time} ·
              ${data.trainings[0].place}
            </div>

          </div>

          <div class="avatar">
            🏋️
          </div>

        </div>

      </div>

      <div class="card">

        <div class="section-label">
          AUSENCIAS
        </div>

        ${
          data.players
          .filter(p=>!p.available)
          .map(p=>`

            <div class="item">

              <div class="avatar">
                ⚽
              </div>

              <div class="grow">

                <b>
                  ${p.num} · ${p.name}
                </b>

                <div class="muted small">
                  ${p.pos}
                </div>

              </div>

              <span class="pill danger">
                ${p.reason}
              </span>

            </div>

          `)
          .join('')
          ||
          '<div class="muted">Ninguna</div>'
        }

      </div>

    `;

  }

  /* =========================
     PLAYER HOME
  ========================= */

  const p=data.players[0];

  const percentage=
    p.total>0
    ?Math.round((p.train/p.total)*100)
    :0;

  return`

    <div class="title">
      Hola, ${p.name}
    </div>

    <div class="player-hero">

      <div class="player-number">
        #${p.num}
      </div>

      <div class="player-name">
        ${p.name}
      </div>

      <div class="player-position">
        ${p.pos} · Primer Equipo
      </div>

    </div>

    <div class="card hero">

      <div
        class="section-label"
        style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        TeamHub FC 🆚 ${data.next.opponent}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          ⚽
        </div>

        <div class="match-info">

          <div class="match-date">
            ${data.next.date} · ${data.next.time}
          </div>

          <div class="match-place">
            📍 ${data.next.place}
          </div>

        </div>

      </div>

      <button
        type="button"
        class="btn lime full"
        onclick="go('matches')">
        Ver partido →
      </button>

    </div>

    <div class="card">

      <div class="section-label">
        PRÓXIMO ENTRENAMIENTO
      </div>

      <div class="big">
        ${data.trainings[0].date}
      </div>

      <div class="muted small">
        ${data.trainings[0].time} ·
        ${data.trainings[0].place}
      </div>

      <br>

      <div class="choice">

        <button
          type="button"
          class="btn"
          onclick="alert('Asistencia confirmada')">
          ✅ Voy
        </button>

        <button
          type="button"
          class="btn light"
          onclick="alert('Ausencia comunicada')">
          ❌ No voy
        </button>

      </div>

    </div>

    <div class="section-label">
      MI TEMPORADA
    </div>

    <div class="grid">

      <div class="stat">
        <b>${p.min}</b>
        <span>Minutos</span>
      </div>

      <div class="stat accent">
        <b>${p.g}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${p.a}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${percentage}%</b>
        <span>Entrenos</span>
      </div>

    </div>

  `;

}

/* =========================
   TEAM
========================= */

function team(){

  const list=data.players.filter(
    p=>filter==='all' ||
    (filter==='available'?p.available:!p.available)
  );

  return`

    <div class="title">
      Plantilla
    </div>

    <div class="tabs">

      <button
        type="button"
        class="tab ${filter==='all'?'active':''}"
        onclick="filter='all';render()">
        Todos
      </button>

      <button
        type="button"
        class="tab ${filter==='available'?'active':''}"
        onclick="filter='available';render()">
        🟢 Disponibles
      </button>

      <button
        type="button"
        class="tab ${filter==='absent'?'active':''}"
        onclick="filter='absent';render()">
        🔴 Ausentes
      </button>

    </div>

    <div class="card">

      ${
        list.map(p=>`

          <div class="item">

            <div class="avatar">
              ${p.pos==='POR'?'🧤':'⚽'}
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.pos} ·
                ${p.available
                  ?'🟢 Disponible'
                  :'🔴 '+p.reason}
              </div>

              <div class="muted small">
                ${p.g} ⚽ ·
                ${p.a} 🎯 ·
                ${p.min} min
              </div>

            </div>

            <span class="pill">
              ${
                p.total>0
                ?Math.round(p.train/p.total*100)
                :0
              }%
            </span>

          </div>

        `).join('')
      }

    </div>

  `;

}

/* =========================
   TRAINING
========================= */

function training(){

  return`

    <div class="title">
      Entrenamientos
    </div>

    <div class="card hero">

      <div
        class="section-label"
        style="color:#b9e86c">
        PRÓXIMO
      </div>

      <div class="big">
        ${data.trainings[0].date}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          🏋️
        </div>

        <div class="match-info">

          <div class="match-date">
            ${data.trainings[0].time}
          </div>

          <div class="match-place">
            📍 ${data.trainings[0].place}
          </div>

        </div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">
        ${
          role==='trainer'
          ?'CONTROL DE ASISTENCIA'
          :'MI ASISTENCIA'
        }
      </div>

      ${
        role==='trainer'
        ?
        data.players.map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.train}/${p.total} entrenamientos
              </div>

            </div>

            <span class="pill">
              ${
                p.total>0
                ?Math.round(p.train/p.total*100)
                :0
              }%
            </span>

          </div>

        `).join('')
        :
        `

        <div class="grid">

          <div class="stat">
            <b>${data.players[0].train}</b>
            <span>Asistencias</span>
          </div>

          <div class="stat accent">
            <b>
              ${
                data.players[0].total>0
                ?Math.round(
                  data.players[0].train/
                  data.players[0].total*100
                )
                :0
              }%
            </b>
            <span>Asistencia</span>
          </div>

        </div>

        `
      }

    </div>

  `;

}

/* =========================
   MATCHES
========================= */

function matches(){

  return`

    <div class="title">
      Partidos
    </div>

    <div class="card hero">

      <div
        class="section-label"
        style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        TeamHub FC 🆚 ${data.next.opponent}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          ⚽
        </div>

        <div class="match-info">

          <div class="match-date">
            ${data.next.date}
          </div>

          <div class="match-place">
            ${data.next.time} ·
            ${data.next.place}
          </div>

        </div>

      </div>

      ${
        role==='trainer'
        ?
        `
        <button
          type="button"
          class="btn lime full"
          onclick="alert('Aquí gestionaremos convocatoria y alineación')">
          Gestionar convocatoria
        </button>
        `
        :
        `
        <span class="pill">
          Convocatoria pendiente
        </span>
        `
      }

    </div>

  `;

}

/* =========================
   STATS
========================= */

function stats(){

  const sorted=[...data.players]
    .sort((a,b)=>b.g-a.g);

  const totalGoals=data.players.reduce(
    (s,p)=>s+(Number(p.g)||0),
    0
  );

  const totalAssists=data.players.reduce(
    (s,p)=>s+(Number(p.a)||0),
    0
  );

  const totalMinutes=data.players.reduce(
    (s,p)=>s+(Number(p.min)||0),
    0
  );

  return`

    <div class="title">
      ${
        role==='trainer'
        ?'Estadísticas del equipo'
        :'Mi temporada'
      }
    </div>

    <div class="grid">

      <div class="stat accent">
        <b>${totalGoals}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${totalAssists}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${totalMinutes}</b>
        <span>Minutos</span>
      </div>

      <div class="stat">
        <b>${data.players.length}</b>
        <span>Jugadores</span>
      </div>

    </div>

    <div class="card">

      <div class="section-label">
        ${
          role==='trainer'
          ?'RENDIMIENTO DE PLANTILLA'
          :'MIS ESTADÍSTICAS'
        }
      </div>

      ${
        (
          role==='trainer'
          ?sorted
          :[data.players[0]]
        )
        .map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>
                ${p.num} · ${p.name}
              </b>

              <div class="muted small">
                ${p.pos}
              </div>

            </div>

            <div style="text-align:right">

              <b>
                ${p.min}
              </b>

              <div class="muted small">
                ${p.g} ⚽ ·
                ${p.a} 🎯
              </div>

            </div>

          </div>

        `).join('')
      }

    </div>

  `;

}

/* =========================
   PROFILE
========================= */

function profile(){

  const p=data.players[0];

  const percentage=
    p.total>0
    ?Math.round(p.train/p.total*100)
    :0;

  return`

    <div class="title">
      Mi perfil
    </div>

    <div class="player-hero">

      <div class="player-number">
        #${p.num}
      </div>

      <div class="player-name">
        ${p.name}
      </div>

      <div class="player-position">
        ${p.pos} · Primer Equipo
      </div>

    </div>

    <div class="grid">

      <div class="stat">
        <b>${p.min}</b>
        <span>Minutos jugados</span>
      </div>

      <div class="stat accent">
        <b>${p.g}</b>
        <span>Goles</span>
      </div>

      <div class="stat">
        <b>${p.a}</b>
        <span>Asistencias</span>
      </div>

      <div class="stat">
        <b>${percentage}%</b>
        <span>Entrenamientos</span>
      </div>

    </div>

    <div class="card">

      <div class="section-label">
        ESTADO
      </div>

      ${
        p.available
        ?
        `
        <div class="row">
          <div>
            <b>🟢 Disponible</b>
            <div class="muted small">
              Disponible para el próximo partido
            </div>
          </div>
        </div>
        `
        :
        `
        <div class="row">
          <div>
            <b>🔴 No disponible</b>
            <div class="muted small">
              ${p.reason}
            </div>
          </div>
        </div>
        `
      }

    </div>

  `;

}

/* =========================
   START
========================= */

render();

</script>

</body>
</html>
