<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green:#123c2d;
  --green-2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
  --danger:#d95c5c;
  --warning:#d89b32;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:96px;
}

/* =========================
   HEADER
========================= */

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--green),#0d2d22);
  color:white;
  padding:26px 20px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #0c2d2225;
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  right:-75px;
  top:-90px;
  background:#b9e86c12;
}

.brand{
  position:relative;
  z-index:2;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand span{
  color:var(--lime);
}

.role{
  position:relative;
  z-index:2;
  opacity:.78;
  font-size:13px;
  margin-top:5px;
  font-weight:600;
}

/* =========================
   MAIN
========================= */

main{
  padding:20px 16px 30px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:2px 0 16px;
}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin:2px 0 16px;
}

.title-row .title{
  margin:0;
}

.subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:-8px;
  margin-bottom:16px;
}

/* =========================
   ROLE SELECTOR
========================= */

.rolebar{
  display:flex;
  gap:8px;
  margin-bottom:18px;
  background:#e6ece8;
  padding:5px;
  border-radius:15px;
}

.rolebar button{
  flex:1;
}

/* =========================
   CARDS
========================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 7px 25px #10221b0b;
}

.hero{
  background:linear-gradient(145deg,var(--green),var(--green-2));
  color:white;
  border:0;
  padding:20px;
  box-shadow:0 12px 30px #123c2d22;
}

.hero .muted{
  color:#c8d8d1;
}

.hero .big{
  color:white;
}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

/* =========================
   MATCH
========================= */

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 0;
}

.team-ball{
  width:50px;
  height:50px;
  border-radius:16px;
  background:#ffffff18;
  display:grid;
  place-items:center;
  font-size:25px;
}

.match-info{
  flex:1;
}

.match-date{
  font-weight:800;
  font-size:14px;
}

.match-place{
  color:#c8d8d1;
  font-size:13px;
  margin-top:3px;
}

/* =========================
   STATS
========================= */

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  background:white;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  box-shadow:0 6px 20px #10221b08;
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.stat.accent b{
  color:#315d18;
}

/* =========================
   ROWS / PLAYERS
========================= */

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.item:last-child{
  border-bottom:0;
}

.player-row{
  cursor:pointer;
  transition:.15s ease;
}

.player-row:active{
  transform:scale(.985);
  opacity:.8;
}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px;
}

.player-avatar{
  background:linear-gradient(145deg,#eaf4ee,#dceae3);
  font-size:22px;
}

.grow{
  flex:1;
  min-width:0;
}

.player-name{
  font-size:15px;
  font-weight:900;
}

.player-number{
  color:var(--muted);
  font-weight:700;
  font-size:13px;
}

.player-arrow{
  color:#a0aaa5;
  font-size:20px;
  font-weight:700;
}

/* =========================
   PILLS
========================= */

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20;
}

.pill.danger{
  background:#fae9e9;
  color:#b44343;
}

.pill.warning{
  background:#fff2d9;
  color:#9b6717;
}

/* =========================
   BUTTONS
========================= */

.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  background:var(--green);
  color:white;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 12px #123c2d20;
}

.btn.light{
  background:#e9efec;
  color:var(--green);
  box-shadow:none;
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.full{
  width:100%;
}

.btn.small-btn{
  padding:10px 12px;
  font-size:12px;
}

.btn.add{
  display:flex;
  align-items:center;
  gap:6px;
  white-space:nowrap;
}

.btn.danger{
  background:#fae9e9;
  color:#b44343;
  box-shadow:none;
}

.choice{
  display:flex;
  gap:8px;
}

.choice button{
  flex:1;
}

/* =========================
   TABS
========================= */

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:white;
}

/* =========================
   NOTICE
========================= */

.notice{
  background:#edf6df;
  color:#36561f;
  border-radius:17px;
  padding:14px;
  font-size:13px;
  font-weight:700;
}

/* =========================
   EMPTY
========================= */

.empty{
  text-align:center;
  padding:30px 15px;
  color:var(--muted);
}

.empty-icon{
  font-size:42px;
  margin-bottom:10px;
}

.empty-title{
  font-size:17px;
  font-weight:900;
  color:var(--text);
  margin-bottom:5px;
}

/* =========================
   PLAYER MODAL
========================= */

.modal{
  position:fixed;
  inset:0;
  background:#07140fcc;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:100;
  display:flex;
  align-items:flex-end;
  justify-content:center;
  padding:0;
}

.modal.hidden{
  display:none;
}

.modal-box{
  width:min(520px,100%);
  max-height:92vh;
  overflow:auto;
  background:#fff;
  border-radius:28px 28px 0 0;
  padding:22px 18px calc(24px + env(safe-area-inset-bottom));
  box-shadow:0 -20px 60px #00000030;
}

.modal-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:18px;
}

.modal-title{
  font-size:22px;
  font-weight:900;
}

.close-btn{
  width:40px;
  height:40px;
  border:0;
  border-radius:50%;
  background:#edf1ef;
  color:var(--green);
  font-size:22px;
  font-weight:700;
}

.form-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:12px;
}

.field{
  margin-bottom:13px;
}

.field.full-field{
  grid-column:1 / -1;
}

.field label{
  display:block;
  font-size:12px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

.field input,
.field select{
  width:100%;
  border:1px solid #dce5e0;
  border-radius:13px;
  padding:13px 12px;
  background:#f8faf9;
  color:var(--text);
  outline:none;
}

.field input:focus,
.field select:focus{
  border-color:var(--green-2);
  box-shadow:0 0 0 3px #19553f18;
}

.modal-actions{
  display:flex;
  gap:9px;
  margin-top:6px;
}

.modal-actions button{
  flex:1;
}

.delete-zone{
  margin-top:15px;
  padding-top:15px;
  border-top:1px solid var(--line);
}

/* =========================
   NAVIGATION
========================= */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffee;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -8px 30px #10221b0c;
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 8px;
  min-width:58px;
  border-radius:13px;
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef;
}

nav button:first-line{
  font-size:18px;
}

/* =========================
   MOBILE
========================= */

@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .big{
    font-size:20px;
  }

  .brand{
    font-size:27px;
  }

  .title-row{
    align-items:flex-start;
  }

  .title-row .btn{
    padding:11px 12px;
  }

  .form-grid{
    grid-template-columns:1fr;
  }

  .field.full-field{
    grid-column:auto;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ <span>KNATT</span></div>
  <div class="role" id="roleText"></div>
</header>

<main id="content"></main>

<nav id="nav"></nav>

<div id="playerModal" class="modal hidden">

  <div class="modal-box">

    <div class="modal-header">
      <div class="modal-title" id="modalTitle">
        Nuevo jugador
      </div>

      <button
        class="close-btn"
        onclick="closePlayerForm()">
        ×
      </button>
    </div>

    <form onsubmit="savePlayer(event)">

      <div class="form-grid">

        <div class="field">
          <label>Nombre</label>
          <input
            id="playerName"
            type="text"
            placeholder="Ej. Marc"
            required>
        </div>

        <div class="field">
          <label>Dorsal</label>
          <input
            id="playerNum"
            type="number"
            min="0"
            max="99"
            placeholder="7"
            required>
        </div>

        <div class="field">
          <label>Posición</label>
          <select id="playerPos">
            <option value="POR">POR · Portero</option>
            <option value="DFC">DFC · Central</option>
            <option value="LI">LI · Lateral izquierdo</option>
            <option value="LD">LD · Lateral derecho</option>
            <option value="MC">MC · Centrocampista</option>
            <option value="MCD">MCD · Mediocentro</option>
            <option value="MP">MP · Mediapunta</option>
            <option value="EI">EI · Extremo izquierdo</option>
            <option value="ED">ED · Extremo derecho</option>
            <option value="DC">DC · Delantero</option>
          </select>
        </div>

        <div class="field">
          <label>Disponibilidad</label>
          <select id="playerAvailable">
            <option value="true">🟢 Disponible</option>
            <option value="false">🔴 Ausente</option>
          </select>
        </div>

        <div class="field full-field">
          <label>Motivo de ausencia</label>
          <input
            id="playerReason"
            type="text"
            placeholder="Ej. Trabajo, lesión...">
        </div>

        <div class="field">
          <label>Minutos</label>
          <input
            id="playerMin"
            type="number"
            min="0"
            value="0">
        </div>

        <div class="field">
          <label>Goles</label>
          <input
            id="playerGoals"
            type="number"
            min="0"
            value="0">
        </div>

        <div class="field">
          <label>Asistencias</label>
          <input
            id="playerAssists"
            type="number"
            min="0"
            value="0">
        </div>

        <div class="field">
          <label>Entrenos realizados</label>
          <input
            id="playerTrain"
            type="number"
            min="0"
            value="0">
        </div>

        <div class="field">
          <label>Total de entrenos</label>
          <input
            id="playerTotal"
            type="number"
            min="0"
            value="0">
        </div>

      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="btn light"
          onclick="closePlayerForm()">
          Cancelar
        </button>

        <button
          type="submit"
          class="btn">
          Guardar jugador
        </button>

      </div>

    </form>

    <div
      id="deleteZone"
      class="delete-zone"
      style="display:none">

      <button
        class="btn danger full"
        onclick="deleteCurrentPlayer()">
        🗑️ Eliminar jugador
      </button>

    </div>

  </div>

</div>

</div>

<script>

const KEY='teamhub-v2';

let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
  players:[
    {
      id:1,
      name:'Montiimontys',
      num:9,
      pos:'DC',
      available:true,
      reason:'',
      min:1126,
      g:12,
      a:6,
      train:18,
      total:20
    },
    {
      id:2,
      name:'Marc',
      num:7,
      pos:'MC',
      available:true,
      reason:'',
      min:1030,
      g:5,
      a:8,
      train:18,
      total:20
    },
    {
      id:3,
      name:'Juan',
      num:4,
      pos:'DFC',
      available:false,
      reason:'Trabajo',
      min:980,
      g:4,
      a:3,
      train:17,
      total:20
    },
    {
      id:4,
      name:'Alex',
      num:1,
      pos:'POR',
      available:true,
      reason:'',
      min:1260,
      g:0,
      a:1,
      train:19,
      total:20
    },
    {
      id:5,
      name:'Pedro',
      num:3,
      pos:'LI',
      available:false,
      reason:'Lesión',
      min:640,
      g:1,
      a:2,
      train:14,
      total:20
    }
  ],

  next:{
    opponent:'CD Rival',
    date:'Domingo 23 de agosto',
    time:'12:00',
    place:'Campo Municipal'
  },

  trainings:[
    {
      date:'Jueves 20 de agosto',
      time:'21:15',
      place:'Campo Municipal'
    }
  ]
};

let role=localStorage.getItem('teamhub-role')||'trainer';
let section='home';
let filter='all';
let editingPlayerId=null;

/* =========================
   HELPERS
========================= */

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function esc(value){
  return String(value??'')
    .replace(/&/g,'&amp;')
    .replace(/</g,'&lt;')
    .replace(/>/g,'&gt;')
    .replace(/"/g,'&quot;')
    .replace(/'/g,'&#039;');
}

function escAttr(value){
  return esc(value);
}

function numberValue(id){
  const value=parseInt(document.getElementById(id).value,10);
  return Number.isFinite(value)?Math.max(0,value):0;
}

/* =========================
   ROLE
========================= */

function setRole(r){
  role=r;
  localStorage.setItem('teamhub-role',r);
  section='home';
  render();
}

function roleName(){
  return role==='trainer'?'Entrenador':'Jugador';
}

/* =========================
   NAVIGATION
========================= */

function navItems(){

  return role==='trainer'
  ? [
      ['home','🏠','Inicio'],
      ['team','👥','Plantilla'],
      ['training','🏋️','Entrenos'],
      ['matches','🏆','Partidos'],
      ['stats','📊','Stats']
    ]
  : [
      ['home','🏠','Inicio'],
      ['profile','⚽','Mi perfil'],
      ['training','🏋️','Entrenos'],
      ['matches','🏆','Partidos'],
      ['stats','📊','Mi temporada']
    ];
}

function render(){

  document.getElementById('roleText').textContent=
    roleName()+' · Primer Equipo';

  document.getElementById('nav').innerHTML=
    navItems()
    .map(x=>`
      <button
        class="${section===x[0]?'active':''}"
        onclick="go('${x[0]}')">
        ${x[1]}<br>${x[2]}
      </button>
    `)
    .join('');

  let c=document.getElementById('content');

  c.innerHTML=`
    <div class="rolebar">

      <button
        class="btn ${role==='trainer'?'':'light'}"
        onclick="setRole('trainer')">
        🧑‍🏫 Entrenador
      </button>

      <button
        class="btn ${role==='player'?'':'light'}"
        onclick="setRole('player')">
        ⚽ Jugador
      </button>

    </div>
  `;

  if(section==='home')c.innerHTML+=home();
  if(section==='team')c.innerHTML+=team();
  if(section==='training')c.innerHTML+=training();
  if(section==='matches')c.innerHTML+=matches();
  if(section==='stats')c.innerHTML+=stats();
  if(section==='profile')c.innerHTML+=profile();
}

function go(s){
  section=s;
  render();
}

/* =========================
   HOME
========================= */

function home(){

  if(role==='trainer'){

    let available=data.players.filter(p=>p.available).length;
    let absent=data.players.filter(p=>!p.available).length;
    let goals=data.players.reduce((s,p)=>s+Number(p.g||0),0);

    return `

    <div class="title">
      Panel del equipo
    </div>

    <div class="card hero">

      <div class="section-label" style="color:#b9e86c">
        PRÓXIMO PARTIDO
      </div>

      <div class="big">
        KNATT 🆚 ${esc(data.next.opponent)}
      </div>

      <div class="match-meta">

        <div class="team-ball">
          ⚽
        </div>

        <div class="match-info">

          <div class="match-date">
            ${esc(data.next.date)} · ${esc(data.next.time)}
          </div>

          <div class="match-place">
            📍 ${esc(data.next.place)}
          </div>

        </div>

      </div>

      <button
        class="btn lime full"
        onclick="go('matches')">
        Ver partido →
      </button>

    </div>

    <div class="section-label">
      RESUMEN DEL EQUIPO
    </div>

    <div class="grid">

      <div class="stat accent">
        <b>${data.players.length}</b>
        <span>Jugadores</span>
      </div>

      <div class="stat">
        <b>${available}</b>
        <span>Disponibles</span>
      </div>

      <div class="stat">
        <b>${absent}</b>
        <span>Ausentes</span>
      </div>

      <div class="stat">
        <b>${goals}</b>
        <span>Goles</span>
      </div>

    </div>

    <div class="card">

      <div class="row">

        <div>

          <div class="section-label">
            PRÓXIMO ENTRENAMIENTO
          </div>

          <div class="big">
            ${esc(data.trainings[0].date)}
          </div>

          <div class="muted small">
            ${esc(data.trainings[0].time)} ·
            ${esc(data.trainings[0].place)}
          </div>

        </div>

        <div class="avatar">
          🏋️
        </div>

      </div>

    </div>

    <div class="card">

      <div class="section-label">
        AUSENCIAS
      </div>

      ${
        data.players.filter(p=>!p.available).map(p=>`

          <div class="item">

            <div class="avatar">
              ⚽
            </div>

            <div class="grow">

              <b>
                ${esc(p.num)} · ${esc(p.name)}
              </b>

              <div class="muted small">
                ${esc(p.pos)}
              </div>

            </div>

/* =========================
   PLAYER FORM
========================= */

function openPlayerForm(id=null){

  if(role!=='trainer'){
    return;
  }

  editingPlayerId=id;

  const modal=document.getElementById('playerModal');
  const title=document.getElementById('modalTitle');
  const deleteZone=document.getElementById('deleteZone');

  if(id===null){

    title.textContent='Nuevo jugador';
    deleteZone.style.display='none';

    document.getElementById('playerName').value='';
    document.getElementById('playerNum').value='';
    document.getElementById('playerPos').value='DC';
    document.getElementById('playerAvailable').value='true';
    document.getElementById('playerReason').value='';
    document.getElementById('playerMin').value=0;
    document.getElementById('playerGoals').value=0;
    document.getElementById('playerAssists').value=0;
    document.getElementById('playerTrain').value=0;
    document.getElementById('playerTotal').value=0;

  }else{

    const p=data.players.find(x=>x.id===id);

    if(!p){
      return;
    }

    title.textContent='Editar jugador';
    deleteZone.style.display='block';

    document.getElementById('playerName').value=p.name||'';
    document.getElementById('playerNum').value=p.num??'';
    document.getElementById('playerPos').value=p.pos||'DC';
    document.getElementById('playerAvailable').value=String(p.available);
    document.getElementById('playerReason').value=p.reason||'';
    document.getElementById('playerMin').value=p.min||0;
    document.getElementById('playerGoals').value=p.g||0;
    document.getElementById('playerAssists').value=p.a||0;
    document.getElementById('playerTrain').value=p.train||0;
    document.getElementById('playerTotal').value=p.total||0;
  }

  modal.classList.remove('hidden');

  setTimeout(()=>{
    document.getElementById('playerName').focus();
  },100);
}

function closePlayerForm(){

  editingPlayerId=null;

  document
    .getElementById('playerModal')
    .classList.add('hidden');
}

function savePlayer(event){

  event.preventDefault();

  const name=document
    .getElementById('playerName')
    .value
    .trim();

  const num=numberValue('playerNum');

  if(!name){
    alert('Introduce el nombre del jugador.');
    return;
  }

  const player={
    id:editingPlayerId??Date.now(),
    name:name,
    num:num,
    pos:document.getElementById('playerPos').value,
    available:
      document.getElementById('playerAvailable').value==='true',
    reason:
      document.getElementById('playerReason').value.trim(),
    min:numberValue('playerMin'),
    g:numberValue('playerGoals'),
    a:numberValue('playerAssists'),
    train:numberValue('playerTrain'),
    total:numberValue('playerTotal')
  };

  if(player.available){
    player.reason='';
  }

  if(player.train>player.total && player.total>0){
    player.total=player.train;
  }

  if(editingPlayerId===null){

    data.players.push(player);

  }else{

    const index=data.players.findIndex(
      p=>p.id===editingPlayerId
    );

    if(index!==-1){
      data.players[index]=player;
    }
  }

  save();
  closePlayerForm();
  render();
}

function deleteCurrentPlayer(){

  if(editingPlayerId===null){
    return;
  }

  const p=data.players.find(
    x=>x.id===editingPlayerId
  );

  if(!p){
    return;
  }

  const confirmed=confirm(
    `¿Seguro que quieres eliminar a ${p.name} de la plantilla?`
  );

  if(!confirmed){
    return;
  }

  data.players=data.players.filter(
    x=>x.id!==editingPlayerId
  );

  save();
  closePlayerForm();
  render();
}
