<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>KNATT</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
--red:#e21d2f;
--red2:#b90f20;
--dark:#0b0b0d;
--dark2:#17171a;
--bg:#f5f5f6;
--card:#fff;
--text:#17171a;
--muted:#77777e;
--line:#e6e6e9
}

html,body{
margin:0;
min-height:100%;
background:var(--bg)
}

body{
font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif;
color:var(--text)
}

button,input,select{font:inherit}
button{cursor:pointer}

.app{
width:min(560px,100%);
min-height:100vh;
margin:auto;
padding-bottom:82px
}

header{
background:var(--dark);
color:#fff;
padding:17px 18px
}

.header-row,.row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px
}

.brand{
font-size:27px;
font-weight:950;
letter-spacing:-1px
}

.brand span{color:#ff3b4d}

.role{
font-size:11px;
color:#aaa;
margin-top:2px;
font-weight:700
}

.header-bell{
width:38px;
height:38px;
border-radius:12px;
background:#ffffff10;
border:1px solid #ffffff12;
color:#fff
}

main{
padding:16px 14px 28px
}

.title{
font-size:25px;
font-weight:950;
letter-spacing:-.7px
}

.subtitle{
font-size:12px;
color:var(--muted);
font-weight:700;
margin-top:2px
}

.title-row{
display:flex;
align-items:center;
justify-content:space-between;
gap:10px;
margin:3px 2px 13px
}

.card{
background:var(--card);
border:1px solid var(--line);
border-radius:18px;
padding:16px;
margin-bottom:12px;
box-shadow:0 7px 24px #14141914
}

.card-dark{
background:var(--dark2);
color:#fff;
border-color:#2b2b30
}

.section-label{
font-size:10px;
text-transform:uppercase;
letter-spacing:.8px;
font-weight:900;
color:var(--muted);
margin-bottom:7px
}

.big{
font-size:21px;
font-weight:950
}

.muted{color:var(--muted)}
.small{font-size:12px}

.btn{
border:0;
border-radius:11px;
padding:12px 14px;
background:var(--red);
color:#fff;
font-weight:900;
font-size:13px
}

.btn.light{
background:#f0f0f2;
color:#222;
box-shadow:none
}

.btn.red-soft{
background:#fff0f2;
color:var(--red);
box-shadow:none
}

.btn.full{width:100%}

.stat-grid{
display:grid;
grid-template-columns:repeat(4,1fr);
gap:7px;
margin-bottom:13px
}

.stat{
background:#fff;
border:1px solid var(--line);
border-radius:15px;
padding:12px 8px;
text-align:center
}

.stat b{
display:block;
font-size:21px;
font-weight:950
}

.stat span{
display:block;
color:var(--muted);
font-size:10px;
font-weight:800;
margin-top:2px
}

.stat.red{
background:#fff0f2;
border-color:#ffd7dc
}

.stat.red b{color:var(--red)}

.tabs{
display:flex;
gap:6px;
overflow:auto;
margin-bottom:12px
}

.tab{
border:0;
border-radius:999px;
padding:9px 13px;
background:#e9e9ec;
color:#5e5e64;
font-size:11px;
font-weight:850;
white-space:nowrap
}

.tab.active{
background:var(--red);
color:#fff
}

.item{
display:flex;
align-items:center;
gap:10px;
padding:12px 0;
border-bottom:1px solid #ededf0
}

.item:last-child{border:0}

.avatar{
width:42px;
height:42px;
flex:0 0 42px;
border-radius:13px;
background:#ececef;
display:grid;
place-items:center;
font-size:20px
}

.grow{
flex:1;
min-width:0
}

.item b{font-size:13px}

.item .muted{
font-size:10px;
margin-top:2px
}

.form-group{
margin-bottom:12px
}

.form-group label{
display:block;
font-size:10px;
text-transform:uppercase;
letter-spacing:.7px;
font-weight:900;
color:var(--muted);
margin-bottom:6px
}

.form-input,.select{
width:100%;
border:1px solid var(--line);
background:#fafafa;
border-radius:11px;
padding:11px;
font-size:14px;
outline:none
}

.match-card{position:relative}

.versus{
display:flex;
align-items:center;
justify-content:center;
gap:18px;
margin:13px 0
}

.club{
width:90px;
text-align:center;
font-weight:900;
font-size:11px
}

.club-logo{
width:46px;
height:46px;
border-radius:13px;
background:#f0f0f2;
margin:0 auto 5px;
display:grid;
place-items:center;
font-size:21px
}

.vs{
font-weight:950;
color:#888
}

.more-screen{
background:var(--dark);
min-height:calc(100vh - 80px);
margin:-16px -14px -28px;
padding:16px 14px 30px;
color:#fff
}

.more-screen .title{color:#fff}

.more-menu{
display:grid;
gap:8px
}

.more-row{
display:flex;
align-items:center;
gap:11px;
width:100%;
border:1px solid #2b2b30;
background:#17171a;
color:#fff;
border-radius:13px;
padding:13px;
text-align:left
}

.more-icon{
width:30px;
height:30px;
border-radius:9px;
background:#242428;
display:grid;
place-items:center;
flex:0 0 30px
}

.more-text{
flex:1;
font-size:12px;
font-weight:850
}

.more-arrow{color:#8c8c92}

.tactic-toolbar{
display:grid;
grid-template-columns:1fr auto;
gap:8px;
align-items:end;
margin-bottom:12px
}

.pitch-wrap{
background:#e8e8ea;
border-radius:19px;
padding:8px;
margin-bottom:12px
}

.pitch{
position:relative;
width:100%;
aspect-ratio:68/105;
border-radius:14px;
overflow:hidden;
background:repeating-linear-gradient(
0deg,
#278247 0 9%,
#2d8b4f 9% 18%
);
touch-action:manipulation
}

.pitch:before{
content:"";
position:absolute;
inset:2.5%;
border:2px solid #fff9;
border-radius:8px
}

.pitch-line{
position:absolute;
left:2.5%;
right:2.5%;
top:50%;
border-top:2px solid #fff9
}

.pitch-circle{
position:absolute;
width:27%;
aspect-ratio:1;
border:2px solid #fff9;
border-radius:50%;
left:36.5%;
top:36.5%
}

.pitch-center{
position:absolute;
width:8px;
height:8px;
background:#fff;
border-radius:50%;
left:calc(50% - 4px);
top:calc(50% - 4px)
}

.box{
position:absolute;
left:20%;
width:60%;
height:16%;
border:2px solid #fff9
}

.box.top{top:2.5%}
.box.bottom{bottom:2.5%}

.goal{
position:absolute;
left:37%;
width:26%;
height:2.5%;
border:2px solid #fff;
background:#ffffff18
}

.goal.top{top:0}
.goal.bottom{bottom:0}

.tactic-slot{
position:absolute;
transform:translate(-50%,-50%);
width:clamp(68px,22vw,105px);
z-index:6;
text-align:center
}

.tactic-role{
display:inline-block;
background:var(--dark);
color:#fff;
border-radius:999px;
padding:4px 7px;
font-size:9px;
font-weight:900;
margin-bottom:3px
}

.player-selector{
position:relative;
width:100%
}

.player-selector-button{
display:flex;
align-items:center;
justify-content:space-between;
gap:4px;
width:100%;
height:36px;
border:3px solid var(--red);
border-radius:10px;
background:#fff;
color:var(--text);
padding:0 6px;
font-size:9px;
font-weight:900;
outline:none;
text-align:left
}

.player-selector-button .player-name{
min-width:0;
flex:1;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.player-selector-button .arrow{
flex:0 0 auto;
font-size:11px
}

.player-selector-menu{
display:none;
position:absolute;
left:0;
right:0;
top:40px;
background:#fff;
border:1px solid #ddd;
border-radius:9px;
box-shadow:0 7px 18px rgba(0,0,0,.22);
overflow:hidden;
z-index:100
}

.player-selector.open .player-selector-menu{
display:block
}

.player-selector.menu-up .player-selector-menu{
top:auto;
bottom:40px
}

.player-option{
display:block;
width:100%;
border:0;
border-bottom:1px solid #eee;
background:#fff;
color:var(--text);
padding:8px 7px;
font-size:9px;
font-weight:800;
text-align:left;
white-space:nowrap;
overflow:hidden;
text-overflow:ellipsis
}

.player-option:last-child{
border-bottom:0
}

.player-option.selected{
background:#fff0f2;
color:var(--red);
font-weight:950
}

.player-option:disabled{
color:#bbb;
background:#fafafa
}

.tactic-actions{
display:grid;
grid-template-columns:1fr 1fr;
gap:8px;
margin-bottom:12px
}

nav{
position:fixed;
bottom:0;
left:50%;
transform:translateX(-50%);
width:min(560px,100%);
display:flex;
justify-content:space-around;
background:#fffefeed;
backdrop-filter:blur(18px);
border-top:1px solid #dedee2;
padding:7px 3px calc(7px + env(safe-area-inset-bottom));
z-index:30;
box-shadow:0 -8px 25px #14141914
}

nav button{
background:none;
border:0;
color:#77777e;
font-size:10px;
font-weight:850;
padding:6px 4px;
min-width:52px;
border-radius:11px
}

nav button.active{
color:var(--red);
background:#fff0f2
}

nav .nav-icon{
font-size:18px;
line-height:18px;
margin-bottom:2px
}
</style>
</head>

<body>

<div class="app">
<header>
<div class="header-row">
<div>
<div class="brand">⚽ <span>KNATT</span></div>
<div class="role">Tu equipo, en una sola app</div>
</div>
<button class="header-bell" onclick="alert('No tienes nuevas notificaciones.')">🔔</button>
</div>
</header>

<main id="content"></main>
<nav id="nav"></nav>
</div>

<script>
const KEY='teamhub-v2';

let data=JSON.parse(localStorage.getItem(KEY)||'null')||{
players:[
{id:1,name:'Montiimontys',num:9,pos:'DC',available:true,reason:'',min:1126,g:12,a:6},
{id:2,name:'Marc',num:7,pos:'MC',available:true,reason:'',min:1030,g:5,a:8},
{id:3,name:'Juan',num:4,pos:'DFC',available:true,reason:'',min:980,g:4,a:3},
{id:4,name:'Alex',num:1,pos:'POR',available:true,reason:'',min:1260,g:0,a:1},
{id:5,name:'Pedro',num:3,pos:'LI',available:true,reason:'',min:640,g:1,a:2}
],
next:{opponent:'CD Rival',date:'Domingo, 24 de agosto',time:'12:00',place:'Campo Municipal'},
matches:[
{date:'17 AGO',home:'KNATT FC',away:'UD Ejemplo',score:'2 - 1'},
{date:'10 AGO',home:'CD Prueba',away:'KNATT FC',score:'0 - 3'}
],
tactics:{formation:'4-3-3',positions:{},savedLineup:[]},
settings:{coach:'',team:'KNATT FC',season:'2026/27',category:'Primer Equipo'}
};

if(!Array.isArray(data.players)) data.players=[];
if(!data.tactics) data.tactics={};
if(!data.tactics.positions) data.tactics.positions={};
if(!data.settings) data.settings={team:'KNATT FC',season:'2026/27',category:'Primer Equipo'};

localStorage.setItem(KEY,JSON.stringify(data));

let section='home',filter='all',selectedPlayerId=null;

const formations={
'4-3-3':[['POR',50,92],['LI',18,76],['DFC',40,80],['DFC',60,80],['LD',82,76],['MC',28,60],['MC',50,58],['MC',72,60],['EI',18,35],['DC',50,24],['ED',82,35]],
'4-4-2':[['POR',50,92],['LI',18,76],['DFC',40,80],['DFC',60,80],['LD',82,76],['MI',18,57],['MC',40,57],['MC',60,57],['MD',82,57],['DC',38,27],['DC',62,27]],
'4-2-3-1':[['POR',50,92],['LI',18,76],['DFC',40,80],['DFC',60,80],['LD',82,76],['MCD',38,63],['MCD',62,63],['EI',18,43],['MCO',50,45],['ED',82,43],['DC',50,24]],
'3-5-2':[['POR',50,92],['DFC',27,78],['DFC',50,82],['DFC',73,78],['MI',12,57],['MC',32,58],['MCO',50,50],['MC',68,58],['MD',88,57],['DC',38,27],['DC',62,27]],
'3-4-3':[['POR',50,92],['DFC',27,80],['DFC',50,83],['DFC',73,80],['MI',18,59],['MC',40,59],['MC',60,59],['MD',82,59],['EI',18,33],['DC',50,24],['ED',82,33]],
'5-3-2':[['POR',50,92],['LI',10,73],['DFC',30,79],['DFC',50,82],['DFC',70,79],['LD',90,73],['MC',30,58],['MC',50,55],['MC',70,58],['DC',38,27],['DC',62,27]],
'4-5-1':[['POR',50,92],['LI',18,76],['DFC',40,80],['DFC',60,80],['LD',82,76],['MI',12,57],['MC',31,57],['MCO',50,53],['MC',69,57],['MD',88,57],['DC',50,24]]
};

function save(){ localStorage.setItem(KEY,JSON.stringify(data)); }

function esc(s){
return String(s??'').replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));
}

function go(s){
section=s;
selectedPlayerId=null;
scrollTo(0,0);
render();
}

function navItems(){
return [['home','⌂','Inicio'],['team','♟','Plantilla'],['tactic','⚽','Táctica'],['matches','🏆','Partidos'],['more','☰','Más']];
}

function render(){
document.getElementById('nav').innerHTML=navItems().map(x=>`<button class="${section===x[0]?'active':''}" onclick="go('${x[0]}')"><div class="nav-icon">${x[1]}</div>${x[2]}</button>`).join('');
let c=document.getElementById('content');
c.innerHTML=section==='home'?home():section==='team'?team():section==='player'?playerProfile():section==='tactic'?tactic():section==='matches'?matches():section==='more'?more():section==='stats'?stats():settings();
}

function home(){
let a=data.players.filter(p=>p.available).length;
return `
<div class="title-row"><div><div class="title">¡Buenos días!</div><div class="subtitle">${esc(data.settings.team||'KNATT FC')}</div></div></div>
<div class="card">
<div class="section-label">PRÓXIMO PARTIDO</div>
<div class="big">${esc(data.next.date)}</div>
<div class="muted small">${esc(data.next.time)} · ${esc(data.next.place)}</div>
<div class="versus">
<div class="club"><div class="club-logo">⚽</div>${esc(data.settings.team||'KNATT FC')}</div>
<div class="vs">VS</div>
<div class="club"><div class="club-logo">🛡️</div>${esc(data.next.opponent)}</div>
</div>
<button class="btn full" onclick="go('tactic')">Abrir Táctica</button>
</div>
<div class="card card-dark">
<div class="section-label">ESTADO DEL EQUIPO</div>
<div class="stat-grid">
<div><b>${data.players.length}</b><span>Jugadores</span></div>
<div><b>${a}</b><span>Disponibles</span></div>
<div><b>${data.players.length-a}</b><span>Ausentes</span></div>
<div><b>${data.matches.length}</b><span>Partidos</span></div>
</div>
</div>`;
}

function team(){
let list=data.players.filter(p=>filter==='all'||(filter==='available'?p.available:!p.available));
return `
<div class="title-row">
<div><div class="title">Plantilla</div><div class="subtitle">${data.players.length} jugadores</div></div>
<button class="btn red-soft" onclick="addPlayer()">＋</button>
</div>
<div class="tabs">
<button class="tab ${filter==='all'?'active':''}" onclick="filter='all';render()">Todos</button>
<button class="tab ${filter==='available'?'active':''}" onclick="filter='available';render()">Disponibles</button>
<button class="tab ${filter==='absent'?'active':''}" onclick="filter='absent';render()">Ausentes</button>
</div>
<div class="card">
${list.map(p=>`<div class="item" onclick="openPlayer(${p.id})">
<div class="avatar">${p.pos==='POR'?'🧤':'⚽'}</div>
<div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.pos)} · ${p.available?'Disponible':esc(p.reason||'No disponible')}</div></div>
<span>›</span>
</div>`).join('')||'<div class="muted">No hay jugadores.</div>'}
</div>`;
}

function openPlayer(id){ selectedPlayerId=id; section='player'; render(); }

function playerProfile(){
let p=data.players.find(x=>String(x.id)===String(selectedPlayerId));
if(!p) return '<div class="card">Jugador no encontrado</div>';
return `
<button class="btn light" onclick="go('team')">← Plantilla</button>
<div class="card" style="margin-top:12px">
<div class="section-label">JUGADOR</div>
<div class="big">${esc(p.name)}</div>
<div class="muted">${esc(p.pos)} · #${esc(p.num)}</div>
</div>
<div class="stat-grid">
<div class="stat"><b>${p.min||0}</b><span>Minutos</span></div>
<div class="stat red"><b>${p.g||0}</b><span>Goles</span></div>
<div class="stat"><b>${p.a||0}</b><span>Asistencias</span></div>
<div class="stat"><b>#${esc(p.num)}</b><span>Dorsal</span></div>
</div>
<div class="card">
<button class="btn full" onclick="editPlayer()">✏️ Editar jugador</button><br><br>
<button class="btn light full" onclick="deletePlayer(${p.id})">🗑️ Eliminar jugador</button>
</div>`;
}

function addPlayer(){
let name=prompt('Nombre del jugador:');
if(!name||!name.trim())return;
let num=prompt('Número de camiseta:','');
if(num===null)return;
let pos=prompt('Posición:','');
if(pos===null)return;

data.players.push({
id:Date.now(),
name:name.trim(),
num:num.trim()||'-',
pos:pos.trim()||'Jugador',
available:true,reason:'',min:0,g:0,a:0
});
save(); render();
}

function editPlayer(){
let p=data.players.find(x=>String(x.id)===String(selectedPlayerId));
if(!p)return;
let name=prompt('Nombre del jugador:',p.name);
if(name===null)return;
let num=prompt('Número de camiseta:',p.num);
if(num===null)return;
let pos=prompt('Posición:',p.pos);
if(pos===null)return;

p.name=name.trim()||p.name;
p.num=num.trim()||p.num;
p.pos=pos.trim()||p.pos;
save(); render();
}

function deletePlayer(id){
if(!confirm('¿Eliminar este jugador?'))return;
data.players=data.players.filter(p=>String(p.id)!==String(id));
Object.keys(data.tactics.positions).forEach(k=>{
if(String(data.tactics.positions[k]?.playerId)===String(id)) delete data.tactics.positions[k];
});
save(); go('team');
}

function matches(){
return `
<div class="title">Partidos</div>
<div class="card match-card">
<div class="section-label">PRÓXIMO PARTIDO</div>
<div class="muted small">${esc(data.next.date)} · ${esc(data.next.time)}</div>
<div class="versus">
<div class="club"><div class="club-logo">⚽</div>${esc(data.settings.team||'KNATT FC')}</div>
<div class="vs">VS</div>
<div class="club"><div class="club-logo">🛡️</div>${esc(data.next.opponent)}</div>
</div>
<div class="muted small" style="text-align:center">${esc(data.next.place)}</div>
</div>
${data.matches.map(m=>`<div class="card"><div class="muted small">${esc(m.date)}</div><div class="versus"><div class="club">${esc(m.home)}</div><div class="vs">${esc(m.score)}</div><div class="club">${esc(m.away)}</div></div></div>`).join('')}`;
}

function more(){
return `
<div class="more-screen">
<div class="title">Más</div>
<div class="more-menu">
<button class="more-row" onclick="go('stats')"><div class="more-icon">📊</div><div class="more-text">Estadísticas</div><div class="more-arrow">›</div></button>
<button class="more-row" onclick="go('tactic')"><div class="more-icon">⚽</div><div class="more-text">Táctica</div><div class="more-arrow">›</div></button>
<button class="more-row" onclick="go('settings')"><div class="more-icon">⚙️</div><div class="more-text">Configuración</div><div class="more-arrow">›</div></button>
</div>
</div>`;
}

function stats(){
let g=data.players.reduce((s,p)=>s+(Number(p.g)||0),0);
let a=data.players.reduce((s,p)=>s+(Number(p.a)||0),0);
return `
<div class="title">Estadísticas</div>
<div class="stat-grid">
<div class="stat red"><b>${g}</b><span>Goles</span></div>
<div class="stat"><b>${a}</b><span>Asistencias</span></div>
<div class="stat"><b>${data.players.length}</b><span>Jugadores</span></div>
<div class="stat"><b>${data.matches.length}</b><span>Partidos</span></div>
</div>
<div class="card">
${data.players.map(p=>`<div class="item">
<div class="avatar">⚽</div>
<div class="grow"><b>${esc(p.name)}</b><div class="muted">${esc(p.pos)}</div></div>
<div><b>${p.g||0} ⚽</b><div class="muted">${p.a||0} 🎯</div></div>
</div>`).join('')}
</div>`;
}

function settings(){
return `
<div class="title">Configuración</div>
<div class="card">
<div class="form-group"><label>Entrenador</label><input id="coach" class="form-input" value="${esc(data.settings.coach||'')}"></div>
<div class="form-group"><label>Equipo</label><input id="team" class="form-input" value="${esc(data.settings.team||'KNATT FC')}"></div>
<div class="form-group"><label>Temporada</label><input id="season" class="form-input" value="${esc(data.settings.season||'2026/27')}"></div>
<button class="btn full" onclick="saveSettings()">💾 Guardar</button>
</div>`;
}

function saveSettings(){
data.settings.coach=document.getElementById('coach').value.trim();
data.settings.team=document.getElementById('team').value.trim()||'KNATT FC';
data.settings.season=document.getElementById('season').value.trim()||'2026/27';
save(); go('home');
}

function tactic(){
let formation=data.tactics.formation||'4-3-3';
let spots=formations[formation];
let positions=data.tactics.positions||{};
return `
<div class="title-row"><div><div class="title">Táctica</div></div></div>
<div class="tactic-toolbar">
<select class="select" onchange="changeFormation(this.value)">
${Object.keys(formations).map(f=>`<option value="${f}" ${f===formation?'selected':''}>${f}</option>`).join('')}
</select>
<button class="btn light" onclick="clearTactic()">Vaciar</button>
</div>
<div class="pitch-wrap">
<div class="pitch">
<div class="pitch-line"></div><div class="pitch-circle"></div><div class="pitch-center"></div>
<div class="box top"></div><div class="box bottom"></div>
<div class="goal top"></div><div class="goal bottom"></div>
${spots.map((s,i)=>slotHtml(s,i,positions)).join('')}
</div>
</div>
<div class="tactic-actions">
<button class="btn" onclick="saveTactic()">💾 Guardar</button>
<button class="btn light" onclick="resetTactic()">↺ Reset</button>
</div>`;
}

function slotHtml(spot,index,positions){
let role=spot[0],x=spot[1],y=spot[2];
let selected=String(positions[String(index)]?.playerId||'');
let player=data.players.find(p=>String(p.id)===selected);
let name=player?esc(player.name):'Seleccionar jugador';
return `
<div class="tactic-slot" id="tactic-slot-${index}" style="left:${x}%;top:${y}%">
<div class="tactic-role">${role}</div>
<div class="player-selector" id="player-selector-${index}">
<button type="button" class="player-selector-button" onclick="togglePlayerMenu(${index},event)">
<span class="player-name">${name}</span>
<span class="arrow">⌄</span>
</button>
<div class="player-selector-menu">${playerOptions(selected,index)}</div>
</div>
</div>`;
}

function playerOptions(selected,index){
let used=new Set(Object.values(data.tactics.positions||{}).map(v=>String(v?.playerId||'')).filter(Boolean));
return `
<button type="button" class="player-option ${selected===''?'selected':''}" onclick="assignPosition(${index},'')">Seleccionar jugador</button>`+
data.players.map(p=>{
let id=String(p.id);
return `<button type="button" class="player-option ${id===selected?'selected':''}" ${used.has(id)&&id!==selected?'disabled':''} onclick="assignPosition(${index},'${id}')">${esc(p.name)}</button>`;
}).join('');
}

function togglePlayerMenu(index,event){
if(event)event.stopPropagation();
let selector=document.getElementById('player-selector-'+index);
if(!selector)return;
let wasOpen=selector.classList.contains('open');
document.querySelectorAll('.player-selector.open').forEach(el=>{
el.classList.remove('open');
el.classList.remove('menu-up');
});
if(wasOpen)return;
let slot=document.getElementById('tactic-slot-'+index);
let rect=slot?slot.getBoundingClientRect():null;
if(rect&&rect.bottom>window.innerHeight-170){
selector.classList.add('menu-up');
}
selector.classList.add('open');
}

function closePlayerMenus(){
document.querySelectorAll('.player-selector.open').forEach(el=>{
el.classList.remove('open');
el.classList.remove('menu-up');
});
}

function assignPosition(index,id){
id=String(id||'');
if(!id){
delete data.tactics.positions[String(index)];
save(); closePlayerMenus(); render();
return;
}
let duplicate=Object.entries(data.tactics.positions).some(([k,v])=>k!==String(index)&&String(v?.playerId)===id);
if(duplicate){
alert('Ese jugador ya está colocado en otra posición.');
return;
}
data.tactics.positions[String(index)]={playerId:id};
save(); closePlayerMenus(); render();
}

document.addEventListener('click',e=>{
if(!e.target.closest('.player-selector')) closePlayerMenus();
});

function changeFormation(f){
data.tactics.formation=f;
data.tactics.positions={};
save(); render();
}

function resetTactic(){
let spots=formations[data.tactics.formation||'4-3-3'];
let next={};
data.players.slice(0,11).forEach((p,i)=>{
if(spots[i]){ next[String(i)]={playerId:String(p.id)}; }
});
data.tactics.positions=next;
save(); render();
}

function clearTactic(){
data.tactics.positions={};
save(); render();
}

function saveTactic(){
data.tactics.savedLineup=Object.values(data.tactics.positions).map(v=>v.playerId);
save();
alert('Alineación guardada correctamente.');
}

render();
</script>
</body>
</html>
