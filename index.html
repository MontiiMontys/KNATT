<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">

<meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>

<title>KNATT</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green:#123c2d;
  --green-2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#fff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
  --danger:#d95c5c;
  --warning:#e4a936;
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

button,
select,
input{
  font-family:inherit;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:96px;
}

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--green),#0d2d22);
  color:#fff;
  padding:26px 20px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #0c2d2225;
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  right:-75px;
  top:-90px;
  background:#b9e86c12;
}

.brand{
  position:relative;
  z-index:2;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand span{
  color:var(--lime);
}

.role{
  position:relative;
  z-index:2;
  opacity:.78;
  font-size:13px;
  margin-top:5px;
  font-weight:600;
}

main{
  padding:20px 16px 30px;
}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin:2px 0 16px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 7px 25px #10221b0b;
}

.hero{
  background:linear-gradient(145deg,var(--green),var(--green-2));
  color:#fff;
  border:0;
  padding:20px;
  box-shadow:0 12px 30px #123c2d22;
}

.hero .muted{
  color:#c8d8d1;
}

.hero .big{
  color:#fff;
}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 0;
}

.team-ball{
  width:50px;
  height:50px;
  border-radius:16px;
  background:#ffffff18;
  display:grid;
  place-items:center;
  font-size:25px;
}

.match-info{
  flex:1;
}

.match-date{
  font-weight:800;
  font-size:14px;
}

.match-place{
  color:#c8d8d1;
  font-size:13px;
  margin-top:3px;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
  box-shadow:0 6px 20px #10221b08;
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
  letter-spacing:-1px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.stat.accent b{
  color:#315d18;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px;
}

.grow{
  flex:1;
  min-width:0;
}

.pill{
  display:inline-flex;
  align-items:center;
  gap:5px;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20;
}

.pill.danger{
  background:#fae9e9;
  color:#b44343;
}

.pill.warning{
  background:#fff2d7;
  color:#986d18;
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  background:var(--green);
  color:#fff;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
  box-shadow:0 5px 12px #123c2d20;
}

.btn.light{
  background:#e9efec;
  color:var(--green);
  box-shadow:none;
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.full{
  width:100%;
}

.choice{
  display:flex;
  gap:8px;
}

.choice button{
  flex:1;
}

.add-player{
  margin-bottom:14px;
}

.add-player .btn{
  width:100%;
}

.delete-btn{
  border:0;
  background:#fae9e9;
  color:#b44343;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:17px;
  font-weight:900;
  cursor:pointer;
  flex:0 0 38px;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:#fff;
}

.notice{
  background:#edf6df;
  color:#36561f;
  border-radius:17px;
  padding:14px;
  font-size:13px;
  font-weight:700;
}

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.form-input{
  width:100%;
  border:1px solid var(--line);
  background:#f8faf9;
  color:var(--text);
  border-radius:14px;
  padding:13px;
  font-size:15px;
  outline:none;
}

.form-input:focus{
  border-color:#a9c99a;
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffee;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -8px 30px #10221b0c;
}

nav button{
  position:relative;
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 5px;
  min-width:52px;
  border-radius:13px;
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef;
}


/* =========================================================
   TÁCTICA
========================================================= */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:14px;
}

.select-wrap{
  flex:1;
}

.select-wrap label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

.select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:14px;
  padding:12px;
  font-size:15px;
  font-weight:800;
  outline:none;
}

.pitch-wrap{
  background:#dfe9e2;
  border-radius:24px;
  padding:10px;
  margin-bottom:14px;
  box-shadow:0 8px 25px #10221b10;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:18px;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #2d8a52 0 8.33%,
      #338f56 8.33% 16.66%,
      #2d8a52 16.66% 25%,
      #338f56 25% 33.33%,
      #2d8a52 33.33% 41.66%,
      #338f56 41.66% 50%,
      #2d8a52 50% 58.33%,
      #338f56 58.33% 66.66%,
      #2d8a52 66.66% 75%,
      #338f56 75% 83.33%,
      #2d8a52 83.33% 91.66%,
      #338f56 91.66% 100%
    );
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #fff8;
  border-radius:10px;
  pointer-events:none;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #fff8;
  pointer-events:none;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #fff8;
  border-radius:50%;
  left:36.5%;
  top:36.5%;
  pointer-events:none;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
  opacity:.85;
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #fff8;
  pointer-events:none;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18;
  pointer-events:none;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}


/* =========================================================
   NUEVAS POSICIONES TÁCTICAS
========================================================= */

/*
  Cada posición es una caja fija.
  La etiqueta oscura indica la posición.
  El desplegable va debajo.
  El jugador seleccionado se muestra
  directamente en el desplegable.
*/

.position-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:112px;
  min-width:0;
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:5;
}

.position-role{
  background:var(--green);
  color:#fff;
  border-radius:999px;
  min-width:58px;
  max-width:100%;
  padding:8px 11px;
  text-align:center;
  font-size:12px;
  font-weight:900;
  line-height:1;
  box-shadow:0 5px 12px #10221b30;
  margin-bottom:6px;
  white-space:nowrap;
}

.position-select{
  width:100%;
  max-width:112px;
  min-width:0;
  border:3px solid var(--lime);
  background:#fff;
  color:var(--text);
  border-radius:15px;
  padding:9px 24px 9px 9px;
  font-size:12px;
  font-weight:900;
  outline:none;
  text-overflow:ellipsis;
  overflow:hidden;
}

.position-select:focus{
  border-color:#8fc24a;
}

.position-select option{
  font-size:14px;
}

.position-name{
  width:100%;
  max-width:112px;
  margin-top:5px;
  background:#ffffffee;
  color:var(--text);
  border-radius:13px;
  padding:6px 7px;
  text-align:center;
  font-size:11px;
  font-weight:900;
  line-height:1.15;
  overflow-wrap:anywhere;
  word-break:break-word;
  box-shadow:0 3px 10px #10221b20;
}

.position-name.empty{
  display:none;
}


/*
  El desplegable se mantiene dentro del campo.
  En móvil reducimos un poco su tamaño.
*/

@media(max-width:380px){

  .position-slot{
    width:96px;
  }

  .position-select{
    max-width:96px;
    font-size:11px;
    padding-left:7px;
    padding-right:20px;
  }

  .position-role{
    font-size:11px;
    padding:7px 9px;
  }

  .position-name{
    max-width:96px;
    font-size:10px;
  }

}


/* =========================================================
   ALINEACIÓN RESUMEN
========================================================= */

.lineup-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:20px;
  padding:16px;
  margin-bottom:14px;
}

.lineup-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #edf1ef;
}

.lineup-row:last-child{
  border-bottom:0;
}

.lineup-position{
  flex:0 0 auto;
  background:var(--green);
  color:#fff;
  border-radius:999px;
  padding:7px 10px;
  font-size:11px;
  font-weight:900;
}

.lineup-player{
  font-weight:800;
  font-size:14px;
  overflow-wrap:anywhere;
}


/* =========================================================
   ACCIONES TÁCTICAS
========================================================= */

.tactic-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.formation-help{
  font-size:12px;
  color:var(--muted);
  margin-top:8px;
}


@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .big{
    font-size:20px;
  }

  .brand{
    font-size:27px;
  }

  nav button{
    min-width:48px;
    padding-left:3px;
    padding-right:3px;
  }

}

</style>

</head>

   DATOS
========================================================= */

const KEY='teamhub-v2';

let data;


try{

  const saved=localStorage.getItem(KEY);

  data=saved?JSON.parse(saved):null;

}catch(error){

  console.error(error);

  data=null;

}


if(!data || typeof data!=='object'){

  data={

    players:[

      {

        reason:'Lesión',
        min:640,
        g:1,
        a:2
      }

    ],

    next:{
      opponent:'CD Rival',
      date:'Domingo 23 de agosto',
      time:'12:00',
      place:'Campo Municipal'
    },

    tactics:{
      formation:'4-3-3',
      lineup:[]
    },

    settings:{
      coach:'',
      team:'KNATT FC',
      season:'2026/27',
      category:'Primer Equipo'
    }

  };

}


/* =========================================================
   REPARAR DATOS
========================================================= */

if(!Array.isArray(data.players)){
  data.players=[];
}


data.players=data.players.map((p,index)=>({

  id:p?.id??Date.now()+index,

  name:
    typeof p?.name==='string' &&
    p.name.trim()
    ?p.name
    :'Jugador',

  num:
    p?.num!==undefined &&
    p?.num!==null &&
    String(p.num).trim()!==''
    ?p.num
    :'-',

  pos:
    typeof p?.pos==='string' &&
    p.pos.trim()
    ?p.pos
    :'Jugador',

  available:
    typeof p?.available==='boolean'
    ?p.available
    :true,

  reason:
    typeof p?.reason==='string'
    ?p.reason
    :'',

  min:
    Number.isFinite(Number(p?.min))
    ?Math.max(0,Number(p.min))
    :0,

  g:
    Number.isFinite(Number(p?.g))
    ?Math.max(0,Number(p.g))
    :0,

  a:
    Number.isFinite(Number(p?.a))
    ?Math.max(0,Number(p.a))
    :0

}));


if(!data.next || typeof data.next!=='object'){
  data.next={};
}

data.next.opponent=
  data.next.opponent||
  'CD Rival';

data.next.date=
  data.next.date||
  'Próximo partido';

data.next.time=
  data.next.time||
  '12:00';

data.next.place=
  data.next.place||
  'Campo Municipal';


if(!data.tactics || typeof data.tactics!=='object'){
  data.tactics={};
}

data.tactics.formation=
  data.tactics.formation||
  '4-3-3';


/*
  Convertimos cualquier alineación antigua
  a la nueva estructura.
*/

if(!Array.isArray(data.tactics.lineup)){

  if(Array.isArray(data.tactics.savedLineup)){

    data.tactics.lineup=
      data.tactics.savedLineup.map(
        x=>String(x)
      );

  }else{

    data.tactics.lineup=[];

  }

}


if(!data.settings || typeof data.settings!=='object'){
  data.settings={};
}

data.settings.coach=
  data.settings.coach||'';

data.settings.team=
  data.settings.team||'KNATT FC';

data.settings.season=
  data.settings.season||'2026/27';

data.settings.category=
  data.settings.category||'Primer Equipo';


localStorage.setItem(
  KEY,
  JSON.stringify(data)
);

   ESTADO
========================================================= */

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


function go(s){

  section=s;

  selectedPlayerId=null;

  render();

}


function getSelectedPlayer(){

  return data.players.find(
    p=>String(p.id)===String(selectedPlayerId)
  );

}


function navItems(){

  return [

    ['home','🏠','Inicio'],

    ['team','👥','Plantilla'],

    ['tactic','🧠','Táctica'],

    ['matches','🏆','Partidos'],

    ['stats','📊','Stats'],

    ['settings','⚙️','Config.']

  ];

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  document.getElementById('nav').innerHTML=

    navItems()
    .map(x=>`

      <button
        class="${section===x[0]?'active':''}"
        onclick="go('${x[0]}')">

        ${x[1]}<br>${x[2]}

      </button>

    `)
    .join('');


  const c=document.getElementById('content');

  c.innerHTML='';


  if(section==='home'){
    c.innerHTML=home();
  }

  if(section==='team'){
    c.innerHTML=team();
  }

  if(section==='player'){
    c.innerHTML=playerProfile();
  }

  if(section==='tactic'){
    c.innerHTML=tactic();
  }

  if(section==='matches'){
    c.innerHTML=matches();
  }

  if(section==='stats'){
    c.innerHTML=stats();
  }

  if(section==='settings'){
    c.innerHTML=settings();
  }

}


/* =========================================================
   JUGADORES
========================================================= */

function openPlayer(id){

  selectedPlayerId=id;

  section='player';

  render();

}


function editPlayer(){

  const p=getSelectedPlayer();

  if(!p){
    return;
  }


  const name=prompt(
    'Nombre del jugador:',
    p.name
  );

  if(name===null){
    return;
  }


  const num=prompt(
    'Número de camiseta:',
    p.num
  );

  if(num===null){
    return;
  }


  const pos=prompt(
    'Posición:',
    p.pos
  );

  if(pos===null){
    return;
  }


  const available=confirm(
    '¿Está disponible para jugar?\n\nAceptar = Sí\nCancelar = No'
  );


  let reason='';


  if(!available){

    const r=prompt(
      'Motivo de la ausencia:',
      p.reason||''
    );

    if(r!==null){
      reason=r.trim();
    }

  }


  const min=prompt(
    'Minutos jugados:',
    p.min
  );

  if(min===null){
    return;
  }


  const goals=prompt(
    'Goles:',
    p.g
  );

  if(goals===null){
    return;
  }


  const assists=prompt(
    'Asistencias:',
    p.a
  );

  if(assists===null){
    return;
  }


  p.name=name.trim()||p.name;

  p.num=num.trim()||p.num;

  p.pos=pos.trim()||p.pos;

  p.available=available;

  p.reason=reason;

  p.min=Math.max(0,Number(min)||0);

  p.g=Math.max(0,Number(goals)||0);

  p.a=Math.max(0,Number(assists)||0);


  save();

  render();

}


function addPlayer(){

  const name=prompt(
    'Nombre del jugador:'
  );

  if(!name || !name.trim()){
    return;
  }


  const num=prompt(
    'Número de camiseta:',
    ''
  );

  if(num===null){
    return;
  }


  const pos=prompt(
    'Posición:',
    ''
  );

  if(pos===null){
    return;
  }


  data.players.push({

    id:Date.now(),

    name:name.trim(),

    num:num.trim()||'-',

    pos:pos.trim()||'Jugador',

    available:true,

    reason:'',

    min:0,

    g:0,

    a:0

  });


  save();

  section='team';

  render();

}


function deletePlayer(id){

  const player=data.players.find(
    p=>String(p.id)===String(id)
  );

  if(!player){
    return;
  }


  if(!confirm(
    '¿Seguro que quieres eliminar a '+
    player.name+
    ' de la plantilla?'
  )){
    return;
  }


  data.players=data.players.filter(
    p=>String(p.id)!==String(id)
  );


  data.tactics.lineup=
    data.tactics.lineup.filter(
      x=>String(x)!==String(id)
    );


  save();

  selectedPlayerId=null;

  section='team';

  render();

}

/* =========================================================
   POSICIÓN INDIVIDUAL
========================================================= */

function positionSlot(
  spot,
  index,
  lineup
){

  const role=spot[0];

  const x=spot[1];

  const y=spot[2];

  const selectedId=
    lineup[index]||'';


  const player=
    data.players.find(
      p=>String(p.id)===String(selectedId)
    );


  return `

    <div
      class="position-slot"
      style="
        left:${x}%;
        top:${y}%
      ">


      <div class="position-role">

        ${escapeHtml(role)}

      </div>


      <select
        class="position-select"
        data-position-index="${index}"
        onchange="selectPosition(${index},this.value)"
        aria-label="Jugador para ${escapeHtml(role)}">


        <option value="">

          -- ${escapeHtml(role)} --

        </option>


        ${
          data.players
          .map(
            p=>`

              <option
                value="${p.id}"
                ${
                  String(p.id)===String(selectedId)
                  ?'selected'
                  :''
                }>

                ${escapeHtml(p.name)}

              </option>

            `
          )
          .join('')

        }

      </select>


      <div
        class="position-name ${
          player
          ?''
          :'empty'
        }">

        ${
          player
          ?escapeHtml(player.name)
          :''
        }

      </div>

    </div>

  `;

}


/* =========================================================
   SELECCIONAR JUGADOR
========================================================= */

function selectPosition(
  index,
  playerId
){

  playerId=
    String(playerId||'');


  /*
    Si se deja vacío,
    eliminamos esa posición.
  */

  if(!playerId){

    data.tactics.lineup[index]='';

    save();

    render();

    return;

  }


  /*
    Un jugador no puede ocupar
    dos posiciones simultáneamente.
  */

  const existingIndex=
    data.tactics.lineup.findIndex(
      (id,i)=>
        i!==index &&
        String(id)===playerId
    );


  if(existingIndex!==-1){

    /*
      Intercambiamos los jugadores
      para que la selección sea cómoda.
    */

    const current=
      data.tactics.lineup[index]||'';


    data.tactics.lineup[index]=
      data.tactics.lineup[existingIndex];


    data.tactics.lineup[existingIndex]=
      current;


  }else{

    data.tactics.lineup[index]=
      playerId;

  }


  /*
    Aseguramos que siempre haya
    exactamente 11 posiciones.
  */

  while(
    data.tactics.lineup.length<
    formations[data.tactics.formation].length
  ){

    data.tactics.lineup.push('');

  }


  save();

  render();

}


/* =========================================================
   CAMBIAR FORMACION
========================================================= */

function changeFormation(
  formation
){

  if(!formations[formation]){
    return;
  }


  data.tactics.formation=
    formation;


  const spots=
    formations[formation];


  const oldLineup=
    Array.isArray(data.tactics.lineup)
    ?data.tactics.lineup
    :[];


  /*
    Intentamos conservar jugadores.
    Si hay más posiciones nuevas,
    las dejamos vacías.
  */

  data.tactics.lineup=
    spots.map(
      (_,index)=>
        oldLineup[index]||''
    );


  save();

  render();

}


/* =========================================================
   RESET TÁCTICA
========================================================= */

function resetTactic(){

  const spots=
    formations[data.tactics.formation];


  /*
    Reset deja las 11 posiciones
    vacías.
  */

  data.tactics.lineup=
    spots.map(
      ()=>''
    );


  save();

  render();

}


/* =========================================================
   VACIAR CAMPO
========================================================= */

function clearTactic(){

  data.tactics.lineup=
    formations[data.tactics.formation]
    .map(
      ()=>''
    );


  save();

  render();

}


/* =========================================================
   GUARDAR ALINEACIÓN
========================================================= */

function saveTactic(){

  const count=
    data.tactics.lineup.filter(
      Boolean
    ).length;


  save();


  alert(
    'Alineación guardada correctamente.\n\n'+
    count+
    ' de 11 posiciones seleccionadas.'
  );

}

/* =========================================================
   CONFIGURACIÓN
========================================================= */

function settings(){

  return `

    <div class="title">
      Configuración
    </div>


    <div class="card">

      <div class="section-label">
        PERFIL DEL ENTRENADOR
      </div>


      <div class="form-group">

        <label>
          Nombre
        </label>


        <input
          id="coachName"
          class="form-input"
          value="${escapeHtml(data.settings.coach)}"
          placeholder="Nombre del entrenador">

      </div>


      <button
        class="btn lime full"
        onclick="saveSettings()">

        💾
        Guardar cambios

      </button>

    </div>


    <div class="card">

      <div class="section-label">
        EQUIPO
      </div>


      <div class="form-group">

        <label>
          Equipo
        </label>


        <input
          id="teamName"
          class="form-input"
          value="${escapeHtml(data.settings.team)}">

      </div>


      <div class="form-group">

        <label>
          Temporada
        </label>


        <input
          id="seasonName"
          class="form-input"
          value="${escapeHtml(data.settings.season)}">

      </div>


      <div class="form-group">

        <label>
          Categoría
        </label>


        <input
          id="categoryName"
          class="form-input"
          value="${escapeHtml(data.settings.category)}">

      </div>


      <button
        class="btn full"
        onclick="saveSettings()">

        Guardar equipo

      </button>

    </div>


    <div class="card">

      <div class="section-label">
        DATOS
      </div>


      <div class="muted small">

        Los datos de KNATT se guardan
        localmente en este dispositivo.

      </div>


      <br>


      <button
        class="btn light full"
        onclick="exportData()">

        📤
        Exportar datos

      </button>


      <br><br>


      <button
        class="btn light full"
        onclick="resetApp()">

        ♻️
        Restaurar datos de ejemplo

      </button>

    </div>

  `;

}


/* =========================================================
   GUARDAR CONFIGURACIÓN
========================================================= */

function saveSettings(){

  data.settings.coach=
    document
    .getElementById('coachName')
    .value
    .trim();


  data.settings.team=
    document
    .getElementById('teamName')
    .value
    .trim()||
    'KNATT FC';


  data.settings.season=
    document
    .getElementById('seasonName')
    .value
    .trim()||
    '2026/27';


  data.settings.category=
    document
    .getElementById('categoryName')
    .value
    .trim()||
    'Primer Equipo';


  save();

  render();

}


/* =========================================================
   EXPORTAR
========================================================= */

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );


  const url=
    URL.createObjectURL(blob);


  const a=
    document.createElement('a');


  a.href=url;

  a.download=
    'knatt-datos.json';


  a.click();


  URL.revokeObjectURL(url);

}


/* =========================================================
   RESET APP
========================================================= */

function resetApp(){

  if(
    !confirm(
      'Esto borrará los datos actuales de KNATT en este dispositivo. ¿Continuar?'
    )
  ){
    return;
  }


  localStorage.removeItem(KEY);

  location.reload();

}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(str){

  return String(str).replace(
    /[&<>"']/g,
    m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m])
  );

}


/* =========================================================
   INICIAR
========================================================= */

render();

</script>

</body>
</html>
