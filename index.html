<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>KNATT</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --red:#e21d2f;
  --red2:#b90f20;
  --dark:#0b0b0d;
  --dark2:#17171a;
  --bg:#f5f5f6;
  --card:#fff;
  --text:#17171a;
  --muted:#77777e;
  --line:#e6e6e9;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:82px;
}


/* =====================================================
   CABECERA
===================================================== */

header{
  background:var(--dark);
  color:#fff;
  padding:
    calc(12px + env(safe-area-inset-top))
    18px
    14px;
}

.header-row,
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1px;
}

.brand span{
  color:#ff3b4d;
}

.role{
  font-size:11px;
  color:#aaa;
  margin-top:2px;
  font-weight:700;
}

.header-bell{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#ffffff10;
  border:1px solid #ffffff12;
  color:#fff;
}

main{
  padding:14px 14px 24px;
}


/* =====================================================
   GENERAL
===================================================== */

.title{
  font-size:25px;
  font-weight:950;
  letter-spacing:-.7px;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:3px 2px 13px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 7px 24px #14141914;
}

.card-dark{
  background:var(--dark2);
  color:#fff;
  border-color:#2b2b30;
}

.section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:21px;
  font-weight:950;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:13px;
}

.btn.light{
  background:#f0f0f2;
  color:#222;
  box-shadow:none;
}

.btn.red-soft{
  background:#fff0f2;
  color:var(--red);
  box-shadow:none;
}

.btn.full{
  width:100%;
}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:13px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 8px;
  text-align:center;
}

.card-dark .stat{
  background:#202024;
  border-color:#303036;
}

.stat b{
  display:block;
  font-size:21px;
  font-weight:950;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-top:2px;
}

.stat.red{
  background:#fff0f2;
  border-color:#ffd7dc;
}

.stat.red b{
  color:var(--red);
}


/* =====================================================
   INICIO
===================================================== */

.home-title-row{
  margin-top:0;
  margin-bottom:12px;
}

.home-title-row .title{
  font-size:26px;
}

.home-title-row .subtitle{
  font-size:13px;
  margin-top:3px;
}

.home-match-card{
  padding:17px;
  border-radius:20px;
}

.home-match-card .section-label{
  margin-bottom:8px;
}

.home-match-card .big{
  font-size:22px;
  line-height:1.15;
}

.home-match-card .versus{
  margin:15px 0 16px;
}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

.match-countdown{
  text-align:center;
  margin-top:-6px;
  margin-bottom:14px;
  font-size:11px;
  font-weight:850;
  color:var(--muted);
}

.match-countdown strong{
  color:var(--red);
  font-weight:950;
}


/* =====================================================
   ACCESO RÁPIDO PLANTILLA
===================================================== */

.home-quick-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 15px;
  cursor:pointer;
}

.home-quick-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#fff0f2;
  color:var(--red);
  display:grid;
  place-items:center;
  font-size:21px;
}

.home-quick-content{
  flex:1;
  min-width:0;
}

.home-quick-title{
  font-size:13px;
  font-weight:950;
}

.home-quick-subtitle{
  font-size:10px;
  color:var(--muted);
  font-weight:750;
  margin-top:2px;
}

.home-quick-arrow{
  font-size:22px;
  color:#99999f;
}


/* =====================================================
   ÚLTIMA ACTIVIDAD
===================================================== */

.home-activity-card{
  padding:16px;
}

.activity-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #ededf0;
}

.activity-item:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.activity-item:first-child{
  padding-top:2px;
}

.activity-icon{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:10px;
  background:#f0f0f2;
  display:grid;
  place-items:center;
  font-size:16px;
}

.activity-content{
  flex:1;
  min-width:0;
}

.activity-title{
  font-size:11px;
  font-weight:900;
}

.activity-time{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}

.activity-empty{
  padding:7px 0 2px;
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}


/* =====================================================
   PLANTILLA
===================================================== */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:12px;
}

.tab{
  border:0;
  border-radius:999px;
  padding:9px 13px;
  background:#e9e9ec;
  color:#5e5e64;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}

.tab.active{
  background:var(--red);
  color:#fff;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ededf0;
}

.item:last-child{
  border:0;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#ececef;
  display:grid;
  place-items:center;
  font-size:20px;
}

.grow{
  flex:1;
  min-width:0;
}

.item b{
  font-size:13px;
}

.item .muted{
  font-size:10px;
  margin-top:2px;
}


/* =====================================================
   FORMULARIOS
===================================================== */

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

.form-input,
.select{
  width:100%;
  border:1px solid var(--line);
  background:#fafafa;
  border-radius:11px;
  padding:11px;
  font-size:14px;
  outline:none;
}

.form-input:focus,
.select:focus{
  border-color:#ffb5bd;
  box-shadow:0 0 0 3px #fff0f2;
}


/* =====================================================
   MODAL EDITAR JUGADOR
===================================================== */

.edit-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(18px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.edit-modal-card{
  width:min(500px,100%);
  max-height:calc(100vh - 36px);
  overflow-y:auto;
  background:#fff;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  padding:20px;
  -webkit-overflow-scrolling:touch;
}

.edit-modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.edit-modal-title{
  font-size:22px;
  font-weight:950;
  letter-spacing:-.5px;
}

.edit-modal-subtitle{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  margin-top:3px;
}

.edit-modal-close{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border:0;
  border-radius:10px;
  background:#f0f0f2;
  color:#555;
  font-size:20px;
  line-height:34px;
}

.edit-status-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.edit-status-option{
  position:relative;
}

.edit-status-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.edit-status-option label{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:45px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fafafa;
  color:#666;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.edit-status-option input:checked + label{
  background:#fff0f2;
  border-color:#ffb5bd;
  color:var(--red);
}

.edit-stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.edit-stats-grid .form-group{
  margin-bottom:12px;
}

.edit-modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:5px;
}

.edit-disabled{
  opacity:.48;
}

.edit-disabled input{
  background:#f0f0f2;
}


/* =====================================================
   PARTIDOS
===================================================== */

.match-card{
  position:relative;
}

.versus{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:13px 0;
}

.club{
  width:90px;
  text-align:center;
  font-weight:900;
  font-size:11px;
}

.club-logo{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#f0f0f2;
  margin:0 auto 5px;
  display:grid;
  place-items:center;
  font-size:21px;
}

.vs{
  font-weight:950;
  color:#888;
}


/* =====================================================
   MÁS
===================================================== */

.more-screen{
  background:var(--dark);
  min-height:calc(100vh - 80px);
  margin:-16px -14px -28px;
  padding:16px 14px 30px;
  color:#fff;
}

.more-screen .title{
  color:#fff;
}

.more-menu{
  display:grid;
  gap:8px;
}

.more-row{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  border:1px solid #2b2b30;
  background:#17171a;
  color:#fff;
  border-radius:13px;
  padding:13px;
  text-align:left;
}

.more-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#242428;
  display:grid;
  place-items:center;
  flex:0 0 30px;
}

.more-text{
  flex:1;
  font-size:12px;
  font-weight:850;
}

.more-arrow{
  color:#8c8c92;
}


/* =====================================================
   TÁCTICA
===================================================== */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:12px;
}

.pitch-wrap{
  position:relative;
  z-index:5;
  background:#e8e8ea;
  border-radius:19px;
  padding:8px;
  margin-bottom:12px;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:14px;
  overflow:hidden;
  background:
    repeating-linear-gradient(
      0deg,
      #278247 0 9%,
      #2d8b4f 9% 18%
    );
  touch-action:manipulation;
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #fff9;
  border-radius:8px;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #fff9;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #fff9;
  border-radius:50%;
  left:36.5%;
  top:36.5%;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #fff9;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}


/* =====================================================
   POSICIONES
===================================================== */

.tactic-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:clamp(68px,22vw,105px);
  z-index:20;
  text-align:center;
}

.tactic-slot.menu-active{
  z-index:9999;
}

.tactic-role{
  display:inline-block;
  background:var(--dark);
  color:#fff;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  margin-bottom:3px;
}

.player-selector{
  position:relative;
  width:100%;
}

.player-selector-button{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:4px;
  width:100%;
  height:36px;
  border:3px solid var(--red);
  border-radius:10px;
  background:#fff;
  color:var(--text);
  padding:0 6px;
  font-size:9px;
  font-weight:900;
  outline:none;
  text-align:left;
}

.player-selector-button .player-name{
  min-width:0;
  flex:1;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-selector-button .arrow{
  flex:0 0 auto;
  font-size:11px;
}

.player-selector-menu{
  display:none;
  position:absolute;
  left:0;
  right:0;
  top:40px;
  max-height:160px;
  overflow-y:auto;
  overflow-x:hidden;
  -webkit-overflow-scrolling:touch;
  background:#fff;
  border:1px solid #ddd;
  border-radius:9px;
  box-shadow:0 7px 18px rgba(0,0,0,.22);
  z-index:99999;
}

.player-selector.open .player-selector-menu{
  display:block;
}

.player-selector.menu-up .player-selector-menu{
  top:auto;
  bottom:40px;
}

.player-option{
  display:block;
  width:100%;
  border:0;
  border-bottom:1px solid #eee;
  background:#fff;
  color:var(--text);
  padding:8px 7px;
  font-size:9px;
  font-weight:800;
  text-align:left;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.player-option:last-child{
  border-bottom:0;
}

.player-option.selected{
  background:#fff0f2;
  color:var(--red);
  font-weight:950;
}

.player-option:disabled{
  color:#bbb;
  background:#fafafa;
}

.tactic-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px;
}


/* =====================================================
   NAVEGACIÓN
===================================================== */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  display:flex;
  justify-content:space-around;
  background:#fffefeed;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dedee2;
  padding:
    7px
    3px
    calc(7px + env(safe-area-inset-bottom));
  z-index:30;
  box-shadow:0 -8px 25px #14141914;
}

nav button{
  background:none;
  border:0;
  color:#77777e;
  font-size:10px;
  font-weight:850;
  padding:6px 4px;
  min-width:52px;
  border-radius:11px;
}

nav button.active{
  color:var(--red);
  background:#fff0f2;
}

nav .nav-icon{
  font-size:18px;
  line-height:18px;
  margin-bottom:2px;
}


/* =====================================================
   MÓVIL
===================================================== */

@media(max-width:380px){

  main{
    padding-left:11px;
    padding-right:11px;
  }

  .tactic-slot{
    width:clamp(62px,20vw,90px);
  }

  .player-selector-button{
    font-size:8px;
    height:34px;
    padding-left:5px;
    padding-right:5px;
  }

  .player-option{
    font-size:8px;
    padding:8px 6px;
  }

  .tactic-role{
    font-size:8px;
    padding:4px 6px;
  }

  .edit-modal{
    padding-left:10px;
    padding-right:10px;
  }

  .edit-modal-card{
    padding:16px;
    border-radius:19px;
  }

  .edit-modal-title{
    font-size:20px;
  }

  .edit-stats-grid{
    grid-template-columns:1fr;
    gap:0;
  }

}

</style>
</head>


<body>

<div>

</div>

</header>

<main id="content"></main>

<nav id="nav"></nav>

</div>

function esc(s){

  return String(
    s ?? ''
  ).replace(
    /[&<>"']/g,

    m => ({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m])

  );

}


/* =====================================================
   FORMATO ACTIVIDAD
===================================================== */

function activityTime(timestamp){

  if(!timestamp){
    return '';
  }

  const diff =
    Date.now() -
    Number(timestamp);

  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;

  if(diff < minute){
    return 'Ahora';
  }

  if(diff < hour){

    const n =
      Math.floor(
        diff / minute
      );

    return `Hace ${n} min`;

  }

  if(diff < day){

    const n =
      Math.floor(
        diff / hour
      );

    return `Hace ${n} h`;

  }

  if(diff < 2 * day){
    return 'Ayer';
  }

  const date =
    new Date(timestamp);

  return date.toLocaleDateString(
    'es-ES',
    {
      day:'numeric',
      month:'short'
    }
  );

}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

function getMatchCountdown(){

  const text =
    String(
      data.next?.date || ''
    );

  const match =
    text.match(
      /(\d{1,2})\s+de\s+([a-záéíóúñ]+)/i
    );

  if(!match){
    return '';
  }

  const day =
    Number(match[1]);

  const months={

    enero:0,
    febrero:1,
    marzo:2,
    abril:3,
    mayo:4,
    junio:5,
    julio:6,
    agosto:7,
    septiembre:8,
    octubre:9,
    noviembre:10,
    diciembre:11

  };

  const monthName =
    match[2]
      .toLowerCase();

  if(
    months[monthName] === undefined
  ){

    return '';

  }

  const now =
    new Date();

  let year =
    now.getFullYear();

  let target =
    new Date(
      year,
      months[monthName],
      day,
      12,
      0,
      0
    );

  if(
    target <
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    )
  ){

    target =
      new Date(
        year + 1,
        months[monthName],
        day,
        12,
        0,
        0
      );

  }

  const startToday =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const startTarget =
    new Date(
      target.getFullYear(),
      target.getMonth(),
      target.getDate()
    );

  const days =
    Math.round(
      (
        startTarget -
        startToday
      ) /
      86400000
    );

  if(days < 0){
    return '';
  }

  if(days === 0){
    return '🔴 Partido hoy';
  }

  if(days === 1){
    return '🟠 Partido mañana';
  }

  return `⏱ Faltan <strong>${days} días</strong>`;

}

    available.checked;


  reason.disabled =
    isAvailable;


  group.classList.toggle(
    'edit-disabled',
    isAvailable
  );


  if(isAvailable){

    reason.value='';

  }

}


/* =====================================================
   GUARDAR EDICIÓN
===================================================== */

function saveEditedPlayer(){

  const p =
    data.players.find(
      x =>
        String(x.id) ===
        String(selectedPlayerId)
    );


  if(!p){

    closeEditModal();

    return;

  }


  const name =
    document.getElementById(
      'edit-name'
    );

  const num =
    document.getElementById(
      'edit-num'
    );

  const pos =
    document.getElementById(
      'edit-pos'
    );

  const available =
    document.querySelector(
      'input[name="edit-available"]:checked'
    );

  const reason =
    document.getElementById(
      'edit-reason'
    );

  const min =
    document.getElementById(
      'edit-min'
    );

  const goals =
    document.getElementById(
      'edit-goals'
    );

  const assists =
    document.getElementById(
      'edit-assists'
    );


  const newName =
    name
      ?name.value.trim()
      :p.name;


  const newNum =
    num
      ?num.value.trim()
      :p.num;


  const newPos =
    pos
      ?pos.value.trim()
      :p.pos;


  if(!newName){

    alert(
      'El nombre del jugador es obligatorio.'
    );

    if(name){
      name.focus();
    }

    return;

  }


  if(!newNum){

    alert(
      'El dorsal es obligatorio.'
    );

    if(num){
      num.focus();
    }

    return;

  }


  if(!newPos){

    alert(
      'La posición es obligatoria.'
    );

    if(pos){
      pos.focus();
    }

    return;

  }


  p.name =
    newName;

  p.num =
    newNum;

  p.pos =
    newPos;


  p.available =
    available
      ?available.value === 'true'
      :p.available;


  p.reason =
    p.available
      ?''
      :(reason
        ?reason.value.trim()
        :p.reason);


  p.min =
    Math.max(
      0,
      Number(
        min
          ?min.value
          :p.min
      ) || 0
    );


  p.g =
    Math.max(
      0,
      Number(
        goals
          ?goals.value
          :p.g
      ) || 0
    );


  p.a =
    Math.max(
      0,
      Number(
        assists
          ?assists.value
          :p.a
      ) || 0
    );


  addActivity(
    '✏️',
    `Jugador actualizado: ${p.name}`
  );


  save();

  closeEditModal();

  render();

}

/* =====================================================

===================================================== */

function deletePlayer(id){

  const player =
    data.players.find(
      p =>
        String(p.id) ===
        String(id)
    );


  if(
    !confirm(
      '¿Eliminar este jugador?'
    )
  ){

    return;

  }


  data.players =
    data.players.filter(
      p =>
        String(p.id) !==
        String(id)
    );


  Object
    .keys(
      data.tactics.positions
    )
    .forEach(
      k => {

        if(
          String(
            data.tactics
              .positions[k]
              ?.playerId
          ) ===
          String(id)
        ){

          delete
            data.tactics
              .positions[k];

        }

      }
    );


  addActivity(
    '🗑️',
    `Jugador eliminado: ${
      player
        ?player.name
        :'Jugador'
    }`
  );

  save();

  go('team');

}

function slotHtml(

){

  const role =

  const y =
    spot[2];


  const selected =
    String(

      ]?.playerId || ''

    data.players.find(

    ">

          )

}


/* =====================================================
   OPCIONES DE JUGADORES
===================================================== */

function playerOptions(
  selected,
  index
){

  const used =
    new Set(

      Object
        .values(
          data.tactics.positions ||
          {}
        )

        .map(
          v =>
            String(
              v?.playerId || ''
            )
        )

        .filter(Boolean)

    );


  return `

  <button
    type="button"

    class="
      player-option
      ${
        selected===''
          ?'selected'
          :''
      }
    "

    onclick="
      assignPosition(
        ${index},
        ''
      )
    ">

    Seleccionar jugador

  </button>

  ` +

  data.players
    .map(
      p => {

        const id =
          String(p.id);


        const disabled =
          used.has(id) &&
          id!==selected;


        return `

        <button
          type="button"

          class="
            player-option
            ${
              id===selected
                ?'selected'
                :''
            }
          "

          ${
            disabled
              ?'disabled'
              :''
          }

          onclick="
            assignPosition(
              ${index},
              '${id}'
            )
          ">

          ${esc(p.name)}

        </button>

        `;

      }
    )
    .join('');

}


/* =====================================================
   ABRIR DESPLEGABLE
===================================================== */

function togglePlayerMenu(
  index,
  event
){

  if(event){

    event.stopPropagation();

  }


  const selector =
    document.getElementById(
      'player-selector-' +
      index
    );


  const slot =
    document.getElementById(
      'tactic-slot-' +
      index
    );


  if(
    !selector ||
    !slot
  ){

    return;

  }


  const wasOpen =
    selector.classList.contains(
      'open'
    );


  document
    .querySelectorAll(
      '.player-selector.open'
    )
    .forEach(
      el => {

        el.classList.remove(
          'open'
        );

        el.classList.remove(
          'menu-up'
        );

      }
    );


  document
    .querySelectorAll(
      '.tactic-slot.menu-active'
    )
    .forEach(
      el => {

        el.classList.remove(
          'menu-active'
        );

      }
    );


  if(wasOpen){

    return;

  }


  slot.classList.add(
    'menu-active'
  );


  const rect =
    selector.getBoundingClientRect();


  const spaceBelow =
    window.innerHeight -
    rect.bottom;


  const spaceAbove =
    rect.top;


  if(
    spaceBelow < 175 &&
    spaceAbove > spaceBelow
  ){

    selector.classList.add(
      'menu-up'
    );

  }


  selector.classList.add(
    'open'
  );

}


/* =====================================================
   CERRAR MENÚS

function closePlayerMenus(){

/* =====================================================
   ASIGNAR JUGADOR
===================================================== */

function assignPosition(
  index,
  id
){

  id =
    String(
      id || ''
    );


  if(!id){

    delete
      data.tactics
        .positions[
          String(index)
        ];


    addActivity(
      '⚽',
      'Jugador retirado de la táctica'
    );

    save();

    closePlayerMenus();

    render();

    return;

  }


  const duplicate =
    Object
      .entries(
        data.tactics.positions
      )
      .some(
        ([key,value]) =>

          key !== String(index)

          &&

          String(
            value?.playerId || ''
          ) === id

      );


  if(duplicate){

    alert(
      'Ese jugador ya está colocado en otra posición.'
    );

    return;

  }


  data.tactics
    .positions[
      String(index)
    ] = {

      playerId:id

    };


  const player =
    data.players.find(
      p =>
        String(p.id) === id
    );


  addActivity(
    '⚽',
    player
      ?`Táctica actualizada: ${player.name}`
      :'Táctica actualizada'
  );

  save();

  closePlayerMenus();

  render();

}

/* =====================================================
   CAMBIAR FORMACIÓN
===================================================== */

function changeFormation(
  formation
){

  if(
    !formations[
      formation
    ]
  ){

    return;

  }


  const oldFormation =
    data.tactics.formation ||
    '4-3-3';


  const oldPositions =
    data.tactics.positions ||
    {};


  const oldSpots =
    formations[
      oldFormation
    ] ||
    [];


  const newSpots =
    formations[
      formation
    ] ||
    [];


  const next = {};

  const used =
    new Set();


  newSpots.forEach(
    (newSpot,newIndex) => {

      const newRole =
        String(
          newSpot[0]
        )
        .trim()
        .toUpperCase();


      for(
        let oldIndex=0;
        oldIndex<oldSpots.length;
        oldIndex++
      ){

        if(
          used.has(oldIndex)
        ){

          continue;

        }


        const oldRole =
          String(
            oldSpots[
              oldIndex
            ][0]
          )
          .trim()
          .toUpperCase();


        const playerId =
          oldPositions[
            String(oldIndex)
          ]?.playerId;


        if(
          playerId &&

          oldRole ===
          newRole &&

          !Object
            .values(next)
            .some(
              p =>
                String(
                  p.playerId
                ) ===
                String(playerId)
            )
        ){

          next[
            String(newIndex)
          ] = {

            playerId:
              String(playerId)

          };


          used.add(
            oldIndex
          );


          break;

        }

      }

    }
  );


  data.tactics.formation =
    formation;


  data.tactics.positions =
    next;


  addActivity(
    '📐',
    `Formación cambiada a ${formation}`
  );

  save();

  render();

}


/* =====================================================
   RESET TÁCTICA
===================================================== */

function resetTactic(){

  const formation =
    data.tactics.formation ||
    '4-3-3';


  const spots =
    formations[
      formation
    ] ||
    [];


  const next = {};

  const used =
    new Set();


  spots.forEach(
    (spot,index) => {

      const role =
        String(
          spot[0]
        )
        .trim()
        .toUpperCase();


      const player =
        data.players.find(
          p =>

            !used.has(
              String(p.id)
            )

            &&

            String(
              p.pos || ''
            )
            .trim()
            .toUpperCase() ===
            role

        );


      if(player){

        next[
          String(index)
        ] = {

          playerId:
            String(player.id)

        };


        used.add(
          String(player.id)
        );

      }

    }
  );


  data.tactics.positions =
    next;


  addActivity(
    '↺',
    'Alineación restablecida'
  );

  save();

  render();

}
