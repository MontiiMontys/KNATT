<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>KNATT</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green:#123c2d;
  --green2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#ffffff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
}

html,
body{
  margin:0;
  padding:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
}

body{
  overflow-x:hidden;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  padding-bottom:100px;
}

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(
    145deg,
    var(--green),
    #0d2d22
  );
  color:#fff;
  padding:26px 20px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #0c2d2225;
}

.brand{
  font-size:29px;
  font-weight:900;
  letter-spacing:-.8px;
}

.brand span{
  color:var(--lime);
}

.role-header{
  opacity:.78;
  font-size:13px;
  margin-top:5px;
  font-weight:600;
}

main{
  padding:20px 16px 30px;
}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin:2px 0 16px;
}

.card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 7px 25px #10221b0b;
}

.hero{
  background:linear-gradient(
    145deg,
    var(--green),
    var(--green2)
  );
  color:#fff;
  border:0;
  padding:20px;
}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:13px;
}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  background:var(--green);
  color:#fff;
  font-weight:900;
  font-size:14px;
  cursor:pointer;
}

.btn.light{
  background:#e9efec;
  color:var(--green);
}

.btn.lime{
  background:var(--lime);
  color:#19331f;
}

.btn.full{
  width:100%;
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px;
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px;
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1;
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap;
}

.tab.active{
  background:var(--green);
  color:#fff;
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef;
}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px;
}

.grow{
  flex:1;
  min-width:0;
}

.pill{
  display:inline-flex;
  align-items:center;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20;
}

.pill.danger{
  background:#fae9e9;
  color:#b44343;
}

.delete-btn{
  border:0;
  background:#fae9e9;
  color:#b44343;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:17px;
  flex:0 0 38px;
}

.notice{
  background:#edf6df;
  color:#36561f;
  border-radius:17px;
  padding:14px;
  font-size:13px;
  font-weight:700;
}


/* =========================================================
   FORMULARIOS
========================================================= */

.form-group{
  margin-bottom:13px;
}

.form-group label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.form-input,
.select{
  width:100%;
  border:1px solid var(--line);
  background:#f8faf9;
  color:var(--text);
  border-radius:14px;
  padding:13px;
  font-size:15px;
  outline:none;
}


/* =========================================================
   NAVEGACIÓN
========================================================= */

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffee;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:50;
  box-shadow:0 -8px 30px #10221b0c;
}

nav button{
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 5px;
  min-width:52px;
  border-radius:13px;
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef;
}


/* =========================================================
   TÁCTICA
========================================================= */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:14px;
}

.select-wrap label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}


/* =========================================================
   CAMPO
========================================================= */

.pitch-wrap{
  background:#dfe9e2;
  border-radius:24px;
  padding:10px;
  margin-bottom:14px;
  box-shadow:0 8px 25px #10221b10;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68 / 105;
  border-radius:18px;
  overflow:hidden;

  background:
    linear-gradient(
      90deg,
      #2d8a52 0 8.33%,
      #338f56 8.33% 16.66%,
      #2d8a52 16.66% 25%,
      #338f56 25% 33.33%,
      #2d8a52 33.33% 41.66%,
      #338f56 41.66% 50%,
      #2d8a52 50% 58.33%,
      #338f56 58.33% 66.66%,
      #2d8a52 66.66% 75%,
      #338f56 75% 83.33%,
      #2d8a52 83.33% 91.66%,
      #338f56 91.66% 100%
    );
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #ffffff88;
  border-radius:10px;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #ffffff88;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #ffffff88;
  border-radius:50%;
  left:36.5%;
  top:36.5%;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
  opacity:.85;
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #ffffff88;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}


/* =========================================================
   POSICIONES
========================================================= */

/*
   IMPORTANTE:

   El select ya NO muestra el nombre del jugador.

   Visualmente siempre vemos:

             DC
       #9 · Montiimontys

   El select invisible se coloca encima del botón DC.
   Al tocar DC se abre el selector.
*/

.position-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:100px;
  z-index:10;
  text-align:center;
}


/* Posiciones laterales */

.position-slot.side{
  width:88px;
}


/* Posiciones centrales */

.position-slot.center{
  width:100px;
}


/* =========================================================
   BOTÓN DE POSICIÓN
========================================================= */

.position-select-box{
  position:relative;
  width:100%;
  height:40px;
}


/*
   Esto es lo que el usuario ve:
   DC / MC / DFC / POR...
*/

.position-role-display{
  position:absolute;
  inset:0;
  display:flex;
  align-items:center;
  justify-content:center;

  background:var(--green);
  color:#fff;

  border-radius:999px;

  font-size:13px;
  font-weight:900;

  box-shadow:
    0 4px 10px #10221b30;

  pointer-events:none;

  padding:0 7px;
}


/*
   El select real queda invisible encima.
   Sigue siendo completamente funcional.
*/

.position-native-select{
  position:absolute;
  inset:0;
  width:100%;
  height:100%;

  opacity:0;

  z-index:20;

  cursor:pointer;

  appearance:auto;
  -webkit-appearance:auto;
}


/* =========================================================
   NOMBRE DEL JUGADOR
========================================================= */

.position-player-name{
  width:100%;

  min-height:30px;

  margin-top:7px;

  padding:6px 5px;

  background:#ffffffef;

  border:1px solid #dfe8e2;

  border-radius:12px;

  color:var(--text);

  font-size:11px;
  font-weight:900;

  line-height:1.15;

  text-align:center;

  /*
    Fundamental para nombres largos.
  */
  white-space:normal;
  overflow-wrap:anywhere;
  word-break:normal;

  box-shadow:
    0 3px 8px #10221b18;
}


/*
   Cuando no hay jugador no aparece ninguna caja.
*/

.position-player-name.empty{
  display:none;
}


/*
   Nombres largos pueden crecer verticalmente,
   pero nunca horizontalmente.
*/

.position-player-name.long{
  font-size:10px;
}


/* =========================================================
   SEPARACIÓN ESPECIAL POR LÍNEAS
========================================================= */

/*
   Los jugadores de la misma línea tienen
   cajas más pequeñas para evitar solapamientos.
*/

.position-slot.line-tight{
  width:84px;
}


/*
   Los extremos tienen un poco más de margen.
*/

.position-slot.left{
  margin-left:2px;
}

.position-slot.right{
  margin-left:-2px;
}


/* =========================================================
   RESUMEN
========================================================= */

.lineup-list{
  display:flex;
  flex-direction:column;
  gap:8px;
}

.lineup-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#f8faf9;
  border:1px solid var(--line);
  border-radius:15px;
}

.lineup-role{
  flex:0 0 58px;
  text-align:center;
  background:var(--green);
  color:#fff;
  border-radius:999px;
  padding:7px 5px;
  font-size:11px;
  font-weight:900;
}

.lineup-player{
  flex:1;
  min-width:0;
  font-size:13px;
  font-weight:800;
  overflow-wrap:anywhere;
}

.lineup-player.empty{
  color:var(--muted);
}


/* =========================================================
   ACCIONES
========================================================= */

.tactic-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}


/* =========================================================
   MÓVIL
========================================================= */

@media(max-width:390px){

  main{
    padding-left:12px;
    padding-right:12px;
  }

  .position-slot{
    width:90px;
  }

  .position-slot.side{
    width:78px;
  }

  .position-role-display{
    font-size:12px;
  }

  .position-player-name{
    font-size:10px;
    padding-left:4px;
    padding-right:4px;
  }

}

</style>
</head>


<body>

<header>

  <div class="brand">

  <div class="role-header">

  </div>

</header>


<main id="content"></main>


<nav id="nav"></nav>

</div>


<script>


/* =========================================================
   DATOS
========================================================= */

const KEY='knatt-app-data';


let data;


try{

  data=
    JSON.parse(
      localStorage.getItem(KEY)
    ) || null;

}catch(e){

    ],

    },

    },

    next:{

    }

  };

if(!data.tactics){
  data.tactics={};
}

if(!data.tactics.formation){
  data.tactics.formation='4-3-3';
}

if(!Array.isArray(data.tactics.lineup)){
  data.tactics.lineup=[];
}

if(!data.settings){
  data.settings={};
}

if(!data.next){
  data.next={};
}


/* =========================================================
   FORMACIONES
========================================================= */

const formations={

  '4-3-3':[

    ['POR',50,88],

    ['LI',16,72],
    ['DFC',38,74],
    ['DFC',62,74],
    ['LD',84,72],

    ['MC',28,53],

    ['EI',17,34],

  ],


  '4-4-2':[

    ['POR',50,88],

    ['LD',84,72],

    ['MI',15,55],
    ['MC',38,54],

  ],


  '4-2-3-1':[

    ['POR',50,88],

    ['MCD',36,57],

    ['EI',17,40],

    ['DC',50,24]

  ],


  '3-5-2':[

    ['POR',50,88],

    ['DFC',29,73],
    ['DFC',50,76],
    ['DFC',71,73],

    ['MI',13,54],

    ['MCO',50,50],

  ],


  '3-4-3':[

    ['POR',50,88],

    ['DFC',29,73],
    ['DFC',50,76],
    ['DFC',71,73],

    ['MI',16,55],
    ['MC',38,55],
    ['MC',62,55],
    ['MD',84,55],

    ['EI',17,34],
    ['DC',50,24],
    ['ED',83,34]

  ],


  '5-3-2':[

    ['POR',50,88],

    ['LI',13,68],
    ['DFC',32,73],
    ['DFC',50,75],
    ['DFC',68,73],
    ['LD',87,68],

    ['MC',31,52],

  ],

    ['MD',86,54],

    ['DC',50,25]

  ]

};


/* =========================================================
   ESTADO
========================================================= */

let section='home';

let filter='all';


/* =========================================================
   GUARDAR
========================================================= */

function save(){

  localStorage.setItem(
    KEY,
    JSON.stringify(data)
  );

}


/* =========================================================
   NAVEGACIÓN
========================================================= */

function go(sectionName){

  section=sectionName;

  render();

}


function navItems(){

  return [

    ['home','🏠','Inicio'],

    ['team','👥','Plantilla'],

    ['tactic','🧠','Táctica'],

    ['matches','🏆','Partidos'],

    ['stats','📊','Stats'],

    ['settings','⚙️','Config.']

  ];

}


/* =========================================================
   RENDER
========================================================= */

function render(){

  document.getElementById('nav').innerHTML=

    navItems()
    .map(item=>`

      <button
        class="${
          section===item[0]
          ?'active'
          :''
        }"
        onclick="go('${item[0]}')">

        ${item[1]}<br>

        ${item[2]}

      </button>

    `)
    .join('');


  const content=
    document.getElementById('content');


  if(section==='home'){
    content.innerHTML=home();
  }

  else if(section==='team'){
    content.innerHTML=team();
  }

  else if(section==='tactic'){
    content.innerHTML=tactic();
  }

  else if(section==='matches'){
    content.innerHTML=matches();
  }

  else if(section==='stats'){
    content.innerHTML=stats();
  }

  else if(section==='settings'){
    content.innerHTML=settings();
  }

}


/* =========================================================
   HOME
========================================================= */

function home(){

  const available=
    data.players.filter(
      p=>p.available
    ).length;


  return `

    <div class="title">
      Panel del equipo
    </div>


    <div class="card hero">

      <div
        class="section-label"
        style="color:#b9e86c">

        PRÓXIMO PARTIDO

      </div>


      <div class="big">

        ${escapeHtml(data.settings.team || 'KNATT FC')}

        🆚

        ${escapeHtml(data.next.opponent || 'Rival')}

      </div>


      <br>


      <div>

        ${escapeHtml(data.next.date || '')}

        ·

        ${escapeHtml(data.next.time || '')}

      </div>


      <div style="margin-top:5px">

        📍
        ${escapeHtml(data.next.place || '')}

      </div>


      <br>


      <button
        class="btn lime full"
        onclick="go('tactic')">

        🧠 Preparar alineación

      </button>

    </div>


    <div class="grid">

      <div class="stat accent">

        <b>
          ${data.players.length}
        </b>

        <span>
          Jugadores
        </span>

      </div>


      <div class="stat">

        <b>
          ${available}
        </b>

        <span>
          Disponibles
        </span>

      </div>

    </div>

  `;

}


/* =========================================================
   PLANTILLA
========================================================= */

function team(){

  let players=
    [...data.players];


  if(filter==='available'){

    players=
      players.filter(
        p=>p.available
      );

  }

  if(filter==='absent'){

    players=
      players.filter(
        p=>!p.available
      );

  }


  return `

    <div class="title">
      Plantilla
    </div>


    <button
      class="btn lime full"
      onclick="addPlayer()">

      ➕ Añadir jugador

    </button>


    <br><br>


    <div class="tabs">

      <button
        class="tab ${
          filter==='all'?'active':''
        }"
        onclick="filter='all';render()">

        Todos

      </button>


      <button
        class="tab ${
          filter==='available'?'active':''
        }"
        onclick="filter='available';render()">

        🟢 Disponibles

      </button>


      <button
        class="tab ${
          filter==='absent'?'active':''
        }"
        onclick="filter='absent';render()">

        🔴 Ausentes

      </button>

    </div>


    <div class="card">

      ${
        players.map(p=>`

          <div class="item">

            <div class="avatar">

              ${
                p.pos==='POR'
                ?'🧤'
                :'⚽'
              }

            </div>


            <div class="grow">

              <b>

                #${escapeHtml(String(p.num))}
                ·
                ${escapeHtml(p.name)}

              </b>


              <div class="muted small">

                ${escapeHtml(p.pos)}

              </div>

            </div>

          </div>

        `).join('')

        ||

        '<div class="muted">No hay jugadores.</div>'

      }

    </div>

  `;

}


/* =========================================================
   TÁCTICA
========================================================= */

function tactic(){

  const formation=
    data.tactics.formation;


  const spots=
    formations[formation];


  ensureLineup(spots);


  return `

    <div class="title">
      Táctica
    </div>


    <div class="card">

      <div class="section-label">
        PIZARRA TÁCTICA
      </div>


      <div class="big">

        ${escapeHtml(formation)}

      </div>


      <div class="muted small">

        Selecciona un jugador en cada posición.

      </div>

    </div>


    <div class="tactic-toolbar">

      <div class="select-wrap">

        <label>
          Formación
        </label>


        <select
          class="select"
          onchange="changeFormation(this.value)">

          ${
            Object.keys(formations)
            .map(f=>`

              <option
                value="${f}"
                ${
                  f===formation
                  ?'selected'
                  :''
                }>

                ${f}

              </option>

            `)
            .join('')
          }

        </select>

      </div>


      <button
        class="btn light"
        onclick="clearTactic()">

        ↻ Reset

      </button>

    </div>


    <div class="pitch-wrap">

      <div class="pitch">

        <div class="pitch-line"></div>

        <div class="pitch-circle"></div>

        <div class="pitch-center"></div>

        <div class="box top"></div>

        <div class="box bottom"></div>

        <div class="goal top"></div>

        <div class="goal bottom"></div>


        ${
          spots
          .map(
            (spot,index)=>
              renderPosition(
                spot,
                index,
                spots
              )
          )
          .join('')
        }

      </div>

    </div>


    <div class="card">

      <div class="section-label">
        ALINEACIÓN
      </div>


      <div class="lineup-list">

        ${
          data.tactics.lineup
          .map(slot=>{

            const player=
              getPlayer(
                slot.playerId
              );


            return `

              <div class="lineup-row">

                <div class="lineup-role">

                  ${escapeHtml(slot.role)}

                </div>


                <div
                  class="
                    lineup-player
                    ${player?'':'empty'}
                  ">

                  ${
                    player

                    ?

                    '#'+
                    escapeHtml(String(player.num))+
                    ' · '+
                    escapeHtml(player.name)

                    :

                    'Sin jugador'

                  }

                </div>

              </div>

            `;

          })
          .join('')

        }

      </div>

    </div>

  `;

}


/* =========================================================
   POSICIÓN
========================================================= */

function renderPosition(
  spot,
  index,
  spots
){

  const role=
    spot[0];

  const x=
    spot[1];

  const y=
    spot[2];


  const slot=
    data.tactics.lineup[index] ||
    {
      role:role,
      playerId:null
    };


  const player=
    getPlayer(
      slot.playerId
    );


  /*
     Determinamos el tamaño de la posición.
     Las posiciones que están cerca entre sí
     utilizan cajas más estrechas.
  */

  let className='position-slot';


  if(
    x<20 ||
    x>80
  ){

    className+=' side';

  }


  if(
    role==='POR' ||
    role==='DC' ||
    role==='MCO'
  ){

    className+=' center';

  }


  /*
     Para las líneas defensivas y de medio campo
     hacemos las cajas todavía más compactas.
  */

  if(
    role==='DFC' ||
    role==='MC' ||
    role==='MCD'
  ){

    className+=' line-tight';

  }


  /*
     Si hay posiciones muy cercanas,
     desplazamos ligeramente algunas.
  */

  let adjustedY=y;


  /*
     Los nombres van SIEMPRE debajo del selector.
     Esto evita que el nombre aparezca dentro
     del botón de posición.
  */


  const playerName=

    player

    ?

    `

      <div
        class="
          position-player-name
          ${
            player.name.length>14
            ?'long'
            :''
          }
        ">

        #${escapeHtml(String(player.num))}
        ·
        ${escapeHtml(player.name)}

      </div>

    `

    :

    '';


  return `

    <div
      class="${className}"
      style="
        left:${x}%;
        top:${adjustedY}%;
      ">


      <div class="position-select-box">

        <!--

          ESTA ES LA POSICIÓN FIJA.

          Aunque selecciones un jugador,
          aquí seguirá apareciendo:

          DC
          MC
          DFC
          POR
          etc.

        -->

        <div class="position-role-display">

          ${escapeHtml(role)}

        </div>


        <!--

          SELECT REAL INVISIBLE.

          Al tocar la posición se abre
          el desplegable de jugadores.

        -->

        <select
          class="position-native-select"
          onchange="
            selectPlayer(
              ${index},
              this.value
            )
          ">

          <option value="">
            Seleccionar jugador
          </option>


          ${
            availablePlayersForSlot(
              index
            )
            .map(p=>`

              <option
                value="${p.id}"
                ${
                  String(p.id)===
                  String(slot.playerId)
                  ?'selected'
                  :''
                }>

                #${escapeHtml(String(p.num))}
                ·
                ${escapeHtml(p.name)}

              </option>

            `)
            .join('')
          }

        </select>

      </div>


      ${playerName}

    </div>

  `;

}


/* =========================================================
   JUGADORES DISPONIBLES PARA UNA POSICIÓN
========================================================= */

function availablePlayersForSlot(
  currentIndex
){

  const selectedElsewhere=
    data.tactics.lineup
    .filter(
      (slot,index)=>
        index!==currentIndex &&
        slot.playerId
    )
    .map(
      slot=>String(slot.playerId)
    );


  return data.players.filter(
    player=>
      !selectedElsewhere.includes(
        String(player.id)
      )
  );

}


/* =========================================================
   SELECCIONAR JUGADOR
========================================================= */

function selectPlayer(
  index,
  playerId
){

  if(!data.tactics.lineup[index]){
    return;
  }


  if(playerId){

    const duplicate=
      data.tactics.lineup.some(
        (slot,i)=>
          i!==index &&
          String(slot.playerId)===
          String(playerId)
      );


    if(duplicate){

      alert(
        'Ese jugador ya está colocado en otra posición.'
      );

      render();

      return;

    }

  }


  data.tactics.lineup[index].playerId=
    playerId
    ?String(playerId)
    :null;


  save();

  render();

}


/* =========================================================
   ASEGURAR ALINEACIÓN
========================================================= */

function ensureLineup(spots){

  const old=
    Array.isArray(data.tactics.lineup)
    ?data.tactics.lineup
    :[];


  data.tactics.lineup=
    spots.map(
      (spot,index)=>({

        role:spot[0],

        playerId:
          old[index]?.playerId
          ?String(old[index].playerId)
          :null

      })
    );

}


/* =========================================================
   CAMBIAR FORMACIÓN
========================================================= */

function changeFormation(
  formation
){

  if(!formations[formation]){
    return;
  }


  const oldPlayers=
    data.tactics.lineup
    .map(
      slot=>slot.playerId
    )
    .filter(Boolean);


  data.tactics.formation=
    formation;


  data.tactics.lineup=
    formations[formation]
    .map(
      (spot,index)=>({

        role:spot[0],

        playerId:
          oldPlayers[index]
          ?String(oldPlayers[index])
          :null

      })
    );


  save();

  render();

}


/* =========================================================
   VACIAR TÁCTICA
========================================================= */

function clearTactic(){

  data.tactics.lineup=
    formations[
      data.tactics.formation
    ]
    .map(
      spot=>({

        role:spot[0],

        playerId:null

      })
    );


  save();

  render();

}


/* =========================================================
   UTILIDADES
========================================================= */

function getPlayer(id){

  if(
    id===null ||
    id===undefined ||
    id===''
  ){

    return null;

  }


  return data.players.find(
    p=>String(p.id)===
    String(id)
  ) || null;

}


function escapeHtml(value){

  return String(value)
    .replace(
      /[&<>"']/g,
      function(match){

        return {

          '&':'&amp;',
          '<':'&lt;',
          '>':'&gt;',
          '"':'&quot;',
          "'":'&#039;'

        }[match];

      }
    );

}


/* =========================================================
   AÑADIR JUGADOR
========================================================= */

function addPlayer(){

  const name=
    prompt(
      'Nombre del jugador:'
    );


  if(
    !name ||
    !name.trim()
  ){

    return;

  }


  const num=
    prompt(
      'Número:',
      ''
    );


  if(num===null){
    return;
  }


  const pos=
    prompt(
      'Posición:',
      ''
    );


  if(pos===null){
    return;
  }


  data.players.push({

    id:Date.now(),

    name:name.trim(),

    num:num.trim() || '-',

    pos:pos.trim() || 'Jugador',

    available:true,

    reason:'',

    min:0,

    g:0,

    a:0

  });


  save();

  render();

}


/* =========================================================
   PARTIDOS
========================================================= */

function matches(){

  return `

    <div class="title">
      Partidos
    </div>


    <div class="card hero">

      <div class="section-label"
           style="color:#b9e86c">

        PRÓXIMO PARTIDO

      </div>


      <div class="big">

        ${escapeHtml(data.settings.team || 'KNATT FC')}

        🆚

        ${escapeHtml(data.next.opponent || 'Rival')}

      </div>


      <br>


      <div>

        ${escapeHtml(data.next.date || '')}

        ·

        ${escapeHtml(data.next.time || '')}

      </div>


      <br>


      <button
        class="btn lime full"
        onclick="go('tactic')">

        🧠 Preparar alineación

      </button>

    </div>

  `;

}


/* =========================================================
   STATS
========================================================= */

function stats(){

  const goals=
    data.players.reduce(
      (sum,p)=>
        sum+(Number(p.g)||0),
      0
    );


  const assists=
    data.players.reduce(
      (sum,p)=>
        sum+(Number(p.a)||0),
      0
    );


  return `

    <div class="title">
      Estadísticas
    </div>


    <div class="grid">

      <div class="stat accent">

        <b>${goals}</b>

        <span>
          Goles
        </span>

      </div>


      <div class="stat">

        <b>${assists}</b>

        <span>
          Asistencias
        </span>

      </div>

    </div>


    <div class="card">

      ${
        data.players.map(p=>`

          <div class="item">

            <div class="grow">

              <b>

                #${escapeHtml(String(p.num))}
                ·
                ${escapeHtml(p.name)}

              </b>

            </div>


            <div>

              ${Number(p.g)||0}
              ⚽

              ·

              ${Number(p.a)||0}
              🎯

            </div>

          </div>

        `).join('')

      }

    </div>

  `;

}


/* =========================================================
   CONFIG
========================================================= */

function settings(){

  return `

    <div class="title">
      Configuración
    </div>


    <div class="card">

      <div class="form-group">

        <label>
          Equipo
        </label>


        <input
          id="teamName"
          class="form-input"
          value="${escapeHtml(
            data.settings.team || ''
          )}">

      </div>


      <div class="form-group">

        <label>
          Temporada
        </label>


        <input
          id="seasonName"
          class="form-input"
          value="${escapeHtml(
            data.settings.season || ''
          )}">

      </div>


      <button
        class="btn lime full"
        onclick="saveSettings()">

        💾 Guardar

      </button>

    </div>

  `;

}


function saveSettings(){

  data.settings.team=
    document
    .getElementById('teamName')
    .value
    .trim();


  data.settings.season=
    document
    .getElementById('seasonName')
    .value
    .trim();


  save();

  render();

}


/* =========================================================
   ARRANCAR
========================================================= */

save();

render();

</script>
