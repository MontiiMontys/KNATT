<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b2118">
<title>KNATT</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --green:#0b2118;
  --green2:#123c2d;
  --green3:#1c5a40;
  --lime:#c7f36b;
  --lime2:#e7ffad;
  --bg:#f4f7f5;
  --card:#fff;
  --text:#10221a;
  --muted:#75837c;
  --line:#e3ebe6;
  --danger:#d85b61;
  --danger-bg:#fcedee;
  --warning:#d99728;
  --warning-bg:#fff4dc;
  --shadow:0 10px 30px rgba(16,34,27,.07);
}

html,body{
  margin:0;
  min-height:100%;
  background:var(--bg)
}

body{
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"SF Pro Display","Segoe UI",sans-serif
}

button,input,select{
  font:inherit
}

button{
  cursor:pointer
}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:92px
}

header{
  position:relative;
  overflow:hidden;
  padding:24px 20px 22px;
  color:#fff;
  background:
    radial-gradient(circle at 100% 0%,#c7f36b22 0 16%,transparent 35%),
    linear-gradient(145deg,#0b2118,#174d38);
  border-radius:0 0 30px 30px
}

header:after{
  content:"";
  position:absolute;
  width:190px;
  height:190px;
  border-radius:50%;
  right:-100px;
  bottom:-130px;
  border:1px solid #ffffff14
}

.header-row{
  position:relative;
  z-index:2;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px
}

.brand{
  font-size:30px;
  font-weight:950;
  letter-spacing:-1px
}

.brand span{
  color:var(--lime)
}

.role{
  margin-top:4px;
  color:#cbdad3;
  font-size:12px;
  font-weight:700
}

.header-badge{
  width:44px;
  height:44px;
  border-radius:15px;
  display:grid;
  place-items:center;
  background:#ffffff12;
  border:1px solid #ffffff18;
  font-size:20px
}

main{
  padding:18px 15px 30px
}

.title-row{
  display:flex;
  align-items:end;
  justify-content:space-between;
  gap:10px;
  margin:4px 2px 15px
}

.title{
  font-size:27px;
  font-weight:950;
  letter-spacing:-.8px
}

.subtitle{
  font-size:13px;
  color:var(--muted);
  font-weight:700;
  margin-top:3px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:23px;
  padding:17px;
  margin-bottom:13px;
  box-shadow:var(--shadow)
}

.hero{
  position:relative;
  overflow:hidden;
  color:#fff;
  border:0;
  background:
    radial-gradient(circle at 90% 10%,#c7f36b20 0 10%,transparent 32%),
    linear-gradient(145deg,var(--green2),var(--green3));
  box-shadow:0 15px 35px #0b211826
}

.hero:after{
  content:"⚽";
  position:absolute;
  right:-5px;
  bottom:-20px;
  font-size:100px;
  opacity:.06
}

.eyebrow{
  font-size:10px;
  letter-spacing:1.4px;
  font-weight:950;
  text-transform:uppercase;
  color:var(--muted)
}

.hero .eyebrow{
  color:var(--lime)
}

.big{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px
}

.hero .big{
  font-size:23px
}

.muted{
  color:var(--muted)
}

.hero .muted{
  color:#c5d6ce
}

.small{
  font-size:12px
}

.match-line{
  display:flex;
  align-items:center;
  gap:10px;
  margin:16px 0
}

.team-ball{
  width:48px;
  height:48px;
  border-radius:16px;
  display:grid;
  place-items:center;
  background:#ffffff12;
  border:1px solid #ffffff16;
  font-size:22px;
  flex:0 0 48px
}

.match-info{
  min-width:0;
  flex:1
}

.match-date{
  font-size:13px;
  font-weight:850
}

.match-place{
  font-size:12px;
  color:#c5d6ce;
  margin-top:4px
}

.btn{
  border:0;
  border-radius:15px;
  padding:13px 15px;
  background:var(--green2);
  color:#fff;
  font-size:13px;
  font-weight:900;
  box-shadow:0 6px 15px #0b21181c
}

.btn.lime{
  background:var(--lime);
  color:#18351f
}

.btn.light{
  background:#eaf0ed;
  color:var(--green2);
  box-shadow:none
}

.btn.danger{
  background:var(--danger-bg);
  color:#b63f47;
  box-shadow:none
}

.btn.full{
  width:100%
}

.btn.small-btn{
  padding:10px 12px;
  font-size:12px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px;
  margin-bottom:13px
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:15px;
  box-shadow:0 7px 20px #10221b07
}

.stat b{
  display:block;
  font-size:26px;
  font-weight:950;
  letter-spacing:-1px
}

.stat span{
  display:block;
  margin-top:2px;
  font-size:11px;
  color:var(--muted);
  font-weight:800
}

.stat.accent{
  background:#eef8df;
  border-color:#dceec0
}

.stat.accent b{
  color:#3d681f
}

.section-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:10px
}

.section-title{
  font-size:15px;
  font-weight:950
}

.link-btn{
  border:0;
  background:none;
  color:#477426;
  font-size:12px;
  font-weight:900;
  padding:5px
}

.quick-grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:10px
}

.quick{
  border:1px solid var(--line);
  background:#f8faf9;
  border-radius:18px;
  padding:14px;
  text-align:left;
  color:var(--text);
  font-weight:900
}

.quick-icon{
  font-size:20px;
  margin-bottom:7px
}

.quick-label{
  font-size:12px
}

.quick-sub{
  font-size:10px;
  color:var(--muted);
  margin-top:3px
}

.item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-bottom:1px solid #edf1ef
}

.item:last-child{
  border-bottom:0
}

.avatar{
  width:44px;
  height:44px;
  flex:0 0 44px;
  border-radius:15px;
  background:#e9f1ed;
  display:grid;
  place-items:center;
  font-size:19px
}

.grow{
  flex:1;
  min-width:0
}

.item-name{
  font-size:14px;
  font-weight:900;
  overflow-wrap:anywhere
}

.item-meta{
  font-size:11px;
  color:var(--muted);
  margin-top:3px;
  font-weight:700
}

.pill{
  display:inline-flex;
  align-items:center;
  border-radius:999px;
  padding:6px 8px;
  font-size:10px;
  font-weight:950;
  background:#eaf7d9;
  color:#426b20
}

.pill.danger{
  background:var(--danger-bg);
  color:#b54249
}

.pill.warning{
  background:var(--warning-bg);
  color:#986b19
}

.delete-btn{
  width:37px;
  height:37px;
  border:0;
  border-radius:12px;
  background:var(--danger-bg);
  color:#b54249;
  font-size:16px;
  flex:0 0 37px
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:13px;
  scrollbar-width:none
}

.tabs::-webkit-scrollbar{
  display:none
}

.tab{
  border:0;
  border-radius:999px;
  padding:9px 13px;
  background:#e8efeb;
  color:#596760;
  font-size:12px;
  font-weight:900;
  white-space:nowrap
}

.tab.active{
  background:var(--green2);
  color:#fff
}

.notice{
  background:#eef7e2;
  color:#426323;
  border-radius:17px;
  padding:13px;
  font-size:12px;
  font-weight:800
}

.form-group{
  margin-bottom:13px
}

.form-group label{
  display:block;
  margin-bottom:6px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:950
}

.form-input,
.select{
  width:100%;
  border:1px solid var(--line);
  background:#f8faf9;
  color:var(--text);
  border-radius:14px;
  padding:12px;
  font-size:14px;
  font-weight:750;
  outline:none
}

.form-input:focus,
.select:focus{
  border-color:#a9cb8c;
  box-shadow:0 0 0 3px #c7f36b22
}

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:12px
}

.select-wrap label{
  display:block;
  margin-bottom:6px;
  color:var(--muted);
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:950
}

.pitch-wrap{
  background:#dce8e0;
  border-radius:25px;
  padding:9px;
  margin-bottom:13px;
  box-shadow:var(--shadow)
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:19px;
  overflow:hidden;
  background:
    repeating-linear-gradient(
      90deg,
      #2d8952 0 8.33%,
      #338f56 8.33% 16.66%
    )
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #ffffff80;
  border-radius:10px
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #ffffff80
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #ffffff80;
  border-radius:50%;
  left:36.5%;
  top:36.5%
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
  opacity:.85
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #ffffff80
}

.box.top{
  top:2.5%
}

.box.bottom{
  bottom:2.5%
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18
}

.goal.top{
  top:0
}

.goal.bottom{
  bottom:0
}

.position-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:112px;
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:5
}

.position-role{
  background:var(--green);
  color:#fff;
  border-radius:999px;
  min-width:55px;
  padding:7px 10px;
  text-align:center;
  font-size:11px;
  font-weight:950;
  line-height:1;
  box-shadow:0 5px 12px #10221b30;
  margin-bottom:5px
}

.position-select{
  width:100%;
  max-width:112px;
  border:3px solid var(--lime);
  background:#fff;
  color:var(--text);
  border-radius:14px;
  padding:8px 22px 8px 8px;
  font-size:11px;
  font-weight:900;
  outline:none
}

.position-select.selected{
  position:absolute;
  left:0;
  top:27px;
  width:100%;
  height:37px;
  border:0;
  padding:0;
  opacity:0;
  z-index:3;
  cursor:pointer
}

.position-name{
  width:100%;
  max-width:112px;
  background:#ffffffef;
  color:var(--text);
  border-radius:12px;
  padding:6px 7px;
  text-align:center;
  font-size:10px;
  font-weight:950;
  line-height:1.12;
  overflow-wrap:anywhere;
  word-break:break-word;
  box-shadow:0 3px 10px #10221b20;
  position:relative;
  z-index:2
}

.lineup-row{
  display:flex;
  align-items:center;
  gap:9px;
  padding:9px 0;
  border-bottom:1px solid #edf1ef
}

.lineup-row:last-child{
  border-bottom:0
}

.lineup-position{
  background:var(--green2);
  color:#fff;
  border-radius:999px;
  padding:6px 9px;
  font-size:10px;
  font-weight:950
}

.lineup-player{
  font-size:13px;
  font-weight:850
}

.tactic-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:12px
}

.modal-backdrop{
  position:fixed;
  inset:0;
  background:#07140fcc;
  backdrop-filter:blur(8px);
  -webkit-backdrop-filter:blur(8px);
  z-index:50;
  display:none;
  align-items:flex-end;
  justify-content:center
}

.modal-backdrop.show{
  display:flex
}

.modal{
  width:min(560px,100%);
  max-height:90vh;
  overflow:auto;
  background:#fff;
  border-radius:27px 27px 0 0;
  padding:20px 16px calc(20px + env(safe-area-inset-bottom));
  box-shadow:0 -15px 50px #0003
}

.modal-head{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin-bottom:16px
}

.modal-title{
  font-size:20px;
  font-weight:950
}

.close-btn{
  border:0;
  background:#edf2ef;
  color:var(--green2);
  width:37px;
  height:37px;
  border-radius:12px;
  font-size:18px
}

.modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:16px
}

.empty{
  text-align:center;
  padding:22px 8px;
  color:var(--muted);
  font-size:13px;
  font-weight:700
}

.nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(560px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffeF;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:8px 4px calc(8px + env(safe-area-inset-bottom));
  z-index:20;
  box-shadow:0 -8px 30px #10221b0c
}

.nav button{
  border:0;
  background:none;
  color:#7a8781;
  font-size:10px;
  font-weight:850;
  padding:7px 5px;
  min-width:52px;
  border-radius:13px
}

.nav button.active{
  color:var(--green)!important;
  background:#edf4ef
}

@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px
  }

  .position-slot{
    width:96px
  }

  .position-select,
  .position-name{
    max-width:96px
  }

  .position-select{
    font-size:10px
  }

  .position-role{
    font-size:10px;
    padding:7px 8px
  }

  .position-name{
    font-size:9px
  }

  .title{
    font-size:24px
  }

  .brand{
    font-size:27px
  }

  .nav button{
    min-width:48px;
    padding-left:3px;
    padding-right:3px
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="header-row">
    <div>
      <div class="brand">⚽ <span>KNATT</span></div>
      <div class="role">Entrenador · Primer Equipo</div>
    </div>

    <div class="header-badge">🧠</div>
  </div>
</header>

<main id="content"></main>

<nav class="nav" id="nav"></nav>

</div>

<div
  class="modal-backdrop"
  id="modalBackdrop"
  onclick="closeModal(event)"
>
  <div class="modal" id="modal"></div>
</div>

<script>

const KEY='teamhub-v2';

let data;

try{
  const saved=localStorage.getItem(KEY);
  data=saved?JSON.parse(saved):null;
}catch(error){
  console.error(error);
  data=null;
}

if(!data || typeof data!=='object'){
  data={
    players:[
      {
        id:1,
        name:'Montiimontys',
        num:9,
        pos:'DC',
        available:true,
        reason:'',
        min:1126,
        g:12,
        a:6
      },
      {
        id:2,
        name:'Marc',
        num:7,
        pos:'MC',
        available:true,
        reason:'',
        min:1030,
        g:5,
        a:8
      },
      {
        id:3,
        name:'Juan',
        num:4,
        pos:'DFC',
        available:false,
        reason:'Trabajo',
        min:980,
        g:4,
        a:3
      },
      {
        id:4,
        name:'Alex',
        num:1,
        pos:'POR',
        available:true,
        reason:'',
        min:1260,
        g:0,
        a:1
      },
      {
        id:5,
        name:'Pedro',
        num:3,
        pos:'LI',
        available:false,
        reason:'Lesión',
        min:640,
        g:1,
        a:2
      }
    ],

    next:{
      opponent:'CD Rival',
      date:'Domingo 23 de agosto',
      time:'12:00',
      place:'Campo Municipal'
    },

    tactics:{
      formation:'4-3-3',
      lineup:[]
    },

    settings:{
      coach:'',
      team:'KNATT FC',
      season:'2026/27',
      category:'Primer Equipo'
    }
  };
}

if(!Array.isArray(data.players)){
  data.players=[];
}

data.players=data.players.map((p,index)=>({
  id:p?.id??Date.now()+index,

  name:
    typeof p?.name==='string' &&
    p.name.trim()
      ?p.name
      :'Jugador',

  num:
    p?.num!==undefined &&
    p?.num!==null &&
    String(p.num).trim()!==''
      ?p.num
      :'-',

  pos:
    typeof p?.pos==='string' &&
    p.pos.trim()
      ?p.pos
      :'Jugador',

  available:
    typeof p?.available==='boolean'
      ?p.available
      :true,

  reason:
    typeof p?.reason==='string'
      ?p.reason
      :'',

  min:
    Number.isFinite(Number(p?.min))
      ?Math.max(0,Number(p.min))
      :0,

  g:
    Number.isFinite(Number(p?.g))
      ?Math.max(0,Number(p.g))
      :0,

  a:
    Number.isFinite(Number(p?.a))
      ?Math.max(0,Number(p.a))
      :0
}));

if(!data.next || typeof data.next!=='object'){
  data.next={};
}

data.next.opponent=data.next.opponent||'CD Rival';
data.next.date=data.next.date||'Próximo partido';
data.next.time=data.next.time||'12:00';
data.next.place=data.next.place||'Campo Municipal';

if(!data.tactics || typeof data.tactics!=='object'){
  data.tactics={};
}

data.tactics.formation=data.tactics.formation||'4-3-3';

if(!Array.isArray(data.tactics.lineup)){
  if(Array.isArray(data.tactics.savedLineup)){
    data.tactics.lineup=data.tactics.savedLineup.map(x=>String(x));
  }else{
    data.tactics.lineup=[];
  }
}

if(!data.settings || typeof data.settings!=='object'){
  data.settings={};
}

data.settings.coach=data.settings.coach||'';
data.settings.team=data.settings.team||'KNATT FC';
data.settings.season=data.settings.season||'2026/27';
data.settings.category=data.settings.category||'Primer Equipo';

localStorage.setItem(KEY,JSON.stringify(data));

let section='home';
let filter='all';
let selectedPlayerId=null;

const formations={

  '4-3-3':[
    ['POR',50,91],
    ['LI',18,76],
    ['DFC',38,80],
    ['DFC',62,80],
    ['LD',82,76],
    ['MC',28,59],
    ['MC',50,57],
    ['MC',72,59],
    ['EI',18,37],
    ['DC',50,25],
    ['ED',82,37]
  ],

  '4-4-2':[
    ['POR',50,91],
    ['LI',18,76],
    ['DFC',39,80],
    ['DFC',61,80],
    ['LD',82,76],
    ['MI',14,58],
    ['MC',38,58],
    ['MC',62,58],
    ['MD',86,58],
    ['DC',39,27],
    ['DC',61,27]
  ],

  '4-2-3-1':[
    ['POR',50,91],
    ['LI',18,76],
    ['DFC',39,80],
    ['DFC',61,80],
    ['LD',82,76],
    ['MCD',38,64],
    ['MCD',62,64],
    ['EI',18,44],
    ['MCO',50,45],
    ['ED',82,44],
    ['DC',50,25]
  ],

  '3-5-2':[
    ['POR',50,91],
    ['DFC',28,80],
    ['DFC',50,82],
    ['DFC',72,80],
    ['MI',12,59],
    ['MC',32,59],
    ['MCO',50,53],
    ['MC',68,59],
    ['MD',88,59],
    ['DC',39,27],
    ['DC',61,27]

/* =========================================================
   SELECCIONAR JUGADOR
========================================================= */

function selectPosition(index,playerId){

  playerId=String(playerId||'');

  if(!playerId){

    data.tactics.lineup[index]='';

    save();
    render();

    return;
  }

  const existingIndex=
    data.tactics.lineup.findIndex(
      (id,i)=>
        i!==index &&
        String(id)===playerId
    );

  if(existingIndex!==-1){

    const current=
      data.tactics.lineup[index]||'';

    data.tactics.lineup[index]=
      data.tactics.lineup[existingIndex];

    data.tactics.lineup[existingIndex]=
      current;

  }else{

    data.tactics.lineup[index]=playerId;

  }

  while(
    data.tactics.lineup.length<
    formations[data.tactics.formation].length
  ){
    data.tactics.lineup.push('');
  }

  save();
  render();
}


/* =========================================================
   CAMBIO DE FORMACIÓN
========================================================= */

function normalizeRole(role){

  const map={
    'POR':'POR',

    'LI':'DEF_L',
    'LD':'DEF_R',

    'DFC':'DFC',

    'MI':'MID_L',
    'MD':'MID_R',

    'MC':'MC',
    'MCD':'MC',
    'MCO':'MCO',

    'EI':'ATT_L',
    'ED':'ATT_R',

    'DC':'DC'
  };

  return map[role]||role;
}


function changeFormation(formation){

  if(!formations[formation]){
    return;
  }

  const oldFormation=
    data.tactics.formation;

  const oldSpots=
    formations[oldFormation]||[];

  const oldLineup=
    Array.isArray(data.tactics.lineup)
      ?data.tactics.lineup
      :[];

  const newSpots=
    formations[formation];

  const result=new Array(newSpots.length).fill('');

  const used=new Set();

  /*
    Primero intentamos conservar
    por rol exacto.
  */

  newSpots.forEach((newSpot,newIndex)=>{

    const newRole=normalizeRole(newSpot[0]);

    for(
      let oldIndex=0;
      oldIndex<oldSpots.length;
      oldIndex++
    ){

      if(used.has(oldIndex)){
        continue;
      }

      const oldPlayerId=
        oldLineup[oldIndex];

      if(!oldPlayerId){
        continue;
      }

      const oldRole=
        normalizeRole(oldSpots[oldIndex][0]);

      if(oldRole===newRole){

        result[newIndex]=oldPlayerId;
        used.add(oldIndex);

        break;
      }

    }

  });

  /*
    Después conservamos los jugadores restantes
    en posiciones vacías compatibles.
  */

  newSpots.forEach((newSpot,newIndex)=>{

    if(result[newIndex]){
      return;
    }

    const newRole=
      normalizeRole(newSpot[0]);

    for(
      let oldIndex=0;
      oldIndex<oldSpots.length;
      oldIndex++
    ){

      if(used.has(oldIndex)){
        continue;
      }

      const oldPlayerId=
        oldLineup[oldIndex];

      if(!oldPlayerId){
        continue;
      }

      const oldRole=
        normalizeRole(oldSpots[oldIndex][0]);

      const compatible=
        newRole===oldRole ||
        (
          newRole==='MC' &&
          oldRole==='MCO'
        ) ||
        (
          newRole==='MCO' &&
          oldRole==='MC'
        ) ||
        (
          newRole==='ATT_L' &&
          oldRole==='ATT_R'
        ) ||
        (
          newRole==='ATT_R' &&
          oldRole==='ATT_L'
        ) ||
        (
          newRole==='DEF_L' &&
          oldRole==='DEF_R'
        ) ||
        (
          newRole==='DEF_R' &&
          oldRole==='DEF_L'
        );

      if(compatible){

        result[newIndex]=oldPlayerId;
        used.add(oldIndex);

        break;
      }

    }

  });

  data.tactics.formation=formation;
  data.tactics.lineup=result;

  save();
  render();
}

        <b>${data.players.length}</b>

      </div>

/* =========================================================
   ELIMINAR JUGADOR
========================================================= */

function deletePlayer(id){

  const p=
    data.players.find(
      x=>String(x.id)===String(id)
    );

  if(
    !p ||
    !confirm(
      '¿Eliminar a '+
      p.name+
      ' de la plantilla?'
    )
  ){
    return;
  }

  data.players=
    data.players.filter(
      x=>String(x.id)!==String(id)
    );

  /*
    IMPORTANTE:
    Conservamos los índices de la alineación.
    Solo vaciamos la posición que ocupaba
    el jugador eliminado.
  */

  if(Array.isArray(data.tactics.lineup)){

    data.tactics.lineup=
      data.tactics.lineup.map(
        x=>
          String(x)===String(id)
            ?''
            :x
      );

  }

  save();

  selectedPlayerId=null;
  section='team';

  render();
}


/* =========================================================
   MODAL JUGADOR
========================================================= */

function openPlayerModal(id=null){

  const p=
    id
      ?data.players.find(
        x=>String(x.id)===String(id)
      )
      :null;

  document.getElementById('modal').innerHTML=`

    <div class="modal-head">

      <div class="modal-title">
        ${p?'Editar jugador':'Añadir jugador'}
      </div>

      <button
        class="close-btn"
        onclick="hideModal()"
      >
        ×
      </button>

    </div>

    <form
      onsubmit="submitPlayerForm(event,${p?p.id:'null'})"
    >

      <div class="form-group">

        <label>
          Nombre
        </label>

        <input
          id="mName"
          class="form-input"
          required
          value="${p?escapeHtml(p.name):''}"
          placeholder="Nombre del jugador"
        >

      </div>

      <div class="form-group">

        <label>
          Dorsal
        </label>

        <input
          id="mNum"
          class="form-input"
          inputmode="numeric"
          value="${p?escapeHtml(String(p.num)):''}"
          placeholder="Número"
        >

      </div>

      <div class="form-group">

        <label>
          Posición
        </label>

        <input
          id="mPos"
          class="form-input"
          value="${p?escapeHtml(p.pos):''}"
          placeholder="DC, MC, DFC..."
        >

      </div>

      <div class="form-group">

        <label>
          Disponibilidad
        </label>

        <select
          id="mAvailable"
          class="select"
          onchange="toggleReason()"
        >

          <option
            value="true"
            ${!p||p.available?'selected':''}
          >
            🟢 Disponible
          </option>

          <option
            value="false"
            ${p&&!p.available?'selected':''}
          >
            🔴 No disponible
          </option>

        </select>

      </div>

      <div
        class="form-group"
        id="reasonGroup"
        style="${p&&!p.available?'':'display:none'}"
      >

        <label>
          Motivo de ausencia
        </label>

        <input
          id="mReason"
          class="form-input"
          value="${p?escapeHtml(p.reason):''}"
          placeholder="Lesión, trabajo..."
        >

      </div>

      <div
        class="grid"
        style="margin-bottom:0"
      >

        <div class="form-group">

          <label>
            Minutos
          </label>

          <input
            id="mMin"
            class="form-input"
            inputmode="numeric"
            value="${p?p.min:0}"
          >

        </div>

        <div class="form-group">

          <label>
            Goles
          </label>

          <input
            id="mGoals"
            class="form-input"
            inputmode="numeric"
            value="${p?p.g:0}"
          >

        </div>

      </div>

      <div class="form-group">

        <label>
          Asistencias
        </label>

        <input
          id="mAssists"
          class="form-input"
          inputmode="numeric"
          value="${p?p.a:0}"
        >

      </div>

      <div class="modal-actions">

        <button
          type="button"
          class="btn light"
          onclick="hideModal()"
        >
          Cancelar
        </button>

        <button
          class="btn lime"
          type="submit"
        >
          Guardar
        </button>

      </div>

    </form>

  `;

  showModal();
}


function toggleReason(){

  const show=
    document.getElementById('mAvailable').value==='false';

  document.getElementById('reasonGroup').style.display=
    show
      ?'block'
      :'none';
}


function submitPlayerForm(e,id){

  e.preventDefault();

  const existing=
    id
      ?data.players.find(
        p=>String(p.id)===String(id)
      )
      :null;

  const obj=
    existing||
    {
      id:Date.now(),
      name:'',
      num:'-',
      pos:'Jugador',
      available:true,
      reason:'',
      min:0,
      g:0,
      a:0
    };

  obj.name=
    document
      .getElementById('mName')
      .value
      .trim()||
      'Jugador';

  obj.num=
    document
      .getElementById('mNum')
      .value
      .trim()||
      '-';

  obj.pos=
    document
      .getElementById('mPos')
      .value
      .trim()||
      'Jugador';

  obj.available=
    document
      .getElementById('mAvailable')
      .value==='true';

  obj.reason=
    obj.available
      ?''
      :document
        .getElementById('mReason')
        .value
        .trim();

  obj.min=
    Math.max(
      0,
      Number(
        document
          .getElementById('mMin')
          .value
      )||0
    );

  obj.g=
    Math.max(
      0,
      Number(
        document
          .getElementById('mGoals')
          .value
      )||0
    );

  obj.a=
    Math.max(
      0,
      Number(
        document
          .getElementById('mAssists')
          .value
      )||0
    );

  if(!existing){
    data.players.push(obj);
  }

  save();
  hideModal();
  render();
}


function showModal(){
  document
    .getElementById('modalBackdrop')
    .classList
    .add('show');
}


function hideModal(){
  document
    .getElementById('modalBackdrop')
    .classList
    .remove('show');
}


function closeModal(e){

  if(
    e.target===
    document.getElementById('modalBackdrop')
  ){
    hideModal();
  }

}


/* =========================================================
   EXPORTAR / IMPORTAR
========================================================= */

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement('a');

  a.href=url;
  a.download='knatt-datos.json';

  a.click();

  URL.revokeObjectURL(url);
}


function openImport(){

  document.getElementById('modal').innerHTML=`

    <div class="modal-head">

      <div class="modal-title">
        Importar datos
      </div>

      <button
        class="close-btn"
        onclick="hideModal()"
      >
        ×
      </button>

    </div>

    <div class="muted small">

      Selecciona un archivo JSON
      exportado previamente desde KNATT.

    </div>

    <div style="height:14px"></div>

    <input
      id="importFile"
      class="form-input"
      type="file"
      accept=".json,application/json"
      onchange="importData(event)"
    >

    <div class="modal-actions">

      <button
        class="btn light"
        onclick="hideModal()"
      >
        Cancelar
      </button>

    </div>

  `;

  showModal();
}


function importData(e){

  const file=
    e.target.files?.[0];

  if(!file){
    return;
  }

  const reader=
    new FileReader();

  reader.onload=()=>{

    try{

      const imported=
        JSON.parse(reader.result);

      if(
        !imported ||
        !Array.isArray(imported.players)
      ){
        throw new Error();
      }

      data=imported;

      if(!data.tactics){
        data.tactics={
          formation:'4-3-3',
          lineup:[]
        };
      }

      if(
        !data.tactics.formation ||
        !formations[data.tactics.formation]
      ){
        data.tactics.formation='4-3-3';
      }

      if(
        !Array.isArray(
          data.tactics.lineup
        )
      ){
        data.tactics.lineup=[];
      }

      save();

      hideModal();

      section='home';

      render();

      alert(
        'Datos importados correctamente.'
      );

    }catch(err){

      alert(
        'El archivo no es un JSON válido de KNATT.'
      );

    }

  };

  reader.readAsText(file);
}


/* =========================================================
   RESET
========================================================= */

function resetApp(){

  if(
    !confirm(
      'Esto borrará los datos actuales de KNATT en este dispositivo. ¿Continuar?'
    )
  ){
    return;
  }

  localStorage.removeItem(KEY);

  location.reload();
}


/* =========================================================
   ESCAPAR HTML
========================================================= */

function escapeHtml(str){

  return String(str).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}


/* =========================================================
   INICIAR
========================================================= */

render();

</script>
