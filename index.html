<!doctype html>
<html lang="es">
<head>

<meta charset="utf-8">

  name="viewport"

<title>KNATT</title>

<style>

/* =========================================================
   KNATT — NUEVA INTERFAZ
========================================================= */

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --green:#42c84f;
  --green-dark:#159b36;
  --green-soft:#eaf8ec;

  --dark:#080b0c;
  --dark-2:#111517;
  --dark-3:#1b2022;

  --bg:#f4f5f6;
  --card:#ffffff;

  --text:#111517;
  --muted:#737a7d;
  --line:#e5e7e8;

  --red:#ef5350;
  --yellow:#f5b82e;
  --blue:#4285f4;

  --radius:18px;
}

html,
body{
  margin:0;
  padding:0;
  min-height:100%;
}

body{
  background:var(--dark);
  color:var(--text);
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "Segoe UI",
    sans-serif;
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:100%;
  max-width:520px;
  min-height:100vh;
  margin:auto;
  background:var(--bg);
  padding-bottom:92px;
}


/* =========================================================
   CABECERA
========================================================= */

.app-header{
  background:
    radial-gradient(
      circle at 100% 0,
      #203529 0,
      transparent 38%
    ),
    var(--dark);

  color:white;
  padding:
    calc(18px + env(safe-area-inset-top))
    18px
    18px;

  position:relative;
}

.header-top{
  display:flex;
  align-items:center;
  justify-content:space-between;
}

.brand{
  display:flex;
  align-items:center;
  gap:10px;
}

.brand-ball{
  width:42px;
  height:42px;
  border-radius:13px;
  background:#17211b;
  border:2px solid var(--green);
  display:grid;
  place-items:center;
  font-size:23px;
}

.brand-text{
  font-size:24px;
  font-weight:950;
  letter-spacing:-1px;
}

.brand-text span{
  color:var(--green);
}

.header-actions{
  display:flex;
  gap:8px;
}

.header-icon{
  width:40px;
  height:40px;
  border:0;
  border-radius:13px;
  background:#171c1e;
  color:#fff;
  display:grid;
  place-items:center;
  font-size:18px;
}

.header-sub{
  margin-top:13px;
  color:#aeb5b7;
  font-size:13px;
  font-weight:600;
}

.header-title{
  margin-top:5px;
  font-size:22px;
  font-weight:900;
}


/* =========================================================
   CONTENIDO
========================================================= */

main{
  padding:16px 14px 24px;
}

.page-title{
  font-size:24px;
  font-weight:950;
  letter-spacing:-.7px;
  margin:4px 0 14px;
}

.page-subtitle{
  color:var(--muted);
  font-size:13px;
  margin-top:-7px;
  margin-bottom:16px;
}

.section-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  margin:20px 2px 9px;
}

.section-title b{
  font-size:13px;
  text-transform:uppercase;
  letter-spacing:.5px;
}

.section-title button{
  border:0;
  background:none;
  color:var(--green-dark);
  font-size:12px;
  font-weight:900;
}


/* =========================================================
   TARJETAS
========================================================= */

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  margin-bottom:12px;
  overflow:hidden;
  box-shadow:
    0 5px 18px rgba(0,0,0,.045);
}

.card-pad{
  padding:16px;
}


/* =========================================================
   TARJETA PROXIMO ENTRENAMIENTO
========================================================= */

.training-card{

}

.card-label{

}

.training-main{

}

.status-number.red{

/* =========================================================

.news-item{

.player-number{

.player-avatar{

  place-items:center;

}

.player-info{
  flex:1;

.player-name{
  font-size:13px;

.player-status{

.player-status.absent{

}

.player-status.warning{
  background:var(--yellow);
}

.player-arrow{
  color:#999fa1;
  font-size:17px;
}


/* =========================================================
   BOTON FLOTANTE
========================================================= */

.fab{
  position:fixed;
  right:max(18px,calc((100vw - 520px)/2 + 18px));
  bottom:90px;
  width:52px;
  height:52px;
  border:0;
  border-radius:50%;
  background:var(--green);
  color:#fff;
  font-size:28px;
  box-shadow:0 8px 22px #159b3660;
  z-index:15;

/* =========================================================
   TÁCTICA
========================================================= */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  margin-bottom:12px;
}

.select{
  width:100%;
  border:1px solid var(--line);
  border-radius:13px;
  padding:11px;
  background:#fff;
  font-weight:850;
  outline:none;
}

.btn{
  border:0;
  border-radius:13px;
  padding:11px 14px;
  background:var(--dark);
  color:#fff;
  font-size:12px;
  font-weight:900;
}

.btn.green{
  background:var(--green);
  color:#fff;
}

.btn.light{
  background:#e9edef;
  color:#303638;
}

.btn.full{
  width:100%;
}

.pitch-wrap{
  background:#dce6df;
  border-radius:21px;
  padding:9px;
  box-shadow:0 7px 22px #00000010;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  overflow:hidden;
  border-radius:16px;

  background:
    repeating-linear-gradient(
      90deg,
      #328b51 0,
      #328b51 8.33%,
      #378f56 8.33%,
      #378f56 16.66%
    );
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #ffffff88;
  border-radius:9px;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #ffffff88;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #ffffff88;
  border-radius:50%;
  left:36.5%;
  top:36.5%;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  border-radius:50%;
  background:#fff;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #ffffff88;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid white;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}

.position-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:106px;
  display:flex;
  flex-direction:column;
  align-items:center;
  z-index:5;
}

.position-role{
  background:var(--dark);
  color:#fff;
  border-radius:999px;
  padding:7px 10px;
  font-size:10px;
  font-weight:950;
  margin-bottom:4px;
}

.position-select{
  width:106px;
  border:2px solid var(--green);
  background:#fff;
  color:#17201b;
  border-radius:12px;
  padding:8px 18px 8px 7px;
  font-size:10px;
  font-weight:900;
}

.position-name{
  width:106px;
  background:#ffffffef;
  border-radius:11px;
  padding:6px;
  text-align:center;
  font-size:10px;
  font-weight:950;
  box-shadow:0 3px 10px #0002;
  overflow-wrap:anywhere;
}

.position-select.selected{
  position:absolute;
  left:0;
  top:27px;
  opacity:0;
  width:106px;
  height:31px;
  z-index:10;
}


/* =========================================================
   ALINEACIÓN
========================================================= */

.lineup-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:9px 0;
  border-bottom:1px solid var(--line);
}

.lineup-row:last-child{
  border-bottom:0;
}

.lineup-position{
  background:var(--dark);
  color:#fff;
  border-radius:999px;
  padding:6px 8px;
  font-size:9px;
  font-weight:950;
}

.lineup-player{
  font-size:12px;
  font-weight:800;
}


/* =========================================================
   PARTIDOS
========================================================= */

.big-match{
  text-align:center;
  padding:18px;
}

.big-match-label{
  font-size:10px;
  color:var(--muted);

}

.big-match-teams{

}

.big-match .team-logo{

/* =========================================================

.more-profile{

    linear-gradient(
      145deg,
      #101516,

    );

}

.profile-avatar{

.profile-name{

.more-list{

.more-icon{

}

.more-label{

}


/* =========================================================

.stats-grid{

.stat-box{

.bottom-nav{

<body>

<div class="app">

  <header class="app-header">

    <div class="header-top">

      <div class="brand">

        <div class="brand-ball">
          ⚽
        </div>

        <div class="brand-text">
          KNA<span>TT</span>
        </div>

      </div>

      <div class="header-actions">

        <button
          class="header-icon"
          onclick="showSection('more')">
          🔔
        </button>

      </div>

    </div>

    <div class="header-sub">
      Gestión de equipo de fútbol
    </div>

    <div class="header-title">
      Primer Equipo
    </div>

  </header>


  <main id="content"></main>


  <nav
    class="bottom-nav"
    id="nav">
  </nav>


</div>


<script>

/* =========================================================
   DATOS
========================================================= */

const KEY='teamhub-v2';

let data=null;

try{

  const saved=localStorage.getItem(KEY);

  data=saved
    ?JSON.parse(saved)
    :null;

}catch(error){

  console.error(error);

}


if(!data || typeof data!=='object'){

  data={

    players:[

      {
        id:1,
        name:'Montiimontys',
        num:9,
        pos:'DC',
        available:true,
        reason:'',
        min:1126,
        g:12,
        a:6
      },

      {
        id:2,
        name:'Marc',
        num:7,
        pos:'MC',
        available:true,
        reason:'',
        min:1030,
        g:5,
        a:8
      },

      {
        id:3,
        name:'Juan',
        num:4,
        pos:'DFC',
        available:false,
        reason:'Trabajo',
        min:980,
        g:4,
        a:3
      },

      {
        id:4,
        name:'Alex',
        num:1,
        pos:'POR',
        available:true,
        reason:'',
        min:1260,
        g:0,
        a:1
      },

      {
        id:5,
        name:'Pedro',
        num:3,
        pos:'LI',
        available:false,
        reason:'Lesión',
        min:640,
        g:1,
        a:2
      }

    ],

    next:{
      opponent:'CD Rival',
      date:'Domingo 24 de agosto',
      time:'12:00',
      place:'Campo Municipal'
    },

    tactics:{
      formation:'4-3-3',
      lineup:[]
    },

    settings:{
      coach:'',
      team:'KNATT FC',
      season:'2026/27',
      category:'Primer Equipo'
    }

  };

}


/* =========================================================
   REPARAR DATOS
========================================================= */

if(!Array.isArray(data.players)){
  data.players=[];
}

data.players=data.players.map(
  (p,index)=>({

    id:p?.id??Date.now()+index,

    name:
      typeof p?.name==='string' &&
      p.name.trim()
      ?p.name
      :'Jugador',

    num:
      p?.num!==undefined &&
      p?.num!==null
      ?p.num
      :'-',

    pos:
      typeof p?.pos==='string' &&
      p.pos.trim()
      ?p.pos

function team(){

  const filtered=
    data.players.filter(
      p=>{

          return !p.available;
        }

        return true;

      }
    );


  const groups=[
    ['POR','Porteros'],
    ['DFC','Defensas'],
    ['LI','Defensas'],
    ['LD','Defensas'],
    ['MC','Centrocampistas'],
    ['MCO','Centrocampistas'],
    ['MCD','Centrocampistas'],
    ['MI','Centrocampistas'],
    ['MD','Centrocampistas'],
    ['DC','Delanteros'],
    ['EI','Delanteros'],
    ['ED','Delanteros']
  ];


  const categories={};

  filtered.forEach(
    p=>{

      let category='Centrocampistas';

      if(p.pos==='POR'){
        category='Porteros';
      }

      else if(
        ['DFC','LI','LD'].includes(p.pos)

      if(!categories[category]){

  return `

        onclick="filter='available';render()">
        Disponibles
      </button>

        class="filter ${filter==='absent'?'active':''}"

        Ausentes
      </button>

    ${
      Object.keys(categories)
      .map(
        category=>`

          <div class="player-section-title">
            ${category}

          <div class="card">

            ${
              categories[category]
              .map(
                p=>`

                  <div
                    class="player-card"

                    <div class="player-number">
                      ${escapeHtml(String(p.num))}

                    <div class="player-avatar">

                      ${

                        ${escapeHtml(p.name)}

                      <div class="player-meta">

                        ${Number(p.g)||0} ⚽

                        ${Number(p.a)||0} 🎯

                    </div>

                    <div
                      class="player-status ${
                        p.available?'':'absent'

                    </div>

                    <div class="player-arrow">
                      ›

                `

              .join('')

    }

/* =========================================================

========================================================= */

function deletePlayer(id){

  const player=
    data.players.find(
      p=>String(p.id)===String(id)
    );

  if(!player){
    return;
  }

  if(
    !confirm(
      '¿Eliminar a '+player.name+'?'
    )
  ){
    return;
  }

  data.players=
    data.players.filter(
      p=>String(p.id)!==String(id)
    );


  /*
    IMPORTANTE:
    Mantenemos los índices de la alineación.
    Solo vaciamos la posición del jugador eliminado.
  */

  if(Array.isArray(data.tactics.lineup)){

    data.tactics.lineup=
      data.tactics.lineup.map(
        id2=>
          String(id2)===String(id)
          ?''
          :id2
      );

  }

  save();

  selectedPlayerId=null;

  section='team';

  render();

}

/* =========================================================
   POSICIÓN
========================================================= */

function positionSlot(
  spot,
  index,
  lineup
){

  const role=spot[0];

  const x=spot[1];

  const y=spot[2];

  const selectedId=
    lineup[index]||'';

  const player=
    data.players.find(
      p=>String(p.id)===String(selectedId)
    );


  if(player){

    return `

      <div
        class="position-slot"
        style="
          left:${x}%;
          top:${y}%
        ">

        <div class="position-role">
          ${escapeHtml(role)}
        </div>

        <div class="position-name">
          ${escapeHtml(player.name)}
        </div>

        <select
          class="position-select selected"
          onchange="selectPosition(${index},this.value)">

          <option value="">
            Quitar jugador
          </option>

          ${
            data.players
            .map(
              p=>`

                <option
                  value="${p.id}"
                  ${String(p.id)===String(selectedId)
                    ?'selected'
                    :''
                  }>

                  ${escapeHtml(p.name)}

                  ${
                    !p.available
                    ?' · 🔴'
                    :''
                  }

                </option>

              `
            )
            .join('')
          }

        </select>

      </div>

    `;

  }


  return `

    <div
      class="position-slot"
      style="
        left:${x}%;
        top:${y}%
      ">

      <div class="position-role">
        ${escapeHtml(role)}
      </div>

      <select
        class="position-select"
        onchange="selectPosition(${index},this.value)">

        <option value="">
          -- ${escapeHtml(role)} --
        </option>

        ${
          data.players
          .map(
            p=>`

              <option
                value="${p.id}"
                ${!p.available?'disabled':''}>

                ${escapeHtml(p.name)}
                ${!p.available?' · 🔴 No disponible':''}

              </option>

            `
          )
          .join('')
        }

      </select>

    </div>

  `;

}


/* =========================================================
   SELECCIONAR POSICIÓN
========================================================= */

function selectPosition(
  index,
  playerId
){

  playerId=
    String(playerId||'');


  if(!playerId){

    data.tactics.lineup[index]='';

    save();

    render();

    return;

  }


  const player=
    data.players.find(
      p=>String(p.id)===playerId
    );


  if(!player || !player.available){

    alert(
      'Este jugador no está disponible.'
    );

    render();

    return;

  }


  const existingIndex=
    data.tactics.lineup.findIndex(
      (id,i)=>
        i!==index &&
        String(id)===playerId
    );


  if(existingIndex!==-1){

    const current=
      data.tactics.lineup[index]||'';

    data.tactics.lineup[index]=
      data.tactics.lineup[existingIndex];

    data.tactics.lineup[existingIndex]=
      current;

  }

  else{

    data.tactics.lineup[index]=
      playerId;

  }


  while(
    data.tactics.lineup.length<
    formations[data.tactics.formation].length
  ){

    data.tactics.lineup.push('');

  }


  save();

  render();

}


/* =========================================================
   CAMBIO FORMACIÓN
   Conserva por rol
========================================================= */

function changeFormation(
  formation
){

  if(!formations[formation]){
    return;
  }

  const oldFormation=
    data.tactics.formation;

  const oldSpots=
    formations[oldFormation];

  const oldLineup=
    data.tactics.lineup||[];

  const newSpots=
    formations[formation];

  const used=new Set();

  const newLineup=
    newSpots.map(
      newSpot=>{

        const newRole=
          newSpot[0];

        let found='';

        /*
          Primero buscamos mismo rol.
        */

        for(
          let i=0;
          i<oldSpots.length;
          i++
        ){

          if(used.has(i)){
            continue;
          }

          if(
            oldSpots[i][0]===newRole &&
            oldLineup[i]
          ){

            found=
              oldLineup[i];

            used.add(i);

            break;

          }

        }

        return found;

      }
    );


  /*
    Segundo intento:
    conservar jugadores que no hayan
    encontrado rol equivalente.
  */

  oldLineup.forEach(
    (playerId,i)=>{

      if(!playerId || used.has(i)){
        return;
      }

      const freeIndex=
        newLineup.findIndex(
          x=>!x
        );

      if(freeIndex!==-1){

        newLineup[freeIndex]=
          playerId;

      }

    }
  );


  data.tactics.formation=
    formation;

  data.tactics.lineup=
    newLineup;

  save();

  render();

}


/* =========================================================
   RESET
========================================================= */

function resetTactic(){

  data.tactics.lineup=
    formations[data.tactics.formation]
    .map(
      ()=>''
    );

  save();

  render();

}


function saveTactic(){

  save();

  const count=
    data.tactics.lineup
    .filter(Boolean)
    .length;

  alert(
    'Alineación guardada.\n\n'+
    count+
    ' de 11 posiciones seleccionadas.'
  );

}

/* =========================================================

========================================================= */

function exportData(){

  const blob=
    new Blob(
      [
        JSON.stringify(
          data,
          null,
          2
        )
      ],
      {
        type:'application/json'
      }
    );

  const url=
    URL.createObjectURL(blob);

  const a=
    document.createElement('a');

  a.href=url;

  a.download=
    'knatt-datos.json';

  a.click();

  URL.revokeObjectURL(url);

}

/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHtml(str){

  return String(str).replace(
    /[&<>"']/g,
    m=>({

      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m])
  );

}
