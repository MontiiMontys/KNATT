function save(){localStorage.setItem(KEY,JSON.stringify(data));}
function go(s){section=s;selectedPlayerId=null;render();}
function getSelectedPlayer(){return data.players.find(p=>String(p.id)===String(selectedPlayerId));}
function roleName(){return 'Entrenador';}
function navItems(){return [['home','ð ','Inicio'],['team','ð¥','Plantilla'],['tactic','ð§ ','TÃ¡ctica'],['matches','ð','Partidos'],['stats','ð','Stats'],['settings','âï¸','Config.']];}

function render(){
  document.getElementById('nav').innerHTML=navItems().map(x=>`<button class="${section===x[0]?'active':''}" onclick="go('${x[0]}')">${x[1]}<br>${x[2]}</button>`).join('');

  c.innerHTML='';
  if(section==='home')c.innerHTML=home();
  if(section==='team')c.innerHTML=team();

function openPlayer(id){selectedPlayerId=id;section='player';render();}

function editPlayer(){
  const p=getSelectedPlayer();if(!p)return;
  const name=prompt('Nombre del jugador:',p.name);if(name===null)return;
  const num=prompt('NÃºmero de camiseta:',p.num);if(num===null)return;
  const pos=prompt('PosiciÃ³n:',p.pos);if(pos===null)return;
  const available=confirm('Â¿EstÃ¡ disponible para jugar?\n\nAceptar = SÃ­\nCancelar = No');
  let reason='';
  if(!available){const r=prompt('Motivo de la ausencia:',p.reason||'');if(r!==null)reason=r.trim();}
  const min=prompt('Minutos jugados:',p.min);if(min===null)return;
  const goals=prompt('Goles:',p.g);if(goals===null)return;
  const assists=prompt('Asistencias:',p.a);if(assists===null)return;
  p.name=name.trim()||p.name;p.num=num.trim()||p.num;p.pos=pos.trim()||p.pos;p.available=available;p.reason=reason;
  p.min=Math.max(0,Number(min)||0);p.g=Math.max(0,Number(goals)||0);p.a=Math.max(0,Number(assists)||0);
  save();render();
}

function addPlayer(){
  const name=prompt('Nombre del jugador:');if(!name||!name.trim())return;
  const num=prompt('NÃºmero de camiseta:','');if(num===null)return;
  const pos=prompt('PosiciÃ³n:','');if(pos===null)return;
  data.players.push({id:Date.now(),name:name.trim(),num:num.trim()||'-',pos:pos.trim()||'Jugador',available:true,reason:'',min:0,g:0,a:0});
  save();section='team';render();
}

function deletePlayer(id){
  const player=data.players.find(p=>String(p.id)===String(id));if(!player)return;
  if(!confirm('Â¿Seguro que quieres eliminar a '+player.name+' de la plantilla?'))return;
  data.players=data.players.filter(p=>String(p.id)!==String(id));
  Object.keys(data.tactics.positions).forEach(k=>{if(String(data.tactics.positions[k].playerId)===String(id))delete data.tactics.positions[k];});
  data.tactics.savedLineup=data.tactics.savedLineup.filter(x=>String(x)!==String(id));
  save();selectedPlayerId=null;section='team';render();
}

function home(){
  const available=data.players.filter(p=>p.available).length;
  const absent=data.players.filter(p=>!p.available).length;
  const goals=data.players.reduce((s,p)=>s+(Number(p.g)||0),0);
  return `<div class="title">Panel del equipo</div>
  <div class="card hero"><div class="section-label" style="color:#b9e86c">PRÃXIMO PARTIDO</div><div class="big">${data.settings.team} ð ${data.next.opponent}</div>
  <div class="match-meta"><div class="team-ball">â½</div><div class="match-info"><div class="match-date">${data.next.date} Â· ${data.next.time}</div><div class="match-place">ð ${data.next.place}</div></div></div>
  <button class="btn lime full" onclick="go('matches')">Ver partido â</button></div>
  <div class="section-label">RESUMEN DEL EQUIPO</div><div class="grid">

  <div class="card"><div class="section-label">TÃCTICA</div><div class="big">Prepara tu alineaciÃ³n</div><div class="muted small">Elige una formaciÃ³n y coloca a tus jugadores en el campo.</div><br><button class="btn lime full" onclick="go('tactic')">ð§  Abrir pizarra tÃ¡ctica â</button></div>
  <div class="card"><div class="section-label">AUSENCIAS</div>${data.players.filter(p=>!p.available).map(p=>`<div class="item"><div class="avatar">â½</div><div class="grow"><b>${p.num} Â· ${p.name}</b><div class="muted small">${p.pos}</div></div><span class="pill danger">${p.reason||'Ausente'}</span></div>`).join('')||'<div class="muted">Ninguna</div>'}</div>`;
}

function team(){
  const list=data.players.filter(p=>filter==='all'||(filter==='available'?p.available:!p.available));
  return `<div class="title">Plantilla</div><div class="add-player"><button class="btn lime full" onclick="addPlayer()">â AÃ±adir jugador</button></div>

  <div class="card">${list.length?list.map(p=>`<div class="item" onclick="openPlayer(${p.id})" style="cursor:pointer"><div class="avatar">${p.pos==='POR'?'ð§¤':'â½'}</div><div class="grow"><b>${p.num} Â· ${p.name}</b><div class="muted small">${p.pos} Â· ${p.available?'ð¢ Disponible':'ð´ '+(p.reason||'Ausente')}</div><div class="muted small">${Number(p.g)||0} â½ Â· ${Number(p.a)||0} ð¯ Â· ${Number(p.min)||0} min</div></div><button class="delete-btn" onclick="event.stopPropagation();deletePlayer(${p.id})" title="Eliminar jugador">ðï¸</button></div>`).join(''):`<div class="muted" style="text-align:center;padding:20px 0">No hay jugadores en este filtro.</div>`}</div>`;

function tactic(){
  const formation=data.tactics.formation;

  const positions=data.tactics.positions||{};
  const fieldPlayers=data.players.filter(p=>positions[String(p.id)]);
  const onFieldIds=fieldPlayers.map(p=>String(p.id));
  return `<div class="title">TÃ¡ctica</div>
  <div class="card"><div class="section-label">PIZARRA TÃCTICA</div><div class="big">Crear alineaciÃ³n</div><div class="muted small">Elige una formaciÃ³n y arrastra los jugadores al campo. DespuÃ©s puedes moverlos libremente.</div></div>
  <div class="tactic-toolbar"><div class="select-wrap"><label>FormaciÃ³n</label><select class="select" onchange="changeFormation(this.value)">${Object.keys(formations).map(f=>`<option value="${f}" ${f===formation?'selected':''}>${f}</option>`).join('')}</select></div><button class="btn light" onclick="resetTactic()">âº Reset</button></div>
  <div class="pitch-wrap"><div class="pitch" id="pitch" onpointermove="moveDrag(event)" onpointerup="endDrag(event)" onpointercancel="endDrag(event)"><div class="pitch-line"></div><div class="pitch-circle"></div><div class="pitch-center"></div><div class="box top"></div><div class="box bottom"></div><div class="goal top"></div><div class="goal bottom"></div>
  ${fieldPlayers.map(p=>{const pos=positions[String(p.id)];return `<div class="player-token" data-player-id="${p.id}" style="left:${pos.x}%;top:${pos.y}%" onpointerdown="startDrag(event,${p.id},'field')"><span class="token-num">#${p.num}</span><span>${escapeHtml(shortName(p.name))}</span></div>`;}).join('')}</div></div>
  <div class="card"><div class="section-label">JUGADORES</div><div class="muted small" style="margin-bottom:8px">Arrastra un jugador al campo. Los que ya estÃ¡n colocados aparecen marcados.</div><div class="bench">${data.players.map(p=>`<div class="bench-player ${onFieldIds.includes(String(p.id))?'on-field':''}" onpointerdown="startDrag(event,${p.id},'bench')"><b>#${p.num} Â· ${escapeHtml(shortName(p.name))}</b><small>${p.pos}${onFieldIds.includes(String(p.id))?' Â· En campo':''}</small></div>`).join('')||'<div class="muted">AÃ±ade jugadores desde Plantilla.</div>'}</div></div>
  <div class="tactic-actions"><button class="btn lime" onclick="saveTactic()">ð¾ Guardar alineaciÃ³n</button><button class="btn light" onclick="clearTactic()">ð§¹ Vaciar campo</button></div>
  <div class="notice">ð¡ Puedes colocar cualquier jugador en cualquier zona, aunque su posiciÃ³n habitual sea diferente.</div>`;
}

function shortName(name){const s=String(name||'Jugador');return s.length>12?s.slice(0,11)+'â¦':s;}
function escapeHtml(str){return String(str).replace(/[&<>"']/g,m=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#039;'}[m]));}

function changeFormation(formation){
  data.tactics.formation=formation;
  const spots=formations[formation];
  const currentIds=Object.keys(data.tactics.positions).map(String);
  const keep=currentIds.slice(0,spots.length);
  const next={};
  keep.forEach((id,i)=>{next[id]={x:spots[i][1],y:spots[i][2],role:spots[i][0]};});
  data.tactics.positions=next;save();render();
}

function resetTactic(){
  const formation=data.tactics.formation;const spots=formations[formation];const next={};
  data.players.slice(0,spots.length).forEach((p,i)=>{next[String(p.id)]={x:spots[i][1],y:spots[i][2],role:spots[i][0]};});
  data.tactics.positions=next;save();render();
}

function clearTactic(){data.tactics.positions={};save();render();}

function saveTactic(){data.tactics.savedLineup=Object.keys(data.tactics.positions);save();alert('AlineaciÃ³n guardada correctamente.');}

function startDrag(event,playerId,source){
  event.preventDefault();event.stopPropagation();
  draggingPlayerId=String(playerId);dragSource=source;
  const pitch=document.getElementById('pitch');
  if(!pitch)return;
  if(source==='bench'){
    const rect=pitch.getBoundingClientRect();
    const x=Math.max(4,Math.min(96,((event.clientX-rect.left)/rect.width)*100));
    const y=Math.max(4,Math.min(96,((event.clientY-rect.top)/rect.height)*100));
    data.tactics.positions[draggingPlayerId]={x,y,role:'Libre'};
    save();render();
  }
  const token=document.querySelector(`.player-token[data-player-id="${CSS.escape(draggingPlayerId)}"]`);
  if(token)token.classList.add('dragging');
}

function moveDrag(event){
  if(!draggingPlayerId)return;
  event.preventDefault();
  const pitch=document.getElementById('pitch');if(!pitch)return;
  const rect=pitch.getBoundingClientRect();
  const x=Math.max(5,Math.min(95,((event.clientX-rect.left)/rect.width)*100));
  const y=Math.max(5,Math.min(95,((event.clientY-rect.top)/rect.height)*100));
  if(data.tactics.positions[draggingPlayerId]){data.tactics.positions[draggingPlayerId].x=x;data.tactics.positions[draggingPlayerId].y=y;}
  const token=document.querySelector(`.player-token[data-player-id="${CSS.escape(draggingPlayerId)}"]`);
  if(token){token.style.left=x+'%';token.style.top=y+'%';}
}

function endDrag(){
  if(!draggingPlayerId)return;
  const token=document.querySelector(`.player-token[data-player-id="${CSS.escape(draggingPlayerId)}"]`);if(token)token.classList.remove('dragging');
  save();draggingPlayerId=null;dragSource='';
}

function matches(){return `<div class="title">Partidos</div><div class="card hero"><div class="section-label" style="color:#b9e86c">PRÃXIMO PARTIDO</div><div class="big">${data.settings.team} ð ${data.next.opponent}</div><div class="match-meta"><div class="team-ball">â½</div><div class="match-info"><div class="match-date">${data.next.date}</div><div class="match-place">${data.next.time} Â· ${data.next.place}</div></div></div><button class="btn lime full" onclick="go('tactic')">ð§  Preparar alineaciÃ³n</button></div>
<div class="card"><div class="section-label">HISTORIAL</div><div class="muted">AquÃ­ podremos aÃ±adir resultados y estadÃ­sticas de partidos en la siguiente fase.</div></div>`;}

function stats(){
  const sorted=[...data.players].sort((a,b)=>(Number(b.g)||0)-(Number(a.g)||0));
  const totalGoals=data.players.reduce((s,p)=>s+(Number(p.g)||0),0);const totalAssists=data.players.reduce((s,p)=>s+(Number(p.a)||0),0);const totalMinutes=data.players.reduce((s,p)=>s+(Number(p.min)||0),0);
  return `<div class="title">EstadÃ­sticas del equipo</div><div class="grid"><div class="stat accent"><b>${totalGoals}</b><span>Goles</span></div><div class="stat"><b>${totalAssists}</b><span>Asistencias</span></div><div class="stat"><b>${totalMinutes}</b><span>Minutos</span></div><div class="stat"><b>${data.players.length}</b><span>Jugadores</span></div></div><div class="card"><div class="section-label">RENDIMIENTO DE PLANTILLA</div>${sorted.map(p=>`<div class="item"><div class="avatar">${p.pos==='POR'?'ð§¤':'â½'}</div><div class="grow"><b>${p.num} Â· ${p.name}</b><div class="muted small">${p.pos}</div></div><div style="text-align:right"><b>${Number(p.min)||0}</b><div class="muted small">${Number(p.g)||0} â½ Â· ${Number(p.a)||0} ð¯</div></div></div>`).join('')||'<div class="muted">No hay jugadores.</div>'}</div>`;
}

function settings(){
  return `<div class="title">ConfiguraciÃ³n</div><div class="card"><div class="section-label">PERFIL DEL ENTRENADOR</div><div class="form-group"><label>Nombre</label><input id="coachName" class="form-input" value="${escapeHtml(data.settings.coach)}" placeholder="Nombre del entrenador"></div><button class="btn lime full" onclick="saveSettings()">ð¾ Guardar cambios</button></div>
  <div class="card"><div class="section-label">EQUIPO</div><div class="form-group"><label>Equipo</label><input id="teamName" class="form-input" value="${escapeHtml(data.settings.team)}"></div><div class="form-group"><label>Temporada</label><input id="seasonName" class="form-input" value="${escapeHtml(data.settings.season)}"></div><div class="form-group"><label>CategorÃ­a</label><input id="categoryName" class="form-input" value="${escapeHtml(data.settings.category)}"></div><button class="btn full" onclick="saveSettings()">Guardar equipo</button></div>
  <div class="card"><div class="section-label">DATOS</div><div class="muted small">Los datos de KNATT se guardan localmente en este dispositivo.</div><br><button class="btn light full" onclick="exportData()">ð¤ Exportar datos</button><br><br><button class="btn light full" onclick="resetApp()">â»ï¸ Restaurar datos de ejemplo</button></div>`;
}

function saveSettings(){
  data.settings.coach=document.getElementById('coachName').value.trim();data.settings.team=document.getElementById('teamName').value.trim()||'KNATT FC';data.settings.season=document.getElementById('seasonName').value.trim()||'2026/27';data.settings.category=document.getElementById('categoryName').value.trim()||'Primer Equipo';save();render();
}
function exportData(){
  const blob=new Blob([JSON.stringify(data,null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download='knatt-datos.json';a.click();URL.revokeObjectURL(url);
}
function resetApp(){if(!confirm('Esto borrarÃ¡ los datos actuales de KNATT en este dispositivo. Â¿Continuar?'))return;localStorage.removeItem(KEY);location.reload();}

render();
</script>
