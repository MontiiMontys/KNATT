<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0b0d">
<title>KNATT</title>

<style>

*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --red:#e21d2f;
  --red2:#b90f20;
  --dark:#0b0b0d;
  --dark2:#17171a;
  --bg:#f5f5f6;
  --card:#fff;
  --text:#17171a;
  --muted:#77777e;
  --line:#e6e6e9;
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "Segoe UI",
    sans-serif;
  color:var(--text);
}

button,
input,
select{
  font:inherit;
}

button{
  cursor:pointer;
}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:82px;
}


/* =====================================================
   CABECERA
===================================================== */

header{
  background:var(--dark);
  color:#fff;
  padding:
    calc(12px + env(safe-area-inset-top))
    18px
    14px;
}

.header-row,
.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
}

.brand{
  font-size:27px;
  font-weight:950;
  letter-spacing:-1px;
}

.brand span{
  color:#ff3b4d;
}

.role{
  font-size:11px;
  color:#aaa;
  margin-top:2px;
  font-weight:700;
}

.header-bell{
  width:38px;
  height:38px;
  border-radius:12px;
  background:#ffffff10;
  border:1px solid #ffffff12;
  color:#fff;
}

main{
  padding:14px 14px 24px;
}


/* =====================================================
   GENERAL
===================================================== */

.title{
  font-size:25px;
  font-weight:950;
  letter-spacing:-.7px;
}

.subtitle{
  font-size:12px;
  color:var(--muted);
  font-weight:700;
  margin-top:2px;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin:3px 2px 13px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:18px;
  padding:16px;
  margin-bottom:12px;
  box-shadow:0 7px 24px #14141914;
}

.card-dark{
  background:var(--dark2);
  color:#fff;
  border-color:#2b2b30;
}

.section-label{
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px;
}

.big{
  font-size:21px;
  font-weight:950;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:12px;
}

.btn{
  border:0;
  border-radius:11px;
  padding:12px 14px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:13px;
}

.btn.light{
  background:#f0f0f2;
  color:#222;
  box-shadow:none;
}

.btn.red-soft{
  background:#fff0f2;
  color:var(--red);
  box-shadow:none;
}

.btn.full{
  width:100%;
}


/* =====================================================
   ESTADÍSTICAS
===================================================== */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(4,1fr);
  gap:7px;
  margin-bottom:13px;
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:15px;
  padding:12px 8px;
  text-align:center;
}

.card-dark .stat{
  background:#202024;
  border-color:#303036;
}

.stat b{
  display:block;
  font-size:21px;
  font-weight:950;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
  margin-top:2px;
}

.stat.red{
  background:#fff0f2;
  border-color:#ffd7dc;
}

.stat.red b{
  color:var(--red);
}


/* =====================================================
   INICIO
===================================================== */

.home-title-row{
  margin-top:0;
  margin-bottom:12px;
}

.home-title-row .title{
  font-size:26px;
}

.home-title-row .subtitle{
  font-size:13px;
  margin-top:3px;
}

.home-match-card{
  padding:17px;
  border-radius:20px;
}

.home-match-card .section-label{
  margin-bottom:8px;
}

.home-match-card .big{
  font-size:22px;
  line-height:1.15;
}

.home-match-card .versus{
  margin:15px 0 16px;
}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

.match-countdown{
  text-align:center;
  margin-top:-6px;
  margin-bottom:14px;
  font-size:11px;
  font-weight:850;
  color:var(--muted);
}

.match-countdown strong{
  color:var(--red);
  font-weight:950;
}


/* =====================================================
   ACCESO RÁPIDO PLANTILLA
===================================================== */

.home-quick-card{
  display:flex;
  align-items:center;
  gap:12px;
  padding:14px 15px;
  cursor:pointer;
}

.home-quick-icon{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#fff0f2;
  color:var(--red);
  display:grid;
  place-items:center;
  font-size:21px;
}

.home-quick-content{
  flex:1;
  min-width:0;
}

.home-quick-title{
  font-size:13px;
  font-weight:950;
}

.home-quick-subtitle{
  font-size:10px;
  color:var(--muted);
  font-weight:750;
  margin-top:2px;
}

.home-quick-arrow{
  font-size:22px;
  color:#99999f;
}


/* =====================================================
   ÚLTIMA ACTIVIDAD
===================================================== */

.home-activity-card{
  padding:16px;
}

.activity-item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px 0;
  border-bottom:1px solid #ededf0;
}

.activity-item:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.activity-item:first-child{
  padding-top:2px;
}

.activity-icon{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border-radius:10px;
  background:#f0f0f2;
  display:grid;
  place-items:center;
  font-size:16px;
}

.activity-content{
  flex:1;
  min-width:0;
}

.activity-title{
  font-size:11px;
  font-weight:900;
}

.activity-time{
  font-size:9px;
  color:var(--muted);
  margin-top:2px;
}

.activity-empty{
  padding:7px 0 2px;
  font-size:11px;
  color:var(--muted);
  font-weight:700;
}


/* =====================================================
   PLANTILLA
===================================================== */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:12px;
}

.tab{
  border:0;
  border-radius:999px;
  padding:9px 13px;
  background:#e9e9ec;
  color:#5e5e64;
  font-size:11px;
  font-weight:850;
  white-space:nowrap;
}

.tab.active{
  background:var(--red);
  color:#fff;
}

.item{
  display:flex;
  align-items:center;
  gap:10px;
  padding:12px 0;
  border-bottom:1px solid #ededf0;
}

.item:last-child{
  border:0;
}

.avatar{
  width:42px;
  height:42px;
  flex:0 0 42px;
  border-radius:13px;
  background:#ececef;
  display:grid;
  place-items:center;
  font-size:20px;
}

.grow{
  flex:1;
  min-width:0;
}

.item b{
  font-size:13px;
}

.item .muted{
  font-size:10px;
  margin-top:2px;
}


/* =====================================================
   FORMULARIOS
===================================================== */

.form-group{
  margin-bottom:12px;
}

.form-group label{
  display:block;
  font-size:10px;
  text-transform:uppercase;
  letter-spacing:.7px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px;
}

.form-input,
.select{
  width:100%;
  border:1px solid var(--line);
  background:#fafafa;
  border-radius:11px;
  padding:11px;
  font-size:14px;
  outline:none;
}

.form-input:focus,
.select:focus{
  border-color:#ffb5bd;
  box-shadow:0 0 0 3px #fff0f2;
}


/* =====================================================
   MODAL JUGADOR
===================================================== */

.edit-modal{
  position:fixed;
  inset:0;
  z-index:1000;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:
    calc(18px + env(safe-area-inset-top))
    14px
    calc(18px + env(safe-area-inset-bottom));
  background:rgba(0,0,0,.52);
  backdrop-filter:blur(7px);
  -webkit-backdrop-filter:blur(7px);
}

.edit-modal-card{
  width:min(500px,100%);
  max-height:calc(100vh - 36px);
  overflow-y:auto;
  background:#fff;
  border-radius:22px;
  box-shadow:0 20px 60px rgba(0,0,0,.3);
  padding:20px;
  -webkit-overflow-scrolling:touch;
}

.edit-modal-header{
  display:flex;
  align-items:flex-start;
  justify-content:space-between;
  gap:12px;
  margin-bottom:18px;
}

.edit-modal-title{
  font-size:22px;
  font-weight:950;
  letter-spacing:-.5px;
}

.edit-modal-subtitle{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  margin-top:3px;
}

.edit-modal-close{
  width:34px;
  height:34px;
  flex:0 0 34px;
  border:0;
  border-radius:10px;
  background:#f0f0f2;
  color:#555;
  font-size:20px;
  line-height:34px;
}

.edit-status-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px;
}

.edit-status-option{
  position:relative;
}

.edit-status-option input{
  position:absolute;
  opacity:0;
  pointer-events:none;
}

.edit-status-option label{
  display:flex;
  align-items:center;
  justify-content:center;
  min-height:45px;
  border:1px solid var(--line);
  border-radius:12px;
  background:#fafafa;
  color:#666;
  font-size:12px;
  font-weight:900;
  cursor:pointer;
}

.edit-status-option input:checked + label{
  background:#fff0f2;
  border-color:#ffb5bd;
  color:var(--red);
}

.edit-stats-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

.edit-stats-grid .form-group{
  margin-bottom:12px;
}

.edit-modal-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-top:5px;
}

.edit-disabled{
  opacity:.48;
}

.edit-disabled input{
  background:#f0f0f2;
}


/* =====================================================
   PARTIDOS
===================================================== */

.match-card{
  position:relative;
}

.versus{
  display:flex;
  align-items:center;
  justify-content:center;
  gap:18px;
  margin:13px 0;
}

.club{
  width:90px;
  text-align:center;
  font-weight:900;
  font-size:11px;
}

.club-logo{
  width:46px;
  height:46px;
  border-radius:13px;
  background:#f0f0f2;
  margin:0 auto 5px;
  display:grid;
  place-items:center;
  font-size:21px;
}

.vs{
  font-weight:950;
  color:#888;
}


/* =====================================================
   MÁS
===================================================== */

.more-screen{
  background:var(--dark);
  min-height:calc(100vh - 80px);
  margin:-16px -14px -28px;
  padding:16px 14px 30px;
  color:#fff;
}

.more-screen .title{
  color:#fff;
}

.more-menu{
  display:grid;
  gap:8px;
}

.more-row{
  display:flex;
  align-items:center;
  gap:11px;
  width:100%;
  border:1px solid #2b2b30;
  background:#17171a;
  color:#fff;
  border-radius:13px;
  padding:13px;
  text-align:left;
}

.more-icon{
  width:30px;
  height:30px;
  border-radius:9px;
  background:#242428;
  display:grid;
  place-items:center;
  flex:0 0 30px;
}

.more-text{
  flex:1;
  font-size:12px;
  font-weight:850;
}

.more-arrow{
  color:#8c8c92;
}


/* =====================================================
   TÁCTICA — PIZARRA
===================================================== */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:10px;
}

.tactic-view-btn{
  border:0;
  border-radius:12px;
  min-height:44px;
  background:#e9e9ec;
  color:#666;
  font-size:12px;
  font-weight:900;
}

.tactic-view-btn.active{
  background:var(--red);
  color:#fff;
}


/* =====================================================
   PIZARRA
===================================================== */

.pitch-wrap{
  position:relative;
  z-index:5;
  background:#e8e8ea;
  border-radius:19px;
  padding:8px;
  margin-bottom:12px;
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:14px;
  overflow:hidden;
  background:
    repeating-linear-gradient(
      0deg,
      #278247 0 9%,
      #2d8b4f 9% 18%
    );
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #fff9;
  border-radius:8px;
  pointer-events:none;
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #fff9;
  pointer-events:none;
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #fff9;
  border-radius:50%;
  left:36.5%;
  top:36.5%;
  pointer-events:none;
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px);
  pointer-events:none;
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #fff9;
  pointer-events:none;
}

.box.top{
  top:2.5%;
}

.box.bottom{
  bottom:2.5%;
}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18;
  pointer-events:none;
}

.goal.top{
  top:0;
}

.goal.bottom{
  bottom:0;
}


/* =====================================================
   MEDIO CAMPO
===================================================== */

.pitch.half-mode{
  aspect-ratio:68/70;
}

.pitch.half-mode .pitch-line{
  display:none;
}

.pitch.half-mode .pitch-circle{
  top:58%;
}

.pitch.half-mode .box.bottom,
.pitch.half-mode .goal.bottom{
  display:none;
}

.pitch.half-mode .box.top{
  top:2.5%;
}

.pitch.half-mode .goal.top{
  top:0;
}


/* =====================================================
   JUGADORES EN LA PIZARRA
   DISEÑO COMPACTO
===================================================== */

.board-player{
  position:absolute;
  transform:translate(-50%,-50%);
  z-index:30;

  /*
    Marcador compacto.
    Ya no utiliza una tarjeta blanca.
  */
  width:78px;
  min-height:66px;

  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:grab;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;
}

.board-player.dragging{
  z-index:1000;
  cursor:grabbing;
  transform:
    translate(-50%,-50%)
    scale(1.08);
}


/* =====================================================
   CÍRCULO DEL JUGADOR
===================================================== */

.board-player-card{
  position:relative;

  width:100%;
  min-height:66px;

  padding:0;

  border:0;
  background:transparent;
  box-shadow:none;

  display:flex;
  flex-direction:column;
  align-items:center;
  justify-content:flex-start;

  gap:3px;
}


/* =====================================================
   ICONO ROJO DEL JUGADOR
===================================================== */

.board-player-ball{
  width:38px;
  height:38px;
  flex:0 0 38px;

  border-radius:50%;

  background:var(--red);
  color:#fff;

  display:grid;
  place-items:center;

  font-size:20px;
  line-height:1;

  font-weight:950;

  box-shadow:
    0 3px 8px rgba(0,0,0,.22);

  border:2px solid #fff;
}


/* =====================================================
   INFORMACIÓN DEBAJO DEL CÍRCULO
===================================================== */

.board-player-info{
  width:100%;
  min-width:0;

  display:flex;
  flex-direction:column;
  align-items:center;

  text-align:center;
}


/* =====================================================
   NOMBRE
===================================================== */

.board-player-name{
  width:100%;

  font-size:10px;
  line-height:1.08;

  font-weight:950;

  color:#fff;

  text-shadow:
    0 1px 3px rgba(0,0,0,.85),
    0 0 4px rgba(0,0,0,.55);

  white-space:normal;
  overflow-wrap:anywhere;
  word-break:break-word;

  display:-webkit-box;
  -webkit-box-orient:vertical;
  -webkit-line-clamp:2;

  overflow:hidden;
}


/* =====================================================
   POSICIÓN
===================================================== */

.board-player-pos{
  margin-top:2px;

  font-size:8px;

  line-height:1;

  color:#fff;

  font-weight:900;

  text-shadow:
    0 1px 3px rgba(0,0,0,.85);

  text-align:center;
}


/* =====================================================
   BOTÓN ELIMINAR
===================================================== */

.board-player-remove{
  position:absolute;

  top:-5px;
  right:4px;

  width:20px;
  height:20px;

  border:2px solid #fff;

  border-radius:50%;

  background:var(--dark);
  color:#fff;

  display:grid;
  place-items:center;

  font-size:12px;
  font-weight:900;

  line-height:1;

  padding:0;

  z-index:5;

  box-shadow:
    0 2px 6px rgba(0,0,0,.35);
}


/* =====================================================
   BANDEJA DE JUGADORES
===================================================== */

.tactic-help{
  text-align:center;
  font-size:11px;
  color:var(--muted);
  font-weight:750;
  margin:-2px 0 10px;
}

.player-tray{
  background:#fff;
  border:1px solid var(--line);
  border-radius:17px;
  padding:12px;
  margin-bottom:12px;
  box-shadow:0 5px 18px #14141910;
}

.player-tray-title{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  margin-bottom:9px;
}

.player-tray-title strong{
  font-size:12px;
  font-weight:950;
}

.player-tray-count{
  font-size:10px;
  color:var(--muted);
  font-weight:800;
}

.player-tray-list{
  display:flex;
  gap:8px;
  overflow-x:auto;
  overflow-y:hidden;
  padding:2px 2px 5px;
  -webkit-overflow-scrolling:touch;
  scrollbar-width:none;
}

.player-tray-list::-webkit-scrollbar{
  display:none;
}

.tray-player{
  position:relative;
  flex:0 0 auto;
  width:86px;
  min-height:54px;
  border:1px solid #dedee2;
  border-radius:12px;
  background:#fafafa;
  padding:7px 6px;
  touch-action:none;
  user-select:none;
  -webkit-user-select:none;
  cursor:grab;
}

.tray-player:active{
  background:#fff0f2;
  border-color:#ffb5bd;
}

.tray-player.dragging{
  opacity:.45;
}

.tray-player-top{
  display:flex;
  align-items:center;
  gap:5px;
}

.tray-number{
  width:22px;
  height:22px;
  border-radius:50%;
  background:#ececef;
  display:grid;
  place-items:center;
  font-size:8px;
  font-weight:950;
  flex:0 0 22px;
}

.tray-name{
  min-width:0;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.tray-pos{
  margin-top:4px;
  font-size:7px;
  color:var(--muted);
  font-weight:800;
}

.tray-empty{
  width:100%;
  padding:8px 2px;
  text-align:center;
  color:var(--muted);
  font-size:10px;
  font-weight:800;
}


/* =====================================================
   INDICADOR DE ARRASTRE
===================================================== */

.drag-ghost{
  position:fixed;
  z-index:10000;
  pointer-events:none;

  transform:
    translate(-50%,-50%)
    scale(1.08);

  width:78px;

  opacity:.94;

  display:none;
}


/*
  El fantasma de arrastre utiliza
  exactamente el mismo diseño compacto.
*/

.drag-ghost .board-player-card{
  width:100%;
}


/* =====================================================
   ZONA DE CAMPO AL ARRASTRAR
===================================================== */

.pitch.drop-active{
  box-shadow:
    0 0 0 4px #fff,
    0 0 0 7px #e21d2f88;
}

      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'

    }[m])

  );

}


/* =====================================================
   FORMATO ACTIVIDAD
===================================================== */

function activityTime(timestamp){

  if(!timestamp){
    return '';
  }

  const diff =
    Date.now() -
    Number(timestamp);

  const minute =
    60 * 1000;

  const hour =
    60 * minute;

  const day =
    24 * hour;

  if(diff < minute){
    return 'Ahora';
  }

  if(diff < hour){

    const n =
      Math.floor(
        diff / minute
      );

    return `Hace ${n} min`;

  }

  if(diff < day){

    const n =
      Math.floor(
        diff / hour
      );

    return `Hace ${n} h`;

  }

  if(diff < 2 * day){
    return 'Ayer';
  }

  const date =
    new Date(timestamp);

  return date.toLocaleDateString(
    'es-ES',
    {
      day:'numeric',
      month:'short'
    }
  );

}


/* =====================================================
   CUENTA ATRÁS
===================================================== */

function getMatchCountdown(){

  const text =
    String(
      data.next?.date || ''
    );

  const match =
    text.match(
      /(\d{1,2})\s+de\s+([a-záéíóúñ]+)/i
    );

  if(!match){
    return '';
  }

  const day =
    Number(match[1]);

  const months={

    enero:0,
    febrero:1,
    marzo:2,
    abril:3,
    mayo:4,
    junio:5,
    julio:6,
    agosto:7,
    septiembre:8,
    octubre:9,
    noviembre:10,
    diciembre:11

  };

  const monthName =
    match[2]
      .toLowerCase();

  if(
    months[monthName] === undefined
  ){

    return '';

  }

  const now =
    new Date();

  let year =
    now.getFullYear();

  let target =
    new Date(
      year,
      months[monthName],
      day,
      12,
      0,
      0
    );

  if(
    target <
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    )
  ){

    target =
      new Date(
        year + 1,
        months[monthName],
        day,
        12,
        0,
        0
      );

  }

  const startToday =
    new Date(
      now.getFullYear(),
      now.getMonth(),
      now.getDate()
    );

  const startTarget =
    new Date(
      target.getFullYear(),
      target.getMonth(),
      target.getDate()
    );

  const days =
    Math.round(
      (
        startTarget -
        startToday
      ) /
      86400000
    );

  if(days < 0){
    return '';
  }

  if(days === 0){
    return '🔴 Partido hoy';
  }

  if(days === 1){
    return '🟠 Partido mañana';
  }

  return `⏱ Faltan <strong>${days} días</strong>`;

}

function saveNewPlayer(){

  const name =
    document.getElementById(
      'add-name'
    );

  const num =
    document.getElementById(
      'add-num'
    );

  const pos =
    document.getElementById(
      'add-pos'
    );

  const available =
    document.querySelector(
      'input[name="add-available"]:checked'
    );

  const reason =
    document.getElementById(
      'add-reason'
    );

  const min =
    document.getElementById(
      'add-min'
    );

  const goals =
    document.getElementById(
      'add-goals'
    );

  const assists =
    document.getElementById(
      'add-assists'
    );


  const newName =
    name
      ?name.value.trim()
      :'';


  const newNum =
    num
      ?num.value.trim()
      :'';


  const newPos =
    pos
      ?pos.value.trim()
      :'';


  if(!newName){

    alert(
      'El nombre del jugador es obligatorio.'
    );

    if(name){
      name.focus();
    }

    return;

  }


  if(!newNum){

    alert(
      'El dorsal es obligatorio.'
    );

    if(num){
      num.focus();
    }

    return;

  }


  if(!newPos){

    alert(
      'La posición es obligatoria.'
    );

    if(pos){
      pos.focus();
    }

    return;

  }


  const isAvailable =
    available
      ?available.value === 'true'
      :true;


  const newPlayer={

    id:Date.now(),

    name:newName,

    num:newNum,

    pos:newPos,

    available:isAvailable,

    reason:
      isAvailable
        ?''
        :(reason
          ?reason.value.trim()
          :''),

    min:Math.max(
      0,
      Number(
        min
          ?min.value
          :0
      ) || 0
    ),

    g:Math.max(
      0,
      Number(
        goals
          ?goals.value
          :0
      ) || 0
    ),

    a:Math.max(
      0,
      Number(
        assists
          ?assists.value
          :0
      ) || 0
    )

  };


  data.players.push(
    newPlayer
  );


  addActivity(
    '👤',
    `Jugador añadido: ${newPlayer.name}`
  );


  save();

  closeAddModal();

  render();

}

  const placedIds =

        .values(positions)
        .map(

            String(
              p?.playerId || ''
            )
        )
        .filter(Boolean)

  const availablePlayers =

        p.available !== false &&
        !placedIds.has(
          String(p.id)
        )
    );


  return `

  <div class="title-row">

      }"

        changeTacticView('half')

        view==='half'
          ?'half-mode'
          :''
      }">

      <div class="pitch-line"></div>

      <div class="pitch-circle"></div>

      <div class="pitch-center"></div>

      <div class="box top"></div>

      <div class="box bottom"></div>

      <div class="goal top"></div>

      <div class="goal bottom"></div>


      ${
        Object
          .entries(positions)
          .map(
            ([key,value]) =>
              boardPlayerHtml(
                key,
                value
              )
          )
          .join('')
      }

    </div>

  </div>


  <div class="player-tray">

    <div class="player-tray-title">

      <strong>
        Jugadores
      </strong>

      <span class="player-tray-count">

        ${availablePlayers.length}

    <button
      class="btn"

/* =====================================================
   JUGADOR EN EL CAMPO
===================================================== */

function boardPlayerHtml(
  key,
  value
){

  const player =
    data.players.find(
      p =>
        String(p.id) ===
        String(value?.playerId || '')
    );


  if(!player){
    return '';
  }


  let x =
    Number(value.x);

  let y =
    Number(value.y);


  if(!Number.isFinite(x)){
    x=50;
  }

  if(!Number.isFinite(y)){
    y=50;
  }


  x =
    Math.max(
      4,
      Math.min(
        96,
        x
      )
    );


  y =
    Math.max(
      3,
      Math.min(
        97,
        y
      )
    );


  return `

  <div
    class="board-player"
    id="board-player-${esc(player.id)}"
    data-player-id="${esc(player.id)}"
    data-position-key="${esc(key)}"
    style="
      left:${x}%;
      top:${y}%;
    "
    onpointerdown="
      startBoardDrag(
        event,
        '${esc(player.id)}'
      )
    ">

    <div class="board-player-card">

      <div class="board-player-ball">
        👤
      </div>

      <div class="board-player-info">

        <div class="board-player-name">
          ${esc(player.name)}
        </div>

        <div class="board-player-pos">
          ${esc(player.pos || 'Jugador')}
        </div>

      </div>


      <button
        type="button"
        class="board-player-remove"
        onclick="
          event.stopPropagation();
          removePlayerFromTactic('${esc(player.id)}')
        ">

        ×

      </button>

    </div>

  </div>

  `;

}


/* =====================================================
   CAMBIAR VISTA
===================================================== */

function changeTacticView(
  view
){

  if(
    view!=='full' &&
    view!=='half'
  ){

    return;

  }


  data.tactics.view =
    view;


  save();

  render();

}


/* =====================================================
   CREAR POSICIÓN
===================================================== */

function addPlayerToTactic(
  playerId,
  x,
  y
){

  const id =
    String(playerId);


  const player =
    data.players.find(
      p =>
        String(p.id) === id
    );


  if(!player){
    return;
  }


  const positions =
    data.tactics.positions ||
    {};


  const already =
    Object
      .entries(positions)
      .find(
        ([key,value]) =>
          String(
            value?.playerId || ''
          ) === id
      );


  if(already){

    return;

  }


  const key =
    'p_' +
    Date.now() +
    '_' +
    Math.floor(
      Math.random()*10000
    );


  positions[key]={

    playerId:id,

    x:Math.max(
      4,
      Math.min(
        96,
        Number(x)
      )
    ),

    y:Math.max(
      3,
      Math.min(
        97,
        Number(y)
      )
    )

  };


  data.tactics.positions =
    positions;


  addActivity(
    '⚽',
    `Jugador colocado: ${player.name}`
  );


  save();

  render();

}


/* =====================================================
   ELIMINAR JUGADOR DE LA PIZARRA
===================================================== */

function removePlayerFromTactic(
  playerId
){

  const id =
    String(playerId);


  const positions =
    data.tactics.positions ||
    {};


  let removed=false;

  Object
    .entries(positions)
    .forEach(
      ([key,value]) => {

        if(
          String(
            value?.playerId || ''
          ) === id
        ){

          delete positions[key];

          removed=true;

        }

      }
    );


  if(!removed){
    return;
  }


  const player =
    data.players.find(
      p =>
        String(p.id) === id
    );


  addActivity(
    '↩️',
    player
      ?`${player.name} retirado de la pizarra`
      :'Jugador retirado de la pizarra'
  );


  data.tactics.positions =
    positions;


  save();

  render();

}


/* =====================================================
   ARRASTRAR DESDE BANDEJA
===================================================== */

let dragState=null;

let dragGhost=null;


function createDragGhost(
  player
){

  if(dragGhost){

    dragGhost.remove();

  }


  dragGhost =
    document.createElement(
      'div'
    );


  dragGhost.className='drag-ghost';


  dragGhost.innerHTML = `

    <div class="board-player-card">

      <div class="board-player-ball">
        👤
      </div>

      <div class="board-player-info">

        <div class="board-player-name">
          ${esc(player.name)}
        </div>

        <div class="board-player-pos">
          ${esc(player.pos || 'Jugador')}
        </div>

      </div>

    </div>

  `;


  document.body.appendChild(
    dragGhost
  );


  dragGhost.style.display='block';

}


function updateDragGhost(
  event
){

  if(
    !dragGhost ||
    !dragState
  ){

    return;

  }


  dragGhost.style.left =
    `${event.clientX}px`;

  dragGhost.style.top =
    `${event.clientY}px`;

}


function destroyDragGhost(){

  if(dragGhost){

    dragGhost.remove();

    dragGhost=null;

  }

}


/* =====================================================
   INICIAR ARRASTRE DESDE BANDEJA
===================================================== */

function startTrayDrag(
  event,
  playerId
){

  if(
    event.pointerType==='mouse' &&
    event.button!==0
  ){

    return;

  }


  event.preventDefault();

  event.stopPropagation();


  const player =
    data.players.find(
      p =>
        String(p.id) ===
        String(playerId)
    );


  if(!player){
    return;
  }


  const source =
    event.currentTarget;


  dragState={

    type:'tray',

    playerId:
      String(playerId),

    source:source,

    moved:false,

    startX:event.clientX,

    startY:event.clientY

  };


  source.classList.add(
    'dragging'
  );


  createDragGhost(
    player
  );


  updateDragGhost(
    event
  );


  try{

    source.setPointerCapture(
      event.pointerId
    );

  }catch(error){}


  document.addEventListener(
    'pointermove',
    handleGlobalPointerMove,
    {
      passive:false
    }
  );


  document.addEventListener(
    'pointerup',
    handleGlobalPointerUp,
    {
      once:true
    }
  );


  document.addEventListener(
    'pointercancel',
    handleGlobalPointerCancel,
    {
      once:true
    }
  );

}


/* =====================================================
   ARRASTRAR JUGADOR YA COLOCADO
===================================================== */

function startBoardDrag(
  event,
  playerId
){

  if(
    event.target.closest(
      '.board-player-remove'
    )
  ){

    return;

  }


  if(
    event.pointerType==='mouse' &&
    event.button!==0
  ){

    return;

  }


  event.preventDefault();

  event.stopPropagation();


  const id =
    String(playerId);


  const entry =
    Object
      .entries(
        data.tactics.positions ||
        {}
      )
      .find(
        ([key,value]) =>
          String(
            value?.playerId || ''
          ) === id
      );


  if(!entry){
    return;
  }


  const player =
    data.players.find(
      p =>
        String(p.id) === id
    );


  if(!player){
    return;
  }


  const source =
    event.currentTarget;


  dragState={

    type:'board',

    playerId:id,

    key:entry[0],

    source:source,

    moved:false,

    startX:event.clientX,

    startY:event.clientY

  };


  source.classList.add(
    'dragging'
  );


  try{

    source.setPointerCapture(
      event.pointerId
    );

  }catch(error){}


  document.addEventListener(
    'pointermove',
    handleGlobalPointerMove,
    {
      passive:false
    }
  );


  document.addEventListener(
    'pointerup',
    handleGlobalPointerUp,
    {
      once:true
    }
  );


  document.addEventListener(
    'pointercancel',
    handleGlobalPointerCancel,
    {
      once:true
    }
  );

}


/* =====================================================
   MOVIMIENTO GLOBAL
===================================================== */

function handleGlobalPointerMove(
  event
){

  if(!dragState){
    return;
  }


  event.preventDefault();


  const dx =
    event.clientX -
    (
      dragState.startX ??
      event.clientX
    );


  const dy =
    event.clientY -
    (
      dragState.startY ??
      event.clientY
    );


  if(
    Math.abs(dx)>4 ||
    Math.abs(dy)>4
  ){

    dragState.moved=true;

  }


  if(
    dragState.type==='tray'
  ){

    updateDragGhost(
      event
    );

  }


  const pitch =
    document.getElementById(
      'tactic-pitch'
    );


  if(!pitch){
    return;
  }


  const rect =
    pitch.getBoundingClientRect();


  const inside =
    event.clientX >= rect.left &&
    event.clientX <= rect.right &&
    event.clientY >= rect.top &&
    event.clientY <= rect.bottom;


  pitch.classList.toggle(
    'drop-active',
    inside
  );


  if(
    dragState.type==='board' &&
    inside
  ){

    const x =
      (
        (
          event.clientX -
          rect.left
        ) /
        rect.width
      ) *
      100;


    const y =
      (
        (
          event.clientY -
          rect.top
        ) /
        rect.height
      ) *
      100;


    const playerElement =
      dragState.source;


    playerElement.style.left =
      `${Math.max(
        4,
        Math.min(
          96,
          x
        )
      )}%`;


    playerElement.style.top =
      `${Math.max(
        3,
        Math.min(
          97,
          y
        )
      )}%`;

  }

}


/* =====================================================
   FIN DEL ARRASTRE
===================================================== */

function handleGlobalPointerUp(
  event
){

  if(!dragState){
    return;
  }


  event.preventDefault();


  const state =
    dragState;


  const pitch =
    document.getElementById(
      'tactic-pitch'
    );


  let dropped=false;


  if(pitch){

    const rect =
      pitch.getBoundingClientRect();


    const inside =
      event.clientX >= rect.left &&
      event.clientX <= rect.right &&
      event.clientY >= rect.top &&
      event.clientY <= rect.bottom;


    if(
      state.type==='tray' &&
      inside &&
      state.moved
    ){

      const x =
        (
          (
            event.clientX -
            rect.left
          ) /
          rect.width
        ) *
        100;


      const y =
        (
          (
            event.clientY -
            rect.top
          ) /
          rect.height
        ) *
        100;


      destroyDragGhost();


      addPlayerToTactic(
        state.playerId,
        x,
        y
      );


      dropped=true;

    }


    if(
      state.type==='board' &&
      inside &&
      state.moved
    ){

      const x =
        (
          (
            event.clientX -
            rect.left
          ) /
          rect.width
        ) *
        100;


      const y =
        (
          (
            event.clientY -
            rect.top
          ) /
          rect.height
        ) *
        100;


      updateBoardPlayerPosition(
        state.key,
        x,
        y
      );


      dropped=true;

    }

  }


  cleanupDrag();


  if(!dropped){

    render();

  }

}


/* =====================================================
   CANCELAR ARRASTRE
===================================================== */

function handleGlobalPointerCancel(){

  cleanupDrag();

  render();

}


/* =====================================================
   ACTUALIZAR POSICIÓN
===================================================== */

function updateBoardPlayerPosition(
  key,
  x,
  y
){

  const position =
    data.tactics.positions[
      key
    ];


  if(!position){
    return;
  }


  position.x =
    Math.max(
      4,
      Math.min(
        96,
        Number(x)
      )
    );


  position.y =
    Math.max(
      3,
      Math.min(
        97,
        Number(y)
      )
    );


  const player =
    data.players.find(
      p =>
        String(p.id) ===
        String(position.playerId)
    );


  addActivity(
    '📍',
    player
      ?`Posición actualizada: ${player.name}`
      :'Posición actualizada'
  );


  save();

}


/* =====================================================
   LIMPIAR ARRASTRE
===================================================== */

function cleanupDrag(){

  document
    .querySelectorAll(
      '.tray-player.dragging'
    )
    .forEach(
      el =>
        el.classList.remove(
          'dragging'
        )
    );


  document
    .querySelectorAll(
      '.board-player.dragging'
    )
    .forEach(
      el =>
        el.classList.remove(
          'dragging'
        )
    );


  document
    .querySelectorAll(
      '.pitch.drop-active'
    )
    .forEach(
      el =>
        el.classList.remove(
          'drop-active'
        )
    );


  destroyDragGhost();


  document.removeEventListener(
    'pointermove',
    handleGlobalPointerMove
  );


  dragState=null;

}


/* =====================================================
   VACIAR TÁCTICA
===================================================== */

function clearTactic(){

  data.tactics.positions={};

  addActivity(
    '🧹',
    'Pizarra táctica vaciada'
  );

  save();

  render();

}


/* =====================================================
   GUARDAR TÁCTICA
===================================================== */

function saveTactic(){

  data.tactics.savedLineup =

    Object
      .values(
        data.tactics.positions ||
        {}
      )
      .map(
        v => ({
          playerId:
            String(v.playerId),

          x:
            Number(v.x),

          y:
            Number(v.y)

        })
      );


  addActivity(
    '💾',
    'Pizarra táctica guardada'
  );

  save();


  alert(
    'Pizarra táctica guardada correctamente.'
  );

}


/* =====================================================
   ARRANQUE
===================================================== */

save();

render();

</script>
