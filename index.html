<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}

:root{
  --green:#123c2d;
  --green-2:#19553f;
  --lime:#b9e86c;
  --bg:#f3f6f4;
  --card:#fff;
  --text:#10221b;
  --muted:#718078;
  --line:#e4ebe7;
  --danger:#d95c5c;
  --warning:#e4a936
}

body{
  margin:0;
  background:var(--bg);
  color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif
}

button,select,input{font-family:inherit}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:var(--bg);
  padding-bottom:96px
}

header{
  position:relative;
  overflow:hidden;
  background:linear-gradient(145deg,var(--green),#0d2d22);
  color:#fff;
  padding:26px 20px 24px;
  border-radius:0 0 30px 30px;
  box-shadow:0 8px 25px #0c2d2225
}

header:after{
  content:"";
  position:absolute;
  width:180px;
  height:180px;
  border-radius:50%;
  right:-75px;
  top:-90px;
  background:#b9e86c12
}

.brand{
  position:relative;
  z-index:2;
  font-size:29px;
  font-weight:900;
  letter-spacing:-.8px
}

.brand span{color:var(--lime)}

.role{
  position:relative;
  z-index:2;
  opacity:.78;
  font-size:13px;
  margin-top:5px;
  font-weight:600
}

main{padding:20px 16px 30px}

.title{
  font-size:25px;
  font-weight:900;
  letter-spacing:-.5px;
  margin:2px 0 16px
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:22px;
  padding:18px;
  margin-bottom:14px;
  box-shadow:0 7px 25px #10221b0b
}

.hero{
  background:linear-gradient(145deg,var(--green),var(--green-2));
  color:#fff;
  border:0;
  padding:20px
}

.hero .muted{color:#c8d8d1}
.hero .big{color:#fff}

.section-label{
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:1px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px
}

.big{
  font-size:22px;
  font-weight:900;
  letter-spacing:-.4px
}

.muted{color:var(--muted)}
.small{font-size:13px}

.match-meta{
  display:flex;
  align-items:center;
  gap:12px;
  margin:16px 0
}

.team-ball{
  width:50px;
  height:50px;
  border-radius:16px;
  background:#ffffff18;
  display:grid;
  place-items:center;
  font-size:25px
}

.match-info{flex:1}

.match-date{
  font-weight:800;
  font-size:14px
}

.match-place{
  color:#c8d8d1;
  font-size:13px;
  margin-top:3px
}

.grid{
  display:grid;
  grid-template-columns:repeat(2,1fr);
  gap:11px;
  margin-bottom:14px
}

.stat{
  background:#fff;
  border:1px solid var(--line);
  border-radius:19px;
  padding:16px
}

.stat b{
  display:block;
  font-size:27px;
  font-weight:900
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:12px;
  font-weight:700;
  margin-top:3px
}

.stat.accent{
  background:#edf7df;
  border-color:#dcefc1
}

.stat.accent b{color:#315d18}

.row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px
}

.item{
  display:flex;
  align-items:center;
  gap:12px;
  padding:13px 0;
  border-bottom:1px solid #edf1ef
}

.item:last-child{border-bottom:0}

.avatar{
  width:46px;
  height:46px;
  flex:0 0 46px;
  border-radius:15px;
  background:#e8f0ec;
  display:grid;
  place-items:center;
  font-size:21px
}

.grow{
  flex:1;
  min-width:0
}

.pill{
  display:inline-flex;
  align-items:center;
  font-size:11px;
  font-weight:900;
  border-radius:999px;
  padding:6px 9px;
  background:#e9f7d8;
  color:#426c20
}

.pill.danger{
  background:#fae9e9;
  color:#b44343
}

.btn{
  border:0;
  border-radius:14px;
  padding:13px 15px;
  background:var(--green);
  color:#fff;
  font-weight:900;
  font-size:14px;
  cursor:pointer
}

.btn.light{
  background:#e9efec;
  color:var(--green)
}

.btn.lime{
  background:var(--lime);
  color:#19331f
}

.btn.full{width:100%}

.add-player{margin-bottom:14px}

.delete-btn{
  border:0;
  background:#fae9e9;
  color:#b44343;
  width:38px;
  height:38px;
  border-radius:12px;
  font-size:17px;
  cursor:pointer
}

.tabs{
  display:flex;
  gap:7px;
  overflow:auto;
  margin-bottom:14px;
  scrollbar-width:none
}

.tabs::-webkit-scrollbar{display:none}

.tab{
  border:0;
  border-radius:999px;
  padding:10px 14px;
  background:#e8eeeb;
  color:#526159;
  font-weight:800;
  white-space:nowrap
}

.tab.active{
  background:var(--green);
  color:#fff
}

.notice{
  background:#edf6df;
  color:#36561f;
  border-radius:17px;
  padding:14px;
  font-size:13px;
  font-weight:700
}

.form-group{margin-bottom:13px}

.form-group label{
  display:block;
  font-size:12px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:7px
}

.form-input{
  width:100%;
  border:1px solid var(--line);
  background:#f8faf9;
  color:var(--text);
  border-radius:14px;
  padding:13px;
  font-size:15px;
  outline:none
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  display:flex;
  justify-content:space-around;
  background:#ffffffee;
  backdrop-filter:blur(18px);
  -webkit-backdrop-filter:blur(18px);
  border-top:1px solid #dfe7e3;
  padding:9px 4px calc(9px + env(safe-area-inset-bottom));
  z-index:20
}

nav button{
  background:none;
  border:0;
  color:#7a8781;
  font-size:11px;
  font-weight:800;
  padding:7px 5px;
  min-width:52px;
  border-radius:13px
}

nav button.active{
  color:var(--green)!important;
  background:#edf4ef
}

/* ================= TÁCTICA ================= */

.tactic-toolbar{
  display:grid;
  grid-template-columns:1fr auto;
  gap:8px;
  align-items:end;
  margin-bottom:14px
}

.select-wrap label{
  display:block;
  font-size:11px;
  text-transform:uppercase;
  letter-spacing:.8px;
  font-weight:900;
  color:var(--muted);
  margin-bottom:6px
}

.select{
  width:100%;
  border:1px solid var(--line);
  background:#fff;
  color:var(--text);
  border-radius:14px;
  padding:12px;
  font-size:15px;
  font-weight:800;
  outline:none
}

.pitch-wrap{
  background:#dfe9e2;
  border-radius:24px;
  padding:10px;
  margin-bottom:14px;
  box-shadow:0 8px 25px #10221b10
}

.pitch{
  position:relative;
  width:100%;
  aspect-ratio:68/105;
  border-radius:18px;
  overflow:hidden;
  background:
    linear-gradient(
      90deg,
      #2d8a52 0 8.33%,
      #338f56 8.33% 16.66%,
      #2d8a52 16.66% 25%,
      #338f56 25% 33.33%,
      #2d8a52 33.33% 41.66%,
      #338f56 41.66% 50%,
      #2d8a52 50% 58.33%,
      #338f56 58.33% 66.66%,
      #2d8a52 66.66% 75%,
      #338f56 75% 83.33%,
      #2d8a52 83.33% 91.66%,
      #338f56 91.66% 100%
    )
}

.pitch:before{
  content:"";
  position:absolute;
  inset:2.5%;
  border:2px solid #fff8;
  border-radius:10px
}

.pitch-line{
  position:absolute;
  left:2.5%;
  right:2.5%;
  top:50%;
  border-top:2px solid #fff8
}

.pitch-circle{
  position:absolute;
  width:27%;
  aspect-ratio:1;
  border:2px solid #fff8;
  border-radius:50%;
  left:36.5%;
  top:36.5%
}

.pitch-center{
  position:absolute;
  width:8px;
  height:8px;
  background:#fff;
  border-radius:50%;
  left:calc(50% - 4px);
  top:calc(50% - 4px)
}

.box{
  position:absolute;
  left:20%;
  width:60%;
  height:16%;
  border:2px solid #fff8
}

.box.top{top:2.5%}
.box.bottom{bottom:2.5%}

.goal{
  position:absolute;
  left:37%;
  width:26%;
  height:2.5%;
  border:2px solid #fff;
  background:#ffffff18
}

.goal.top{top:0}
.goal.bottom{bottom:0}

/* POSICIONES FIJAS */

.tactic-position{
  position:absolute;
  transform:translate(-50%,-50%);
  width:105px;
  z-index:10;
  text-align:center
}

.position-label{
  display:inline-block;
  background:var(--green);
  color:#fff;
  border-radius:999px;
  padding:4px 7px;
  font-size:9px;
  font-weight:900;
  margin-bottom:4px;
  box-shadow:0 3px 8px #10221b40
}

.position-select{
  width:105px;
  border:2px solid var(--lime);
  background:#fff;
  color:var(--green);
  border-radius:10px;
  padding:6px 5px;
  font-size:10px;
  font-weight:800;
  outline:none;
  box-shadow:0 4px 10px #10221b30
}

.position-select:focus{
  border-color:var(--green)
}

.lineup-list{
  display:flex;
  flex-direction:column;
  gap:8px
}

.lineup-row{
  display:flex;
  align-items:center;
  gap:10px;
  padding:10px;
  background:#f8faf9;
  border:1px solid var(--line);
  border-radius:13px
}

.lineup-position{
  flex:0 0 48px;
  text-align:center;
  background:var(--green);
  color:#fff;
  border-radius:9px;
  padding:7px 4px;
  font-size:10px;
  font-weight:900
}

.lineup-player{
  flex:1;
  min-width:0;
  display:flex;
  flex-direction:column;
  gap:2px
}

.lineup-player b{font-size:13px}

.lineup-player span{
  color:var(--muted);
  font-size:11px
}

.empty-lineup{font-style:italic}

.tactic-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:8px;
  margin-bottom:14px
}

@media(max-width:380px){

  main{
    padding-left:12px;
    padding-right:12px
  }

  .big{font-size:20px}
  .brand{font-size:27px}

  .tactic-position{
    width:88px
  }

  .position-select{
    width:88px;
    font-size:9px;
    padding:5px 3px
  }

  .position-label{
    font-size:8px;
    padding:3px 6px
  }

  nav button{
    min-width:48px
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ <span>KNATT</span></div>

</div>

<script>

const KEY='teamhub-v2';

let data;

try{
  const saved=localStorage.getItem(KEY);
  data=saved?JSON.parse(saved):null;
}catch(e){
  data=null;
}


/* ================= DATOS ================= */

if(!data || typeof data!=='object'){

  data={
    players:[
      {
        id:1,

        pos:'DC',

      },
      {

      },
      {

      },
      {

      },
      {

      }
    ],

    next:{
      opponent:'CD Rival',

    },

      positions:{},
      lineup:{},
      savedLineup:[]
    },

    settings:{
      coach:'',
      team:'KNATT FC',
      season:'2026/27',
      category:'Primer Equipo'
    }
  };
}


/* ================= REPARAR DATOS ================= */

if(!Array.isArray(data.players)){
  data.players=[];
}

data.players=data.players.map((p,i)=>({
  id:p?.id??Date.now()+i,
  name:typeof p?.name==='string'&&p.name.trim()?p.name:'Jugador',
  num:p?.num!==undefined?p.num:'-',
  pos:typeof p?.pos==='string'&&p.pos.trim()?p.pos:'Jugador',
  available:typeof p?.available==='boolean'?p.available:true,
  reason:typeof p?.reason==='string'?p.reason:'',
  min:Number.isFinite(Number(p?.min))?Math.max(0,Number(p.min)):0,
  g:Number.isFinite(Number(p?.g))?Math.max(0,Number(p.g)):0,
  a:Number.isFinite(Number(p?.a))?Math.max(0,Number(p.a)):0
}));

if(!data.next||typeof data.next!=='object'){
  data.next={}
}

data.next.opponent=data.next.opponent||'CD Rival';
data.next.date=data.next.date||'Próximo partido';
data.next.time=data.next.time||'12:00';
data.next.place=data.next.place||'Campo Municipal';

if(!data.tactics||typeof data.tactics!=='object'){
  data.tactics={}
}

data.tactics.formation=data.tactics.formation||'4-3-3';

data.tactics.positions=
  data.tactics.positions&&typeof data.tactics.positions==='object'
  ?data.tactics.positions
  :{};

data.tactics.lineup=
  data.tactics.lineup&&typeof data.tactics.lineup==='object'
  ?data.tactics.lineup
  :{};

data.tactics.savedLineup=
  Array.isArray(data.tactics.savedLineup)
  ?data.tactics.savedLineup
  :[];

if(!data.settings||typeof data.settings!=='object'){
  data.settings={}
}

data.settings.coach=data.settings.coach||'';
data.settings.team=data.settings.team||'KNATT FC';
data.settings.season=data.settings.season||'2026/27';
data.settings.category=data.settings.category||'Primer Equipo';

localStorage.setItem(KEY,JSON.stringify(data));


/* ================= ESTADO ================= */

let section='home';
let filter='all';
let selectedPlayerId=null;


/* ================= FORMACIONES ================= */

const formations={

  '4-3-3':[
    ['POR',50,92],
    ['LI',18,76],
    ['DFC',40,80],
    ['DFC',60,80],
    ['LD',82,76],
    ['MC',28,60],
    ['MC',50,58],
    ['MC',72,60],
    ['EI',18,35],
    ['DC',50,24],
    ['ED',82,35]
  ],

  '4-4-2':[
    ['POR',50,92],
    ['LI',18,76],
    ['DFC',40,80],
    ['DFC',60,80],
    ['LD',82,76],
    ['MI',18,57],
    ['MC',40,57],
    ['MC',60,57],
    ['MD',82,57],
    ['DC',38,27],
    ['DC',62,27]
  ],

  '4-2-3-1':[
    ['POR',50,92],
    ['LI',18,76],
    ['DFC',40,80],
    ['DFC',60,80],
    ['LD',82,76],
    ['MCD',38,63],
    ['MCD',62,63],
    ['EI',18,43],
    ['MCO',50,45],
    ['ED',82,43],
    ['DC',50,24]
  ],

  '3-5-2':[
    ['POR',50,92],
    ['DFC',27,78],
    ['DFC',50,82],
    ['DFC',73,78],
    ['MI',12,57],
    ['MC',32,58],
    ['MCO',50,50],
    ['MC',68,58],
    ['MD',88,57],
    ['DC',38,27],
    ['DC',62,27]
  ],

  '3-4-3':[
    ['POR',50,92],
    ['DFC',27,80],
    ['DFC',50,83],
    ['DFC',73,80],
    ['MI',18,59],
    ['MC',40,59],
    ['MC',60,59],
    ['MD',82,59],
    ['EI',18,33],
    ['DC',50,24],
    ['ED',82,33]
  ],

  '5-3-2':[
    ['POR',50,92],
    ['LI',10,73],
    ['DFC',30,79],
    ['DFC',50,82],
    ['DFC',70,79],
    ['LD',90,73],
    ['MC',30,58],
    ['MC',50,55],
    ['MC',70,58],
    ['DC',38,27],
    ['DC',62,27]
  ],

  '4-5-1':[
    ['POR',50,92],
    ['LI',18,76],
    ['DFC',40,80],
    ['DFC',60,80],
    ['LD',82,76],
    ['MI',12,57],
    ['MC',31,57],
    ['MCO',50,53],
    ['MC',69,57],
    ['MD',88,57],
    ['DC',50,24]
  ]

};


/* ================= GENERALES ================= */

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

function go(s){
  section=s;
  selectedPlayerId=null;
  render();
}

function getSelectedPlayer(){
  return data.players.find(
    p=>String(p.id)===String(selectedPlayerId)
  );
}

function navItems(){
  return[
    ['home','🏠','Inicio'],
    ['team','👥','Plantilla'],
    ['tactic','🧠','Táctica'],
    ['matches','🏆','Partidos'],
    ['stats','📊','Stats'],
    ['settings','⚙️','Config.']
  ];
}


/* ================= RENDER ================= */

function render(){

  document.getElementById('nav').innerHTML=
    navItems().map(x=>`
      <button
        class="${section===x[0]?'active':''}"
        onclick="go('${x[0]}')">
        ${x[1]}<br>${x[2]}
      </button>
    `).join('');

  const c=document.getElementById('content');

  c.innerHTML='';

  if(section==='home')c.innerHTML=home();
  if(section==='team')c.innerHTML=team();
  if(section==='player')c.innerHTML=playerProfile();
  if(section==='tactic')c.innerHTML=tactic();
  if(section==='matches')c.innerHTML=matches();
  if(section==='stats')c.innerHTML=stats();
  if(section==='settings')c.innerHTML=settings();
}


/* ================= JUGADORES ================= */

function openPlayer(id){
  selectedPlayerId=id;
  section='player';
  render();
}

function editPlayer(){

  const p=getSelectedPlayer();

  if(!p)return;

  const name=prompt('Nombre del jugador:',p.name);
  if(name===null)return;

  const num=prompt('Número de camiseta:',p.num);
  if(num===null)return;

  const pos=prompt('Posición:',p.pos);
  if(pos===null)return;

  const available=confirm(
    '¿Está disponible para jugar?\n\nAceptar = Sí\nCancelar = No'
  );

  let reason='';

  if(!available){
    const r=prompt('Motivo de la ausencia:',p.reason||'');
    if(r!==null)reason=r.trim();
  }

  const min=prompt('Minutos jugados:',p.min);
  if(min===null)return;

  const goals=prompt('Goles:',p.g);
  if(goals===null)return;

  const assists=prompt('Asistencias:',p.a);
  if(assists===null)return;

  p.name=name.trim()||p.name;
  p.num=num.trim()||p.num;
  p.pos=pos.trim()||p.pos;
  p.available=available;
  p.reason=reason;
  p.min=Math.max(0,Number(min)||0);
  p.g=Math.max(0,Number(goals)||0);
  p.a=Math.max(0,Number(assists)||0);

  save();
  render();
}

function addPlayer(){

  const name=prompt('Nombre del jugador:');

  if(!name||!name.trim())return;

  const num=prompt('Número de camiseta:','');
  if(num===null)return;

  const pos=prompt('Posición:','');
  if(pos===null)return;

  data.players.push({
    id:Date.now(),
    name:name.trim(),
    num:num.trim()||'-',
    pos:pos.trim()||'Jugador',
    available:true,
    reason:'',
    min:0,
    g:0,
    a:0
  });

  save();
  section='team';
  render();
}

function deletePlayer(id){

  const player=data.players.find(
    p=>String(p.id)===String(id)
  );

  if(!player)return;

  if(!confirm(
    '¿Seguro que quieres eliminar a '+
    player.name+
    ' de la plantilla?'
  ))return;

  data.players=data.players.filter(
    p=>String(p.id)!==String(id)
  );

  Object.keys(data.tactics.lineup||{}).forEach(i=>{
    if(String(data.tactics.lineup[i])===String(id)){
      delete data.tactics.lineup[i];
    }

  delete data.tactics.positions[String(id)];

  save();

  selectedPlayerId=null;
  section='team';

  render();
}

function tactic(){

  const formation=data.tactics.formation;
  const spots=formations[formation];

  if(!data.tactics.lineup){
    data.tactics.lineup={};
  }

  const lineup=data.tactics.lineup;

  const selectedIds=
    Object.values(lineup).map(String);

  return`

    <div class="title">
      Táctica
    </div>

    <div class="card">

      <div class="section-label">
        PIZARRA TÁCTICA
      </div>

      <div class="big">
        Crear alineación
      </div>

      <div class="muted small">
        Elige la formación y selecciona
        un jugador para cada posición.
      </div>

    </div>

    <div class="tactic-toolbar">

      <div class="select-wrap">

        <label>
          Formación
        </label>

        <select
          class="select"
          onchange="changeFormation(this.value)">

          ${
            Object.keys(formations).map(f=>`

              <option
                value="${f}"
                ${f===formation?'selected':''}>
                ${f}
              </option>

            `).join('')
          }

        </select>

      </div>

      <button
        class="btn light"
        onclick="resetTactic()">
        ↺ Reset
      </button>

    </div>

    <div class="pitch-wrap">

      <div class="pitch">

        <div class="pitch-line"></div>
        <div class="pitch-circle"></div>
        <div class="pitch-center"></div>
        <div class="box top"></div>
        <div class="box bottom"></div>
        <div class="goal top"></div>
        <div class="goal bottom"></div>

        ${
          spots.map((spot,index)=>{

            const role=spot[0];
            const x=spot[1];
            const y=spot[2];

            const playerId=
              lineup[index]
              ?String(lineup[index])
              :'';

            return`

              <div
                class="tactic-position"
                style="
                  left:${x}%;
                  top:${y}%;
                ">

                <div class="position-label">
                  ${role}
                </div>

                <select
                  class="position-select"
                  onchange="
                    selectTacticPlayer(
                      ${index},
                      this.value
                    )
                  ">

                  <option value="">
                    -- ${role} --
                  </option>

                  ${
                    data.players.map(p=>{

                      const isSelected=
                        String(p.id)===playerId;

                      const usedElsewhere=
                        selectedIds.includes(String(p.id))
                        &&!isSelected;

                      return`

                        <option
                          value="${p.id}"
                          ${isSelected?'selected':''}
                          ${usedElsewhere?'disabled':''}>

                          #${p.num} ·
                          ${escapeHtml(p.name)}

                        </option>

                      `;

                    }).join('')
                  }

                </select>

              </div>

            `;

          }).join('')
        }

      </div>

    </div>

    <div class="card">

      <div class="section-label">
        ALINEACIÓN
      </div>

      <div class="lineup-list">

        ${
          spots.map((spot,index)=>{

            const role=spot[0];

            const playerId=
              lineup[index]
              ?String(lineup[index])
              :'';

            const player=
              data.players.find(
                p=>String(p.id)===playerId
              );

            return`

              <div class="lineup-row">

                <div class="lineup-position">
                  ${role}
                </div>

                <div class="lineup-player">

                  ${
                    player

                    ?

                    `

                    <b>
                      #${player.num} ·
                      ${escapeHtml(player.name)}
                    </b>

                    <span>
                      ${escapeHtml(player.pos)}
                      ·
                      ${
                        player.available
                        ?'🟢 Disponible'
                        :'🔴 '+escapeHtml(
                          player.reason||'Ausente'
                        )
                      }
                    </span>

                    `

                    :

                    `

                    <span class="empty-lineup">
                      Sin jugador seleccionado
                    </span>

                    `
                  }

                </div>

              </div>

            `;

          }).join('')
        }

      </div>

    </div>

    <div class="tactic-actions">

      <button
        class="btn lime"
        onclick="saveTactic()">
        💾 Guardar alineación
      </button>

      <button
        class="btn light"
        onclick="clearTactic()">
        🧹 Vaciar campo
      </button>

    </div>

    <div class="notice">

      💡 Cada jugador solo puede ocupar
      una posición de la alineación.

    </div>

  `;
}


/* ================= SELECCIONAR JUGADOR ================= */

function selectTacticPlayer(positionIndex,playerId){

  if(!data.tactics.lineup){
    data.tactics.lineup={};
  }

  playerId=String(playerId||'');

  if(!playerId){

    delete data.tactics.lineup[positionIndex];

    rebuildPositions();

    save();
    render();

    return;
  }

  /*
    Si el jugador ya estaba en otra posición,
    lo quitamos de allí.
  */

  Object.keys(data.tactics.lineup).forEach(index=>{

    if(
      String(index)!==String(positionIndex)&&
      String(data.tactics.lineup[index])===playerId
    ){
      delete data.tactics.lineup[index];
    }

  });

  data.tactics.lineup[positionIndex]=playerId;

  rebuildPositions();

  save();
  render();
}


/* ================= RECONSTRUIR POSICIONES ================= */

function rebuildPositions(){

  data.tactics.positions={};

  const spots=
    formations[data.tactics.formation];

  Object.keys(data.tactics.lineup||{}).forEach(index=>{

    const playerId=
      String(data.tactics.lineup[index]);

    const spot=spots[index];

    if(!spot)return;

    data.tactics.positions[playerId]={
      x:spot[1],
      y:spot[2],
      role:spot[0]
    };

  });

}


/* ================= CAMBIAR FORMACION ================= */

function changeFormation(formation){

  const oldLineup=
    data.tactics.lineup||{};

  const players=
    Object.values(oldLineup)
    .map(String);

  const spots=formations[formation];

  const next={};

  players
    .slice(0,spots.length)
    .forEach((playerId,index)=>{
      next[index]=playerId;
    });

  data.tactics.formation=formation;
  data.tactics.lineup=next;

  rebuildPositions();

  save();
  render();
}


/* ================= RESET ================= */

function resetTactic(){

  data.tactics.lineup={};
  data.tactics.positions={};
  data.tactics.savedLineup=[];

  save();
  render();
}


/* ================= VACIAR ================= */

function clearTactic(){

  data.tactics.lineup={};

/* ================= GUARDAR ================= */

function saveTactic(){

  data.tactics.savedLineup=
    Object.values(data.tactics.lineup||{});

    'Alineación guardada correctamente.'
  );
}

function exportData(){

  const url=URL.createObjectURL(blob);

  const a=document.createElement('a');

  a.href=url;
  a.download='knatt-datos.json';

  URL.revokeObjectURL(url);
}


function resetApp(){

  localStorage.removeItem(KEY);

/* ================= SEGURIDAD HTML ================= */

function escapeHtml(str){

  return String(str).replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}
