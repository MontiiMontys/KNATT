<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0a0a0c">
<title>KNATT</title>

<style>
*{
  box-sizing:border-box;
  -webkit-tap-highlight-color:transparent;
}

:root{
  --red:#e21d2f;
  --red-dark:#bd1425;
  --red-soft:#fff1f3;

  --black:#09090b;
  --black-2:#121216;
  --black-3:#1b1b20;

  --bg:#f3f3f5;
  --card:#ffffff;

  --text:#111114;
  --text-2:#37373d;
  --muted:#85858d;

  --line:#e5e5e9;
  --line-dark:#29292e;

  --radius:16px;
  --radius-small:11px;

  --shadow:0 8px 28px rgba(15,15,20,.055);
  --shadow-strong:0 14px 40px rgba(15,15,20,.10);
}

html,
body{
  margin:0;
  min-height:100%;
  background:var(--bg);
}

body{
  font-family:
    -apple-system,
    BlinkMacSystemFont,
    "SF Pro Display",
    "SF Pro Text",
    "Segoe UI",
    sans-serif;
  color:var(--text);
  -webkit-font-smoothing:antialiased;
  text-rendering:optimizeLegibility;
}

button,
input,
select,
textarea{
  font:inherit;
}

button{
  cursor:pointer;
}

button:active{
  transform:scale(.98);
}

.app{
  width:min(560px,100%);
  min-height:100vh;
  margin:auto;
  padding-bottom:92px;
  background:var(--bg);
}

/* =====================================================
   CABECERA
===================================================== */

header{
  background:var(--black);
  color:#fff;
  padding:
    calc(15px + env(safe-area-inset-top))
    18px
    16px;
  border-bottom:1px solid #202025;
}

.header-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:15px;
}

.brand{
  font-size:25px;
  line-height:1;
  font-weight:950;
  letter-spacing:-1.1px;
}

.brand span{
  color:#fff;
}

.role{
  font-size:10px;
  color:#898991;
  margin-top:6px;
  font-weight:700;
  letter-spacing:.15px;
}

.header-bell{
  min-width:68px;
  height:34px;
  padding:0 12px;
  border-radius:9px;
  background:#18181c;
  border:1px solid #2a2a30;
  color:#bdbdc4;
  font-size:10px;
  font-weight:850;
}

/* =====================================================
   CONTENIDO
===================================================== */

main{
  padding:18px 14px 28px;
}

.title{
  font-size:25px;
  line-height:1.08;
  font-weight:950;
  letter-spacing:-.75px;
}

.subtitle{
  font-size:11px;
  color:var(--muted);
  font-weight:700;
  margin-top:5px;
  line-height:1.35;
}

.title-row{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
  margin:1px 2px 15px;
}

.card{
  background:var(--card);
  border:1px solid var(--line);
  border-radius:var(--radius);
  padding:16px;
  margin-bottom:12px;
  box-shadow:var(--shadow);
}

.card-dark{
  background:var(--black-2);
  color:#fff;
  border-color:var(--black-3);
  box-shadow:0 10px 30px rgba(0,0,0,.12);
}

.section-label{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1.1px;
  font-weight:950;
  color:var(--muted);
  margin-bottom:9px;
}

.card-dark .section-label{
  color:#85858c;
}

.big{
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px;
}

.muted{
  color:var(--muted);
}

.small{
  font-size:11px;
}

/* =====================================================
   BOTONES
===================================================== */

.btn{
  border:0;
  border-radius:10px;
  min-height:42px;
  padding:0 15px;
  background:var(--red);
  color:#fff;
  font-weight:900;
  font-size:11px;
  letter-spacing:.05px;
  box-shadow:0 5px 14px rgba(226,29,47,.18);
}

.btn.light{
  background:#eeeeF1;
  color:#25252a;
  box-shadow:none;
}

.btn.red-soft{
  background:var(--red-soft);
  color:var(--red);
  box-shadow:none;
}

.btn.full{
  width:100%;
}

.btn:disabled{
  opacity:.45;
  cursor:not-allowed;
}

/* =====================================================
   ESTADÍSTICAS
===================================================== */

.stat-grid{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
  margin-bottom:13px;
}

.stat{
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:13px;
  padding:13px 8px;
  text-align:center;
}

.card-dark .stat{
  background:#18181c;
  border-color:#29292e;
}

.stat b{
  display:block;
  font-size:21px;
  font-weight:950;
  letter-spacing:-.4px;
}

.stat span{
  display:block;
  color:var(--muted);
  font-size:9px;
  font-weight:850;
  margin-top:4px;
}

.card-dark .stat span{
  color:#898991;
}

.stat.red{
  background:var(--red-soft);
  border-color:#ffd6db;
}

.stat.red b{
  color:var(--red);
}

/* =====================================================
   INICIO
===================================================== */

.home-title-row{
  margin-top:0;
  margin-bottom:14px;
}

.home-title-row .title{
  font-size:26px;
}

.home-title-row .subtitle{
  font-size:12px;
}

.home-team-heading{
  display:flex;
  align-items:center;
  gap:12px;
  min-width:0;
}

.home-team-logo{
  width:56px;
  height:56px;
  flex:0 0 56px;
  border-radius:14px;
  background:#fff;
  border:1px solid var(--line);
  display:grid;
  place-items:center;
  overflow:hidden;
  box-shadow:0 5px 16px rgba(15,15,20,.07);
}

.home-team-logo img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.home-team-logo-placeholder{
  width:26px;
  height:26px;
  border:2px solid #c7c7cc;
  border-radius:7px;
  position:relative;
}

.home-team-logo-placeholder:after{
  content:"";
  position:absolute;
  left:5px;
  right:5px;
  bottom:5px;
  height:2px;
  background:#c7c7cc;
  border-radius:2px;
}

.home-team-info{
  min-width:0;
}

.home-team-name{
  font-size:15px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.home-team-season,
.home-team-division,
.home-team-category{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  margin-top:3px;
  line-height:1.35;
}

/* =====================================================
   SALUDO
===================================================== */

.home-title-row + .card{
  padding:18px;
  border-radius:17px;
  background:
    linear-gradient(
      135deg,
      #ffffff 0%,
      #fafafa 100%
    );
}

.home-title-row + .card .title{
  font-size:19px;
}

.home-title-row + .card .subtitle{
  margin-top:6px;
}

/* =====================================================
   ACCESOS RÁPIDOS
===================================================== */

.home-quick-card{
  position:relative;
  display:flex;
  align-items:center;
  gap:13px;
  padding:14px 15px;
  cursor:pointer;
  overflow:hidden;
}

.home-quick-card:before{
  content:"";
  position:absolute;
  left:0;
  top:0;
  bottom:0;
  width:3px;
  background:var(--red);
  opacity:0;
  transition:.2s ease;
}

.home-quick-card:active:before{
  opacity:1;
}

.home-quick-icon{
  width:7px;
  height:36px;
  flex:0 0 7px;
  border-radius:5px;
  background:var(--red);
  font-size:0;
}

.home-quick-content{
  flex:1;
  min-width:0;
}

.home-quick-title{
  font-size:12px;
  font-weight:950;
  letter-spacing:.05px;
}

.home-quick-subtitle{
  font-size:9px;
  color:var(--muted);
  font-weight:750;
  margin-top:4px;
}

.home-quick-arrow{
  width:25px;
  height:25px;
  border:1px solid var(--line);
  border-radius:50%;
  display:grid;
  place-items:center;
  color:#77777e;
  font-size:16px;
  line-height:1;
}

/* =====================================================
   ACTIVIDAD
===================================================== */

.home-activity-card{
  padding:16px;
}

.activity-item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:11px 0;
  border-bottom:1px solid #ededf0;
}

.activity-item:last-child{
  border-bottom:0;
  padding-bottom:0;
}

.activity-item:first-child{
  padding-top:2px;
}

.activity-icon{
  display:none;
}

.activity-content{
  flex:1;
  min-width:0;
}

.activity-title{
  font-size:10px;
  font-weight:900;
  line-height:1.3;
}

.activity-time{
  font-size:8px;
  color:var(--muted);
  margin-top:3px;
}

.activity-empty{
  padding:7px 0 2px;
  font-size:10px;
  color:var(--muted);
  font-weight:700;
}

/* =====================================================
   ÚLTIMO PARTIDO
===================================================== */

.home-last-match{
  padding:15px;
  cursor:pointer;
}

.home-last-match-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:10px;
  margin-bottom:13px;
}

.home-last-match-label{
  font-size:9px;
  text-transform:uppercase;
  letter-spacing:1px;
  color:var(--muted);
  font-weight:950;
}

.home-last-match-date{
  font-size:8px;
  color:var(--muted);
  font-weight:750;
}

.home-last-match-body{
  display:flex;
  align-items:center;
  gap:12px;
}

.home-last-match-teams{
  flex:1;
  min-width:0;
}

.home-last-match-team{
  font-size:12px;
  font-weight:950;
  line-height:1.25;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.home-last-match-team + .home-last-match-team{
  margin-top:6px;
}

.home-last-match-vs{
  color:#aaa;
  font-size:8px;
  font-weight:850;
  margin-right:4px;
}

.home-last-match-result{
  min-width:66px;
  padding:10px 8px;
  border-radius:12px;
  background:var(--black);
  color:#fff;
  text-align:center;
  font-size:18px;
  font-weight:950;
  letter-spacing:-.4px;
}

.home-last-match-footer{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #ededf0;
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
}

.home-last-match-footer-text{
  font-size:8px;
  color:var(--muted);
  font-weight:750;
}

.home-last-match-arrow{
  font-size:18px;
  color:#99999f;
}

/* =====================================================
   PARTIDOS
===================================================== */

.match-card{
  background:#fff;
  border:1px solid var(--line);
  border-radius:16px;
  padding:15px;
  margin-bottom:10px;
  box-shadow:var(--shadow);
}

.match-card-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:12px;
}

.match-teams{
  flex:1;
  min-width:0;
}

.match-home,
.match-away{
  font-size:12px;
  font-weight:950;
  line-height:1.25;
}

.match-away{
  margin-top:5px;
}

.match-vs{
  color:#aaa;
  font-size:8px;
  font-weight:850;
  margin:0 4px;
}

.match-result{
  min-width:62px;
  padding:9px 8px;
  border-radius:11px;
  background:var(--black);
  color:#fff;
  text-align:center;
  font-size:17px;
  font-weight:950;
}

.match-details{
  margin-top:12px;
  padding-top:10px;
  border-top:1px solid #ededf0;
  display:grid;
  gap:7px;
}

.match-detail{
  font-size:9px;
  color:#555;
  line-height:1.45;
}

.match-detail b{
  color:#222;
  font-weight:950;
}

.match-date{
  margin-top:10px;
  font-size:8px;
  color:var(--muted);
  font-weight:750;
}

.match-actions{
  display:flex;
  gap:6px;
  margin-top:11px;
}

.match-action{
  width:32px;
  height:32px;
  border:1px solid var(--line);
  border-radius:9px;
  background:#fafafa;
  color:#666;
  display:grid;
  place-items:center;
  font-size:0;
}

.match-action:before{
  content:"Editar";
  font-size:8px;
  font-weight:900;
}

.match-action.delete:before{
  content:"Eliminar";
}

.match-action.delete{
  color:var(--red);
  background:var(--red-soft);
  border-color:#ffd9de;
}

.matches-empty{
  text-align:center;
  padding:42px 18px;
}

.matches-empty-icon{
  width:52px;
  height:52px;
  margin:0 auto 13px;
  border-radius:15px;
  background:var(--black);
  position:relative;
  font-size:0;
}

.matches-empty-icon:after{
  content:"";
  position:absolute;
  left:14px;
  right:14px;
  top:24px;
  height:2px;
  background:#fff;
  border-radius:2px;
}

.matches-empty-title{
  font-size:14px;
  font-weight:950;
}

.matches-empty-text{
  margin-top:6px;
  font-size:9px;
  color:var(--muted);
  font-weight:700;
  line-height:1.5;
}

/* =====================================================
   GOLEADORES / TARJETAS
===================================================== */

.match-stats-card{
  background:#fafafa;
  border:1px solid var(--line);
  border-radius:14px;
  padding:11px;
  margin-bottom:12px;
}

.match-stats-header{
  display:flex;
  align-items:center;
  justify-content:space-between;
  gap:8px;
  padding:3px 4px 10px;
}

.match-stats-title{
  font-size:12px;
  font-weight:950;
}

.match-stats-help{
  font-size:8px;
  color:var(--muted);
  font-weight:800;
  text-align:right;
}

/* =====================================================
   SELECTORES
===================================================== */

.select,
.form-input,
.form-textarea{
  appearance:none;
  -webkit-appearance:none;
}

.scorer-selector{
  display:flex;
  gap:7px;
  align-items:center;
}

.scorer-selector .select{
  flex:1;
  min-width:0;
}

.scorer-controls-selected{
  display:flex;
  align-items:center;
  gap:7px;
  margin-top:8px;
}

.scorer-controls-selected .scorer-btn{
  flex:0 0 45px;
}

.scorer-selected-info{
  flex:1;
  min-width:0;
  height:45px;
  border:1px solid #dedee2;
  border-radius:11px;
  background:#fff;
  display:flex;
  align-items:center;
  justify-content:center;
  padding:0 8px;
  text-align:center;
}

.scorer-selected-name{
  font-size:10px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.scorer-selected-count{
  font-size:9px;
  color:var(--muted);
  font-weight:800;
  margin-left:5px;
}

.scorer-selected-list{
  margin-top:10px;
  display:grid;
  gap:6px;
}

.scorer-selected-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 9px;
  background:#fff;
  border:1px solid #e5e5e8;
  border-radius:10px;
}

.scorer-selected-icon{
  display:none;
}

.scorer-selected-name-list{
  flex:1;
  min-width:0;
  font-size:10px;
  font-weight:900;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.scorer-selected-goals{
  min-width:29px;
  padding:4px 7px;
  border-radius:7px;
  background:var(--red-soft);
  color:var(--red);
  text-align:center;
  font-size:10px;
  font-weight:950;
}

.scorer-list{
  display:grid;
  gap:7px;
}

.scorer-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:10px 6px;
  border:1px solid #e1e1e4;
  border-radius:12px;
  background:#fff;
}

.scorer-info{
  flex:1;
  min-width:0;
}

.scorer-name{
  font-size:11px;
  font-weight:950;
  white-space:nowrap;
  overflow:hidden;
  text-overflow:ellipsis;
}

.scorer-pos{
  font-size:8px;
  color:var(--muted);
  font-weight:800;
  margin-top:2px;
}

.scorer-controls{
  display:flex;
  align-items:center;
  gap:8px;
  flex:0 0 auto;
}

.scorer-btn{
  width:38px;
  height:38px;
  border:0;
  border-radius:10px;
  display:grid;
  place-items:center;
  font-size:20px;
  font-weight:950;
}

.scorer-minus{
  background:#ededf0;
  color:#555;
}

.scorer-plus{
  background:var(--red-soft);
  color:var(--red);
}

.scorer-count{
  min-width:20px;
  text-align:center;
  font-size:14px;
  font-weight:950;
}

.cards-panel{
  margin-top:2px;
}

.card-select-row{
  display:flex;
  gap:7px;
  align-items:center;
}

.card-select-row .select{
  flex:1;
  min-width:0;
}

.card-buttons{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:8px;
}

.card-add-btn{
  border:0;
  border-radius:10px;
  min-height:44px;
  font-size:10px;
  font-weight:950;
}

.card-yellow{
  background:#f5f0dc;
  color:#665a25;
}

.card-red{
  background:var(--red-soft);
  color:var(--red);
}

.selected-cards{
  margin-top:10px;
  display:grid;
  gap:6px;
}

.selected-card-row{
  display:flex;
  align-items:center;
  gap:8px;
  padding:8px 9px;
  background:#fff;
  border:1px solid #e5e5e8;
  border-radius:10px;
}

.selected-card-badge{
  width:7px;
  height:24px;
  border-radius:4px;
  background:#d5bf51;
  font-size:0;
}

.selected-card-row:has(.selected-card-badge){
}

.selected-card-name{
  flex:1;
  min-width:0;
  font-size:10px;
  font-weight:900;
}

.selected-card-remove{
  width:25px;
  height:25px;
  border:0;
  border-radius:7px;
  background:#ededf0;
  color:#666;
  font-weight:950;
}

/* =====================================================
   ESCUDO
===================================================== */

.team-logo-settings{
  display:flex;
  align-items:center;
  gap:13px;
  padding:12px;
  border:1px solid var(--line);
  border-radius:14px;
  background:#fafafa;
  margin-bottom:12px;
}

.team-logo-preview{
  width:72px;
  height:72px;
  flex:0 0 72px;
  border-radius:14px;
  background:#fff;
  border:1px solid #dedee2;
  display:grid;
  place-items:center;
  overflow:hidden;
  box-shadow:0 4px 14px rgba(15,15,20,.05);
}

.team-logo-preview img{
  width:100%;
  height:100%;
  object-fit:contain;
  display:block;
}

.team-logo-placeholder{
  width:27px;
  height:27px;
  border:2px solid #b9b9bf;
  border-radius:7px;
  font-size:0;
}

.team-logo-info{
  flex:1;
  min-width:0;
}

.team-logo-title{
  font-size:12px;
  font-weight:950;
}

.team-logo-subtitle{
  font-size:9px;
  color:var(--muted);
  line-height:1.4;
  margin-top:4px;
}

.team-logo-actions{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:7px;
  margin-top:10px;
}

.logo-file-input{
  display:none;
}

/* =====================================================
   PLANTILLA
===================================================== */

.tabs{
  display:flex;
  gap:6px;
  overflow:auto;
  margin-bottom:12px;
  padding-bottom:2px;
  scrollbar-width:none;
}

.tabs::-webkit-scrollbar{
  display:none;
}

.tab{
  border:1px solid #dedee2;
  border-radius:9px;
  padding:9px 13px;
  background:#fff;
  color:#67676e;
  font-size:9px;
  font-weight:900;
  white-space:nowrap;
}

.tab.active{
  background:var(--black);
  border-color:var(--black);
  color:#fff;
}

.item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-bottom:1px solid #ededf0;
}

.item:last-child{
  border:0;
}

.avatar{
  width:40px;
  height:40px;

/* =====================================================

===================================================== */

function esc(s){

  return String(s??'').replace(
    /[&<>"']/g,
    m=>({
      '&':'&amp;',
      '<':'&lt;',
      '>':'&gt;',
      '"':'&quot;',
      "'":'&#039;'
    }[m])
  );

}

function activityTime(timestamp){

  if(!timestamp)return '';

  const diff=
    Date.now()-Number(timestamp);

  const minute=60000;
  const hour=60*minute;
  const day=24*hour;

  if(diff<minute)
    return 'Ahora';

  if(diff<hour){
    return`Hace ${
      Math.floor(diff/minute)
    } min`;
  }

  if(diff<day){
    return`Hace ${
      Math.floor(diff/hour)
    } h`;
  }

  if(diff<2*day)
    return'Ayer';

  return new Date(
    timestamp
  ).toLocaleDateString(
    'es-ES',
    {
      day:'numeric',
      month:'short'
    }
  );

}

function toggleAddReason(){

  const available=
    document.querySelector(
      '#add-available-yes'
    );

  const reason=
    document.getElementById(
      'add-reason'
    );

  const group=
    document.getElementById(
      'add-reason-group'
    );

  if(!available||!reason||!group)
    return;

  const isAvailable=available.checked;

  reason.disabled=isAvailable;

  group.classList.toggle(
    'edit-disabled',
    isAvailable
  );

  if(isAvailable){
    reason.value='';
  }

}

function saveNewPlayer(){

  const name=document.getElementById('add-name');
  const num=document.getElementById('add-num');
  const pos=document.getElementById('add-pos');
  const available=document.querySelector(
    'input[name="add-available"]:checked'
  );
  const reason=document.getElementById('add-reason');
  const min=document.getElementById('add-min');
  const goals=document.getElementById('add-goals');
  const assists=document.getElementById('add-assists');

  const newName=name?name.value.trim():'';
  const newNum=num?num.value.trim():'';
  const newPos=pos?pos.value.trim():'';

  if(!newName){
    alert('El nombre del jugador es obligatorio.');
    name?.focus();
    return;
  }

  if(!newNum){
    alert('El dorsal es obligatorio.');
    num?.focus();
    return;
  }

  if(!newPos){
    alert('La posición es obligatoria.');
    pos?.focus();
    return;
  }

  const isAvailable=
    available
      ?available.value==='true'
      :true;

  const newPlayer={

    id:Date.now(),

    name:newName,

    num:newNum,

    pos:newPos,

    available:isAvailable,

    reason:
      isAvailable
        ?''
        :(reason?reason.value.trim():''),

    min:Math.max(
      0,
      Number(min?.value)||0
    ),

    g:Math.max(
      0,
      Number(goals?.value)||0
    ),

    a:Math.max(
      0,
      Number(assists?.value)||0
    )

  };

  data.players.push(newPlayer);

  addActivity(

    return;

  reason.disabled=isAvailable;

  group.classList.toggle(
    'edit-disabled',
    isAvailable
  );

  }

function saveEditedPlayer(){

  const p=
    data.players.find(
      x=>
        String(x.id)===
        String(selectedPlayerId)
    );

    closeEditModal();
    return;
  }

  const name=document.getElementById('edit-name');
  const num=document.getElementById('edit-num');
  const pos=document.getElementById('edit-pos');
  const available=document.querySelector(
    'input[name="edit-available"]:checked'
  );
  const reason=document.getElementById('edit-reason');
  const min=document.getElementById('edit-min');
  const goals=document.getElementById('edit-goals');
  const assists=document.getElementById('edit-assists');

  const newName=name?name.value.trim():p.name;
  const newNum=num?num.value.trim():p.num;
  const newPos=pos?pos.value.trim():p.pos;

  if(!newName){
    alert('El nombre del jugador es obligatorio.');
    name?.focus();
    return;
  }

  if(!newNum){
    alert('El dorsal es obligatorio.');
    num?.focus();
    return;
  }

  if(!newPos){
    alert('La posición es obligatoria.');
    pos?.focus();
    return;
  }

  p.name=newName;
  p.num=newNum;
  p.pos=newPos;

  p.available=
    available
      ?available.value==='true'
      :p.available;

  p.reason=
    p.available
      ?''
      :(reason?reason.value.trim():p.reason);

  p.min=Math.max(
    0,
    Number(min?.value)||0
  );

  p.g=Math.max(
    0,
    Number(goals?.value)||0
  );

  p.a=Math.max(

    Number(assists?.value)||0
  );

    'player',
    `Jugador actualizado: ${p.name}`
  );

  closeEditModal();

  render();

/* =====================================================
   ESTADÍSTICAS DEL PARTIDO
===================================================== */

function getPlayerById(id){

  return data.players.find(
    p=>String(p.id)===String(id)
  );

}

function escapeRegex(value){

  return String(value).replace(
    /[.*+?^${}()|[\]\\]/g,
    '\\$&'
  );

}

function parseOldScorers(text){

  const counts={};

  if(!text)
    return counts;

  const parts=
    String(text)
      .split(',')
      .map(x=>x.trim())
      .filter(Boolean);

  parts.forEach(part=>{

    let found=false;

    const sorted=
      [...data.players]
        .sort(
          (a,b)=>
            String(b.name).length-
            String(a.name).length
        );

    sorted.forEach(player=>{

      if(found)return;

      const regex=
        new RegExp(
          '^'+
          escapeRegex(player.name)+
          '(?:\\s+(\\d+))?$',
          'i'
        );

      const match=
        part.match(regex);

      if(match){

        const count=
          Math.max(
            1,
            Number(match[1])||1
          );

        counts[String(player.id)]=count;

        found=true;

      }

    });

  });

  return counts;

}

function parseOldCards(text){

  const entries=[];

  if(!text)
    return entries;

  const parts=
    String(text)
      .split(',')
      .map(x=>x.trim())
      .filter(Boolean);

  parts.forEach(part=>{

    const sorted=
      [...data.players]
        .sort(
          (a,b)=>
            String(b.name).length-
            String(a.name).length
        );

    for(const player of sorted){

      if(
        part
          .toLowerCase()
          .includes(
            String(player.name).toLowerCase()
          )
      ){

        entries.push({

          playerId:
            String(player.id),

          color:
            part.includes('🟥')
              ?'red'
              :'yellow'

        });

        break;

      }

    }

  });

  return entries;

}

function initMatchStats(existing){

  matchScorerCounts={};

  matchScorerPlayerId='';

  matchCardEntries=[];

  matchCardPlayerId='';

  if(!existing)
    return;

  if(
    existing.scorerCounts&&
    typeof existing.scorerCounts==='object'
  ){

    Object.entries(
      existing.scorerCounts
    ).forEach(([id,count])=>{

      const n=
        Math.max(
          0,
          Number(count)||0
        );

      if(n>0){
        matchScorerCounts[String(id)]=n;
      }

    });

  }else{

    matchScorerCounts=
      parseOldScorers(
        existing.scorers||''
      );

  }

  if(
    Array.isArray(existing.cardEntries)
  ){

    matchCardEntries=
      existing.cardEntries
        .map(card=>({

          playerId:
            String(card.playerId),

          color:
            card.color==='red'
              ?'red'
              :'yellow'

        }))
        .filter(
          card=>
            getPlayerById(card.playerId)
        );

  }else{

    matchCardEntries=
      parseOldCards(
        existing.cards||''
      );

  }

}

/* =====================================================
   GOLEADORES
===================================================== */

function changeMatchScorer(
  playerId,
  amount
){

  const id=String(playerId);

  const current=
    Number(
      matchScorerCounts[id]||0
    );

  const next=
    Math.max(
      0,
      current+Number(amount)
    );

  if(next===0){

    delete matchScorerCounts[id];

  }else{

    matchScorerCounts[id]=next;

  }

  renderMatchScorers();

}

function selectMatchScorer(playerId){

  matchScorerPlayerId=
    String(playerId||'');

  renderMatchScorers();

}

function renderMatchScorers(){

  const container=
    document.getElementById(
      'match-scorers-list'
    );

  if(!container)
    return;

  const selectedId=
    String(
      matchScorerPlayerId||''
    );

  const selectedPlayer=
    selectedId
      ?getPlayerById(selectedId)
      :null;

  const selectedCount=
    selectedPlayer
      ?Number(
          matchScorerCounts[selectedId]||0
        )
      :0;

  const selectedRows=
    Object.entries(
      matchScorerCounts
    )
    .filter(
      ([id,count])=>
        Number(count)>0&&
        getPlayerById(id)
    )
    .sort(
      ([a],[b])=>{

        const pa=getPlayerById(a);
        const pb=getPlayerById(b);

        return String(pa?.name||'')
          .localeCompare(
            String(pb?.name||''),
            'es'
          );

      }
    )
    .map(
      ([id,count])=>{

        const player=
          getPlayerById(id);

        return`

          <div class="scorer-selected-row">

            <div class="scorer-selected-icon"></div>

            <div class="scorer-selected-name-list">

              ${esc(player.name)}

            </div>

            <div class="scorer-selected-goals">

              ${Number(count)}

            </div>

          </div>

        `;

      }
    )
    .join('');

  container.innerHTML=`

    <div class="scorer-selector">

      <select
        id="match-scorer-player"
        class="select"
        onchange="
          selectMatchScorer(this.value)
        ">

        <option value="">
          Seleccionar jugador...
        </option>

        ${
          data.players.map(
            player=>`

              <option
                value="${esc(player.id)}"
                ${
                  selectedId===
                  String(player.id)
                    ?'selected'
                    :''
                }>

                ${esc(player.name)}

              </option>

            `
          ).join('')
        }

      </select>

    </div>

    ${
      selectedPlayer

        ?`

          <div class="scorer-controls-selected">

            <button
              type="button"
              class="scorer-btn scorer-minus"
              onclick="
                changeMatchScorer(
                  '${esc(selectedPlayer.id)}',
                  -1
                )
              "
              ${selectedCount<=0?'disabled':''}>

              −

            </button>

            <div class="scorer-selected-info">

              <div class="scorer-selected-name">

                ${esc(selectedPlayer.name)}

                <span class="scorer-selected-count">

                  · ${selectedCount} ${
                    selectedCount===1
                      ?'gol'
                      :'goles'
                  }

                </span>

              </div>

            </div>

            <button
              type="button"
              class="scorer-btn scorer-plus"
              onclick="
                changeMatchScorer(
                  '${esc(selectedPlayer.id)}',
                  1
                )
              ">

              +

            </button>

          </div>

        `
        :''
    }

    ${
      selectedRows

        ?`

          <div class="scorer-selected-list">

            ${selectedRows}

          </div>

        `
        :''
    }

  `;

}

function addMatchCard(color){

  if(
    color!=='yellow'&&
    color!=='red'
  ){
    return;
  }

  if(!matchCardPlayerId){

    alert(
      'Selecciona un jugador primero.'
    );

    return;

  }

  const player=
    getPlayerById(
      matchCardPlayerId
    );

  if(!player)
    return;

  matchCardEntries.push({

    playerId:
      String(player.id),

    color

  });

  matchCardPlayerId='';

  const select=
    document.getElementById(
      'match-card-player'
    );

  if(select){
    select.value='';
  }

  renderMatchCards();

}

function removeMatchCard(index){

  if(
    index<0||
    index>=matchCardEntries.length
  ){
    return;
  }

  matchCardEntries.splice(
    index,
    1
  );

  renderMatchCards();

}

function renderMatchCards(){

  const container=
    document.getElementById(
      'selected-cards'
    );

  if(!container)
    return;

  if(!matchCardEntries.length){

    container.innerHTML=`

      <div class="cards-empty">
        Todavía no has añadido tarjetas.
      </div>

    `;

    return;

  }

  container.innerHTML=
    matchCardEntries.map(
      (card,index)=>{

        const player=
          getPlayerById(
            card.playerId
          );

        if(!player)
          return '';

        return`

          <div class="selected-card-row">

            <div
              class="selected-card-badge"
              style="
                background:${
                  card.color==='red'
                    ?'var(--red)'
                    :'#d5bf51'
                };
              ">
            </div>

            <div class="selected-card-name">

              ${esc(player.name)}

              ·

              ${
                card.color==='red'
                  ?'Roja'
                  :'Amarilla'
              }

            </div>

            <button
              type="button"
              class="selected-card-remove"
              onclick="
                removeMatchCard(${index})
              ">

              ×

            </button>

          </div>

        `;

      }
    ).join('');

}

function buildScorersText(){

  return Object.entries(
    matchScorerCounts
  )
  .map(([id,count])=>{

    const player=
      getPlayerById(id);

    if(!player)
      return '';

    const n=
      Math.max(
        0,
        Number(count)||0
      );

    if(!n)
      return '';

    return`${player.name} ${n}`;

  })
  .filter(Boolean)
  .join(', ');

}

function buildCardsText(){

  return matchCardEntries
    .map(card=>{

      const player=
        getPlayerById(
          card.playerId
        );

      if(!player)
        return '';

      return`${player.name} ${
        card.color==='red'
          ?'🟥'
          :'🟨'
      }`;

    })
    .filter(Boolean)
    .join(', ');

}

function saveMatch(id=null){

  const home=
    document.getElementById(
      'match-home'
    );

  const away=
    document.getElementById(
      'match-away'
    );

  const result=
    document.getElementById(
      'match-result'
    );

  const matchHome=
    home
      ?home.value.trim()
      :'';

  const matchAway=
    away
      ?away.value.trim()
      :'';

  const matchResult=
    result
      ?result.value.trim()
      :'';

  if(!matchHome){

    alert(
      'El equipo local es obligatorio.'
    );

    home?.focus();

    return;

  }

  if(!matchAway){

    alert(
      'El equipo visitante es obligatorio.'
    );

    away?.focus();

    return;

  }

  if(!matchResult){

    alert(
      'El resultado final es obligatorio.'
    );

    result?.focus();

    return;

  }

  const matchScorers=
    buildScorersText();

  const matchCards=
    buildCardsText();

  const cleanScorerCounts={};

  Object.entries(
    matchScorerCounts
  ).forEach(([playerId,count])=>{

    const player=
      getPlayerById(playerId);

    const n=
      Math.max(
        0,
        Number(count)||0
      );

    if(player&&n>0){

      cleanScorerCounts[
        String(player.id)
      ]=n;

    }

  });

  const cleanCards=
    matchCardEntries
      .filter(
        card=>
          getPlayerById(card.playerId)
      )
      .map(card=>({

        playerId:
          String(card.playerId),

        color:
          card.color==='red'
            ?'red'
            :'yellow'

      }));

  if(id!==null){

    const match=
      data.matches.find(
        m=>
          String(m.id)===
          String(id)
      );

    if(!match){

      closeMatchModal();

      return;

    }

    match.home=
      matchHome;

    match.away=
      matchAway;

    match.rival=
      matchAway;

    match.result=
      matchResult;

    match.scorers=
      matchScorers;

    match.cards=
      matchCards;

    match.scorerCounts=
      cleanScorerCounts;

    match.cardEntries=
      cleanCards;

    match.updatedAt=
      Date.now();

    addActivity(
      'match',
      `Partido actualizado: ${matchHome} ${matchResult} ${matchAway}`
    );

  }else{

    const now=
      Date.now();

    const newMatch={

      id:
        `match-${now}-${Math.random()
          .toString(36)
          .slice(2,8)}`,

      home:
        matchHome,

      away:
        matchAway,

      rival:
        matchAway,

      result:
        matchResult,

      scorers:
        matchScorers,

      cards:
        matchCards,

      scorerCounts:
        cleanScorerCounts,

      cardEntries:
        cleanCards,

      createdAt:
        now,

      updatedAt:
        now

    };

    data.matches.unshift(
      newMatch
    );

    data.settings.team=
      matchHome;

    addActivity(
      'match',
      `Partido añadido: ${matchHome} ${matchResult} ${matchAway}`
    );

  }

  save();

  closeMatchModal();

  render();

}

function closeMatchModal(){

  const modal=
    document.getElementById(
      'match-modal'
    );

  if(modal){
    modal.remove();
  }

  if(
    !document.getElementById('edit-player-modal')&&
    !document.getElementById('add-player-modal')&&
    !document.getElementById('note-modal')
  ){

    document.body.style.overflow='';

  }

}

function deleteMatch(id){

  const match=
    data.matches.find(
      m=>
        String(m.id)===
        String(id)
    );

  if(!match)
    return;

  const away=
    match.away||
    match.rival||
    '';

  const confirmed=
    confirm(
      `¿Eliminar el partido "${match.home} vs ${away}"?`
    );

  if(!confirmed)
    return;

  data.matches=
    data.matches.filter(
      m=>
        String(m.id)!==
        String(id)
    );

  addActivity(
    'delete',
    `Partido eliminado: ${match.home} vs ${away}`
  );

  save();

  render();

}

function handleTeamLogoUpload(event){

  const input=event.target;

  if(
    !input||
    !input.files||
    !input.files.length
  ){
    return;
  }

  const file=input.files[0];

  if(!file.type.startsWith('image/')){

    alert(
      'Selecciona una imagen válida.'
    );

    input.value='';

    return;

  }

  const reader=new FileReader();

  reader.onload=function(){

    const image=new Image();

    image.onload=function(){

      const maxSize=500;

      let width=image.naturalWidth;
      let height=image.naturalHeight;

      if(width<=0||height<=0){

        alert(
          'No se ha podido leer la imagen.'
        );

        input.value='';

        return;

      }

      const scale=
        Math.min(
          1,
          maxSize/
          Math.max(width,height)
        );

      width=Math.round(width*scale);
      height=Math.round(height*scale);

      const canvas=document.createElement('canvas');

      canvas.width=width;
      canvas.height=height;

      const ctx=canvas.getContext('2d');

      if(!ctx){

        alert(
          'No se ha podido procesar la imagen.'
        );

        input.value='';

        return;

      }

      ctx.clearRect(
        0,
        0,
        width,
        height
      );

      ctx.drawImage(
        image,
        0,
        0,
        width,
        height
      );

      let logoData;

      try{

        logoData=
          canvas.toDataURL(
            'image/webp',
            .82
          );

      }catch(error){

        logoData=
          canvas.toDataURL(
            'image/jpeg',
            .85
          );

      }

      data.settings.logo=logoData;

      addActivity(
        'logo',
        'Escudo del equipo actualizado'
      );

      save();

      refreshSettingsLogoUI();

      input.value='';

    };

    image.onerror=function(){

      alert(
        'No se ha podido cargar la imagen.'
      );

      input.value='';

    };

    image.src=reader.result;

  };

  reader.onerror=function(){

    alert(
      'No se ha podido leer el archivo.'
    );

    input.value='';

  };

  reader.readAsDataURL(file);

}

    data.settings.team=
      team.value.trim()||
      'KNATT FC';
  }

  if(season){
    data.settings.season=
      season.value.trim()||
      '2026/27';
  }

  if(category){
    data.settings.category=
      category.value.trim()||
      'Primer Equipo';
  }

  if(division){
    data.settings.division=
      division.value.trim();
  }

  addActivity(
    'profile',
    'Perfil del equipo actualizado'
  );

  save();

  go('home');

}

/* =====================================================
   TÁCTICA
===================================================== */

function tactic(){

  const view=
    data.tactics.view==='half'
      ?'half'
      :'full';

  const positions=
    data.tactics.positions||{};

  const placedIds=
    new Set(
      Object.values(positions)
        .map(
          p=>
            String(
              p?.playerId||
              ''
            )
        )
        .filter(Boolean)
    );

  const availablePlayers=
    data.players.filter(
      p=>
        p.available!==false&&
        !placedIds.has(
          String(p.id)
        )
    );

  return`

    <div class="title-row">

      <div>

        <div class="title">
          Táctica
        </div>

        <div class="subtitle">
          Arrastra los jugadores al campo
        </div>

      </div>

    </div>

    <div class="tactic-toolbar">

      <button
        type="button"
        class="tactic-view-btn ${
          view==='full'?'active':''
        }"
        onclick="
          changeTacticView('full')
        ">

        Campo entero

      </button>

      <button
        type="button"
        class="tactic-view-btn ${
          view==='half'?'active':''
        }"
        onclick="
          changeTacticView('half')
        ">

        Medio campo

      </button>

    </div>

    <div class="tactic-help">

      Arrastra un jugador desde abajo
      y colócalo donde quieras.

    </div>

    <div class="pitch-wrap">

      <div
        id="tactic-pitch"
        class="pitch ${
          view==='half'?'half-mode':''
        }">

        <div class="pitch-line"></div>

        <div class="pitch-circle"></div>

        <div class="pitch-center"></div>

        <div class="box top"></div>

        <div class="box bottom"></div>

        <div class="goal top"></div>

        <div class="goal bottom"></div>

        ${
          Object.entries(positions)
            .map(
              ([key,value])=>
                boardPlayerHtml(key,value)
            )
            .join('')
        }

      </div>

    </div>

    <div class="player-tray">

      <div class="player-tray-title">

        <strong>
          Jugadores
        </strong>

        <span class="player-tray-count">

          ${availablePlayers.length}

          disponibles para colocar

        </span>

      </div>

      <div class="player-tray-list">

        ${
          availablePlayers.length

            ?availablePlayers.map(
              p=>trayPlayerHtml(p)
            ).join('')

            :`

              <div class="tray-empty">

                Todos los jugadores disponibles
                están en el campo.

              </div>

            `

        }

      </div>

    </div>

    <div class="tactic-actions">

      <button
        class="btn"
        onclick="saveTactic()">

        Guardar

      </button>

      <button
        class="btn light"
        onclick="clearTactic()">

        Vaciar

      </button>

    </div>

  `;

}

function trayPlayerHtml(player){

  return`

    <div
      class="tray-player"
      data-player-id="${esc(player.id)}"
      data-drag-source="tray"
      onpointerdown="
        startTrayDrag(
          event,
          ${player.id}
        )
      ">

      <div class="tray-player-top">

        <div class="tray-number">
          ${esc(player.num)}
        </div>

        <div class="tray-name">
          ${esc(player.name)}
        </div>

      </div>

      <div class="tray-pos">
        ${esc(player.pos||'Jugador')}
      </div>

    </div>

  `;

}

function boardPlayerHtml(
  key,
  value
){

  const player=
    data.players.find(
      p=>
        String(p.id)===
        String(value?.playerId||'')
    );

  if(!player)
    return '';

  let x=Number(value.x);
  let y=Number(value.y);

  if(!Number.isFinite(x))
    x=50;

  if(!Number.isFinite(y))
    y=50;

  x=Math.max(4,Math.min(96,x));
  y=Math.max(3,Math.min(97,y));

  return`

    <div
      class="board-player"
      id="board-player-${esc(player.id)}"
      data-player-id="${esc(player.id)}"
      data-position-key="${esc(key)}"
      style="
        left:${x}%;
        top:${y}%;
      "
      onpointerdown="
        startBoardDrag(
          event,
          '${esc(player.id)}'
        )
      ">

      <div class="board-player-card">

        <div class="board-player-ball"></div>

        <div class="board-player-info">

          <div class="board-player-name">
            ${esc(player.name)}
          </div>

          <div class="board-player-pos">
            ${esc(
              player.pos||
              'Jugador'
            )}
          </div>

        </div>

        <button
          type="button"
          class="board-player-remove"
          onclick="
            event.stopPropagation();
            removePlayerFromTactic(
              '${esc(player.id)}'
            )
          ">

          ×

        </button>

      </div>

    </div>

  `;

}

function changeTacticView(view){

  if(
    view!=='full'&&
    view!=='half'
  ){
    return;
  }

  data.tactics.view=view;

  save();

  render();

}

function addPlayerToTactic(
  playerId,
  x,
  y
){

  const id=String(playerId);

  const player=
    data.players.find(
      p=>String(p.id)===id
    );

  if(!player)
    return;

  const positions=
    data.tactics.positions||{};

  const already=
    Object.entries(positions).find(
      ([key,value])=>
        String(value?.playerId||'')===id
    );

  if(already)
    return;

  const key=
    'p_'+
    Date.now()+
    '_'+
    Math.floor(Math.random()*10000);

  positions[key]={

    playerId:id,

    x:Math.max(
      4,
      Math.min(96,Number(x))
    ),

    y:Math.max(
      3,
      Math.min(97,Number(y))
    )

  };

  data.tactics.positions=positions;

  addActivity(
    'tactic',
    `Jugador colocado: ${player.name}`
  );

  save();

  render();

}

function removePlayerFromTactic(
  playerId,
  silent=false
){

  const id=String(playerId);

  const positions=
    data.tactics.positions||{};

  let removed=false;

  Object.entries(positions).forEach(
    ([key,value])=>{

      if(
        String(value?.playerId||'')===id
      ){

        delete positions[key];

        removed=true;

      }

    }
  );

  if(!removed)
    return;

  const player=
    data.players.find(
      p=>String(p.id)===id
    );

  if(!silent){

    addActivity(
      'tactic',
      player
        ?`${player.name} retirado de la pizarra`
        :'Jugador retirado de la pizarra'
    );

  }

  data.tactics.positions=positions;

  save();

  if(!silent)
    render();

}

/* =====================================================
   DRAG
===================================================== */

let dragState=null;

let dragGhost=null;

function createDragGhost(player){

  if(dragGhost){
    dragGhost.remove();
  }

  dragGhost=
    document.createElement('div');

  dragGhost.className='drag-ghost';

  dragGhost.innerHTML=`

    <div class="board-player-card">

      <div class="board-player-ball"></div>

      <div class="board-player-info">

        <div class="board-player-name">
          ${esc(player.name)}
        </div>

        <div class="board-player-pos">
          ${esc(player.pos||'Jugador')}
        </div>

      </div>

    </div>

  `;

  document.body.appendChild(
    dragGhost
  );

  dragGhost.style.display='block';

}

function updateDragGhost(event){

  if(
    !dragGhost||
    !dragState
  ){
    return;
  }

  dragGhost.style.left=
    `${event.clientX}px`;

  dragGhost.style.top=
    `${event.clientY}px`;

}

function destroyDragGhost(){

  if(dragGhost){

    dragGhost.remove();

    dragGhost=null;

  }

}

function startTrayDrag(
  event,
  playerId
){

  if(
    event.pointerType==='mouse'&&
    event.button!==0
  ){
    return;
  }

  event.preventDefault();
  event.stopPropagation();

  const player=
    data.players.find(
      p=>String(p.id)===String(playerId)
    );

  if(!player)
    return;

  const source=event.currentTarget;

  dragState={

    type:'tray',

    playerId:String(playerId),

    source,

    moved:false,

    startX:event.clientX,

    startY:event.clientY

  };

  source.classList.add('dragging');

  createDragGhost(player);

  updateDragGhost(event);

  try{
    source.setPointerCapture(
      event.pointerId
    );
  }catch(error){}

  document.addEventListener(
    'pointermove',
    handleGlobalPointerMove,
    {passive:false}
  );

  document.addEventListener(
    'pointerup',
    handleGlobalPointerUp,
    {once:true}
  );

  document.addEventListener(
    'pointercancel',
    handleGlobalPointerCancel,
    {once:true}
  );

}

function startBoardDrag(
  event,
  playerId
){

  if(
    event.target.closest(
      '.board-player-remove'
    )
  ){
    return;
  }

  if(
    event.pointerType==='mouse'&&
    event.button!==0
  ){
    return;
  }

  event.preventDefault();
  event.stopPropagation();

  const id=String(playerId);

  const entry=
    Object.entries(
      data.tactics.positions||{}
    ).find(
      ([key,value])=>
        String(value?.playerId||'')===id
    );

  if(!entry)
    return;

  const player=
    data.players.find(
      p=>String(p.id)===id
    );

  if(!player)
    return;

  const source=event.currentTarget;

  dragState={

    type:'board',

    playerId:id,

    key:entry[0],

    source,

    moved:false,

    startX:event.clientX,

    startY:event.clientY

  };

  source.classList.add('dragging');

  try{
    source.setPointerCapture(
      event.pointerId
    );
  }catch(error){}

  document.addEventListener(
    'pointermove',
    handleGlobalPointerMove,
    {passive:false}
  );

  document.addEventListener(
    'pointerup',
    handleGlobalPointerUp,
    {once:true}
  );

  document.addEventListener(
    'pointercancel',
    handleGlobalPointerCancel,
    {once:true}
  );

}

function handleGlobalPointerMove(event){

  if(!dragState)
    return;

  event.preventDefault();

  const dx=
    event.clientX-
    (
      dragState.startX||
      event.clientX
    );

  const dy=
    event.clientY-
    (
      dragState.startY||
      event.clientY
    );

  if(
    Math.abs(dx)>4||
    Math.abs(dy)>4
  ){
    dragState.moved=true;
  }

  if(
    dragState.type==='tray'
  ){
    updateDragGhost(event);
  }

  const pitch=
    document.getElementById(
      'tactic-pitch'
    );

  if(!pitch)
    return;

  const rect=
    pitch.getBoundingClientRect();

  const inside=
    event.clientX>=rect.left&&
    event.clientX<=rect.right&&
    event.clientY>=rect.top&&
    event.clientY<=rect.bottom;

  pitch.classList.toggle(
    'drop-active',
    inside
  );

  if(
    dragState.type==='board'&&
    inside
  ){

    const x=
      (
        (
          event.clientX-
          rect.left
        )/
        rect.width
      )*100;

    const y=
      (
        (
          event.clientY-
          rect.top
        )/
        rect.height
      )*100;

    const playerElement=
      dragState.source;

    playerElement.style.left=
      `${Math.max(
        4,
        Math.min(96,x)
      )}%`;

    playerElement.style.top=
      `${Math.max(
        3,
        Math.min(97,y)
      )}%`;

  }

}

function handleGlobalPointerUp(event){

  if(!dragState)
    return;

  event.preventDefault();

  const state=dragState;

  const pitch=
    document.getElementById(
      'tactic-pitch'
    );

  let dropped=false;

  if(pitch){

    const rect=
      pitch.getBoundingClientRect();

    const inside=
      event.clientX>=rect.left&&
      event.clientX<=rect.right&&
      event.clientY>=rect.top&&
      event.clientY<=rect.bottom;

    if(
      state.type==='tray'&&
      inside&&
      state.moved
    ){

      const x=
        (
          (
            event.clientX-
            rect.left
          )/
          rect.width
        )*100;

      const y=
        (
          (
            event.clientY-
            rect.top
          )/
          rect.height
        )*100;

      destroyDragGhost();

      addPlayerToTactic(
        state.playerId,
        x,
        y
      );

      dropped=true;

    }

    if(
      state.type==='board'&&
      inside&&
      state.moved
    ){

      const x=
        (
          (
            event.clientX-
            rect.left
          )/
          rect.width
        )*100;

      const y=
        (
          (
            event.clientY-
            rect.top
          )/
          rect.height
        )*100;

      updateBoardPlayerPosition(
        state.key,
        x,
        y
      );

      dropped=true;

    }

  }

  cleanupDrag();

  if(!dropped){
    render();
  }

}

function handleGlobalPointerCancel(){

  cleanupDrag();

  render();

}

function updateBoardPlayerPosition(
  key,
  x,
  y
){

  const position=
    data.tactics.positions[key];

  if(!position)
    return;

  position.x=
    Math.max(
      4,
      Math.min(
        96,
        Number(x)
      )
    );

  position.y=
    Math.max(
      3,
      Math.min(
        97,
        Number(y)
      )
    );

  const player=
    data.players.find(
      p=>
        String(p.id)===
        String(position.playerId)
    );

  addActivity(
    'tactic',
    player
      ?`Posición actualizada: ${player.name}`
      :'Posición actualizada'
  );

  save();

}

function cleanupDrag(){

  document.querySelectorAll(
    '.tray-player.dragging'
  ).forEach(
    el=>
      el.classList.remove(
        'dragging'
      )
  );

  document.querySelectorAll(
    '.board-player.dragging'
  ).forEach(
    el=>
      el.classList.remove(
        'dragging'
      )
  );

  document.querySelectorAll(
    '.pitch.drop-active'
  ).forEach(
    el=>
      el.classList.remove(
        'drop-active'
      )
  );

  destroyDragGhost();

  document.removeEventListener(
    'pointermove',
    handleGlobalPointerMove
  );

  dragState=null;

}

/* =====================================================
   TÁCTICA GUARDAR / VACIAR
===================================================== */

function clearTactic(){

  data.tactics.positions={};

  addActivity(
    'tactic',
    'Pizarra táctica vaciada'
  );

  save();

  render();

}

function saveTactic(){

  data.tactics.savedLineup=

    Object.values(
      data.tactics.positions||{}
    ).map(

      v=>({

        playerId:String(v.playerId),

        x:Number(v.x),

        y:Number(v.y)

      })

    );

  addActivity(
    'tactic',
    'Pizarra táctica guardada'
  );

  save();

  alert(
    'Pizarra táctica guardada correctamente.'
  );

}

/* =====================================================
   ARRANQUE
===================================================== */

save();

render();

</script>
