<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>KNATT</title>

<style>
*{box-sizing:border-box}

body{
  margin:0;
  background:#eef3f0;
  color:#17201d;
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;
}

.app{
  max-width:520px;
  margin:auto;
  min-height:100vh;
  background:#f7f9f8;
  padding-bottom:90px;
}

header{
  background:#103c2b;
  color:white;
  padding:18px;
  position:sticky;
  top:0;
  z-index:10;
  box-shadow:0 3px 12px #0002;
}

.brand{
  font-size:25px;
  font-weight:800;
}

.header-sub{
  font-size:13px;
  opacity:.75;
  margin-top:3px;
}

main{
  padding:16px;
}

.card{
  background:white;
  border:1px solid #e1e7e4;
  border-radius:18px;
  padding:16px;
  margin-bottom:14px;
  box-shadow:0 3px 12px #00000008;
}

h1,h2,h3{
  margin-top:0;
}

h2{
  font-size:21px;
}

button{
  border:0;
  border-radius:13px;
  padding:13px 15px;
  font-size:15px;
  font-weight:700;
  cursor:pointer;
}

.btn{
  background:#103c2b;
  color:white;
}

.btn-light{
  background:#e9efec;
  color:#103c2b;
}

.btn-danger{
  background:#b32626;
  color:white;
}

.btn-gold{
  background:#d6a928;
  color:white;
}

.row{
  display:flex;
  gap:9px;
  align-items:center;
}

.row-between{
  display:flex;
  justify-content:space-between;
  align-items:center;
  gap:10px;
}

.grid2{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.grid3{
  display:grid;
  grid-template-columns:repeat(3,1fr);
  gap:8px;
}

input,select,textarea{
  width:100%;
  padding:13px;
  border:1px solid #ccd6d1;
  border-radius:12px;
  background:white;
  font-size:16px;
  margin-top:6px;
}

label{
  display:block;
  font-size:13px;
  font-weight:700;
  margin-top:11px;
}

.item{
  display:flex;
  align-items:center;
  gap:11px;
  padding:12px 0;
  border-bottom:1px solid #edf0ef;
}

.item:last-child{
  border-bottom:0;
}

.avatar{
  width:44px;
  height:44px;
  border-radius:50%;
  background:#dfe9e4;
  color:#103c2b;
  display:flex;
  align-items:center;
  justify-content:center;
  font-weight:800;
  flex-shrink:0;
}

.small{
  font-size:13px;
  color:#6d7773;
}

.badge{
  display:inline-block;
  padding:5px 8px;
  border-radius:8px;
  font-size:12px;
  font-weight:700;
  background:#e9efec;
  color:#103c2b;
}

.stat{
  text-align:center;
  padding:12px 5px;
  background:#f2f6f4;
  border-radius:12px;
}

.stat strong{
  display:block;
  font-size:21px;
}

.empty{
  text-align:center;
  padding:25px 10px;
  color:#7a8480;
}

.green{
  color:#187443;
}

.red{
  color:#b32626;
}

.yellow{
  color:#9a7600;
}

.search{
  margin:12px 0;
}

.player-card{
  background:white;
  border:1px solid #e1e7e4;
  border-radius:16px;
  padding:13px;
  margin-bottom:9px;
}

.player-card:active{
  transform:scale(.99);
}

.player-main{
  display:flex;
  align-items:center;
  gap:12px;
}

.player-info{
  flex:1;
  min-width:0;
}

.player-name{
  font-size:16px;
  font-weight:800;
}

.player-meta{
  margin-top:3px;
  font-size:13px;
  color:#737d79;
}

.status-dot{
  width:9px;
  height:9px;
  border-radius:50%;
  display:inline-block;
  margin-right:5px;
}

.dot-green{
  background:#24a148;
}

.dot-red{
  background:#c62828;
}

.fine{
  display:flex;
  justify-content:space-between;
  align-items:center;
  padding:10px 0;
  border-bottom:1px solid #edf0ef;
}

.fine:last-child{
  border-bottom:0;
}

.total-fines{
  background:#fff7df;
  border:1px solid #f0df9e;
  padding:14px;
  border-radius:13px;
  margin-top:10px;
}

.action-grid{
  display:grid;
  grid-template-columns:1fr 1fr;
  gap:10px;
}

.action-grid button{
  min-height:65px;
}

nav{
  position:fixed;
  bottom:0;
  left:50%;
  transform:translateX(-50%);
  width:min(520px,100%);
  background:white;
  border-top:1px solid #dfe5e2;
  display:grid;
  grid-template-columns:repeat(5,1fr);
  z-index:20;
  padding-bottom:env(safe-area-inset-bottom);
}

nav button{
  background:white;
  color:#68736e;
  border-radius:0;
  padding:10px 4px;
  font-size:11px;
}

nav button.active{
  color:#103c2b;
  font-weight:800;
}

.nav-icon{
  display:block;
  font-size:20px;
  margin-bottom:3px;
}

.hidden{
  display:none!important;
}

.modal{
  position:fixed;
  inset:0;
  background:#0007;
  z-index:50;
  display:flex;
  align-items:flex-end;
  justify-content:center;
}

.modal-box{
  width:min(520px,100%);
  background:white;
  border-radius:22px 22px 0 0;
  padding:20px;
  max-height:90vh;
  overflow:auto;
}

.close{
  float:right;
  background:#edf1ef;
  color:#333;
  padding:8px 11px;
}

.section-title{
  font-size:15px;
  font-weight:800;
  margin:18px 0 8px;
}

@media(max-width:380px){
  .grid3{
    gap:5px;
  }

  .stat strong{
    font-size:18px;
  }
}
</style>
</head>

<body>

<div class="app">

<header>
  <div class="brand">⚽ KNATT</div>
  <div class="header-sub" id="headerSub">Entrenador</div>
</header>

<main id="content"></main>

<nav id="nav">

  <button onclick="go('inicio')" id="nav-inicio">
    <span class="nav-icon">🏠</span>
    Inicio
  </button>

  <button onclick="go('plantilla')" id="nav-plantilla">
    <span class="nav-icon">👥</span>
    Plantilla
  </button>

  <button onclick="go('entrenos')" id="nav-entrenos">
    <span class="nav-icon">🏋️</span>
    Entrenos
  </button>

  <button onclick="go('partidos')" id="nav-partidos">
    <span class="nav-icon">⚽</span>
    Partidos
  </button>

  <button onclick="go('mas')" id="nav-mas">
    <span class="nav-icon">☰</span>
    Más
  </button>

</nav>

</div>

<div id="modal" class="modal hidden">
  <div class="modal-box" id="modalBox"></div>
</div>

<script>

const KEY="teamhub-v2";

let data=JSON.parse(localStorage.getItem(KEY)||"null");

if(!data){

  data={
    team:{
      name:"KNATT",
      season:"2026/27"
    },

    players:[
      {
        id:1,
        name:"Montiimontys",
        num:9,
        pos:"DC",
        available:true,
        reason:"",
        fines:[]
      },
      {
        id:2,
        name:"Marc",
        num:7,
        pos:"MC",
        available:true,
        reason:"",
        fines:[]
      },
      {
        id:3,
        name:"Juan",
        num:4,
        pos:"DFC",
        available:false,
        reason:"Lesión",
        fines:[]
      },
      {
        id:4,
        name:"Alex",
        num:1,
        pos:"POR",
        available:true,
        reason:"",
        fines:[]
      },
      {
        id:5,
        name:"Pedro",
        num:3,
        pos:"LI",
        available:false,
        reason:"Trabajo",
        fines:[]
      }
    ],

    matches:[
      {
        id:1,
        opponent:"CD Rival",
        date:"Domingo 23 de agosto",
        time:"12:00",
        location:"Campo rival",
        convocados:[]
      }
    ],

    trainings:[
      {
        id:1,
        date:"Jueves 20 de agosto",
        time:"21:15",
        place:"Campo habitual",
        attendance:[]
      }
    ],

    stats:{},

    role:"entrenador"
  };

  save();

}

/* Compatibilidad con datos antiguos */

data.players.forEach(p=>{
  if(!p.fines)p.fines=[];
});

if(!data.stats)data.stats={};
if(!data.matches)data.matches=[];
if(!data.trainings)data.trainings=[];

function save(){
  localStorage.setItem(KEY,JSON.stringify(data));
}

let current="inicio";

function go(page){

  current=page;

  document.querySelectorAll("nav button")
    .forEach(x=>x.classList.remove("active"));

  const n=document.getElementById("nav-"+page);

  if(n)n.classList.add("active");

  render();
}

function render(){

  const content=document.getElementById("content");

  if(current==="inicio")content.innerHTML=home();
  if(current==="plantilla")content.innerHTML=plantilla();
  if(current==="entrenos")content.innerHTML=entrenos();
  if(current==="partidos")content.innerHTML=partidos();
  if(current==="mas")content.innerHTML=mas();

  document.getElementById("headerSub").textContent=
    data.role==="administrador"
    ? "Administrador"
    : data.role==="jugador"
    ? "Jugador"
    : "Entrenador";
}

/* =========================
   INICIO
========================= */

function home(){

  const next=data.matches[0];

  const disponibles=
    data.players.filter(p=>p.available).length;

  const totalFines=
    data.players.reduce(
      (total,p)=>
      total+p.fines.reduce((a,f)=>a+Number(f.amount||0),0)
    ,0);

  return `

    <div class="card">

      <h2>👋 Inicio</h2>

      <p class="small">
        Panel principal de ${data.team.name}
      </p>

      <div class="grid3">

        <div class="stat">
          <strong>${data.players.length}</strong>
          <span class="small">Jugadores</span>
        </div>

        <div class="stat">
          <strong>${disponibles}</strong>
          <span class="small">Disponibles</span>
        </div>

        <div class="stat">
          <strong>${data.trainings.length}</strong>
          <span class="small">Entrenos</span>
        </div>

      </div>

    </div>

    <div class="card">

      <h2>🏆 Próximo partido</h2>

      ${
        next
        ?
        `
        <div class="item">

          <div class="avatar">⚽</div>

          <div style="flex:1">

            <strong>${next.opponent}</strong>

            <div class="small">
              ${next.date} · ${next.time}
            </div>

            <div class="small">
              ${next.location}
            </div>

          </div>

        </div>

        <button
          class="btn"
          style="width:100%;margin-top:10px"
          onclick="go('partidos')">

          Ver partido

        </button>
        `
        :
        `<div class="empty">No hay partidos registrados.</div>`
      }

    </div>

    <div class="card">

      <h2>🏋️ Próximo entrenamiento</h2>

      ${
        data.trainings[0]
        ?
        `
        <strong>${data.trainings[0].date}</strong>

        <div class="small">
          ${data.trainings[0].time}
          ·
          ${data.trainings[0].place}
        </div>
        `
        :
        `<div class="empty">No hay entrenamientos.</div>`
      }

    </div>

    <div class="card">

      <h2>💶 Multas</h2>

      <div class="total-fines">

        <div class="row-between">

          <span>
            Total acumulado
          </span>

          <strong>
            ${totalFines.toFixed(2)} €
          </strong>

        </div>

      </div>

    </div>

    <div class="card">

      <h2>⚡ Acciones rápidas</h2>

      <div class="action-grid">

        <button
          class="btn-light"
          onclick="go('plantilla')">
          👥 Plantilla
        </button>

        <button
          class="btn-light"
          onclick="go('entrenos')">
          🏋️ Entreno
        </button>

        <button
          class="btn-light"
          onclick="go('partidos')">
          ⚽ Partido
        </button>

        <button
          class="btn-light"
          onclick="go('mas')">
          ⚙️ Más
        </button>

      </div>

    </div>

  `;
}

/* =========================
   PLANTILLA
========================= */

function plantilla(){

  return `

    <div class="row-between">

      <div>

        <h2 style="margin-bottom:3px">
          👥 Plantilla
        </h2>

        <div class="small">
          ${data.players.length} jugadores
        </div>

      </div>

      ${
        data.role!=="jugador"
        ?
        `
        <button
          class="btn"
          onclick="newPlayer()">
          ＋
        </button>
        `
        :
        ""
      }

    </div>

    <input
      class="search"
      id="playerSearch"
      placeholder="🔎 Buscar jugador..."
      oninput="filterPlayers()">

    <div id="playerList">
      ${playerList()}
    </div>

  `;
}

function playerList(filter=""){

  const search=filter.toLowerCase();

  const players=data.players.filter(p=>
    p.name.toLowerCase().includes(search) ||
    p.pos.toLowerCase().includes(search)
  );

  if(!players.length){
    return `
      <div class="card empty">
        No se encontraron jugadores.
      </div>
    `;
  }

  return players.map(p=>{

    const fines=
      p.fines.reduce(
        (a,f)=>a+Number(f.amount||0),0
      );

    return `

      <div
        class="player-card"
        onclick="player(${p.id})">

        <div class="player-main">

          <div class="avatar">
            ${p.num||"-"}
          </div>

          <div class="player-info">

            <div class="player-name">
              ${p.name}
            </div>

            <div class="player-meta">

              ${p.pos}

              ·

              <span class="${p.available?"green":"red"}">

                <span class="status-dot ${
                  p.available
                  ?"dot-green"
                  :"dot-red"
                }"></span>

                ${
                  p.available
                  ?"Disponible"
                  :"No disponible"
                }

              </span>

            </div>

          </div>

          ${
            fines>0
            ?
            `
            <span class="badge">
              ${fines.toFixed(2)} €
            </span>
            `
            :
            ""
          }

          <span>›</span>

        </div>

      </div>

    `;

  }).join("");

}

function filterPlayers(){

  const value=
    document.getElementById("playerSearch").value;

  document.getElementById("playerList").innerHTML=
    playerList(value);
}

/* =========================
   FICHA JUGADOR
========================= */

function player(id){

  const p=data.players.find(x=>x.id===id);

  if(!p)return;

  const stat=data.stats[id]||{
    goals:0,
    assists:0,
    yellow:0,
    red:0,
    games:0
  };

  const totalFines=
    p.fines.reduce(
      (a,f)=>a+Number(f.amount||0),0
    );

  openModal(`

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <h2>
      ${p.name}
    </h2>

    <div class="grid2">

      <div class="stat">

        <strong>
          #${p.num}
        </strong>

        <span class="small">
          Dorsal
        </span>

      </div>

      <div class="stat">

        <strong>
          ${p.pos}
        </strong>

        <span class="small">
          Posición
        </span>

      </div>

    </div>

    <div
      class="card"
      style="margin-top:15px;background:#f4f7f5">

      <div class="row-between">

        <strong>
          Estado
        </strong>

        ${
          p.available
          ?
          `<span class="badge green">
             Disponible
           </span>`
          :
          `<span class="badge red">
             No disponible
           </span>`
        }

      </div>

      ${
        !p.available && p.reason
        ?
        `
        <div
          class="small"
          style="margin-top:8px">
          Motivo: ${p.reason}
        </div>
        `
        :
        ""
      }

    </div>

    <div class="section-title">
      📊 Estadísticas
    </div>

    <div class="grid3">

      <div class="stat">
        <strong>${stat.games}</strong>
        <span class="small">Partidos</span>
      </div>

      <div class="stat">
        <strong>${stat.goals}</strong>
        <span class="small">Goles</span>
      </div>

      <div class="stat">
        <strong>${stat.assists}</strong>
        <span class="small">Asistencias</span>
      </div>

    </div>

    <div class="grid2" style="margin-top:8px">

      <div class="stat">
        <strong>${stat.yellow}</strong>
        <span class="small">Amarillas</span>
      </div>

      <div class="stat">
        <strong>${stat.red}</strong>
        <span class="small">Rojas</span>
      </div>

    </div>

    <div class="section-title">
      💶 Multas
    </div>

    <div class="total-fines">

      <div class="row-between">

        <span>
          Total
        </span>

        <strong>
          ${totalFines.toFixed(2)} €
        </strong>

      </div>

    </div>

    ${
      p.fines.length
      ?
      p.fines.map(f=>`

        <div class="fine">

          <div>

            <strong>
              ${f.reason}
            </strong>

            <div class="small">
              ${f.date||""}
            </div>

          </div>

          <strong class="red">
            ${Number(f.amount).toFixed(2)} €
          </strong>

        </div>

      `).join("")
      :
      `<div class="empty">
        Este jugador no tiene multas.
      </div>`
    }

    ${
      data.role!=="jugador"
      ?
      `

      <button
        class="btn-gold"
        style="width:100%;margin-top:15px"
        onclick="newFine(${p.id})">

        💶 Añadir multa

      </button>

      <button
        class="btn"
        style="width:100%;margin-top:8px"
        onclick="editPlayer(${p.id})">

        ✏️ Editar jugador

      </button>

      <button
        class="btn-light"
        style="width:100%;margin-top:8px"
        onclick="editStats(${p.id})">

        📊 Editar estadísticas

      </button>

      `
      :
      ""
    }

  `);

}

/* =========================
   NUEVO JUGADOR
========================= */

function newPlayer(){

  openModal(`

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <h2>
      Nuevo jugador
    </h2>

    <label>
      Nombre
    </label>

    <input
      id="pName"
      placeholder="Nombre del jugador">

    <label>
      Dorsal
    </label>

    <input
      id="pNum"
      type="number"
      placeholder="Dorsal">

    <label>
      Posición
    </label>

    <select id="pPos">

      <option>POR</option>
      <option>DFC</option>
      <option>LD</option>
      <option>LI</option>
      <option>MC</option>
      <option>MP</option>
      <option>ED</option>
      <option>EI</option>
      <option>DC</option>

    </select>

    <button
      class="btn"
      style="width:100%;margin-top:16px"
      onclick="addPlayer()">

      Guardar jugador

    </button>

  `);

}

function addPlayer(){

  const name=
    document.getElementById("pName")
    .value.trim();

  const num=
    Number(
      document.getElementById("pNum").value
    );

  const pos=
    document.getElementById("pPos").value;

  if(!name){
    alert("Introduce el nombre.");
    return;
  }

  data.players.push({

    id:Date.now(),
    name,
    num,
    pos,
    available:true,
    reason:"",
    fines:[]

  });

  save();

  closeModal();

  render();

}

/* =========================
   EDITAR JUGADOR
========================= */

function editPlayer(id){

  const p=data.players.find(x=>x.id===id);

  if(!p)return;

  openModal(`

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <h2>
      Editar jugador
    </h2>

    <label>
      Nombre
    </label>

    <input
      id="eName"
      value="${p.name}">

    <label>
      Dorsal
    </label>

    <input
      id="eNum"
      type="number"
      value="${p.num}">

    <label>
      Posición
    </label>

    <select id="ePos">

      ${
        ["POR","DFC","LD","LI","MC","MP","ED","EI","DC"]
        .map(x=>
          `<option ${
            x===p.pos
            ?"selected"
            :""
          }>${x}</option>`
        ).join("")
      }

    </select>

    <label>
      Disponibilidad
    </label>

    <select id="eAvailable">

      <option
        value="true"
        ${p.available?"selected":""}>
        Disponible
      </option>

      <option
        value="false"
        ${!p.available?"selected":""}>
        No disponible
      </option>

    </select>

    <label>
      Motivo
    </label>

    <input
      id="eReason"
      value="${p.reason||""}"
      placeholder="Lesión, trabajo, etc.">

    <button
      class="btn"
      style="width:100%;margin-top:15px"
      onclick="savePlayer(${id})">

      Guardar cambios

    </button>

    <button
      class="btn-danger"
      style="width:100%;margin-top:8px"
      onclick="deletePlayer(${id})">

      Eliminar jugador

    </button>

  `);

}

function savePlayer(id){

  const p=data.players.find(x=>x.id===id);

  if(!p)return;

  p.name=
    document.getElementById("eName")
    .value.trim();

  p.num=

      document.getElementById("eNum").value

  closeModal();

}

function deletePlayer(id){

    data.players.filter(

function addFine(id){

  const p=data.players.find(x=>x.id===id);

  const reason=
    document.getElementById("fReason")
    .value.trim();

  const amount=
    Number(
      document.getElementById("fAmount").value
    );

  const date=
    document.getElementById("fDate")
    .value.trim();

  if(!reason){
    alert("Introduce el motivo.");
    return;
  }

  if(!amount || amount<=0){
    alert("Introduce un importe válido.");
    return;
  }

  p.fines.push({

    id:Date.now(),
    reason,
    amount,
    date

  });

  save();

  closeModal();

  player(id);

}

/* =========================
   ASISTENCIA
========================= */

function attendance(id,type){

  const list=
    type==="training"
    ?
    data.trainings.find(x=>x.id===id)
    :
    data.matches.find(x=>x.id===id);

  if(!list)return;

  const records=
    type==="training"
    ?
    list.attendance
    :
    list.convocados;

  openModal(`

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <h2>
      ${
        type==="training"
        ?"🏋️ Asistencia"
        :"⚽ Convocatoria"
      }
    </h2>

    ${
      data.players.map(p=>`

        <label
          style="
          display:flex;
          align-items:center;
          gap:10px">

          <input
            type="checkbox"
            style="width:auto"
            value="${p.id}"
            ${records.includes(p.id)
              ?"checked"
              :""
            }>

          ${p.name}

        </label>

      `).join("")
    }

    <button
      class="btn"
      style="width:100%;margin-top:16px"
      onclick="saveAttendance(${id},'${type}')">

      Guardar

    </button>

  `);

}

function saveAttendance(id,type){

  const ids=
    [...document.querySelectorAll(
      '.modal-box input[type="checkbox"]:checked'
    )]
    .map(x=>Number(x.value));

  if(type==="training"){

    const t=
      data.trainings.find(x=>x.id===id);

    t.attendance=ids;

  }else{

    const m=
      data.matches.find(x=>x.id===id);

    m.convocados=ids;

  }

  save();

  closeModal();

  render();

}

function fineSummary(){

  const rows=data.players.map(p=>{

    const total=
      p.fines.reduce(
        (a,f)=>a+Number(f.amount||0),0
      );

    return `

      <div class="item">

        <div style="flex:1">

          <strong>
            ${p.name}
          </strong>

          <div class="small">
            ${p.fines.length} multas
          </div>

        </div>

        <strong class="${total>0?"red":"green"}">
          ${total.toFixed(2)} €
        </strong>

      </div>

    `;

  }).join("");

  const total=
    data.players.reduce(
      (a,p)=>
      a+
      p.fines.reduce(
        (x,f)=>x+Number(f.amount||0),0
      )
    ,0);

  openModal(`

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <h2>
      💶 Multas del equipo
    </h2>

    <div class="total-fines">

      <div class="row-between">

        <strong>
          Total
        </strong>

        <strong>
          ${total.toFixed(2)} €
        </strong>

      </div>

    </div>

    ${rows}

  `);

}

function statistics(){

  const total=data.players.length;

  const totalGoals=
    Object.values(data.stats)
    .reduce(
      (a,b)=>a+(b.goals||0)
    ,0);

  const totalAssists=
    Object.values(data.stats)
    .reduce(
      (a,b)=>a+(b.assists||0)
    ,0);

  openModal(`

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <h2>
      📊 Estadísticas
    </h2>

    <div class="grid3">

      <div class="stat">
        <strong>${total}</strong>
        <span class="small">Jugadores</span>
      </div>

      <div class="stat">
        <strong>${totalGoals}</strong>
        <span class="small">Goles</span>
      </div>

      <div class="stat">
        <strong>${totalAssists}</strong>
        <span class="small">Asistencias</span>
      </div>

    </div>

    <div class="section-title">
      Jugadores
    </div>

    ${
      data.players.map(p=>{

        const s=data.stats[p.id]||{
          goals:0,
          assists:0,
          yellow:0,
          red:0
        };

        return `

          <div class="item">

            <div style="flex:1">

              <strong>
                ${p.name}
              </strong>

              <div class="small">

                ⚽ ${s.goals}
                ·
                🅰️ ${s.assists}
                ·
                🟨 ${s.yellow}
                ·
                🟥 ${s.red}

              </div>

            </div>

            ${
              data.role!=="jugador"
              ?
              `<button
                class="btn-light"
                onclick="editStats(${p.id})">
                Editar
              </button>`
              :
              ""
            }

          </div>

        `;

      }).join("")
    }

  `);

}

function editStats(id){

  const p=data.players.find(x=>x.id===id);

  if(!data.stats[id]){

    data.stats[id]={
      goals:0,
      assists:0,
      yellow:0,
      red:0,
      games:0
    };

  }

  const s=data.stats[id];

  openModal(`

    <button
      class="close"
      onclick="closeModal()">
      ✕
    </button>

    <h2>
      📊 ${p.name}
    </h2>

    <label>
      Partidos
    </label>

    <input
      id="stGames"
      type="number"
      value="${s.games||0}">

    <label>
      Goles
    </label>

    <input
      id="stGoals"
      type="number"
      value="${s.goals||0}">

    <label>
      Asistencias
    </label>

    <input
      id="stAssists"
      type="number"
      value="${s.assists||0}">

    <label>
      Amarillas
    </label>

    <input
      id="stYellow"
      type="number"
      value="${s.yellow||0}">

    <label>
      Rojas
    </label>

    <input
      id="stRed"
      type="number"
      value="${s.red||0}">

    <button
      class="btn"
      style="width:100%;margin-top:15px"
      onclick="saveStats(${id})">

      Guardar estadísticas

    </button>

  `);

}

function saveStats(id){

  data.stats[id]={

    games:
      Number(
        document.getElementById("stGames").value
      )||0,

    goals:
      Number(
        document.getElementById("stGoals").value
      )||0,

    assists:
      Number(
        document.getElementById("stAssists").value
      )||0,

    yellow:
      Number(
        document.getElementById("stYellow").value
      )||0,

    red:
      Number(
        document.getElementById("stRed").value
      )||0

  };

  save();

  closeModal();

  statistics();

}

/* =========================
   MODAL
========================= */

function openModal(html){

  document.getElementById("modalBox")
    .innerHTML=html;

  document.getElementById("modal")
    .classList.remove("hidden");

}

function closeModal(){

  document.getElementById("modal")
    .classList.add("hidden");

}

document.getElementById("modal")
.addEventListener("click",e=>{

  if(e.target.id==="modal")
    closeModal();

});

go("inicio");
