<style>

/* =====================================================
   SELECTOR DE JUGADOR DE TÁCTICA
===================================================== */

.tactic-slot{
  position:absolute;
  transform:translate(-50%,-50%);
  width:clamp(82px,23vw,112px);
  z-index:20;
  text-align:center;
}

.tactic-role{
  display:inline-block;
  background:#0b0b0d;
  color:#fff;
  border-radius:999px;
  padding:5px 9px;
  font-size:10px;
  font-weight:900;
  margin-bottom:5px;
}


/* BOTÓN QUE APARECE EN EL CAMPO */

.player-selector{
  position:relative;
  width:100%;
}


.player-selector-button{
  width:100%;
  min-height:40px;

  border:3px solid #e21d2f;
  border-radius:11px;

  background:#fff;

  color:#17171a;

  padding:8px 28px 8px 9px;

  font-size:11px;
  line-height:14px;

  font-weight:900;

  text-align:left;

  position:relative;

  overflow:hidden;

  white-space:nowrap;

  text-overflow:ellipsis;

  box-shadow:
    0 3px 8px rgba(0,0,0,.10);
}


.player-selector-button .arrow{
  position:absolute;

  right:8px;
  top:50%;

  transform:
    translateY(-50%);

  font-size:13px;

  pointer-events:none;
}


/* CUANDO NO HAY JUGADOR */

.player-selector-button.empty{
  color:#77777e;
  font-weight:800;
}


/* LISTA DESPLEGABLE */

.player-selector-menu{
  position:absolute;

  left:0;
  right:0;

  top:calc(100% + 5px);

  background:#fff;

  border-radius:11px;

  border:1px solid #e5e5e8;

  box-shadow:
    0 8px 22px rgba(0,0,0,.20);

  overflow:hidden;

  z-index:999;

  display:none;

  max-height:150px;

  overflow-y:auto;
}


/* LISTA ABIERTA */

.player-selector.open{
  z-index:1000;
}

.player-selector.open
.player-selector-menu{
  display:block;
}


/* OPCIONES */

.player-option{
  width:100%;

  border:0;

  background:#fff;

  color:#17171a;

  padding:10px 9px;

  text-align:left;

  font-size:11px;

  font-weight:800;

  white-space:nowrap;

  overflow:hidden;

  text-overflow:ellipsis;

  border-bottom:1px solid #eeeeef;
}


.player-option:last-child{
  border-bottom:0;
}


.player-option:active{
  background:#fff0f2;
}


.player-option.selected{
  background:#fff0f2;

  color:#e21d2f;

  font-weight:950;
}


/* SIN JUGADOR */

.player-option.empty-option{
  color:#77777e;
}


/* EN EL BORDE DEL CAMPO:
   que el menú no se corte */

.tactic-slot.menu-up
.player-selector-menu{

  top:auto;

  bottom:calc(100% + 5px);

}


/* MÓVIL */

@media(max-width:380px){

  .tactic-slot{
    width:82px;
  }

  .player-selector-button{
    font-size:10px;
    padding-left:7px;
    padding-right:25px;
  }

  .player-option{
    font-size:10px;
    padding:9px 7px;
  }

}

</style>
